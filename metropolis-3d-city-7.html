        function spawnPerformer() {
            if (performers.length >= PERFORMER_CFG.maxPerformers) return;

            // Pick random block
            const bx = Math.floor(Math.random() * GRID.gridCount);
            const bz = Math.floor(Math.random() * GRID.gridCount);
            const blockCenterX = -halfSize + bx * GRID.cellSize + GRID.cellSize / 2;
            const blockCenterZ = -halfSize + bz * GRID.cellSize + GRID.cellSize / 2;
            const innerSize = GRID.cellSize - GRID.roadWidth;
            const swOffset = GRID.sidewalkWidth / 2;

            // Pick random sidewalk side (0=north, 1=south, 2=west, 3=east)
            const side = Math.floor(Math.random() * 4);
            let x, z, facing;

            // Position on sidewalk, facing toward the road
            const alongOffset = (Math.random() - 0.5) * (innerSize - 4);

            if (side === 0) {
                x = blockCenterX + alongOffset;
                z = blockCenterZ - innerSize/2 + swOffset;
                facing = Math.PI; // Face south (toward road)
            } else if (side === 1) {
                x = blockCenterX + alongOffset;
                z = blockCenterZ + innerSize/2 - swOffset;
                facing = 0; // Face north (toward road)
            } else if (side === 2) {
                x = blockCenterX - innerSize/2 + swOffset;
                z = blockCenterZ + alongOffset;
                facing = Math.PI / 2; // Face east (toward road)
            } else {
                x = blockCenterX + innerSize/2 - swOffset;
                z = blockCenterZ + alongOffset;
                facing = -Math.PI / 2; // Face west (toward road)
            }

            // Check if too close to existing performer
            for (const p of performers) {
                const dx = p.position.x - x;
                const dz = p.position.z - z;
                if (Math.sqrt(dx * dx + dz * dz) < 20) return; // Too close
            }

            // Create performer (50% musician, 50% statue)
            const performer = Math.random() < 0.5 ? mkMusician() : mkStatue();
            performer.position.set(x, 0.15, z);
            performer.rotation.y = facing;

            const duration = PERFORMER_CFG.performDuration[0] +
                Math.random() * (PERFORMER_CFG.performDuration[1] - PERFORMER_CFG.performDuration[0]);

            performer.userData.spawnTime = clock.getElapsedTime();
            performer.userData.duration = duration;
            performer.userData.block = { x: bx, z: bz };
            performer.userData.watchers = []; // Track watching pedestrians

            performers.push(performer);
            scene.add(performer);
        }

        function updRain() {
            if (!rain) return;
            const p = rain.geometry.attributes.position.array, v = rain.geometry.attributes.velocity.array;
            for (let i = 0; i < p.length / 3; i++) {
                p[i * 3 + 1] -= v[i];
                // Add wind effect
                p[i * 3] += windDirection.x * windStrength * 0.1;
                p[i * 3 + 2] += windDirection.z * windStrength * 0.1;
                if (p[i * 3 + 1] < 0) { 
                    p[i * 3 + 1] = 100; 
                    p[i * 3] = cam.position.x + (Math.random() - 0.5) * 200; 
                    p[i * 3 + 2] = cam.position.z + (Math.random() - 0.5) * 200; 
                }
            }
            rain.geometry.attributes.position.needsUpdate = true;
        }
        
        function updWeather(t) {
            weatherTimer += 0.016;
            
            // Random weather changes
            if (weatherTimer > nextWeatherChange) {
                changeWeather();
                weatherTimer = 0;
            }
            
            // Update storm effects
            if (weatherState === 'storm') {
                // Lightning flashes
                if (t - lastLightning > 3 + Math.random() * 8) {
                    triggerLightning();
                    lastLightning = t;
                }
                
                // Update flying debris
                updStormDebris(t);
            }
            
            // Update weather indicator
            updateWeatherUI();
        }
        
        function changeWeather() {
            const oldWeather = weatherState;
            
            // Weather transition probabilities (mostly sunny)
            const rand = Math.random();
            if (weatherState === 'sunny') {
                if (rand < 0.7) weatherState = 'sunny'; // 70% stay sunny
                else if (rand < 0.9) weatherState = 'cloudy'; // 20% become cloudy
                else weatherState = 'rain'; // 10% sudden rain
            } else if (weatherState === 'cloudy') {
                if (rand < 0.4) weatherState = 'sunny'; // 40% clear up
                else if (rand < 0.7) weatherState = 'cloudy'; // 30% stay cloudy
                else if (rand < 0.9) weatherState = 'rain'; // 20% rain
                else weatherState = 'storm'; // 10% storm
            } else if (weatherState === 'rain') {
                if (rand < 0.3) weatherState = 'sunny'; // 30% clear up
                else if (rand < 0.5) weatherState = 'cloudy'; // 20% become cloudy
                else if (rand < 0.8) weatherState = 'rain'; // 30% stay rainy
                else weatherState = 'storm'; // 20% storm
            } else if (weatherState === 'storm') {
                if (rand < 0.5) weatherState = 'rain'; // 50% become rain
                else if (rand < 0.8) weatherState = 'cloudy'; // 30% become cloudy
                else weatherState = 'storm'; // 20% stay stormy
            }
            
            // Set next weather change time
            if (weatherState === 'sunny') {
                nextWeatherChange = 45 + Math.random() * 90; // Sunny lasts longer
            } else if (weatherState === 'storm') {
                nextWeatherChange = 15 + Math.random() * 30; // Storms are shorter
            } else {
                nextWeatherChange = 20 + Math.random() * 40;
            }
            
            // Apply weather effects
            if (oldWeather !== weatherState) {
                applyWeatherEffects();
                
                // Notify
                const weatherNames = {
                    'sunny': '☀️ Clear skies',
                    'cloudy': '☁️ Cloudy',
                    'rain': '🌧️ Rain starting',
                    'storm': '⛈️ STORM WARNING!'
                };
                notify(weatherNames[weatherState], 2500);
            }
        }
        
        function applyWeatherEffects() {
            // Clear existing effects
            if (rain) { scene.remove(rain); rain = null; }
            clearStormDebris();
            
            // Set wind
            windDirection = { x: Math.random() - 0.5, z: Math.random() - 0.5 };
            const windLen = Math.sqrt(windDirection.x ** 2 + windDirection.z ** 2);
            if (windLen > 0) {
                windDirection.x /= windLen;
                windDirection.z /= windLen;
            }
            
            // Fog distances per weather — fog/sky COLOR is driven per-frame by setSky()
            switch (weatherState) {
                case 'sunny':
                    if (!scene.fog || scene.fog.far !== 350) {
                        scene.fog = new THREE.Fog(0x87CEEB, 80, 350);
                    }
                    windStrength = 0;
                    raining = false;
                    break;

                case 'cloudy':
                    scene.fog = new THREE.Fog(0x9cacbc, 60, 250);
                    windStrength = 0.5;
                    raining = false;
                    break;

                case 'rain':
                    scene.fog = new THREE.Fog(0x778899, 30, 150);
                    windStrength = 1;
                    createRain(6000);
                    raining = true;
                    break;

                case 'storm':
                    scene.fog = new THREE.Fog(0x4a5568, 20, 100);
                    windStrength = 3;
                    createRain(12000);
                    raining = true;
                    createStormDebris();
                    break;
            }
        }
        
        function createRain(particleCount) {
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(particleCount * 3);
            const vel = new Float32Array(particleCount);
            for (let i = 0; i < particleCount; i++) {
                pos[i * 3] = cam.position.x + (Math.random() - 0.5) * 200;
                pos[i * 3 + 1] = Math.random() * 100;
                pos[i * 3 + 2] = cam.position.z + (Math.random() - 0.5) * 200;
                vel[i] = 0.5 + Math.random() * 0.5;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('velocity', new THREE.BufferAttribute(vel, 1));
            
            const rainColor = weatherState === 'storm' ? 0x6688aa : 0x9999aa;
            const rainSize = weatherState === 'storm' ? 0.15 : 0.1;
            rain = new THREE.Points(geo, new THREE.PointsMaterial({ 
                color: rainColor, 
                size: rainSize, 
                transparent: true, 
                opacity: 0.6 
            }));
            scene.add(rain);
        }
        
        function createStormDebris() {
            // Flying newspapers, leaves, trash
            const debrisTypes = [
                { color: 0xeeeeee, size: [0.4, 0.3, 0.01], name: 'paper' },  // Newspaper
                { color: 0x558833, size: [0.15, 0.15, 0.02], name: 'leaf' }, // Leaf
                { color: 0xcccccc, size: [0.2, 0.2, 0.2], name: 'bag' },     // Plastic bag
                { color: 0x884422, size: [0.3, 0.2, 0.01], name: 'cardboard' } // Cardboard
            ];
            
            for (let i = 0; i < 25; i++) {
                const type = debrisTypes[Math.floor(Math.random() * debrisTypes.length)];
                const debris = new THREE.Mesh(
                    new THREE.BoxGeometry(...type.size),
                    new THREE.MeshStandardMaterial({ 
                        color: type.color, 
                        side: THREE.DoubleSide,
                        transparent: type.name === 'bag',
                        opacity: type.name === 'bag' ? 0.7 : 1
                    })
                );
                
                debris.position.set(
                    (Math.random() - 0.5) * 100,
                    1 + Math.random() * 20,
                    (Math.random() - 0.5) * 100
                );
                
                debris.userData.velocity = {
                    x: (Math.random() - 0.5) * 0.3 + windDirection.x * windStrength * 0.2,
                    y: (Math.random() - 0.5) * 0.1,
                    z: (Math.random() - 0.5) * 0.3 + windDirection.z * windStrength * 0.2
                };
                debris.userData.rotSpeed = {
                    x: (Math.random() - 0.5) * 0.2,
                    y: (Math.random() - 0.5) * 0.2,
                    z: (Math.random() - 0.5) * 0.2
                };
                debris.userData.type = type.name;
                
                stormDebris.push(debris);
                scene.add(debris);
            }
        }
        
        function clearStormDebris() {
            stormDebris.forEach(d => scene.remove(d));
            stormDebris = [];
        }
        
        function updStormDebris(t) {
            stormDebris.forEach(debris => {
                // Move with wind
                debris.position.x += debris.userData.velocity.x + windDirection.x * windStrength * 0.05;
                debris.position.y += debris.userData.velocity.y + Math.sin(t * 3 + debris.position.x) * 0.02;
                debris.position.z += debris.userData.velocity.z + windDirection.z * windStrength * 0.05;
                
                // Tumble
                debris.rotation.x += debris.userData.rotSpeed.x;
                debris.rotation.y += debris.userData.rotSpeed.y;
                debris.rotation.z += debris.userData.rotSpeed.z;
                
                // Wrap around
                if (debris.position.x > halfSize + 20) debris.position.x = -halfSize - 20;
                if (debris.position.x < -halfSize - 20) debris.position.x = halfSize + 20;
                if (debris.position.z > halfSize + 20) debris.position.z = -halfSize - 20;
                if (debris.position.z < -halfSize - 20) debris.position.z = halfSize + 20;
                
                // Keep above ground, below certain height
                if (debris.position.y < 0.5) {
                    debris.position.y = 0.5;
                    debris.userData.velocity.y = Math.abs(debris.userData.velocity.y) * 0.8;
                }
                if (debris.position.y > 30) {
                    debris.position.y = 30;
                    debris.userData.velocity.y = -Math.abs(debris.userData.velocity.y);
                }
            });
        }
        
        function triggerLightning() {
            // Double-pulse flash; decays in updDayNight and whitens the sky via setSky
            lightningFlash = 1.0;
            setTimeout(() => { lightningFlash = 0.75; }, 120 + Math.random() * 120);
        }
        
        function updateWeatherUI() {
            const weatherEl = $('weather');
            if (weatherEl) {
                const icons = { 'sunny': '☀️', 'cloudy': '☁️', 'rain': '🌧️', 'storm': '⛈️' };
                weatherEl.textContent = icons[weatherState] || '☀️';
            }
        }

        function setupMM() { 
            const c = $('mm'); 
            c.width = 130; 
            c.height = 130; 
            mmCtx = c.getContext('2d'); 
        }

        function updMM() {
            if (!mmCtx) return;
            mmCtx.fillStyle = 'rgba(200,230,255,0.95)'; 
            mmCtx.fillRect(0, 0, 130, 130);
            
            const scale = 0.55;
            
            mmCtx.strokeStyle = '#555';
            mmCtx.lineWidth = 3;
            for (let i = 0; i <= GRID.gridCount; i++) {
                const pos = (-halfSize + i * GRID.cellSize - cam.position.x) * scale + 65;
                const posZ = (-halfSize + i * GRID.cellSize - cam.position.z) * scale + 65;
                mmCtx.beginPath(); mmCtx.moveTo(pos, 0); mmCtx.lineTo(pos, 130); mmCtx.stroke();
                mmCtx.beginPath(); mmCtx.moveTo(0, posZ); mmCtx.lineTo(130, posZ); mmCtx.stroke();
            }
            
            mmCtx.fillStyle = 'rgba(100,120,140,0.6)';
            buildings.forEach(b => { 
                const x = 65 + (b.position.x - cam.position.x) * scale;
                const y = 65 + (b.position.z - cam.position.z) * scale;
                if (x > -10 && x < 140 && y > -10 && y < 140) mmCtx.fillRect(x - 4, y - 4, 8, 8); 
            });
            
            mmCtx.fillStyle = '#e44';
            cars.forEach(c => { 
                if (!c.userData.isEmergency) {
                    const x = 65 + (c.position.x - cam.position.x) * scale;
                    const y = 65 + (c.position.z - cam.position.z) * scale;
                    if (x > 0 && x < 130 && y > 0 && y < 130) mmCtx.fillRect(x - 2, y - 2, 4, 4);
                }
            });
            
            // Emergency vehicles in blue
            mmCtx.fillStyle = '#00f';
            emergencyVehicles.forEach(c => { 
                const x = 65 + (c.position.x - cam.position.x) * scale;
                const y = 65 + (c.position.z - cam.position.z) * scale;
                if (x > 0 && x < 130 && y > 0 && y < 130) mmCtx.fillRect(x - 3, y - 3, 6, 6);
            });
            
            // Bicycles in yellow
            mmCtx.fillStyle = '#ff0';
            bicycles.forEach(b => { 
                const x = 65 + (b.position.x - cam.position.x) * scale;
                const y = 65 + (b.position.z - cam.position.z) * scale;
                if (x > 0 && x < 130 && y > 0 && y < 130) {
                    mmCtx.beginPath();
                    mmCtx.arc(x, y, 3, 0, Math.PI * 2);
                    mmCtx.fill();
                }
            });
            
            // Omnibus in green
            if (omnibus) {
                mmCtx.fillStyle = '#22aa22';
                const x = 65 + (omnibus.position.x - cam.position.x) * scale;
                const y = 65 + (omnibus.position.z - cam.position.z) * scale;
                if (x > 0 && x < 130 && y > 0 && y < 130) {
                    mmCtx.fillRect(x - 4, y - 3, 8, 6);
                }
                
                // Bus stops as small green circles
                mmCtx.strokeStyle = '#22aa22';
                mmCtx.lineWidth = 1;
                omnibusStops.forEach(stop => {
                    const sx = 65 + (stop.x - cam.position.x) * scale;
                    const sy = 65 + (stop.z - cam.position.z) * scale;
                    if (sx > 0 && sx < 130 && sy > 0 && sy < 130) {
                        mmCtx.beginPath();
                        mmCtx.arc(sx, sy, 4, 0, Math.PI * 2);
                        mmCtx.stroke();
                    }
                });
            }
            
            mmCtx.fillStyle = '#0088ff'; 
            mmCtx.beginPath(); 
            mmCtx.arc(65, 65, 5, 0, Math.PI * 2); 
            mmCtx.fill();
            mmCtx.strokeStyle = '#0066cc'; 
            mmCtx.lineWidth = 2; 
            mmCtx.beginPath(); 
            mmCtx.moveTo(65, 65); 
            mmCtx.lineTo(65 + Math.sin(yaw) * 14, 65 - Math.cos(yaw) * 14); 
            mmCtx.stroke();
        }

        function setupInput() {
            addEventListener('keydown', e => {
                keys[e.code] = true;
                if (e.code === 'KeyR') {
                    // Cycle through weather states manually
                    const states = ['sunny', 'cloudy', 'rain', 'storm'];
                    const currentIndex = states.indexOf(weatherState);
                    weatherState = states[(currentIndex + 1) % states.length];
                    applyWeatherEffects();
                    const weatherNames = {
                        'sunny': '☀️ Clear skies',
                        'cloudy': '☁️ Cloudy',
                        'rain': '🌧️ Rainy',
                        'storm': '⛈️ STORM!'
                    };
                    notify(weatherNames[weatherState], 2000);
                    weatherTimer = 0; // Reset timer
                }
                if (e.code === 'KeyT') {
                    // Toggle time speed: normal -> fast -> frozen -> normal
                    if (dayNightSpeed === 0) {
                        dayNightSpeed = 0.005;
                        notify('Time: Normal', 1500);
                    } else if (dayNightSpeed === 0.005) {
                        dayNightSpeed = 0.05; // 10x faster
                        notify('Time: Fast forward', 1500);
                    } else {
                        dayNightSpeed = 0;
                        notify('Time: Paused', 1500);
                    }
                }
                if (e.code === 'Space') boost = true;
            });
            addEventListener('keyup', e => { keys[e.code] = false; if (e.code === 'Space') boost = false; });
            addEventListener('mousemove', e => {
                if (document.pointerLockElement) {
                    yaw -= e.movementX * 0.002;
                    pitch -= e.movementY * 0.002;
                    pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
                } else {
                    mousePx.x = e.clientX; mousePx.y = e.clientY;
                    mouseNDC.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
                }
            });
            document.addEventListener('pointerlockchange', () => {
                $('xhair').style.display = document.pointerLockElement ? 'block' : 'none';
            });
            $('c').addEventListener('click', () => $('c').requestPointerLock());
            addEventListener('wheel', e => { cam.fov = Math.max(20, Math.min(100, cam.fov + e.deltaY * 0.05)); cam.updateProjectionMatrix(); });
            addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); });
        }

        // Tiny debug/test API (console: __metro.setTime(0.5) etc.)
        window.__metro = {
            setTime: v => { timeOfDay = v; },
            getTime: () => timeOfDay,
            setCam: (x, y, z, yw = 0, pt = 0) => { cam.position.set(x, y, z); yaw = yw; pitch = pt; },
            setWeather: w => { weatherState = w; applyWeatherEffects(); },
            scene: () => scene,
            sun: () => sunMesh,
            cars: () => cars,
            peds: () => peds,
            bikes: () => bicycles,
            figs: () => windowFigures,
            ray: (nx, ny) => {
                const rc = new THREE.Raycaster();
                rc.setFromCamera(new THREE.Vector2(nx, ny), cam);
                return rc.intersectObjects(scene.children, true).slice(0, 4).map(h => ({
                    d: Math.round(h.distance),
                    geo: h.object.geometry?.type,
                    mat: h.object.material?.type,
                    col: h.object.material?.color?.getHexString?.(),
                    y: Math.round(h.object.getWorldPosition(new THREE.Vector3()).y)
                }));
            }
        };

        // Animate the backlit window silhouettes (only those on lit windows are visible)
        const _figTangent = new THREE.Vector3();
        function updWindowFigures(t) {
            for (const fig of windowFigures) {
                if (!fig.visible) continue;
                const u = fig.userData;
                switch (u.def.type) {
                    case 'pace': {
                        // walk back and forth across the window, facing the walk direction
                        _figTangent.set(1, 0, 0).applyEuler(fig.rotation);
                        const s = Math.sin(t * u.rate + u.phase) * 0.16;
                        fig.position.set(u.baseX, u.baseY, u.baseZ).addScaledVector(_figTangent, s);
                        fig.scale.x = Math.cos(t * u.rate + u.phase) >= 0 ? 1 : -1;
                        break;
                    }
                    case 'sip':
                        fig.rotation.z = Math.sin(t * 0.8 + u.phase) * 0.05;
                        break;
                    case 'dance': {
                        const f = Math.floor(t * 2.8 + u.phase) % 2;
                        if (f !== u.frame) { u.frame = f; fig.material.map = u.def.frames[f]; }
                        fig.position.y = u.baseY + (f ? 0.05 : 0);
                        break;
                    }
                    case 'lift': {
                        const f = Math.floor(t * 0.9 + u.phase) % 2;
                        if (f !== u.frame) { u.frame = f; fig.material.map = u.def.frames[f]; }
                        break;
                    }
                    case 'cat':
                        // mostly statue-still; occasional slow head-tilt, as cats do
                        fig.rotation.z = Math.sin(t * 0.4 + u.phase) > 0.93 ? 0.12 : 0;
                        break;
                    case 'tv': {
                        // the glass strobes cool blue-white at ragged intervals — the
                        // unmistakable glow of a TV seen from the street
                        if (!u.win) break;
                        if (t - (u.lastFlick || 0) > 0.1 + Math.random() * 0.35) {
                            u.lastFlick = t;
                            const tones = [0x9fc4ff, 0xbdd8ff, 0x84aef0, 0xdde9ff, 0x6f9ce0, 0xcfe0f5];
                            u.win.material.color.setHex(tones[Math.floor(Math.random() * tones.length)]);
                        }
                        break;
                    }
                }
            }
        }

        // Pop-up toasts ("Stalled vehicle...", "Time: Fast forward", event announcements)
        // broke the immersion the rest of this file is chasing. Kept as a no-op so the
        // two dozen call sites can stay where they are.
        function notify() {}

        function updDayNight(dt) {
            // Advance time (wraps at 1.0)
            timeOfDay = (timeOfDay + dayNightSpeed * dt) % 1.0;

            // Determine if night for other systems
            isNight = timeOfDay < 0.2 || timeOfDay > 0.8;

            // Calculate sky gradient (zenith + horizon) based on time
            // Time segments: midnight(0), dawn(0.2-0.3), day(0.3-0.7), dusk(0.7-0.8), night(0.8-1)
            const t = timeOfDay;
            const blendSky = (a, b, k) => [
                lerpColor(SKY_COLORS[a].zenith, SKY_COLORS[b].zenith, k),
                lerpColor(SKY_COLORS[a].horizon, SKY_COLORS[b].horizon, k)
            ];

            let zen, hor;
            if (t < 0.2) {
                [zen, hor] = blendSky('midnight', 'dawn', t / 0.2);
            } else if (t < 0.3) {
                [zen, hor] = blendSky('dawn', 'day', (t - 0.2) / 0.1);
            } else if (t < 0.7) {
                zen = SKY_COLORS.day.zenith; hor = SKY_COLORS.day.horizon;
            } else if (t < 0.8) {
                [zen, hor] = blendSky('day', 'dusk', (t - 0.7) / 0.1);
            } else if (t < 0.9) {
                [zen, hor] = blendSky('dusk', 'night', (t - 0.8) / 0.1);
            } else {
                [zen, hor] = blendSky('night', 'midnight', (t - 0.9) / 0.1);
            }

            // Lighting factors (needed for sky too — overcast skies darken at night)
            const dayFactor = Math.sin(t * Math.PI); // 0 at midnight, 1 at noon
            const nightFactor = 1 - dayFactor;

            // Apply sky: time-of-day palette when clear, dimmed overcast palette otherwise
            if (weatherState === 'sunny') {
                setSky(zen, hor);
            } else {
                const wp = WEATHER_SKY[weatherState] || WEATHER_SKY.cloudy;
                setSky(wp.zenith, wp.horizon, 0.2 + 0.8 * dayFactor);
            }

            // Lightning flash decay (storm) — whitens sky via setSky + boosts ambient below
            if (lightningFlash > 0.005) lightningFlash *= 0.82; else lightningFlash = 0;

            if (sunLight) {
                sunLight.intensity = 0.18 + dayFactor * 2.0; // moonlight floor at night, 2.2 at noon
                // Warm color at dawn/dusk, white at noon, cool moonlight at night
                if (isNight) {
                    sunLight.color.setHex(0x9aabdd); // Bluish moonlight
                } else if (t > 0.2 && t < 0.3) {
                    sunLight.color.setHex(0xffcc88); // Warm dawn
                } else if (t > 0.7 && t < 0.8) {
                    sunLight.color.setHex(0xff8844); // Orange dusk
                } else {
                    sunLight.color.setHex(0xfffacd); // Normal daylight
                }
                // Overcast: kill direct sun, shadows go soft/absent like a real gray day
                if (weatherState !== 'sunny') sunLight.intensity *= 0.25;
            }

            if (ambientLight) {
                ambientLight.intensity = 0.05 + dayFactor * 0.25 + lightningFlash * 1.5;
                if (weatherState !== 'sunny') ambientLight.intensity += dayFactor * 0.25; // diffuse skylight
            }

            if (hemiLight) {
                hemiLight.intensity = 0.1 + dayFactor * 0.5;
            }

            // Night glow: bloom ramps up as light fades so windows/streetlights/neon glow
            if (bloomPass) bloomPass.strength = 0.04 + nightFactor * 0.45;

            // Environment (IBL) must fade with darkness — r160 has no global knob,
            // so cache MeshStandardMaterials (refreshed for spawned entities) and scale each
            envMatsTimer -= dt;
            if (envMatsTimer <= 0) {
                envMatsTimer = 2;
                const set = new Set();
                scene.traverse(o => { const m = o.material; if (m && m.isMeshStandardMaterial) set.add(m); });
                envMats = [...set];
            }
            const envInt = (0.12 + dayFactor * 0.88) * (weatherState === 'sunny' ? 1 : 0.4);
            for (const m of envMats) m.envMapIntensity = envInt;

            // Position sun and moon based on time
            // Sun arc: rises at 0.2 (east), peaks at 0.5 (south), sets at 0.8 (west)
            // Moon arc: rises at 0.8 (east), peaks at 0.0/1.0 (south), sets at 0.2 (west)

            const cityCenter = totalSize / 2; // Center point for orbits
            const orbitRadius = 150; // Distance from city center
            const orbitHeight = 120; // Peak height at noon/midnight

            if (sunMesh) {
                // Sun visible from 0.2 to 0.8 (day hours)
                if (t >= 0.2 && t <= 0.8) {
                    const sunProgress = (t - 0.2) / 0.6; // 0-1 during day
                    const sunAngle = Math.PI * sunProgress; // 0 to PI (east to west)

                    sunMesh.position.x = cityCenter + Math.cos(sunAngle) * orbitRadius;
                    sunMesh.position.y = Math.sin(sunAngle) * orbitHeight;
                    sunMesh.position.z = cityCenter - 30; // Slightly south

                    sunMesh.visible = true;
                    sunMesh.material.opacity = sunProgress < 0.1 ? sunProgress / 0.1 :
                                               sunProgress > 0.9 ? (1 - sunProgress) / 0.1 : 1;
                } else {
                    sunMesh.visible = false;
                }

                // Sync directional light with sun position
                if (sunLight && sunMesh.visible) {
                    sunLight.position.copy(sunMesh.position);
                    sunLight.target.position.set(cityCenter, 0, cityCenter);
                }
            }

            if (moonMesh) {
                // Moon visible from 0.8 to 0.2 (night hours, wrapping around midnight)
                let moonVisible = t >= 0.8 || t <= 0.2;

                if (moonVisible) {
                    // Normalize moon progress: 0.8->1.0->0.0->0.2 becomes 0->1
                    let moonProgress;
                    if (t >= 0.8) {
                        moonProgress = (t - 0.8) / 0.4; // 0.8-1.0 = 0-0.5
                    } else {
                        moonProgress = 0.5 + (t / 0.4); // 0-0.2 = 0.5-1.0
                    }
                    moonProgress = Math.min(1, moonProgress); // Clamp

                    const moonAngle = Math.PI * moonProgress;

                    moonMesh.position.x = cityCenter + Math.cos(moonAngle) * orbitRadius;
                    moonMesh.position.y = Math.sin(moonAngle) * (orbitHeight - 20); // Slightly lower arc
                    moonMesh.position.z = cityCenter + 30; // Slightly north

                    moonMesh.visible = true;
                    moonMesh.material.opacity = moonProgress < 0.1 ? moonProgress / 0.1 :
                                                moonProgress > 0.9 ? (1 - moonProgress) / 0.1 : 1;

                    // At night the directional light is moonlight — track the moon
                    if (sunLight && (!sunMesh || !sunMesh.visible)) {
                        sunLight.position.copy(moonMesh.position);
                        sunLight.target.position.set(cityCenter, 0, cityCenter);
                    }
                } else {
                    moonMesh.visible = false;
                }
            }

            // Drifting cloud cover + starfield, both tied to the light level
            if (skyDome) {
                const u = skyDome.material.uniforms;
                u.cloudOff.value.x = (u.cloudOff.value.x + dt * 0.004) % 1;
                u.cloudOff.value.y = (u.cloudOff.value.y + dt * 0.0009) % 1;
                u.cloudAmt.value = weatherState === 'storm' ? 0.95 : weatherState === 'rain' ? 0.85
                                 : weatherState === 'cloudy' ? 0.72 : 0.42;
                // clouds are lit by the same sky they hang in, and never darker than it
                const b = 0.30 + dayFactor * 0.70;
                const wf = weatherState === 'sunny' ? 1 : 0.68;
                u.cloudTint.value.setRGB(
                    Math.min(1, b * wf + lightningFlash * 0.7),
                    Math.min(1, b * wf * 0.99 + lightningFlash * 0.7),
                    Math.min(1, b * wf * 1.02 + lightningFlash * 0.7));
            }
            if (starField) {
                starField.material.opacity = Math.max(0, nightFactor - 0.45) * 1.9 * (weatherState === 'sunny' ? 1 : 0.15);
                starField.rotation.y += dt * 0.004;
            }

            // Sky and stars ride with the camera. Anchored at the origin, the far side
            // of the 440-unit dome falls outside the 500-unit far plane as soon as you
            // leave the middle of the map, and the clipped cap renders as a black dome
            // hanging over the city.
            if (skyDome) skyDome.position.copy(cam.position);
            if (starField) starField.position.copy(cam.position);

            // Unlit glass tracks the sky brightness (see setWindowLit)
            const targetWinF = 0.16 + dayFactor * 0.84;
            if (Math.abs(targetWinF - winDayF) > 0.07) {
                winDayF = targetWinF;
                for (const win of allWindows) {
                    if (!win.userData.isLit) win.material.color.copy(
                        _winCol.setHex(win.userData.darkColor).multiplyScalar(winDayF));
                }
            }

            // Track previous night state for transition detection
            if (typeof prevIsNight === 'undefined') prevIsNight = isNight;

            // On day/night transition, re-roll every window against the new lit fraction
            if (isNight !== prevIsNight) {
                const litProbability = WIN_LIT_P();
                allWindows.forEach(win => {
                    if (win.userData.hasFigure) return; // silhouette windows stay backlit
                    const shouldBeLit = Math.random() < litProbability;
                    if (shouldBeLit !== win.userData.isLit) setWindowLit(win, shouldBeLit);
                });

                prevIsNight = isNight;
            }
        }

        // Helper function for color interpolation
        function lerpColor(c1, c2, t) {
            const color1 = new THREE.Color(c1);
            const color2 = new THREE.Color(c2);
            return new THREE.Color().lerpColors(color1, color2, t).getHex();
        }

        function updStreetlights() {
            // Use emissive color for bulbs - no PointLights for performance
            const targetColor = isNight ? 0xffeeaa : 0x222211;

            streetlights.forEach(sl => {
                const bulb = sl.userData.bulb;
                if (bulb) {
                    bulb.material.color.setHex(targetColor);
                }
            });
        }

        function updBirds(t) {
            flocks.forEach(flock => {
                // Update flock center
                flock.center.set(0, 0, 0);
                flock.birds.forEach(bird => {
                    if (bird.userData.state === 'flying') {
                        flock.center.add(bird.position);
                    }
                });
                const flyingCount = flock.birds.filter(b => b.userData.state === 'flying').length;
                if (flyingCount > 0) {
                    flock.center.divideScalar(flyingCount);
                }

                // Check if flock reached waypoint, pick new one
                if (flock.targetWaypoint && flock.center.distanceTo(flock.targetWaypoint) < 15) {
                    flock.targetWaypoint = getRandomWaypoint();
                }

                // Update each bird
                flock.birds.forEach(bird => {
                    // Handle landed state
                    if (bird.userData.state === 'landed') {
                        // Check for pedestrian proximity - scatter if too close
                        if (checkPedestrianProximity(bird.position)) {
                            bird.userData.state = 'takeoff';
                            bird.userData.velocity.set(
                                (Math.random() - 0.5) * 0.2,
                                BIRD_CFG.takeoffSpeed,
                                (Math.random() - 0.5) * 0.2
                            );
                            return;
                        }

                        // Check if time to take off naturally
                        if (t > bird.userData.takeoffTime) {
                            bird.userData.state = 'takeoff';
                            bird.userData.velocity.set(
                                (Math.random() - 0.5) * 0.1,
                                BIRD_CFG.takeoffSpeed,
                                (Math.random() - 0.5) * 0.1
                            );
                        }

                        // Subtle idle animation while landed
                        bird.rotation.y += Math.sin(t * 2 + bird.userData.wingPhase) * 0.01;
                        return;
                    }

                    // Handle takeoff state
                    if (bird.userData.state === 'takeoff') {
                        bird.position.add(bird.userData.velocity);
                        bird.userData.velocity.y *= 0.98; // Slow vertical climb

                        // Animate wings rapidly during takeoff
                        bird.userData.wingPhase += 0.6;
                        const wingAngle = Math.sin(bird.userData.wingPhase) * 0.6;
                        if (bird.userData.leftWing) bird.userData.leftWing.rotation.z = wingAngle;
                        if (bird.userData.rightWing) bird.userData.rightWing.rotation.z = -wingAngle;

                        // Transition to flying once high enough
                        if (bird.position.y > BIRD_CFG.minHeight) {
                            bird.userData.state = 'flying';
                            bird.userData.velocity.y = 0;
                        }
                        return;
                    }

                    // Handle landing state
                    if (bird.userData.state === 'landing') {
                        const target = bird.userData.landingTarget;
                        const toTarget = target.clone().sub(bird.position);
                        const dist = toTarget.length();

                        if (dist < 0.3) {
                            // Landed!
                            bird.position.copy(target);
                            bird.userData.state = 'landed';
                            bird.userData.velocity.set(0, 0, 0);
                            bird.userData.takeoffTime = t + BIRD_CFG.minLandTime +
                                Math.random() * (BIRD_CFG.maxLandTime - BIRD_CFG.minLandTime);

                            // Fold wings
                            if (bird.userData.leftWing) bird.userData.leftWing.rotation.z = 0;
                            if (bird.userData.rightWing) bird.userData.rightWing.rotation.z = 0;

                            // Face random direction
                            bird.rotation.y = Math.random() * Math.PI * 2;
                            return;
                        }

                        // Move toward landing spot
                        toTarget.normalize().multiplyScalar(BIRD_CFG.landingSpeed);
                        bird.userData.velocity.lerp(toTarget, 0.1);
                        bird.position.add(bird.userData.velocity);

                        // Face direction of travel
                        const lookTarget = bird.position.clone().add(bird.userData.velocity);
                        bird.lookAt(lookTarget);

                        // Slow wing flapping during descent
                        bird.userData.wingPhase += 0.2;
                        const wingAngle = Math.sin(bird.userData.wingPhase) * 0.3;
                        if (bird.userData.leftWing) bird.userData.leftWing.rotation.z = wingAngle;
                        if (bird.userData.rightWing) bird.userData.rightWing.rotation.z = -wingAngle;
                        return;
                    }

                    // Flying state - check if should start landing
                    if (bird.userData.state === 'flying' && Math.random() < BIRD_CFG.landingChance) {
                        const perch = findPerchSpot(bird);
                        if (perch) {
                            bird.userData.state = 'landing';
                            bird.userData.landingTarget = perch;
                            return;
                        }
                    }

                    // Normal flying behavior (boids algorithm)
                    // Calculate boids forces
                    const separation = new THREE.Vector3();
                    const cohesion = new THREE.Vector3();
                    const alignment = new THREE.Vector3();
                    let separationCount = 0;
                    let cohesionCount = 0;
                    let alignmentCount = 0;

                    // Check against other birds in same flock
                    flock.birds.forEach(other => {
                        if (other === bird || other.userData.state !== 'flying') return;

                        const dist = bird.position.distanceTo(other.position);

                        // Separation - steer away from nearby birds
                        if (dist < BIRD_CFG.separationDist && dist > 0) {
                            const diff = bird.position.clone().sub(other.position);
                            diff.normalize().divideScalar(dist);
                            separation.add(diff);
                            separationCount++;
                        }

                        // Cohesion - steer toward center of nearby birds
                        if (dist < BIRD_CFG.cohesionDist) {
                            cohesion.add(other.position);
                            cohesionCount++;
                        }

                        // Alignment - match velocity of nearby birds
                        if (dist < BIRD_CFG.alignmentDist) {
                            alignment.add(other.userData.velocity);
                            alignmentCount++;
                        }
                    });

                    // Average and apply weights
                    if (separationCount > 0) {
                        separation.divideScalar(separationCount);
                        separation.normalize().multiplyScalar(BIRD_CFG.separationWeight);
                    }

                    if (cohesionCount > 0) {
                        cohesion.divideScalar(cohesionCount);
                        cohesion.sub(bird.position);
                        cohesion.normalize().multiplyScalar(BIRD_CFG.cohesionWeight);
                    }

                    if (alignmentCount > 0) {
                        alignment.divideScalar(alignmentCount);
                        alignment.normalize().multiplyScalar(BIRD_CFG.alignmentWeight);
                    }

                    // Waypoint steering
                    const toWaypoint = new THREE.Vector3();
                    if (flock.targetWaypoint) {
                        toWaypoint.subVectors(flock.targetWaypoint, bird.position);
                        toWaypoint.normalize().multiplyScalar(0.5);
                    }

                    // Random wandering
                    const wander = new THREE.Vector3(
                        (Math.random() - 0.5) * BIRD_CFG.wanderWeight,
                        (Math.random() - 0.5) * BIRD_CFG.wanderWeight * 0.3,
                        (Math.random() - 0.5) * BIRD_CFG.wanderWeight
                    );

                    // Height bounds steering
                    const heightSteer = new THREE.Vector3();
                    if (bird.position.y < BIRD_CFG.minHeight) {
                        heightSteer.y = 0.5;
                    } else if (bird.position.y > BIRD_CFG.maxHeight) {
                        heightSteer.y = -0.5;
                    }

                    // Combine all forces
                    const acceleration = new THREE.Vector3();
                    acceleration.add(separation);
                    acceleration.add(cohesion);
                    acceleration.add(alignment);
                    acceleration.add(toWaypoint);
                    acceleration.add(wander);
                    acceleration.add(heightSteer);

                    // Apply acceleration to velocity
                    bird.userData.velocity.add(acceleration.multiplyScalar(BIRD_CFG.turnSpeed));

                    // Limit speed
                    const speed = bird.userData.velocity.length();
                    if (speed > BIRD_CFG.speed * 1.5) {
                        bird.userData.velocity.normalize().multiplyScalar(BIRD_CFG.speed * 1.5);
                    } else if (speed < BIRD_CFG.speed * 0.5) {
                        bird.userData.velocity.normalize().multiplyScalar(BIRD_CFG.speed * 0.5);
                    }

                    // Update position
                    bird.position.add(bird.userData.velocity);

                    // Face direction of travel
                    if (bird.userData.velocity.length() > 0.01) {
                        const lookTarget = bird.position.clone().add(bird.userData.velocity);
                        bird.lookAt(lookTarget);
                    }

                    // Animate wings
                    bird.userData.wingPhase += 0.4;
                    const wingAngle = Math.sin(bird.userData.wingPhase) * 0.5;
                    if (bird.userData.leftWing) {
                        bird.userData.leftWing.rotation.z = wingAngle;
                    }
                    if (bird.userData.rightWing) {
                        bird.userData.rightWing.rotation.z = -wingAngle;
                    }
                });
            });
        }

        function updPerformers(t) {
            // Check for new performer spawn
            if (t - lastPerformerCheck > PERFORMER_CFG.spawnInterval) {
                lastPerformerCheck = t;
                if (Math.random() < PERFORMER_CFG.spawnChance) {
                    spawnPerformer();
                }
            }

            // Update existing performers
            for (let i = performers.length - 1; i >= 0; i--) {
                const performer = performers[i];
                const elapsed = t - performer.userData.spawnTime;

                // Check if performance is over
                if (elapsed > performer.userData.duration) {
                    // Release watchers back to walking
                    if (performer.userData.watchers) {
                        performer.userData.watchers.forEach(ped => {
                            if (ped.userData.state === 'watchingPerformer') {
                                ped.userData.state = 'walking';
                                ped.userData.watchingPerformer = null;
                                setNewPedTarget(ped);
                            }
                        });
                    }
                    scene.remove(performer);
                    performers.splice(i, 1);
                    continue;
                }

                // Animate musician strumming
                if (performer.userData.type === 'musician' && performer.userData.strumArm) {
                    performer.userData.animPhase += 0.1;
                    const strum = Math.sin(performer.userData.animPhase * 3) * 0.15;
                    performer.userData.strumArm.rotation.x = 0.3 + strum;
                }

                // Statue occasionally "breaks" stillness with tiny movement (living statue effect)
                if (performer.userData.type === 'statue') {
                    // Very occasional subtle head movement
                    if (Math.random() < 0.001) {
                        performer.children[1].rotation.y = (Math.random() - 0.5) * 0.1;
                    }
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta(), t = clock.getElapsedTime();
            
            const spd = boost ? baseSpd * 3 : baseSpd;
            const fwd = new THREE.Vector3(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch));
            const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
            
            if (keys['KeyW'] || keys['ArrowUp']) vel.add(fwd.clone().multiplyScalar(spd * 0.12));
            if (keys['KeyS'] || keys['ArrowDown']) vel.add(fwd.clone().multiplyScalar(-spd * 0.12));
            if (keys['KeyA'] || keys['ArrowLeft']) vel.add(right.clone().multiplyScalar(-spd * 0.12));
            if (keys['KeyD'] || keys['ArrowRight']) vel.add(right.clone().multiplyScalar(spd * 0.12));
            if (keys['KeyQ']) vel.y -= spd * 0.12;
            if (keys['KeyE']) vel.y += spd * 0.12;
            vel.multiplyScalar(0.9);
            cam.position.add(vel);
            
            // Minimum altitude of 2 meters
            if (cam.position.y < 2) cam.position.y = 2;
            
            cam.rotation.order = 'YXZ'; cam.rotation.y = yaw; cam.rotation.x = pitch;
            
            $('alt').textContent = Math.round(cam.position.y);
            $('spd').textContent = Math.round(vel.length() * 100);
            $('pos').textContent = `${Math.round(cam.position.x)},${Math.round(cam.position.z)}`;

            updDayNight(dt);
