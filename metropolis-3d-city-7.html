        function updDayNight(dt) {
            // Advance time (wraps at 1.0)
            timeOfDay = (timeOfDay + dayNightSpeed * dt) % 1.0;

            // Determine if night for other systems
            // Night: 8pm (0.833) to 5am (0.208)
            isNight = timeOfDay < 0.208 || timeOfDay > 0.833;

            // Calculate sky color based on time
            // Time segments (24hr clock):
            // 00:00-05:00 (0-0.208): midnight (dark)
            // 05:00-06:00 (0.208-0.25): dawn transition
            // 06:00-07:00 (0.25-0.292): dawn to day
            // 07:00-18:00 (0.292-0.75): full day
            // 18:00-19:00 (0.75-0.792): day to dusk
            // 19:00-20:00 (0.792-0.833): dusk to night
            // 20:00-00:00 (0.833-1.0): night (dark)
            let skyColor;
            const t = timeOfDay;

            if (t < 0.208) {
                // Midnight - stay dark (00:00-05:00)
                skyColor = SKY_COLORS.midnight;
            } else if (t < 0.25) {
                // Dawn transition (05:00-06:00)
                skyColor = lerpColor(SKY_COLORS.midnight, SKY_COLORS.dawn, (t - 0.208) / 0.042);
            } else if (t < 0.292) {
                // Dawn to day (06:00-07:00)
                skyColor = lerpColor(SKY_COLORS.dawn, SKY_COLORS.day, (t - 0.25) / 0.042);
            } else if (t < 0.75) {
                // Full day (07:00-18:00)
                skyColor = SKY_COLORS.day;
            } else if (t < 0.792) {
                // Day to dusk (18:00-19:00)
                skyColor = lerpColor(SKY_COLORS.day, SKY_COLORS.dusk, (t - 0.75) / 0.042);
            } else if (t < 0.833) {
                // Dusk to night (19:00-20:00)
                skyColor = lerpColor(SKY_COLORS.dusk, SKY_COLORS.night, (t - 0.792) / 0.041);
            } else {
                // Night - stay dark (20:00-00:00)
                skyColor = SKY_COLORS.midnight;
            }

            // Apply sky color (only if not overridden by weather)
            if (weatherState === 'sunny') {
                scene.background = new THREE.Color(skyColor);
                scene.fog.color = new THREE.Color(skyColor);
            }

            // Adjust lighting intensities
            const dayFactor = Math.sin(t * Math.PI); // 0 at midnight, 1 at noon
            const nightFactor = 1 - dayFactor;

            if (sunLight) {
                sunLight.intensity = 0.2 + dayFactor * 1.0; // 0.2 at night, 1.2 at noon
                // Warm color at dawn/dusk, white at noon
                if (t > 0.2 && t < 0.3) {
                    sunLight.color.setHex(0xffcc88); // Warm dawn
                } else if (t > 0.7 && t < 0.8) {
                    sunLight.color.setHex(0xff8844); // Orange dusk
                } else {
                    sunLight.color.setHex(0xfffacd); // Normal daylight
                }
            }

            if (ambientLight) {
                ambientLight.intensity = 0.15 + dayFactor * 0.45; // 0.15 at night, 0.6 at noon
            }

            if (hemiLight) {
                hemiLight.intensity = 0.1 + dayFactor * 0.4; // Dimmer at night
            }

            // Position sun and moon based on time
            // Sun arc: rises at 0.2 (east), peaks at 0.5 (south), sets at 0.8 (west)
            // Moon arc: rises at 0.8 (east), peaks at 0.0/1.0 (south), sets at 0.2 (west)

            const cityCenter = totalSize / 2; // Center point for orbits
            const orbitRadius = 150; // Distance from city center
            const orbitHeight = 120; // Peak height at noon/midnight

            if (sunMesh) {
                // Sun visible from 0.2 to 0.8 (day hours)
                if (t >= 0.2 && t <= 0.8) {
                    const sunProgress = (t - 0.2) / 0.6; // 0-1 during day
                    const sunAngle = Math.PI * sunProgress; // 0 to PI (east to west)

                    sunMesh.position.x = cityCenter + Math.cos(sunAngle) * orbitRadius;
                    sunMesh.position.y = Math.sin(sunAngle) * orbitHeight;
                    sunMesh.position.z = cityCenter - 30; // Slightly south

                    sunMesh.visible = true;
                    sunMesh.material.opacity = sunProgress < 0.1 ? sunProgress / 0.1 :
                                               sunProgress > 0.9 ? (1 - sunProgress) / 0.1 : 1;
                } else {
                    sunMesh.visible = false;
                }

                // Sync directional light with sun position
                if (sunLight && sunMesh.visible) {
                    sunLight.position.copy(sunMesh.position);
                    sunLight.target.position.set(cityCenter, 0, cityCenter);
                }
            }

            if (moonMesh) {
                // Moon visible from 0.8 to 0.2 (night hours, wrapping around midnight)
                let moonVisible = t >= 0.8 || t <= 0.2;

                if (moonVisible) {
                    // Normalize moon progress: 0.8->1.0->0.0->0.2 becomes 0->1
                    let moonProgress;
                    if (t >= 0.8) {
                        moonProgress = (t - 0.8) / 0.4; // 0.8-1.0 = 0-0.5
                    } else {
                        moonProgress = 0.5 + (t / 0.4); // 0-0.2 = 0.5-1.0
                    }
                    moonProgress = Math.min(1, moonProgress); // Clamp

                    const moonAngle = Math.PI * moonProgress;

                    moonMesh.position.x = cityCenter + Math.cos(moonAngle) * orbitRadius;
                    moonMesh.position.y = Math.sin(moonAngle) * (orbitHeight - 20); // Slightly lower arc
                    moonMesh.position.z = cityCenter + 30; // Slightly north

                    moonMesh.visible = true;
                    moonMesh.material.opacity = moonProgress < 0.1 ? moonProgress / 0.1 :
                                                moonProgress > 0.9 ? (1 - moonProgress) / 0.1 : 1;
                } else {
                    moonMesh.visible = false;
                }
            }

            // Track previous night state for transition detection
            if (typeof prevIsNight === 'undefined') prevIsNight = isNight;

            // On day/night transition, update many windows at once
            if (isNight !== prevIsNight) {
                const transitionCount = Math.floor(allWindows.length * 0.3); // Update 30% of windows
                const litProbability = isNight ? 0.7 : 0.2;

                for (let i = 0; i < transitionCount; i++) {
                    const win = allWindows[Math.floor(Math.random() * allWindows.length)];
                    const shouldBeLit = Math.random() < litProbability;
                    win.userData.isLit = shouldBeLit;
                    win.material.color.setHex(shouldBeLit ? 0xffeeaa : 0x334455);
                    win.material.needsUpdate = true;
                }

                prevIsNight = isNight;
            }
        }

        // Helper function for color interpolation
        function lerpColor(c1, c2, t) {
            const color1 = new THREE.Color(c1);
            const color2 = new THREE.Color(c2);
            return new THREE.Color().lerpColors(color1, color2, t).getHex();
        }

        function updWarningLights(t) {

                light.material.emissive && light.material.emissive.setRGB(r / 255, 0, 0);
            });
        }

        function updBirds(t) {
            flocks.forEach(flock => {
                // Update flock center
                flock.center.set(0, 0, 0);
                flock.birds.forEach(bird => {
                    if (bird.userData.state === 'flying') {
                        flock.center.add(bird.position);
                    }
                });
                const flyingCount = flock.birds.filter(b => b.userData.state === 'flying').length;
                if (flyingCount > 0) {
                    flock.center.divideScalar(flyingCount);
                }

                // Check if flock reached waypoint, pick new one
                if (flock.targetWaypoint && flock.center.distanceTo(flock.targetWaypoint) < 15) {
                    flock.targetWaypoint = getRandomWaypoint();
                }

                // Update each bird
                flock.birds.forEach(bird => {
                    // Handle landed state
                    if (bird.userData.state === 'landed') {
                        // Check for pedestrian proximity - scatter if too close
                        if (checkPedestrianProximity(bird.position)) {
                            bird.userData.state = 'takeoff';
                            bird.userData.velocity.set(
                                (Math.random() - 0.5) * 0.2,
                                BIRD_CFG.takeoffSpeed,
                                (Math.random() - 0.5) * 0.2
                            );
                            return;
                        }

                        // Check if time to take off naturally
                        if (t > bird.userData.takeoffTime) {
                            bird.userData.state = 'takeoff';
                            bird.userData.velocity.set(
                                (Math.random() - 0.5) * 0.1,
                                BIRD_CFG.takeoffSpeed,
                                (Math.random() - 0.5) * 0.1
                            );
                        }

                        // Subtle idle animation while landed
                        bird.rotation.y += Math.sin(t * 2 + bird.userData.wingPhase) * 0.01;
                        return;
                    }

                    // Handle takeoff state
                    if (bird.userData.state === 'takeoff') {
                        bird.position.add(bird.userData.velocity);
                        bird.userData.velocity.y *= 0.98; // Slow vertical climb

                        // Animate wings rapidly during takeoff
                        bird.userData.wingPhase += 0.6;
                        const wingAngle = Math.sin(bird.userData.wingPhase) * 0.6;
                        if (bird.userData.leftWing) bird.userData.leftWing.rotation.z = wingAngle;
                        if (bird.userData.rightWing) bird.userData.rightWing.rotation.z = -wingAngle;

                        // Transition to flying once high enough
                        if (bird.position.y > BIRD_CFG.minHeight) {
                            bird.userData.state = 'flying';
                            bird.userData.velocity.y = 0;
                        }
                        return;
                    }

                    // Handle landing state
                    if (bird.userData.state === 'landing') {
                        const target = bird.userData.landingTarget;
                        const toTarget = target.clone().sub(bird.position);
                        const dist = toTarget.length();

                        if (dist < 0.3) {
                            // Landed!
                            bird.position.copy(target);
                            bird.userData.state = 'landed';
                            bird.userData.velocity.set(0, 0, 0);
                            bird.userData.takeoffTime = t + BIRD_CFG.minLandTime +
                                Math.random() * (BIRD_CFG.maxLandTime - BIRD_CFG.minLandTime);

                            // Fold wings
                            if (bird.userData.leftWing) bird.userData.leftWing.rotation.z = 0;
                            if (bird.userData.rightWing) bird.userData.rightWing.rotation.z = 0;

                            // Face random direction
                            bird.rotation.y = Math.random() * Math.PI * 2;
                            return;
                        }

                        // Move toward landing spot
                        toTarget.normalize().multiplyScalar(BIRD_CFG.landingSpeed);
                        bird.userData.velocity.lerp(toTarget, 0.1);
                        bird.position.add(bird.userData.velocity);

                        // Face direction of travel
                        const lookTarget = bird.position.clone().add(bird.userData.velocity);
                        bird.lookAt(lookTarget);

                        // Slow wing flapping during descent
                        bird.userData.wingPhase += 0.2;
                        const wingAngle = Math.sin(bird.userData.wingPhase) * 0.3;
                        if (bird.userData.leftWing) bird.userData.leftWing.rotation.z = wingAngle;
                        if (bird.userData.rightWing) bird.userData.rightWing.rotation.z = -wingAngle;
                        return;
                    }

                    // Flying state - check if should start landing
                    if (bird.userData.state === 'flying' && Math.random() < BIRD_CFG.landingChance) {
                        const perch = findPerchSpot(bird);
                        if (perch) {
                            bird.userData.state = 'landing';
                            bird.userData.landingTarget = perch;
                            return;
                        }
                    }

                    // Normal flying behavior (boids algorithm)
                    // Calculate boids forces
                    const separation = new THREE.Vector3();
                    const cohesion = new THREE.Vector3();
                    const alignment = new THREE.Vector3();
                    let separationCount = 0;
                    let cohesionCount = 0;
                    let alignmentCount = 0;

                    // Check against other birds in same flock
                    flock.birds.forEach(other => {
                        if (other === bird || other.userData.state !== 'flying') return;

                        const dist = bird.position.distanceTo(other.position);

                        // Separation - steer away from nearby birds
                        if (dist < BIRD_CFG.separationDist && dist > 0) {
                            const diff = bird.position.clone().sub(other.position);
                            diff.normalize().divideScalar(dist);
                            separation.add(diff);
                            separationCount++;
                        }

                        // Cohesion - steer toward center of nearby birds
                        if (dist < BIRD_CFG.cohesionDist) {
                            cohesion.add(other.position);
                            cohesionCount++;
                        }

                        // Alignment - match velocity of nearby birds
                        if (dist < BIRD_CFG.alignmentDist) {
                            alignment.add(other.userData.velocity);
                            alignmentCount++;
                        }
                    });

                    // Average and apply weights
                    if (separationCount > 0) {
                        separation.divideScalar(separationCount);
                        separation.normalize().multiplyScalar(BIRD_CFG.separationWeight);
                    }

                    if (cohesionCount > 0) {
                        cohesion.divideScalar(cohesionCount);
                        cohesion.sub(bird.position);
                        cohesion.normalize().multiplyScalar(BIRD_CFG.cohesionWeight);
                    }

                    if (alignmentCount > 0) {
                        alignment.divideScalar(alignmentCount);
                        alignment.normalize().multiplyScalar(BIRD_CFG.alignmentWeight);
                    }

                    // Waypoint steering
                    const toWaypoint = new THREE.Vector3();
                    if (flock.targetWaypoint) {
                        toWaypoint.subVectors(flock.targetWaypoint, bird.position);
                        toWaypoint.normalize().multiplyScalar(0.5);
                    }

                    // Random wandering
                    const wander = new THREE.Vector3(
                        (Math.random() - 0.5) * BIRD_CFG.wanderWeight,
                        (Math.random() - 0.5) * BIRD_CFG.wanderWeight * 0.3,
                        (Math.random() - 0.5) * BIRD_CFG.wanderWeight
                    );

                    // Height bounds steering
                    const heightSteer = new THREE.Vector3();
                    if (bird.position.y < BIRD_CFG.minHeight) {
                        heightSteer.y = 0.5;
                    } else if (bird.position.y > BIRD_CFG.maxHeight) {
                        heightSteer.y = -0.5;
                    }

                    // Building avoidance - steer away from buildings
                    const buildingAvoid = new THREE.Vector3();
                    const avoidDist = 15; // Start avoiding when this close to building
                    buildings.forEach(b => {
                        if (!b.userData || !b.userData.height) return;
                        const bw = (b.userData.width || 6) / 2 + 3;
                        const bd = (b.userData.depth || 6) / 2 + 3;
                        const bh = b.userData.height;

                        // Check if bird is near building bounds (with margin)
                        const dx = bird.position.x - b.position.x;
                        const dz = bird.position.z - b.position.z;
                        const nearX = Math.abs(dx) < bw + avoidDist;
                        const nearZ = Math.abs(dz) < bd + avoidDist;
                        const nearY = bird.position.y < bh + 5;

                        if (nearX && nearZ && nearY) {
                            // Bird is in danger zone - calculate escape vector
                            const escapeX = dx < 0 ? -1 : 1;
                            const escapeZ = dz < 0 ? -1 : 1;

                            // Stronger avoidance when closer
                            const distToEdgeX = Math.max(0, bw - Math.abs(dx));
                            const distToEdgeZ = Math.max(0, bd - Math.abs(dz));
                            const urgency = Math.max(distToEdgeX, distToEdgeZ) / avoidDist;

                            // Push away from building center
                            buildingAvoid.x += escapeX * urgency * 2;
                            buildingAvoid.z += escapeZ * urgency * 2;

                            // If below building height, also push up
                            if (bird.position.y < bh + 3) {
                                buildingAvoid.y += 1.5;
                            }
                        }
                    });

                    // Combine all forces
                    const acceleration = new THREE.Vector3();
                    acceleration.add(separation);
                    acceleration.add(cohesion);
                    acceleration.add(alignment);
                    acceleration.add(toWaypoint);
                    acceleration.add(wander);
                    acceleration.add(heightSteer);
                    acceleration.add(buildingAvoid);

                    // Apply acceleration to velocity
                    bird.userData.velocity.add(acceleration.multiplyScalar(BIRD_CFG.turnSpeed));

                    // Limit speed
                    const speed = bird.userData.velocity.length();
                    if (speed > BIRD_CFG.speed * 1.5) {
                        bird.userData.velocity.normalize().multiplyScalar(BIRD_CFG.speed * 1.5);
                    } else if (speed < BIRD_CFG.speed * 0.5) {
                        bird.userData.velocity.normalize().multiplyScalar(BIRD_CFG.speed * 0.5);
                    }

                    // Update position
                    bird.position.add(bird.userData.velocity);

                    // Face direction of travel
                    if (bird.userData.velocity.length() > 0.01) {
                        const lookTarget = bird.position.clone().add(bird.userData.velocity);
                        bird.lookAt(lookTarget);
                    }

                    // Animate wings
                    bird.userData.wingPhase += 0.4;
                    const wingAngle = Math.sin(bird.userData.wingPhase) * 0.5;
                    if (bird.userData.leftWing) {
                        bird.userData.leftWing.rotation.z = wingAngle;
                    }
                    if (bird.userData.rightWing) {
                        bird.userData.rightWing.rotation.z = -wingAngle;
                    }
                });
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta(), t = clock.getElapsedTime();
            
            const spd = boost ? baseSpd * 3 : baseSpd;
            // Horizontal-only forward vector (ignores pitch) for ground movement
            const fwdHoriz = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
            const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));

            if (keys['KeyW'] || keys['ArrowUp']) vel.add(fwdHoriz.clone().multiplyScalar(spd * 0.12));
            if (keys['KeyS'] || keys['ArrowDown']) vel.add(fwdHoriz.clone().multiplyScalar(-spd * 0.12));
            if (keys['KeyA'] || keys['ArrowLeft']) vel.add(right.clone().multiplyScalar(-spd * 0.12));
            if (keys['KeyD'] || keys['ArrowRight']) vel.add(right.clone().multiplyScalar(spd * 0.12));
            if (keys['KeyQ']) vel.y -= spd * 0.12;
            if (keys['KeyE']) vel.y += spd * 0.12;
            vel.multiplyScalar(0.9);
            cam.position.add(vel);
            
            // Minimum altitude of 2 meters
            if (cam.position.y < 2) cam.position.y = 2;
            
            cam.rotation.order = 'YXZ'; cam.rotation.y = yaw; cam.rotation.x = pitch;
            
            $('alt').textContent = Math.round(cam.position.y);
            $('spd').textContent = Math.round(vel.length() * 100);
            $('pos').textContent = `${Math.round(cam.position.x)},${Math.round(cam.position.z)}`;
            // Convert timeOfDay (0-1) to 24-hour clock
            const totalMins = Math.floor(timeOfDay * 24 * 60);
            const hrs = Math.floor(totalMins / 60);
            const mins = totalMins % 60;
            $('time').textContent = `${hrs.toString().padStart(2,'0')}:${mins.toString().padStart(2,'0')}`;

            updDayNight(dt);
            updStreetlights();
            updWarningLights(t);

            updCars(t);
            updHighwayCars();
            updPeds(t);
            updBicycles(t);
            updTaxis(t);
            updOmnibus(t);
            updSubway(t);
            updSpecialEvents(t);
            updGarbageTruck(t);
            updWrecker(t);
            updTL(t);
            updSecrets(t);
            updBirds(t);
            updBillboards(t);
            updRooftopParties(t);
            updRooftopFigures(t);
            updRooftopAmenities(t);
            updWindowLights(t);
            updVegasWindows();
            updEmergencyLights(t);
            updGridlock(t);
            updWeather(t);
            if (temperatureBillboard) updTemperatureBillboard(temperatureBillboard, t);
            updWelcomeSign();
            chkDiscoveries();
            if (raining) updRain();
            updMM();
            
            renderer.render(scene, cam);
        }

        function updCars(t) {
            const carLength = 2.5;
            const safeDistance = carLength * 5; // 5 car lengths for emergency vehicles

            cars.forEach(car => {
                let shouldStop = false;

                // Taxis stop for pickup/dropoff
                if (car.userData.isTaxi && car.userData.taxiStopped) {
                    shouldStop = true;
                }

                // Check traffic lights (emergency vehicles ignore)
                if (!car.userData.isEmergency) {
                    tlights.forEach(tl => {
                        const ix = tl.userData.intersection.x;
                        const iz = tl.userData.intersection.z;
                        const phase = (t + tl.userData.phase) % 10;
                        // X-axis: GREEN 0-4.5, YELLOW 4.5-5, RED 5-10
                        // Z-axis: RED 0-5, GREEN 5-9.5, YELLOW 9.5-10
                        const isRedForX = phase >= 5;

                        if (car.userData.axis === 'x') {
                            const dist = (ix - car.position.x) * car.userData.dir;
                            // Only stop if intersection is 2-8 units ahead (not when already in it)
                            if (dist > 2 && dist < 8 && Math.abs(car.position.z - iz) < 5) {
                                if (isRedForX) shouldStop = true;
                            }
                        } else {
                            const dist = (iz - car.position.z) * car.userData.dir;
                            // Only stop if intersection is 2-8 units ahead (not when already in it)
                            if (dist > 2 && dist < 8 && Math.abs(car.position.x - ix) < 5) {
                                if (!isRedForX) shouldStop = true;
                            }
                        }
                    });
                }
                
                // Check for pedestrians on the road
                peds.forEach(ped => {
                    if (!ped.visible) return;
                    // Skip pedestrians waiting at or walking to bus stops - they're on the sidewalk
                    if (ped.userData.waitingForBus || ped.userData.state === 'toBusStop') return;

                    const dx = ped.position.x - car.position.x;
                    const dz = ped.position.z - car.position.z;

                    if (car.userData.axis === 'x') {
                        const ahead = dx * car.userData.dir;
                        const inPath = Math.abs(dz) < 3;
                        if (ahead > 0 && ahead < 8 && inPath) {
                            shouldStop = true;
                        }
                    } else {
                        const ahead = dz * car.userData.dir;
                        const inPath = Math.abs(dx) < 3;
                        if (ahead > 0 && ahead < 8 && inPath) {
                            shouldStop = true;
                        }
                    }
                });
                
                // Check for emergency vehicles - only yield if they're behind you and approaching
                if (!car.userData.isEmergency) {
                    emergencyVehicles.forEach(ev => {
                        if (ev.userData.axis !== car.userData.axis) return; // Different roads, ignore
                        
                        const dx = ev.position.x - car.position.x;
                        const dz = ev.position.z - car.position.z;
                        const dist = Math.sqrt(dx * dx + dz * dz);
                        
                        // Only yield if emergency vehicle is behind us and within range
                        if (dist < safeDistance) {
                            if (car.userData.axis === 'x') {
                                // Emergency vehicle behind us (opposite of our direction)
                                const evBehind = dx * car.userData.dir < 0;
                                const sameLane = Math.abs(dz) < 3;
                                // Emergency vehicle approaching (moving toward us)
                                const evApproaching = ev.userData.dir === car.userData.dir;
                                if (evBehind && sameLane && evApproaching) {
                                    // Pull over - don't stop, just slow down and let them pass
                                    // Actually for simplicity, just don't block - keep moving
                                }
                            } else {
                                const evBehind = dz * car.userData.dir < 0;
                                const sameLane = Math.abs(dx) < 3;
                                const evApproaching = ev.userData.dir === car.userData.dir;
                                if (evBehind && sameLane && evApproaching) {
                                    // Keep moving, don't block
                                }
                            }
                        }
                    });
                }
                
                // Check for cars ahead - widen detection to prevent clipping
                // Buses need longer detection distance due to size
                const stopDist = (car.userData.isBus || car.userData.isTaxi) ? 7 : 5;
                cars.forEach(other => {
                    if (other === car) return;
                    const dx = other.position.x - car.position.x;
                    const dz = other.position.z - car.position.z;
                    const dist = Math.sqrt(dx * dx + dz * dz);

                    // Check cars on same axis (same road direction)
                    if (other.userData.axis === car.userData.axis) {
                        // Use longer distance if either vehicle is a bus
                        const detectDist = (other.userData.isBus || car.userData.isBus) ? 8 : stopDist;
                        if (car.userData.axis === 'x') {
                            const ahead = dx * car.userData.dir;
                            const nearLane = Math.abs(dz) < 3;
                            if (ahead > 0 && ahead < detectDist && nearLane) {
                                shouldStop = true;
                            }
                        } else {
                            const ahead = dz * car.userData.dir;
                            const nearLane = Math.abs(dx) < 3;
                            if (ahead > 0 && ahead < detectDist && nearLane) {
                                shouldStop = true;
                            }
                        }
                    }
                    // Check cars on perpendicular roads (at intersections)
                    // Only stop if both cars are approaching the same point
                    else {
                        // Larger detection radius for buses
                        const crossDist = (car.userData.isBus || other.userData.isBus) ? 5 : 3.5;
                        const crossAhead = (car.userData.isBus || other.userData.isBus) ? 6 : 4;
                        if (dist < crossDist) {
                            const myAhead = car.userData.axis === 'x'
                                ? dx * car.userData.dir
                                : dz * car.userData.dir;
                            const theirAhead = other.userData.axis === 'x'
                                ? -dx * other.userData.dir
                                : -dz * other.userData.dir;
                            // Both cars must be approaching collision point
                            if (myAhead > 0 && myAhead < crossAhead && theirAhead > 0 && theirAhead < crossAhead) {
                                shouldStop = true;
                            }
                        }
                    }
                });
                
                // Check for broken down cars or other obstacles from special events
                let obstacleAhead = false;
                if (specialEvent && specialEvent.entities) {
                    specialEvent.entities.forEach(entity => {
                        if (!entity.userData.isBrokenDown) return;
                        const dx = entity.position.x - car.position.x;
                        const dz = entity.position.z - car.position.z;
                        
                        if (car.userData.axis === 'x') {
                            const ahead = dx * car.userData.dir;
                            const nearLane = Math.abs(entity.position.z - car.position.z) < 3;
                            if (ahead > 0 && ahead < 8 && nearLane) {
                                obstacleAhead = true;
                            }
                        } else {
                            const ahead = dz * car.userData.dir;
                            const nearLane = Math.abs(entity.position.x - car.position.x) < 3;
                            if (ahead > 0 && ahead < 8 && nearLane) {
                                obstacleAhead = true;
                            }
                        }
                    });
                }
                
                // Check for garbage truck
                if (garbageTruck && garbageTruckActive) {
                    const dx = garbageTruck.position.x - car.position.x;
                    const dz = garbageTruck.position.z - car.position.z;
                    
                    if (car.userData.axis === 'x') {
                        const ahead = dx * car.userData.dir;
                        const nearLane = Math.abs(dz) < 3;
                        if (ahead > 0 && ahead < 10 && nearLane) {
                            obstacleAhead = true;
                        }
                    } else {
                        const ahead = dz * car.userData.dir;
                        const nearLane = Math.abs(dx) < 3;
                        if (ahead > 0 && ahead < 10 && nearLane) {
                            obstacleAhead = true;
                        }
                    }
                }
                
                // Check for omnibus
                if (omnibus) {
                    const dx = omnibus.position.x - car.position.x;
                    const dz = omnibus.position.z - car.position.z;
                    
                    if (car.userData.axis === 'x') {
                        const ahead = dx * car.userData.dir;
                        const nearLane = Math.abs(dz) < 3;
                        if (ahead > 0 && ahead < 6 && nearLane) {
                            obstacleAhead = true;
                        }
                    } else {
                        const ahead = dz * car.userData.dir;
                        const nearLane = Math.abs(dx) < 3;
                        if (ahead > 0 && ahead < 6 && nearLane) {
                            obstacleAhead = true;
                        }
                    }
                }
                
                // Move car if not stopped
                if (!shouldStop && !obstacleAhead) {
                    const speed = car.userData.isEmergency ? car.userData.spd * 1.5 : car.userData.spd;

                    // If in passing lane, check if we can return to original lane
                    if (car.userData.inPassingLane && car.userData.originalLaneOffset !== undefined) {
                        // Track time in passing lane
                        car.userData.passingLaneTime = (car.userData.passingLaneTime || 0) + 0.016;

                        const origOffset = car.userData.originalLaneOffset;
                        let originalLaneClear = true;

                        // Check if original lane is clear ahead (only 5 units)
                        cars.forEach(other => {
                            if (other === car) return;
                            if (other.userData.axis !== car.userData.axis) return;

                            const dx = other.position.x - car.position.x;
                            const dz = other.position.z - car.position.z;
                            const dist = Math.sqrt(dx * dx + dz * dz);

                            if (dist < 5) {
                                // Check if other car is in our original lane
                                if (car.userData.axis === 'x') {
                                    if (Math.abs(other.position.z - (car.userData.roadPos + origOffset)) < 1.5) {
                                        if (dx * car.userData.dir > 0) {
                                            originalLaneClear = false;
                                        }
                                    }
                                } else {
                                    if (Math.abs(other.position.x - (car.userData.roadPos + origOffset)) < 1.5) {
                                        if (dz * car.userData.dir > 0) {
                                            originalLaneClear = false;
                                        }
                                    }
                                }
                            }
                        });

                        // Check for oncoming traffic only in our original lane
                        cars.forEach(other => {
                            if (other === car) return;
                            if (other.userData.axis !== car.userData.axis) return;
                            if (other.userData.dir === car.userData.dir) return;

                            const dx = other.position.x - car.position.x;
                            const dz = other.position.z - car.position.z;
                            const dist = Math.sqrt(dx * dx + dz * dz);

                            // Only block if oncoming car is actually in our target lane
                            if (dist < 8) {
                                if (car.userData.axis === 'x') {
                                    if (Math.abs(other.position.z - (car.userData.roadPos + origOffset)) < 2) {
                                        originalLaneClear = false;
                                    }
                                } else {
                                    if (Math.abs(other.position.x - (car.userData.roadPos + origOffset)) < 2) {
                                        originalLaneClear = false;
                                    }
                                }
                            }
                        });

                        // Force return after 2 seconds in passing lane (desperate merge)
                        if (car.userData.passingLaneTime > 2) {
                            originalLaneClear = true;
                        }

                        if (originalLaneClear) {
                            // Return to original lane
                            car.userData.laneOffset = origOffset;
                            car.userData.inPassingLane = false;
                            car.userData.passingLaneTime = 0;
                        }
                    }

                    if (car.userData.axis === 'x') {
                        car.position.x += speed * car.userData.dir;
                        car.position.z = car.userData.roadPos + car.userData.laneOffset;
                        if (car.position.x > halfSize + 15) car.position.x = -halfSize - 15;
                        if (car.position.x < -halfSize - 15) car.position.x = halfSize + 15;
                    } else {
                        car.position.z += speed * car.userData.dir;
                        car.position.x = car.userData.roadPos + car.userData.laneOffset;
                        if (car.position.z > halfSize + 15) car.position.z = -halfSize - 15;
                        if (car.position.z < -halfSize - 15) car.position.z = halfSize + 15;
                    }
                } else if (obstacleAhead || shouldStop) {
                    // Try to change lanes to go around obstacle
                    const oppositeOffset = -car.userData.laneOffset;
                    
                    // Check if opposite lane is clear
                    let oppositeClear = true;
                    cars.forEach(other => {
                        if (other === car) return;
                        const dx = other.position.x - car.position.x;
                        const dz = other.position.z - car.position.z;
                        const dist = Math.sqrt(dx * dx + dz * dz);
                        if (dist < 8) {
                            if (car.userData.axis === 'x' && Math.abs(other.position.z - (car.userData.roadPos + oppositeOffset)) < 1.5) {
                                oppositeClear = false;
                            } else if (car.userData.axis === 'z' && Math.abs(other.position.x - (car.userData.roadPos + oppositeOffset)) < 1.5) {
                                oppositeClear = false;
                            }
                        }
                    });
                    
                    // Also check for oncoming traffic
                    cars.forEach(other => {
                        if (other === car) return;
                        if (other.userData.axis !== car.userData.axis) return;
                        if (other.userData.dir === car.userData.dir) return; // Same direction, ok
                        
                        const dx = other.position.x - car.position.x;
                        const dz = other.position.z - car.position.z;
                        const dist = Math.sqrt(dx * dx + dz * dz);
                        
                        if (dist < 15) {
                            // Oncoming car nearby, don't switch
                            oppositeClear = false;
                        }
                    });
                    
                    if (oppositeClear && obstacleAhead) {
                        // Switch lanes to go around - mark as in passing lane
                        car.userData.laneOffset = oppositeOffset;
                        car.userData.inPassingLane = true;
                        const speed = car.userData.spd * 0.8;

                        if (car.userData.axis === 'x') {
                            car.position.x += speed * car.userData.dir;
                            car.position.z = car.userData.roadPos + oppositeOffset;
                        } else {
                            car.position.z += speed * car.userData.dir;
                            car.position.x = car.userData.roadPos + oppositeOffset;
                        }
                        car.userData.stuckTime = 0;
                    } else if (car.userData.isEmergency) {
                        // Emergency vehicles try to go around obstacles by switching lanes
                        // But NEVER if there are pedestrians crossing nearby
                        let pedCrossing = false;
                        peds.forEach(ped => {
                            if (ped.userData.state === 'crossing') {
                                const dx = ped.position.x - car.position.x;
                                const dz = ped.position.z - car.position.z;
                                const dist = Math.sqrt(dx * dx + dz * dz);
                                if (dist < 10) pedCrossing = true;
                            }
                        });

                        if (pedCrossing) return; // Don't move if pedestrian crossing nearby

                        const speed = car.userData.spd * 1.2;
                        const emergencyOppositeOffset = -car.userData.laneOffset;

                        // Calculate next position
                        let nextX = car.position.x;
                        let nextZ = car.position.z;
                        if (car.userData.axis === 'x') {
                            nextX += speed * car.userData.dir;
                            nextZ = car.userData.roadPos + emergencyOppositeOffset;
                        } else {
                            nextZ += speed * car.userData.dir;
                            nextX = car.userData.roadPos + emergencyOppositeOffset;
                        }

                        // Check if path is clear (both at next position and along the way)
                        let pathClear = true;
                        cars.forEach(other => {
                            if (other === car) return;
                            const dx = other.position.x - nextX;
                            const dz = other.position.z - nextZ;
                            const dist = Math.sqrt(dx * dx + dz * dz);
                            if (dist < 3.5) pathClear = false;
                        });

                        if (pathClear) {
                            car.position.x = nextX;
                            car.position.z = nextZ;
                            car.userData.laneOffset = emergencyOppositeOffset;
                            if (car.userData.axis === 'x') {
                                if (car.position.x > halfSize + 15) car.position.x = -halfSize - 15;
                                if (car.position.x < -halfSize - 15) car.position.x = halfSize + 15;
                            } else {
                                if (car.position.z > halfSize + 15) car.position.z = -halfSize - 15;
                                if (car.position.z < -halfSize - 15) car.position.z = halfSize + 15;
                            }
                            car.userData.stuckTime = 0;
                        }
                    } else {
                        // Regular car stuck - try to self-unstick after 5 seconds
                        if (car.userData.stuckTime > 5) {
                            // Buses should NOT flip direction - they just wait
                            if (car.userData.isBus) {
                                car.userData.stuckTime = 0;
                            } else if (!car.userData.inPassingLane && Math.random() < 0.3) {
                                // 30% chance to briefly use passing lane (only if not already there)
                                car.userData.laneOffset = -car.userData.laneOffset;
                                car.userData.inPassingLane = true;
                                car.userData.passingLaneTime = 0;
                            } else if (Math.random() < 0.1) {
                                // 10% chance to reverse and go the other way
                                car.userData.dir *= -1;
                                // Update lane for new direction (right-side driving)
                                if (car.userData.axis === 'x') {
                                    car.userData.laneOffset = car.userData.dir * 1.8;
                                    car.userData.originalLaneOffset = car.userData.laneOffset;
                                    car.rotation.y = car.userData.dir > 0 ? 0 : Math.PI;
                                } else {
                                    car.userData.laneOffset = -car.userData.dir * 1.8;
                                    car.userData.originalLaneOffset = car.userData.laneOffset;
                                    car.rotation.y = car.userData.dir > 0 ? -Math.PI / 2 : Math.PI / 2;
                                }
                                car.userData.inPassingLane = false;
                            }
                            // Otherwise just wait
                            car.userData.stuckTime = 0;
                        }
                    }
                }
            });
        }

        function updEmergencyLights(t) {
            emergencyVehicles.forEach(ev => {
                ev.traverse(child => {
                    if (child.userData.emergencyLight) {
                        const flash = Math.sin(t * 15) > 0;
                        child.material.color.setHex(flash ? child.userData.lightColor : 0x333333);
                    }
                });
            });
        }
        
        function updGridlock(t) {
            // Check every second
            if (t - lastGridlockCheck < 1) return;
            lastGridlockCheck = t;
            
            // Update stuck time for all cars
            cars.forEach(car => {
                if (!car.userData.lastPos) {
                    car.userData.lastPos = { x: car.position.x, z: car.position.z };
                    car.userData.stuckTime = 0;
                    return;
                }
                
                const dx = car.position.x - car.userData.lastPos.x;
                const dz = car.position.z - car.userData.lastPos.z;
                const moved = Math.sqrt(dx * dx + dz * dz);
                
                if (moved < 0.5) {
                    // Car hasn't moved much
                    car.userData.stuckTime = (car.userData.stuckTime || 0) + 1;
                } else {
                    car.userData.stuckTime = 0;
                    car.userData.beingHelped = false;
                }
                
                car.userData.lastPos = { x: car.position.x, z: car.position.z };
            });
            
            // Find a stuck car or pedestrian that needs help (stuck > 15 seconds)
            if (!trafficCop && !trafficCopTarget) {
                // Check for stuck cars first
                const stuckCar = cars.find(c =>
                    c.userData.stuckTime > 15 &&
                    !c.userData.beingHelped &&
                    !c.userData.isEmergency
                );

                // Also check for stuck pedestrians
                const stuckPed = peds.find(p =>
                    p.userData.stuckTime > 15 &&
                    !p.userData.beingHelped
                );

                const stuckEntity = stuckCar || stuckPed;

                if (stuckEntity) {
                    // Dispatch police car to help!
                    stuckEntity.userData.beingHelped = true;
                    trafficCopTarget = stuckEntity;

                    // Find the police car
                    const policeCar = emergencyVehicles.find(ev => ev.userData.emergencyType === 'police');
                    if (policeCar && !policeChaseTarget) {
                        // Use police car instead of traffic cop pedestrian
                        policeCar.userData.respondingToGridlock = true;
                        policeCar.userData.gridlockTarget = stuckEntity;
                        trafficCop = policeCar; // Reuse trafficCop variable to track response
                        notify('🚔 Police car dispatched to assist!', 2500);
                    } else {
                        // Fallback to traffic cop pedestrian if police is busy
                        spawnTrafficCop(stuckEntity);
                        notify('🚔 Traffic cop dispatched to clear gridlock!', 2500);
                    }
                }
            }
            
            // Update traffic cop or police car response
            if (trafficCop && trafficCopTarget) {
                const dx = trafficCopTarget.position.x - trafficCop.position.x;
                const dz = trafficCopTarget.position.z - trafficCop.position.z;
                const dist = Math.sqrt(dx * dx + dz * dz);

                // Check if this is a police car responding to gridlock
                if (trafficCop.userData.respondingToGridlock) {
                    if (dist < 6) {
                        // Police car arrived - clear the gridlock!
                        clearGridlock(trafficCopTarget);
                        trafficCop.userData.respondingToGridlock = false;
                        trafficCop.userData.gridlockTarget = null;
                        trafficCop.userData.returningToRoad = true;
                        trafficCopTarget.userData.beingHelped = false;
                        trafficCop = null;
                        trafficCopTarget = null;
                    } else {
                        // Police car drives toward stuck entity
                        const speed = 0.25;
                        trafficCop.position.x += (dx / dist) * speed;
                        trafficCop.position.z += (dz / dist) * speed;
                        trafficCop.rotation.y = Math.atan2(dx, dz);
                    }
                } else {
                    // Regular traffic cop pedestrian logic
                    if (dist < 3) {
                        // Arrived at gridlock - clear it!
                        clearGridlock(trafficCopTarget);

                        // Cop walks away
                        trafficCop.userData.state = 'leaving';
                        trafficCop.userData.leaveTimer = 0;
                    } else if (trafficCop.userData.state === 'approaching') {
                        // Walk toward stuck car
                        const speed = 0.08;
                        trafficCop.position.x += (dx / dist) * speed;
                        trafficCop.position.z += (dz / dist) * speed;
                        trafficCop.rotation.y = Math.atan2(dx, dz);

                        // Animate walking
                        trafficCop.userData.walk = (trafficCop.userData.walk || 0) + 0.2;
                        const sw = Math.sin(trafficCop.userData.walk) * 0.4;
                        if (trafficCop.userData.ll) trafficCop.userData.ll.rotation.x = sw;
                        if (trafficCop.userData.rl) trafficCop.userData.rl.rotation.x = -sw;
                    }

                    if (trafficCop.userData.state === 'leaving') {
                        trafficCop.userData.leaveTimer += 0.016;

                        // Walk to edge of road
                        trafficCop.position.x += 0.05;
                        trafficCop.rotation.y = Math.PI / 2;

                        trafficCop.userData.walk = (trafficCop.userData.walk || 0) + 0.2;
                        const sw = Math.sin(trafficCop.userData.walk) * 0.4;
                        if (trafficCop.userData.ll) trafficCop.userData.ll.rotation.x = sw;
                        if (trafficCop.userData.rl) trafficCop.userData.rl.rotation.x = -sw;

                        if (trafficCop.userData.leaveTimer > 3) {
                            // Remove cop
                            scene.remove(trafficCop);
                            trafficCop = null;
                            trafficCopTarget = null;
                        }
                    }
                }
            }

            // Update headlights based on time of day
            cars.forEach(car => {
                if (car.userData.headlights) {
                    const headlightColor = isNight ? 0xffffee : 0x333322;
                    car.userData.headlights.forEach(hl => {
                        if (hl.material) { // Mesh, not light
                            hl.material.color.setHex(headlightColor);
                        }
                    });
                }
            });
        }

        function spawnTrafficCop(targetCar) {
            const cop = new THREE.Group();
            
            // Blue police uniform
            const body = new THREE.Mesh(
                new THREE.CylinderGeometry(0.15, 0.18, 0.6, 8),

            );
            body.position.y = 0.45;
            cop.add(body);
            
            // Head
            const head = new THREE.Mesh(
                new THREE.SphereGeometry(0.12, 8, 8),

            );
            head.position.y = 0.85;
            cop.add(head);
            
            // Police cap
            const cap = new THREE.Mesh(
                new THREE.CylinderGeometry(0.14, 0.14, 0.08, 8),
                new THREE.MeshStandardMaterial({ color: 0x000044 })
            );
            cap.position.y = 0.95;
            cop.add(cap);
            
            // Cap brim
            const brim = new THREE.Mesh(
                new THREE.CylinderGeometry(0.16, 0.16, 0.02, 8),

            );
            brim.position.set(0.05, 0.92, 0);
            cop.add(brim);
            
            // Legs
            const legMat = new THREE.MeshStandardMaterial({ color: 0x000044 });
            const ll = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.35, 6), legMat);
            ll.position.set(0.07, 0.17, 0);
            cop.add(ll);
            cop.userData.ll = ll;
            
            const rl = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.35, 6), legMat);
            rl.position.set(-0.07, 0.17, 0);

            cop.userData.rl = rl;
            
            // Whistle (small yellow sphere)
            const whistle = new THREE.Mesh(

            // Position cop near the stuck car

            cop.position.set(
