        function wallAdTex(ad) {
            return _winCanvasTex(512, 256, (ctx, W, H) => {
                ctx.fillStyle = ad.bg; ctx.fillRect(0, 0, W, H);
                // painted-on wear so it doesn't look like a decal
                ctx.fillStyle = 'rgba(255,255,255,0.05)';
                for (let i = 0; i < 60; i++) ctx.fillRect(Math.random() * W, Math.random() * H, 40, 3);
                ctx.strokeStyle = ad.accent; ctx.lineWidth = 10;
                ctx.strokeRect(14, 14, W - 28, H - 28);
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                let size = 92;
                do { ctx.font = `bold ${size}px Impact, "Arial Black", system-ui`; size -= 3; }
                while (ctx.measureText(ad.head).width > W - 70 && size > 20);
                ctx.fillStyle = ad.fg;
                ctx.fillText(ad.head, W / 2, H * 0.40);
                ctx.fillStyle = ad.accent;
                ctx.fillRect(W * 0.22, H * 0.58, W * 0.56, 5);
                let s2 = 34;
                do { ctx.font = `bold ${s2}px system-ui, sans-serif`; s2 -= 2; }
                while (ctx.measureText(ad.sub).width > W - 90 && s2 > 10);
                ctx.fillStyle = ad.fg;
                ctx.fillText(ad.sub, W / 2, H * 0.74);
            });
        }

        function mkWallAds() {
            const deck = WALL_ADS.map((_, i) => i);
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
            let n = 0;
            const hosts = buildings
                .filter(b => b.userData.height > 26 && b.userData.width >= 5)
                .sort(() => Math.random() - 0.5);

            for (const b of hosts) {
                if (n >= 10) break;
                const w = b.userData.width, d = b.userData.depth, h = b.userData.height;
                const ad = WALL_ADS[deck[n % deck.length]];
                const tex = wallAdTex(ad);
                const mat = new THREE.MeshBasicMaterial({ map: tex });   // stays readable after dark

                // one or two faces, always ones that look down a street
                const faces = [0, 1, 2, 3].sort(() => Math.random() - 0.5).slice(0, Math.random() < 0.4 ? 2 : 1);
                for (const face of faces) {
                    const spanW = (face < 2 ? w : d) * 0.92;
                    const bh = Math.min(9, Math.max(4, h * 0.2));
                    const y = h * (0.5 + Math.random() * 0.28);
                    const panel = new THREE.Mesh(new THREE.PlaneGeometry(spanW, bh), mat);
                    const e = 0.14;
                    if (face === 0) panel.position.set(0, y, d / 2 + e);
                    else if (face === 1) { panel.position.set(0, y, -d / 2 - e); panel.rotation.y = Math.PI; }
                    else if (face === 2) { panel.position.set(w / 2 + e, y, 0); panel.rotation.y = Math.PI / 2; }
                    else { panel.position.set(-w / 2 - e, y, 0); panel.rotation.y = -Math.PI / 2; }
                    panel.userData.shop = { emoji: '📣', name: ad.head, blurb: ad.sub };
                    b.add(panel);
                    shopHitMeshes.push(panel);

                    // gooseneck floodlights along the bottom edge, lit at night
                    const arm = new THREE.MeshStandardMaterial({ color: 0x3a3e42, roughness: 0.6, metalness: 0.4 });
                    for (let k = -1; k <= 1; k++) {
                        const lamp = new THREE.Group();
                        const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.7, 5), arm);
                        stalk.rotation.x = Math.PI / 2.4;
                        lamp.add(stalk);
                        const hood = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.14, 0.26, 8), arm);
                        hood.position.set(0, 0.22, 0.3);
                        hood.rotation.x = -0.9;
                        lamp.add(hood);
                        const bulb = new THREE.Mesh(new THREE.CircleGeometry(0.13, 8),
                            new THREE.MeshBasicMaterial({ color: 0xfff0c0 }));
                        bulb.position.set(0, 0.32, 0.36);
                        bulb.rotation.x = -0.9;
                        lamp.add(bulb);
                        bulb.userData.steady = true;   // floodlights burn, they don't chase
                        streetLife.bulbs.push(bulb);
                        lamp.position.copy(panel.position);
                        lamp.rotation.copy(panel.rotation);
                        lamp.translateY(-bh / 2 - 0.35);
                        lamp.translateX(k * spanW * 0.33);
                        b.add(lamp);
                    }
                }
                n++;
            }
        }

        function mkTrafficLights() {

        function mkTL() {
            const g = new THREE.Group();
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x5e6266, metalness: 0.5, roughness: 0.5 });
            const boxMat = new THREE.MeshStandardMaterial({ color: 0x33383c, roughness: 0.6 });

            g.userData.lts = [];

            // 4 corners of intersection - each gets a pole with signal
            // Signal on corner, rotated 180 degrees to face approaching traffic
            const corners = [
                // SW corner - faces WEST toward westbound traffic (-X dir)
                { x: -5, z: 5, facingX: -1, facingZ: 0, axis: 'x', dir: -1 },
                // NW corner - faces NORTH toward northbound traffic (-Z dir)
                { x: -5, z: -5, facingX: 0, facingZ: -1, axis: 'z', dir: -1 },
                // NE corner - faces EAST toward eastbound traffic (+X dir)
                { x: 5, z: -5, facingX: 1, facingZ: 0, axis: 'x', dir: 1 },
                // SE corner - faces SOUTH toward southbound traffic (+Z dir)
                { x: 5, z: 5, facingX: 0, facingZ: 1, axis: 'z', dir: 1 }
            ];

            corners.forEach(corner => {
                // Pole - street corner style
                const pole = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.08, 0.1, 5),
                    poleMat
                );
                pole.position.set(corner.x, 2.5, corner.z);
                pole.castShadow = true;
                g.add(pole);

                // Signal housing (vertical 3-light box)
                const box = new THREE.Mesh(
                    new THREE.BoxGeometry(0.5, 1.2, 0.35),
                    boxMat
                );
                box.position.set(corner.x, 5.3, corner.z);
                box.rotation.y = Math.atan2(corner.facingX, corner.facingZ);
                g.add(box);

                // Visor/hood over the signal (extends in facing direction)
                const visor = new THREE.Mesh(
                    new THREE.BoxGeometry(0.6, 0.1, 0.5),
                    boxMat
                );
                visor.position.set(
                    corner.x + corner.facingX * 0.2,
                    5.95,
                    corner.z + corner.facingZ * 0.2
                );
                visor.rotation.y = Math.atan2(corner.facingX, corner.facingZ);
                g.add(visor);

                // Three lights: red (top), yellow (middle), green (bottom)
                const colors = [0xff0000, 0xffff00, 0x00ff00];
                const yPositions = [5.65, 5.3, 4.95];

                colors.forEach((col, idx) => {
                    const light = new THREE.Mesh(
                        new THREE.SphereGeometry(0.1),
                        new THREE.MeshBasicMaterial({ color: 0x222222 })
                    );
                    // Position lights on the front face of signal box
                    light.position.set(
                        corner.x + corner.facingX * 0.2,
                        yPositions[idx],
                        corner.z + corner.facingZ * 0.2
                    );
                    light.userData.axis = corner.axis;
                    light.userData.lightIndex = idx; // 0=red, 1=yellow, 2=green
                    light.userData.activeCol = col;
                    g.add(light);
                    g.userData.lts.push(light);
                });
            });

            return g;
        }

        function updOmnibus(t) {
            if (!omnibus) return;
            
            const currentStop = omnibusStops[omnibus.userData.currentStop];
            const nextStop = omnibusStops[omnibus.userData.nextStop];
            
            // Ring bell occasionally
            if (omnibus.userData.bell && Math.random() < 0.002) {
                omnibus.userData.bell.scale.setScalar(1.3);
                setTimeout(() => {
                    if (omnibus.userData.bell) omnibus.userData.bell.scale.setScalar(1);
                }, 100);
            }
            
            if (omnibus.userData.state === 'moving') {
                // Move toward next stop
                const dx = nextStop.x - omnibus.position.x;
                const dz = nextStop.z - omnibus.position.z;
                const dist = Math.sqrt(dx * dx + dz * dz);
                
                if (dist < 1) {
                    // Arrived at stop
                    omnibus.userData.state = 'stopping';
                    omnibus.userData.stopTimer = 0;
                    omnibus.position.set(nextStop.x, 0, nextStop.z);
                } else {
                    // Check for obstacles ahead
                    let omnibusBlocked = false;
                    
                    // Check cars
                    for (const car of cars) {
                        const cdx = car.position.x - omnibus.position.x;
                        const cdz = car.position.z - omnibus.position.z;
                        const cdist = Math.sqrt(cdx * cdx + cdz * cdz);
                        // Check if car is in our path
                        const dotProduct = (cdx * dx + cdz * dz) / dist;
                        if (dotProduct > 0 && cdist < 5) {
                            omnibusBlocked = true;
                            break;
                        }
                    }
                    
                    // Check garbage truck
                    if (!omnibusBlocked && garbageTruck && garbageTruckActive) {
                        const gdx = garbageTruck.position.x - omnibus.position.x;
                        const gdz = garbageTruck.position.z - omnibus.position.z;
                        const gdist = Math.sqrt(gdx * gdx + gdz * gdz);
                        if (gdist < 8) {
                            omnibusBlocked = true;
                        }
                    }
                    
                    // Check pedestrians
                    for (const ped of peds) {
                        if (!ped.visible) continue;
                        const pdx = ped.position.x - omnibus.position.x;
                        const pdz = ped.position.z - omnibus.position.z;
                        const pdist = Math.sqrt(pdx * pdx + pdz * pdz);
                        const dotProduct = (pdx * dx + pdz * dz) / dist;
                        if (dotProduct > 0 && pdist < 6) {
                            omnibusBlocked = true;
                            break;
                        }
                    }
                    
                    if (!omnibusBlocked) {
                        // Keep moving
                        const speed = omnibus.userData.spd;
                        spinWheels(omnibus, speed);
                        omnibus.position.x += (dx / dist) * speed;
                        omnibus.position.z += (dz / dist) * speed;

                        // Face direction of travel (front of bus is +X, so subtract PI/2)
                        omnibus.rotation.y = Math.atan2(dx, dz) - Math.PI / 2;
                    }
                }
            } else if (omnibus.userData.state === 'stopping') {
                omnibus.userData.stopTimer += 0.016;
                
                if (omnibus.userData.stopTimer > 0.5) {
                    omnibus.userData.state = 'boarding';
                    omnibus.userData.stopTimer = 0;
                    
                    // Let passengers off
                    const numOff = Math.min(omnibusPassengers.length, Math.floor(Math.random() * 3));
                    for (let i = 0; i < numOff; i++) {
                        disembarkPassenger(nextStop);
                    }
                    
                    // Board waiting passengers - pick up all waiting (up to capacity)
                    const stop = nextStop;
                    const numBoard = Math.min(
                        stop.waitingPeds.length,
                        OMNIBUS_MAX_PASSENGERS - omnibusPassengers.length
                    );
                    for (let i = 0; i < numBoard; i++) {
                        boardPassenger(stop);
                    }
                    
                    updatePassengerDots();
                }
            } else if (omnibus.userData.state === 'boarding') {
                omnibus.userData.stopTimer += 0.016;
                
                if (omnibus.userData.stopTimer > 2) {
                    // Done boarding, move to next stop
                    omnibus.userData.currentStop = omnibus.userData.nextStop;
                    omnibus.userData.nextStop = (omnibus.userData.nextStop + 1) % omnibusStops.length;
                    omnibus.userData.state = 'moving';
                }
            }
            
            // Randomly assign pedestrians to wait at stops
            if (Math.random() < 0.003) {
                assignPedToStop();
            }

            // Dispatch jitneys to crowded stops (check every ~2 seconds)
            if (Math.random() < 0.008) {
                updJitneyDispatch();
            }

            // Update jitney pickups
            updJitneyPickup();
        }

        function assignPedToStop() {
            // Find a random walking pedestrian near a bus stop
            const eligiblePeds = peds.filter(p =>
                p.userData.state === 'walking' &&
                !p.userData.waitingForBus &&
                !p.userData.watchingPerformer &&
                p.userData.state !== 'toSubwayStation' &&
                p.userData.state !== 'inSubway'
            );
            
            if (eligiblePeds.length === 0) return;
            
            const ped = eligiblePeds[Math.floor(Math.random() * eligiblePeds.length)];
            
            // Find nearest bus stop
            let nearestStop = null;
            let nearestDist = Infinity;
            omnibusStops.forEach(stop => {
                const dx = stop.x - ped.position.x;
                const dz = stop.z - ped.position.z;
                const dist = Math.sqrt(dx * dx + dz * dz);
                if (dist < nearestDist && dist < 25) {
                    nearestDist = dist;
                    nearestStop = stop;
                }
            });
            
            if (nearestStop && nearestStop.waitingPeds.length < 4) {
                // Send pedestrian to bus stop
                ped.userData.waitingForBus = true;
                ped.userData.targetStop = nearestStop;
                ped.userData.state = 'toBusStop';
                
                // Wait by the bench on the sidewalk, never in the road
                const offset = nearestStop.waitingPeds.length * 0.5;
                ped.userData.target = new THREE.Vector3(
                    nearestStop.curbX + 0.8 + offset * 0.3,
                    0.15,
                    nearestStop.curbZ + (Math.random() - 0.5) * 0.5
                );
                
                nearestStop.waitingPeds.push(ped);
            }
        }
        
        function boardPassenger(stop) {
            if (stop.waitingPeds.length === 0) return;
            
            const ped = stop.waitingPeds.shift();
            if (ped) {
                // Remove from scene, add to bus
                ped.visible = false;
                ped.userData.state = 'onBus';
                ped.userData.waitingForBus = false;
                omnibusPassengers.push(ped);
            }
        }
        
        function disembarkPassenger(stop) {
            if (omnibusPassengers.length === 0) return;
            
            const ped = omnibusPassengers.shift();
            if (ped) {
                // Step off onto the sidewalk by the stop
                ped.position.set(
                    stop.curbX + 1 + Math.random(),
                    0.15,
                    stop.curbZ + (Math.random() - 0.5) * 2
                );
                ped.visible = true;
                ped.userData.state = 'walking';
                ped.userData.waitingForBus = false;
                
                // Find which block they're in
                const bx = Math.floor((ped.position.x + halfSize) / GRID.cellSize);
                const bz = Math.floor((ped.position.z + halfSize) / GRID.cellSize);
                ped.userData.currentBlock = { 
                    x: Math.max(0, Math.min(bx, GRID.gridCount - 1)), 
                    z: Math.max(0, Math.min(bz, GRID.gridCount - 1)) 
                };
                
                setNewPedTarget(ped);
            }
        }
        
        function updatePassengerDots() {
            if (!omnibus || !omnibus.userData.passengerDots) return;
            
            omnibus.userData.passengerDots.forEach((dot, i) => {
                if (i < omnibusPassengers.length) {
                    dot.material.color.setHex(0x44ff44);
                    dot.material.opacity = 1;
                } else {
                    dot.material.color.setHex(0x333333);
                    dot.material.opacity = 0.3;
                }
            });
        }

        // Dispatch jitneys to crowded bus stops
        function updJitneyDispatch() {
            // Find stops with 3+ waiting passengers
            const crowdedStops = omnibusStops.filter(stop => stop.waitingPeds && stop.waitingPeds.length >= 3);
            if (crowdedStops.length === 0) return;

            // Find available jitneys (not already heading to a stop)
            const jitneys = cars.filter(c => c.userData.busType === 'jitney' && !c.userData.dispatchedToStop);
            if (jitneys.length === 0) return;

            crowdedStops.forEach(stop => {
                // Find nearest jitney not already dispatched
                let nearestJitney = null;
                let nearestDist = Infinity;

                jitneys.forEach(jitney => {
                    if (jitney.userData.dispatchedToStop) return;
                    const dx = stop.x - jitney.position.x;
                    const dz = stop.z - jitney.position.z;
                    const dist = Math.sqrt(dx * dx + dz * dz);
                    if (dist < nearestDist) {
                        nearestDist = dist;
                        nearestJitney = jitney;
                    }
                });

                if (nearestJitney && nearestDist < 60) {
                    nearestJitney.userData.dispatchedToStop = stop;
                    nearestJitney.userData.dispatchTimeout = 10; // seconds before giving up
                }
            });
        }

        // Handle jitney pickup at stops
        function updJitneyPickup() {
            cars.forEach(car => {
                if (car.userData.busType !== 'jitney') return;

                const stop = car.userData.dispatchedToStop;
                if (!stop) return;

                // Check if arrived at stop
                const dx = stop.x - car.position.x;
                const dz = stop.z - car.position.z;
                const dist = Math.sqrt(dx * dx + dz * dz);

                if (dist < 5) {
                    // Pick up waiting passengers (up to 4)
                    const numPickup = Math.min(stop.waitingPeds.length, 4);
                    for (let i = 0; i < numPickup; i++) {
                        const ped = stop.waitingPeds.shift();
                        if (ped) {
                            ped.visible = false;
                            ped.userData.state = 'onBus';
                            ped.userData.waitingForBus = false;
                            // Jitney passengers get dropped off after a delay
                            setTimeout(() => {
                                if (ped) {
                                    ped.position.set(
                                        car.position.x + (Math.random() - 0.5) * 4,
                                        0.15,
                                        car.position.z + (Math.random() - 0.5) * 4
                                    );
                                    ped.visible = true;
                                    ped.userData.state = 'walking';
                                    // Find which block they're in
                                    const bx = Math.floor((ped.position.x + halfSize) / GRID.cellSize);
                                    const bz = Math.floor((ped.position.z + halfSize) / GRID.cellSize);
                                    ped.userData.currentBlock = { x: Math.max(0, Math.min(GRID.gridCount - 1, bx)), z: Math.max(0, Math.min(GRID.gridCount - 1, bz)) };
                                    setNewPedTarget(ped);
                                }
                            }, 3000 + Math.random() * 5000);
                        }
                    }
                    car.userData.dispatchedToStop = null;
                } else {
                    // Timeout check
                    car.userData.dispatchTimeout -= 0.016;
                    if (car.userData.dispatchTimeout <= 0) {
                        car.userData.dispatchedToStop = null;
                    }
                }
            });
        }

        function mkSubwayTrack(startX, startZ, endX, endZ) {
            const g = new THREE.Group();

            // Calculate track length and direction
            const dx = endX - startX;
            const dz = endZ - startZ;
            const length = Math.sqrt(dx * dx + dz * dz);
            const angle = Math.atan2(dx, dz);

            // Main track beam
            const beam = new THREE.Mesh(
                new THREE.BoxGeometry(2, 0.5, length),
                new THREE.MeshStandardMaterial({ color: 0x444444 })
            );
            beam.position.set((startX + endX) / 2, SUBWAY_CFG.trackHeight - 0.25, (startZ + endZ) / 2);
            beam.rotation.y = angle;
            beam.receiveShadow = true;
            g.add(beam);

            // Rails on top of beam
            const railMat = new THREE.MeshStandardMaterial({ color: 0x666666, metalness: 0.5 });
            [-0.6, 0.6].forEach(offset => {
                const rail = new THREE.Mesh(
                    new THREE.BoxGeometry(0.1, 0.1, length),
                    railMat
                );
                // Position rail along the track
                const perpX = Math.cos(angle) * offset;
                const perpZ = -Math.sin(angle) * offset;
                rail.position.set(
                    (startX + endX) / 2 + perpX,
                    SUBWAY_CFG.trackHeight + 0.05,
                    (startZ + endZ) / 2 + perpZ
                );
                rail.rotation.y = angle;
                g.add(rail);
            });

            // Guard rails on both sides
            const guardMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
            [-1.1, 1.1].forEach(offset => {
                const guard = new THREE.Mesh(
                    new THREE.BoxGeometry(0.08, 0.8, length),
                    guardMat
                );
                const perpX = Math.cos(angle) * offset;
                const perpZ = -Math.sin(angle) * offset;
                guard.position.set(
                    (startX + endX) / 2 + perpX,
                    SUBWAY_CFG.trackHeight + 0.4,
                    (startZ + endZ) / 2 + perpZ
                );
                guard.rotation.y = angle;
                g.add(guard);
            });

            // Support columns every 12 units — but never planted in a roadway (traffic
            // drove straight through them). A support that would land on asphalt slides
            // along the track to the nearest clear spot; dead-center intersection spots
            // that can't clear are spanned unsupported.
            const pillarMat = new THREE.MeshStandardMaterial({ color: 0x666666 });
            const numSupports = Math.floor(length / 12);
            const ux = dx / length, uz = dz / length;
            const offRoad = v => {
                const r = Math.round((v + halfSize) / GRID.cellSize) * GRID.cellSize - halfSize;
                return Math.abs(v - r) > GRID.roadWidth / 2 + 0.8;
            };
            for (let i = 1; i < numSupports; i++) {
                const base = (i / numSupports) * length;
                let s = 0, found = false;
                for (let step = 0; step < 36 && !found; step++) {
                    s = (step % 2 ? 1 : -1) * Math.ceil(step / 2) * 0.5;
                    found = offRoad(startX + ux * (base + s)) && offRoad(startZ + uz * (base + s));
                }
                if (!found) continue;

                const pillar = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.25, 0.3, SUBWAY_CFG.trackHeight, 10),
                    pillarMat
                );
                pillar.position.set(startX + ux * (base + s), SUBWAY_CFG.trackHeight / 2, startZ + uz * (base + s));
                pillar.castShadow = true;
                g.add(pillar);
            }

            g.userData = { type: 'subwayTrack' };
            return g;
        }

        function createSubwayLine() {
            // Define 3 stations forming an L-shaped route along city edges
            // 4 corner stations form a rectangular loop — every track segment is
            // axis-aligned so getSubwayTunnelInfo can carve tunnels through the
            // buildings in its path (a diagonal closing segment sliced through facades)
            subwayStations = [
                { x: -halfSize + 12, z: -halfSize + 12, name: 'North', rotation: 0 },
                { x: -halfSize + 12, z: halfSize - 12, name: 'Central', rotation: 0 },
                { x: halfSize - 12, z: halfSize - 12, name: 'East', rotation: Math.PI / 2 },
                { x: halfSize - 12, z: -halfSize + 12, name: 'Airport', rotation: Math.PI / 2 }
            ];

            // Create stations
            subwayStations.forEach((station, i) => {
                const stationMesh = mkSubwayStation(i + 1);
                stationMesh.position.set(station.x, 0, station.z);
                stationMesh.rotation.y = station.rotation;
                scene.add(stationMesh);
                station.mesh = stationMesh;
            });

            // Create elevated track segments between consecutive stations
            for (let i = 0; i < subwayStations.length; i++) {
                const current = subwayStations[i];
                const next = subwayStations[(i + 1) % subwayStations.length];
                const track = mkSubwayTrack(current.x, current.z, next.x, next.z);
                scene.add(track);
            }

            // Create train and position at first station
            subwayTrain = mkSubwayTrain();
            subwayTrain.position.set(
                subwayStations[0].x,
                SUBWAY_CFG.trackHeight,
                subwayStations[0].z
            );
            // Set initial rotation to face second station
            const initDx = subwayStations[1].x - subwayStations[0].x;
            const initDz = subwayStations[1].z - subwayStations[0].z;
            subwayTrain.rotation.y = Math.atan2(initDx, initDz) - Math.PI / 2;
            scene.add(subwayTrain);

            notify('Subway Line now running!', 3000);
        }

        function updSubway(t) {
            if (!subwayTrain) return;

            const currentStation = subwayStations[subwayTrain.userData.currentStation];
            const nextStation = subwayStations[subwayTrain.userData.nextStation];

            if (subwayTrain.userData.state === 'moving') {
                const dx = nextStation.x - subwayTrain.position.x;
                const dz = nextStation.z - subwayTrain.position.z;
                const dist = Math.sqrt(dx * dx + dz * dz);

                if (dist < 1) {
                    // Arrived at station
                    subwayTrain.userData.state = 'stopping';
                    subwayTrain.userData.stopTimer = 0;
                    subwayTrain.position.set(nextStation.x, SUBWAY_CFG.trackHeight, nextStation.z);
                } else {
                    // Move toward next station
                    const speed = subwayTrain.userData.spd;
                    subwayTrain.position.x += (dx / dist) * speed;
                    subwayTrain.position.z += (dz / dist) * speed;

                    // Rotate to face direction of travel (train built along X-axis, needs offset)
                    subwayTrain.rotation.y = Math.atan2(dx, dz) - Math.PI / 2;
                }
            } else if (subwayTrain.userData.state === 'stopping') {
                subwayTrain.userData.stopTimer += 0.016;

                if (subwayTrain.userData.stopTimer > SUBWAY_CFG.stopDuration) {
                    // Update station indices
                    subwayTrain.userData.currentStation = subwayTrain.userData.nextStation;
                    subwayTrain.userData.nextStation = (subwayTrain.userData.nextStation + 1) % subwayStations.length;
                    subwayTrain.userData.state = 'moving';
                }
            }

            // Update station activity lights based on nearby pedestrians
            subwayStations.forEach(station => {
                if (!station.mesh) return;

                // Check for pedestrians heading to or at this station
                let hasActivity = false;
                for (const p of peds) {
                    if (p.userData.targetStation === station ||
                        (p.userData.exitStation === station && p.userData.state === 'inSubway')) {
                        hasActivity = true;
                        break;
                    }
                }

                // Also show activity when train is stopped at this station
                if (subwayTrain && subwayTrain.userData.state === 'stopping') {
                    const trainStation = subwayStations[subwayTrain.userData.nextStation];
                    if (trainStation === station) hasActivity = true;
                }

                // Update activity light
                station.mesh.traverse(child => {
                    if (child.userData.isActivityLight) {
                        child.material.opacity = hasActivity ? 0.8 : 0.2;
                        child.material.color.setHex(hasActivity ? 0x00ff00 : 0x004400);
                    }
                });
            });
        }

        function mkJitney() {

            const doorWin = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.46), CAR_GLASS_MAT);
            doorWin.position.set(0.95, 1.34, 0.765); g.add(doorWin);
            const doorRail = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.2, 5), CAR_CHROME_MAT);

        function addEmergencyLights(car, color1, color2) {
            if (car.userData.hasLightbar) return;   // purpose-built body brought its own

                new THREE.BoxGeometry(0.3, 0.2, 0.3),

            light1.userData.lightColor = color1;

            const light2 = new THREE.Mesh(
                new THREE.BoxGeometry(0.3, 0.2, 0.3),

            );

            light2.userData.emergencyLight = true;

        // ================= METROPOLIS INTERNATIONAL AIRPORT =================
        // RDU-inspired: two terminals (T2 with the arched steel roof), central
        // parking garage, one-way terminal loop with a loading-zone curb, hotel
        // courtesy buses to/from town, jets at gates with animated jet bridges,
        // service vehicles on the apron, and a live runway east of the city.
        const AP = {
            noseX: 153,          // jets park nose-in at this x (terminal back wall x=150)
            taxiX: 202,          // pushback/taxi lane, clear of the service road
            twyZ: -64,           // east-west taxiway
            rwyZ: -70,           // runway centerline
            // stand spacing = half-span(left jet) + half-span(right jet) + clearance
            gates: [
                { z: -47, type: 'regional', livery: 'sunjet' },
                { z: -31, type: 'narrow', livery: 'cardinal' },
                { z: -14, type: 'narrow', livery: 'metro' },
                { z: 4, type: 'narrow', livery: 'metro', cycler: true },
                { z: 24, type: 'wide', livery: 'cloud9' }
            ]
        };
        const JET_TYPES = {
            regional: { len: 12, r: 0.8, wing: 5.2, tail: 2.2, eng: 0.26 },
            narrow:   { len: 18, r: 1.1, wing: 7.6, tail: 3.0, eng: 0.34 },
            wide:     { len: 24, r: 1.5, wing: 10.2, tail: 3.8, eng: 0.46 }
        };
        const JET_LIVERIES = {
            metro:    { col: 0x1b6ca8, name: 'MetroAir', mark: 'chevron' },
            sunjet:   { col: 0xe07b39, name: 'Sunjet', mark: 'sun' },
            cardinal: { col: 0xb3282d, name: 'Cardinal', mark: 'bird' },
            cloud9:   { col: 0x159a9c, name: 'Cloud 9', mark: 'cloud' }
        };
        const airport = { buses: [], tugs: [], jets: [], bridges: [], cars: [], walkers: [], service: [], cycle: null, built: false };

        function mkTextSign(text, w, h, bg, fg, opts = {}) {
            const px = opts.px || 256;
            const tex = _winCanvasTex(px, Math.max(32, Math.round(px * h / w)), (ctx, W, H) => {
                ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
                ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 4; ctx.strokeRect(0, 0, W, H);
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                let size = H * 0.62;
                do { ctx.font = `bold ${size}px ${opts.font || 'system-ui, sans-serif'}`; size -= 2; }
                while (ctx.measureText(text).width > W - 16 && size > 8);
                ctx.fillStyle = fg;
                ctx.fillText(text, W / 2, H / 2 + 1);
            });
            return new THREE.Mesh(new THREE.PlaneGeometry(w, h),
                new THREE.MeshBasicMaterial({ map: tex, side: opts.double ? THREE.DoubleSide : THREE.FrontSide }));
        }

        // Cabin-window strip, painted once per (livery, length) and reused. Modelling
        // 60 windows as meshes per aircraft would cost more than the whole city.
        const _jetWinCache = new Map();
        function jetWindowTex(rows, tint) {
            const key = rows + '|' + tint;
            if (_jetWinCache.has(key)) return _jetWinCache.get(key);
            const tex = _winCanvasTex(rows * 16, 64, (ctx, W, H) => {
                ctx.clearRect(0, 0, W, H);
                for (let i = 0; i < rows; i++) {
                    const x = i * 16 + 5;
                    // rounded rect window with a bright reveal and a lit interior
                    ctx.fillStyle = 'rgba(24,30,40,0.92)';
                    ctx.beginPath(); ctx.roundRect(x, 22, 7, 12, 3); ctx.fill();
                    ctx.fillStyle = Math.random() < 0.3 ? 'rgba(255,226,170,0.9)' : 'rgba(120,148,178,0.75)';
                    ctx.beginPath(); ctx.roundRect(x + 1, 23.5, 5, 9, 2); ctx.fill();
                }
            });
            _jetWinCache.set(key, tex);
            return tex;
        }

        // Tail fin art: each carrier gets a distinct mark rather than a plain slab
        function jetTailTex(lv) {
            const key = 'tail|' + lv.name;
            if (_jetWinCache.has(key)) return _jetWinCache.get(key);
            const tex = _winCanvasTex(128, 128, (ctx, W, H) => {
                ctx.fillStyle = '#' + new THREE.Color(lv.col).getHexString();
                ctx.fillRect(0, 0, W, H);
                ctx.save();
                ctx.translate(W / 2, H / 2);
                ctx.fillStyle = 'rgba(255,255,255,0.92)';
                if (lv.mark === 'chevron') {
                    ctx.beginPath();
                    ctx.moveTo(-34, 30); ctx.lineTo(0, -34); ctx.lineTo(34, 30);
                    ctx.lineTo(16, 30); ctx.lineTo(0, -6); ctx.lineTo(-16, 30);
                    ctx.closePath(); ctx.fill();
                } else if (lv.mark === 'sun') {
                    ctx.beginPath(); ctx.arc(0, 4, 20, 0, Math.PI * 2); ctx.fill();
                    for (let i = 0; i < 10; i++) {
                        ctx.save(); ctx.rotate(i * Math.PI / 5);
                        ctx.fillRect(-2.5, -40, 5, 12);
                        ctx.restore();
                    }
                } else if (lv.mark === 'bird') {
                    ctx.beginPath();
                    ctx.moveTo(-38, 6); ctx.quadraticCurveTo(-6, -30, 6, 2);
                    ctx.quadraticCurveTo(18, -26, 40, -2);
                    ctx.quadraticCurveTo(14, 10, 4, 30);
                    ctx.quadraticCurveTo(-8, 12, -38, 6);
                    ctx.fill();
                } else {   // cloud
                    ctx.beginPath();
                    ctx.arc(-16, 8, 15, 0, Math.PI * 2);
                    ctx.arc(2, -4, 20, 0, Math.PI * 2);
                    ctx.arc(22, 10, 14, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            });
            _jetWinCache.set(key, tex);
            return tex;
        }

        function mkJet(type, liveryKey) {
            const c = JET_TYPES[type], lv = JET_LIVERIES[liveryKey];
            const g = new THREE.Group();
            const yC = c.r + 0.8;                      // fuselage centreline (gear below)
            const white = new THREE.MeshStandardMaterial({ color: 0xf4f4f2, roughness: 0.3, metalness: 0.3 });
            const belly = new THREE.MeshStandardMaterial({ color: 0xc9ced4, roughness: 0.45, metalness: 0.35 });
            const livMat = new THREE.MeshStandardMaterial({ color: lv.col, roughness: 0.35, metalness: 0.25 });
            const dark = new THREE.MeshStandardMaterial({ color: 0x22262c, roughness: 0.5 });
            const alloy = new THREE.MeshStandardMaterial({ color: 0x9aa2ab, roughness: 0.28, metalness: 0.8 });
            const rubber = new THREE.MeshStandardMaterial({ color: 0x15171a, roughness: 0.92 });

            // ---- Fuselage: barrel + tapered nose cone + upswept tail cone ----
            const barrelLen = c.len * 0.62;
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(c.r, c.r, barrelLen, 20), white);
            barrel.rotation.x = Math.PI / 2;
            barrel.position.y = yC;
            barrel.castShadow = true;
            g.add(barrel);

            const noseLen = c.len * 0.17;
            const nose = new THREE.Mesh(new THREE.SphereGeometry(c.r, 18, 12, 0, Math.PI * 2, 0, Math.PI / 2), white);
            nose.rotation.x = Math.PI / 2;
            nose.scale.set(1, noseLen / c.r, 1);
            nose.position.set(0, yC, barrelLen / 2);
            nose.castShadow = true;
            g.add(nose);

            // tail cone rises toward the fin, the way a real rear fuselage does
            const tailLen = c.len - barrelLen - noseLen;
            const tail = new THREE.Mesh(new THREE.CylinderGeometry(c.r * 0.16, c.r, tailLen, 20), white);
            tail.rotation.x = -Math.PI / 2;
            tail.position.set(0, yC + c.r * 0.42, -(barrelLen / 2 + tailLen / 2));
            tail.rotation.z = 0;
            tail.castShadow = true;
            g.add(tail);
            const tailFair = new THREE.Mesh(new THREE.BoxGeometry(c.r * 1.5, c.r * 0.7, tailLen * 0.8), white);
            tailFair.position.set(0, yC + c.r * 0.18, -(barrelLen / 2 + tailLen * 0.4));
            g.add(tailFair);

            // ---- Paint: grey belly, cheatline, engine-height livery band ----
            const bellyMesh = new THREE.Mesh(new THREE.CylinderGeometry(c.r * 1.005, c.r * 1.005, barrelLen, 20, 1, true, -0.9, 1.8), belly);
            bellyMesh.rotation.x = Math.PI / 2;
            bellyMesh.rotation.y = Math.PI;
            bellyMesh.position.y = yC;
            g.add(bellyMesh);
            const cheat = new THREE.Mesh(new THREE.CylinderGeometry(c.r * 1.01, c.r * 1.01, barrelLen, 20, 1, true, -0.34, 0.68), livMat);
            cheat.rotation.x = Math.PI / 2;
            cheat.position.set(0, yC - c.r * 0.02, 0);
            g.add(cheat);
            const cheat2 = cheat.clone();
            cheat2.rotation.y = Math.PI;
            g.add(cheat2);

            // ---- Cabin windows: one textured band per side ----
            const rows = Math.max(8, Math.round(barrelLen / 0.85));
            const winTex = jetWindowTex(rows, lv.col);
            for (const sd of [-1, 1]) {
                const band = new THREE.Mesh(new THREE.PlaneGeometry(barrelLen * 0.94, c.r * 0.46),
                    new THREE.MeshBasicMaterial({ map: winTex, transparent: true }));
                band.position.set(sd * (c.r * 0.995), yC + c.r * 0.32, 0);
                band.rotation.y = sd > 0 ? Math.PI / 2 : -Math.PI / 2;
                g.add(band);
                // cabin doors fore and aft
                for (const dz of [barrelLen * 0.4, -barrelLen * 0.36]) {
                    const door = new THREE.Mesh(new THREE.PlaneGeometry(0.5, c.r * 0.85),
                        new THREE.MeshStandardMaterial({ color: 0xe4e6e6, roughness: 0.4 }));
                    door.position.set(sd * (c.r * 1.002), yC + c.r * 0.18, dz);
                    door.rotation.y = sd > 0 ? Math.PI / 2 : -Math.PI / 2;
                    g.add(door);
                }
            }

            // ---- Flight deck glazing ----
            const glass = new THREE.MeshStandardMaterial({ color: 0x1b2733, roughness: 0.12, metalness: 0.6 });
            const wsZ = barrelLen / 2 + noseLen * 0.42;
            const frame = new THREE.MeshStandardMaterial({ color: 0x2b2f34, roughness: 0.55 });
            // two forward panes with a centre post, then quarter lights down each side
            for (const sd of [-1, 1]) {
                const pane = new THREE.Mesh(new THREE.BoxGeometry(c.r * 0.42, c.r * 0.3, 0.09), glass);
                pane.position.set(sd * c.r * 0.25, yC + c.r * 0.52, wsZ);
                pane.rotation.x = -0.42;
                pane.rotation.y = sd * -0.12;
                g.add(pane);
                const surround = new THREE.Mesh(new THREE.BoxGeometry(c.r * 0.5, c.r * 0.38, 0.06), frame);
                surround.position.set(sd * c.r * 0.25, yC + c.r * 0.52, wsZ - 0.03);
                surround.rotation.x = -0.42;
                surround.rotation.y = sd * -0.12;
                g.add(surround);
                const quarter = new THREE.Mesh(new THREE.PlaneGeometry(0.5, c.r * 0.24), glass);
                quarter.position.set(sd * c.r * 0.78, yC + c.r * 0.46, wsZ - 0.42);
                quarter.rotation.y = sd > 0 ? Math.PI / 2 : -Math.PI / 2;
                quarter.rotation.z = sd * 0.18;
                g.add(quarter);
                const wiper = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.03, c.r * 0.28), frame);
                wiper.position.set(sd * c.r * 0.25, yC + c.r * 0.4, wsZ + 0.06);
                wiper.rotation.x = -0.42;
                g.add(wiper);
            }
            const post = new THREE.Mesh(new THREE.BoxGeometry(0.07, c.r * 0.34, 0.1), frame);
            post.position.set(0, yC + c.r * 0.52, wsZ + 0.02);
            post.rotation.x = -0.42;
            g.add(post);
            const radome = new THREE.Mesh(new THREE.SphereGeometry(c.r * 0.35, 10, 8), dark);
            radome.position.set(0, yC - c.r * 0.1, barrelLen / 2 + noseLen * 0.92);
            g.add(radome);

            // ---- Carrier name along the forward fuselage ----
            const nameMat = mkTextSign(lv.name.toUpperCase(), 3, 0.6, '#f4f4f2',
                '#' + new THREE.Color(lv.col).getHexString(), { px: 256 }).material;
            for (const sd of [-1, 1]) {
                const nm = new THREE.Mesh(new THREE.PlaneGeometry(c.len * 0.17, c.r * 0.3), nameMat);
                nm.position.set(sd * (c.r * 1.004), yC + c.r * 0.72, barrelLen * 0.2);
                nm.rotation.y = sd > 0 ? Math.PI / 2 : -Math.PI / 2;
                g.add(nm);
            }

            // ---- Wings: swept, tapered aerofoils with winglets, fairings and engines ----
            // Everything hangs off one explicit span axis. Nesting the parts in a rotated
            // carrier put the nacelles out in mid-air beside the wing instead of under it.
            const wingRoot = 3.0 + c.r, wingTip = wingRoot * 0.4;
            const aerofoil = (rootChord, tipChord, span, thick) => {
                const geo = new THREE.CylinderGeometry(tipChord / 2, rootChord / 2, span, 4, 1);
                geo.rotateY(Math.PI / 4);   // flats face fore and aft
                geo.scale(thick, 1, 1);     // thin across what becomes the vertical
                geo.translate(0, span / 2, 0);
                return geo;                 // span runs along +Y, chord along Z
            };
            // Rz maps the span onto ±X (with a little dihedral), then Ry sweeps it aft
            const panelEuler = (sd, sweep, dihedral) => new THREE.Euler(
                0, sd * sweep, sd > 0 ? -Math.PI / 2 + dihedral : Math.PI / 2 - dihedral, 'XYZ');

            [-1, 1].forEach(sd => {
                const rot = panelEuler(sd, 0.42, 0.07);
                const root = new THREE.Vector3(sd * c.r * 0.85, yC - c.r * 0.34, 0.35);
                const axis = new THREE.Vector3(0, 1, 0).applyEuler(rot);   // outboard, aft, up

                const wing = new THREE.Mesh(aerofoil(wingRoot, wingTip, c.wing, 0.075), white);
                wing.position.copy(root);
                wing.rotation.copy(rot);
                wing.castShadow = true;
                g.add(wing);

                // Winglet: a small vertical fin at the tip. Sized like the wing panel it
                // came out as a slab hanging off the wing at 45 degrees.
                const tip = at(0.995);
                const wlSpan = 1.3, wlRot = new THREE.Euler(0, sd * 0.42, sd * -0.1, 'XYZ');
                const wl = new THREE.Mesh(aerofoil(wingTip * 0.72, wingTip * 0.3, wlSpan, 0.1), white);
                wl.position.copy(tip);
                wl.rotation.copy(wlRot);
                g.add(wl);
                const wlFlash = new THREE.Mesh(aerofoil(wingTip * 0.42, wingTip * 0.28, wlSpan * 0.36, 0.11), livMat);
                wlFlash.position.copy(tip).addScaledVector(
                    new THREE.Vector3(0, 1, 0).applyEuler(wlRot), wlSpan * 0.64);
                wlFlash.rotation.copy(wlRot);
                g.add(wlFlash);

                // Flap track fairings under the trailing edge
                for (const f of [0.24, 0.46]) {
                    const p = at(f);
                    const ftf = new THREE.Mesh(new THREE.CapsuleGeometry(0.1, 0.8, 3, 6), white);
                    ftf.rotation.x = Math.PI / 2;
                    ftf.position.set(p.x, p.y - 0.12, p.z - wingRoot * 0.34);
                    g.add(ftf);
                }

                // Engine: hung forward of and below the wing at the 34% station
                const ep = at(0.34);
                const nac = new THREE.Group();
                nac.position.set(ep.x, ep.y - c.r * 0.5, ep.z + 1.35);
                g.add(nac);
                const cowl = new THREE.Mesh(new THREE.CylinderGeometry(c.eng, c.eng * 0.93, 1.9, 14, 1, true), alloy);
                cowl.rotation.x = Math.PI / 2;
                cowl.castShadow = true;
                nac.add(cowl);
                const lip = new THREE.Mesh(new THREE.TorusGeometry(c.eng, c.eng * 0.14, 6, 16), alloy);
                lip.position.z = 0.95;
                nac.add(lip);
                const fan = new THREE.Mesh(new THREE.CircleGeometry(c.eng * 0.85, 16), dark);
                fan.position.z = 0.7;
                nac.add(fan);
                for (let b = 0; b < 12; b++) {   // fan blades behind the intake
                    const blade = new THREE.Mesh(new THREE.BoxGeometry(c.eng * 0.72, 0.03, 0.04), alloy);
                    blade.rotation.z = b * Math.PI / 6;
                    blade.position.z = 0.74;
                    nac.add(blade);
                }
                const spinner = new THREE.Mesh(new THREE.ConeGeometry(c.eng * 0.2, 0.42, 10), white);
                spinner.rotation.x = Math.PI / 2;
                spinner.position.z = 0.9;
                nac.add(spinner);
                const cowlBand = new THREE.Mesh(new THREE.CylinderGeometry(c.eng * 1.02, c.eng * 1.02, 0.4, 14, 1, true), livMat);
                cowlBand.rotation.x = Math.PI / 2;
                cowlBand.position.z = 0.48;
                nac.add(cowlBand);
                const exhaust = new THREE.Mesh(new THREE.CylinderGeometry(c.eng * 0.56, c.eng * 0.4, 0.85, 12), dark);
                exhaust.rotation.x = Math.PI / 2;
                exhaust.position.z = -1.2;
                nac.add(exhaust);
                // pylon bridging nacelle to wing
                const pyl = new THREE.Mesh(new THREE.BoxGeometry(0.14, c.r * 0.55, 1.1), white);
                pyl.position.set(ep.x, ep.y - c.r * 0.22, ep.z + 0.95);
                g.add(pyl);
            });

            // ---- Empennage: swept fin carrying the tail art, dihedral tailplane ----
            const finZ = -(c.len / 2 - c.r * 1.4);
            const finH = c.tail * 1.55;
            const fin = new THREE.Mesh(aerofoil(c.tail * 0.95, c.tail * 0.4, finH, 0.05), livMat);
            fin.position.set(0, yC + c.r * 0.45, finZ);
            fin.rotation.x = -0.30;    // sweep the fin back (+0.30 rakes it forward)

            g.add(fin);

            for (const sd of [-1, 1]) {

            [-1, 1].forEach(sd => {

            // ---- Landing gear: twin-wheel bogies, doors, nose steering leg ----
            const gearY = yC - c.r;
            const mkBogie = (gx, gz, wheels, r) => {
                const strut = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.09, gearY - r, 8), alloy);
                strut.position.set(gx, r + (gearY - r) / 2, gz);

                const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.62, 6), alloy);
                axle.rotation.z = Math.PI / 2;

                for (let i = 0; i < wheels; i++) {

            mkBogie(0, barrelLen / 2 + noseLen * 0.3, 1, 0.2);                 // nose
            mkBogie(-c.r * 1.15, -0.5, type === 'wide' ? 2 : 1, 0.26);         // mains

            // ---- Lights: nav red/green, beacons, landing lights ----
            const navL = new THREE.Mesh(new THREE.SphereGeometry(0.09, 6, 5), new THREE.MeshBasicMaterial({ color: 0xff2222 }));
            navL.position.set(-c.wing * 0.96, yC - c.r * 0.2, -0.7);

            const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.1, 6, 5), new THREE.MeshBasicMaterial({ color: 0xff3322 }));
            beacon.position.set(0, yC - c.r - 0.05, 0.4);

            for (const sd of [-1, 1]) {
                const land = new THREE.Mesh(new THREE.CircleGeometry(0.13, 8), new THREE.MeshBasicMaterial({ color: 0xfff6d8 }));

            const regMat = mkTextSign('N' + (200 + Math.floor(Math.random() * 700)) + 'MP', 1.4, 0.3, '#f4f4f2', '#33383e', { px: 128 }).material;
            for (const sd of [-1, 1]) {
                const reg = new THREE.Mesh(new THREE.PlaneGeometry(c.len * 0.11, c.r * 0.24), regMat);
                reg.position.set(sd * (c.r * 0.72), yC + c.r * 0.55, -(barrelLen / 2 + tailLen * 0.25));
                reg.rotation.y = sd > 0 ? Math.PI / 2 : -Math.PI / 2;
                g.add(reg);

            g.userData.jetType = type;

        // Jet bridge: rotunda at the terminal wall, telescoping tube, cab. u=0
        // retracted along the wall, u=1 docked on the jet's forward port door.
        function mkJetBridge(gate) {
            const c = JET_TYPES[gate.type];
            const g = new THREE.Group();
            g.position.set(150.3, 0, gate.z + 3.8);
            const mat = new THREE.MeshStandardMaterial({ color: 0xb9bfc6, roughness: 0.5, metalness: 0.4 });
            const glassMat = new THREE.MeshStandardMaterial({ color: 0x5a6a7a, roughness: 0.25, metalness: 0.5 });

            const col = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.26, 2.2, 8), mat);
            col.position.y = 1.1;
            g.add(col);
            const rotunda = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.95, 2.0, 12), mat);
            rotunda.position.y = 2.5;
            g.add(rotunda);

            const arm = new THREE.Group();
            arm.position.y = 2.5;
            g.add(arm);
            const tube = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.8, 3.2), glassMat);
            tube.position.z = 1.6;
            arm.add(tube);
            const sleeve = new THREE.Mesh(new THREE.BoxGeometry(1.7, 1.9, 1), mat);
            arm.add(sleeve);
            const cab = new THREE.Mesh(new THREE.BoxGeometry(1.9, 2.0, 1.3), mat);
            arm.add(cab);

            // docked pose: aim at the jet's forward door (port side, +z of nose)
            const doorX = AP.noseX + 2.4, doorZ = gate.z + c.r * 0.85;
            const dx = doorX - g.position.x, dz = doorZ - g.position.z;
            const br = {
                group: g, arm, sleeve, cab,
                dockYaw: Math.atan2(dx, dz),
                dockLen: Math.sqrt(dx * dx + dz * dz) - 0.8,
                retYaw: 0.22, retLen: 3.4, u: 1
            };
            setBridge(br, 1);
            return br;
        }

        function setBridge(br, u) {
            br.u = u;
            const yaw = br.retYaw + (br.dockYaw - br.retYaw) * u;
            const L = br.retLen + (br.dockLen - br.retLen) * u;
            br.arm.rotation.y = yaw;
            const ext = Math.max(0.15, L - 3.0);
            br.sleeve.scale.z = ext;
            br.sleeve.position.z = 3.0 + ext / 2 - 0.1;
            br.cab.position.z = L + 0.45;
        }

        // Shared waypoint follower: {path:[{x,z,spd,dwell}], wp, dwellT, loop}
        // `others`: vehicles to queue behind — never drive through the one ahead
        function apFollowPath(o, dt, turnRate = 3.5, others = null) {
            const u = o.userData;
            if (!u.path || u.wp >= u.path.length) return true;
            if (u.dwellT > 0) { u.dwellT -= dt; return false; }
            const wp = u.path[u.wp];
            const dx = wp.x - o.position.x, dz = wp.z - o.position.z;
            const d = Math.sqrt(dx * dx + dz * dz);
            if (others && d > 0.01) {
                const hx = dx / d, hz = dz / d; // heading toward the waypoint
                for (const other of others) {
                    if (other === o) continue;
                    const ox = other.position.x - o.position.x;
                    const oz = other.position.z - o.position.z;
                    const ahead = ox * hx + oz * hz;
                    const lateral = Math.abs(ox * hz - oz * hx);
                    if (ahead > 0.01 && ahead < 3.6 && lateral < 1.7) return false; // hold behind
                    // dead-tie (stacked vehicles): lower id drives out first
                    if (Math.abs(ahead) <= 0.01 && lateral < 1.7 && Math.hypot(ox, oz) < 2 && other.id < o.id) return false;
                }
            }
            const step = (wp.spd || 6) * dt;
            if (d < Math.max(step, 0.15)) {
                o.position.x = wp.x; o.position.z = wp.z;
                u.dwellT = wp.dwell || 0;
                u.wp++;
                if (u.wp >= u.path.length) {
                    if (u.loop) u.wp = 0;
                    else return true;
                }
            } else {
                o.position.x += dx / d * step;
                o.position.z += dz / d * step;
                const target = Math.atan2(dx, dz);
                let dy = target - o.rotation.y;
                while (dy > Math.PI) dy -= Math.PI * 2;
                while (dy < -Math.PI) dy += Math.PI * 2;
                o.rotation.y += dy * Math.min(1, dt * turnRate);
            }
            return false;
        }

        // Hazard chevrons for service bodies, generated once
        let _apChevron = null;
        function apChevronMat() {
            if (_apChevron) return _apChevron;
            const tex = _mkTex(128, (ctx, sz) => {
                ctx.fillStyle = '#e8322a'; ctx.fillRect(0, 0, sz, sz);
                ctx.fillStyle = '#f2f0e6';
                ctx.save(); ctx.rotate(-0.6);
                for (let i = -3; i < 8; i++) ctx.fillRect(i * 34, -sz, 17, sz * 3);
                ctx.restore();
            });
            tex.repeat.set(3, 1);
            _apChevron = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.65 });
            return _apChevron;
        }

        function mkAirportCar(col, isTaxi) {

        function mkAirport() {
            // Every flat airport surface declares a depth layer. They were all packed
            // into a 16mm band across a 300m field, and the airport grass sat 5mm BELOW
            // the world ground plane — the pair of them flickered across the whole site.
            const layer = (m, l) => {
                m.polygonOffset = true;
                m.polygonOffsetFactor = -l;
                m.polygonOffsetUnits = -l * 2;
                return m;
            };
            const Y = { grass: -0.05, slab: 0.02, road: 0.03, paint: 0.05, kerb: 0.09 };
            const conc = layer(new THREE.MeshStandardMaterial({ color: 0xb7b7b2, roughness: 0.95, map: TEX.concreteH }), 1);
            const asph = layer(new THREE.MeshStandardMaterial({ color: 0x8f8f92, roughness: 0.95, map: TEX.asphaltH }), 2);
            const white = layer(new THREE.MeshStandardMaterial({ color: 0xd9d9d4, roughness: 0.6 }), 4);
            const yellow = layer(new THREE.MeshStandardMaterial({ color: 0xc8b13a, roughness: 0.7 }), 4);
            const flat = (geo, mat, x, y, z) => {
                const m = new THREE.Mesh(geo, mat);
                m.rotation.x = -Math.PI / 2;
                m.position.set(x, y, z);
                m.receiveShadow = true;
                scene.add(m);
                return m;
            };

            // Grounds: airport grass apron-to-runway, then paved surfaces
            const grassMat = layer(new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95, map: TEX.grass }), 1);
            flat(new THREE.PlaneGeometry(170, 150), grassMat, 152, Y.grass, -12);

            // Access road from town (z=0 road continues east) + dashes
            flat(new THREE.PlaneGeometry(76, 8), asph, 89, Y.road, 0);
            for (let x = 54; x < 122; x += 5) flat(new THREE.PlaneGeometry(3, 0.2), yellow, x + 1.5, Y.paint, 0);

            gantry.rotation.y = -Math.PI / 2;

            scene.add(gantry);
            [[104, -5.2], [104, 5.2]].forEach(([px, pz]) => {

                flat(new THREE.PlaneGeometry(0.5, 2), layer(new THREE.MeshStandardMaterial({ color: z % 8 ? 0xb33a2e : 0xd9d9d4, roughness: 0.7 }), 5), 126.2, Y.kerb + 0.01, z + 1);
            }
            const loadSign = mkTextSign('LOADING ZONE ONLY', 3.4, 0.5, '#f4efe2', '#8a1f1f');
            loadSign.position.set(127.5, 2.6, -26);
            loadSign.rotation.y = -Math.PI / 2;

            [[127.5, -26]].forEach(([px, pz]) => {

            // Curb canopy in front of Terminal 2

            // ---- Terminal 2 (north, RDU's arched steel roof) ----
            const t2 = new THREE.Mesh(new THREE.BoxGeometry(20, 8, 56), new THREE.MeshStandardMaterial({ color: 0xd8d4cb, roughness: 0.65, map: TEX.facadeCement }));

            // signature arched roof: five steel arcs spanning the depth

            const t2Sign = mkTextSign('TERMINAL 2', 9, 1.2, '#1e2a38', '#f2ede0');

            // T2 curbside: numbered doors 1-4, each with its airline's sign
            const airlines = [

            const doorFrameMat = new THREE.MeshStandardMaterial({ color: 0x8f979e, roughness: 0.5, metalness: 0.4 });
            airlines.forEach((al, i) => {
                const z = -15 + i * 10;

                const alSign = mkTextSign(al.name, 4.2, 0.8, al.col, '#ffffff');
                alSign.position.set(129.76, 4.6, z);
                alSign.rotation.y = -Math.PI / 2;

            });

            // ---- Parking garage (west of the loop, facing the terminals) ----
            // Footprint z -35..-5 keeps it clear of the access road (z -4..4);
            // base slab is sunk to grade so the structure sits ON the ground
            const gMat = new THREE.MeshStandardMaterial({ color: 0xb5b2aa, roughness: 0.85, map: TEX.facadeCement });
            const GZ = -20;                 // garage center z
            const gSlabY = lvl => 0.06 + lvl * 2.6; // slab center (bottom rests at grade)
            for (let lvl = 0; lvl < 4; lvl++) {
                const slab = new THREE.Mesh(new THREE.BoxGeometry(16, 0.35, 30), gMat);
                slab.position.set(106, gSlabY(lvl), GZ);
                slab.castShadow = true; slab.receiveShadow = true;
                scene.add(slab);
                if (lvl > 0) { // parapet rails
                    [[-7.8, 0], [7.8, 0]].forEach(([ox]) => {
                        const rail = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.5, 30), gMat);
                        rail.position.set(106 + ox, gSlabY(lvl) + 0.4, GZ);
                        scene.add(rail);
                    });
                    [GZ + 15, GZ - 15].forEach(rz => {
                        const rail = new THREE.Mesh(new THREE.BoxGeometry(16, 0.5, 0.15), gMat);
                        rail.position.set(106, gSlabY(lvl) + 0.4, rz);
                        scene.add(rail);
                    });
                }
            }
            for (let cx = -6; cx <= 6; cx += 6) {
                for (let cz = GZ - 13; cz <= GZ + 13; cz += 6.5) {
                    const colm = new THREE.Mesh(new THREE.BoxGeometry(0.4, 7.9, 0.4), gMat);
                    colm.position.set(106 + cx, 3.85, cz);
                    scene.add(colm);
                }
            }
            // a well-used garage: orderly rows of parked cars on every level (~70% full)
            const pcarCols = [0xaa3333, 0x3355aa, 0xcccccc, 0x333333, 0x778855, 0x996633, 0xd9d9d9, 0x554466, 0xbb7722, 0x225577];
            const pcarGeo = new THREE.BoxGeometry(1.1, 0.6, 2.2);
            for (let lvl = 0; lvl < 4; lvl++) {
                [101.5, 110.5].forEach((rowX, ri) => {
                    for (let s = 0; s < 10; s++) {
                        if (Math.random() > 0.7) continue; // empty stalls here and there
                        const pcar = new THREE.Mesh(pcarGeo,
                            new THREE.MeshStandardMaterial({ color: pcarCols[Math.floor(Math.random() * pcarCols.length)], roughness: 0.4, metalness: 0.4 }));
                        pcar.position.set(rowX + (Math.random() - 0.5) * 0.3, gSlabY(lvl) + 0.475, GZ - 12.5 + s * 2.7);
                        pcar.rotation.y = (ri ? Math.PI / 2 : -Math.PI / 2) + (Math.random() - 0.5) * 0.06;

            // Flat driveway from the access road into the ground level (the old

            scene.add(pSign);
            const pEntry = mkTextSign('P', 1.2, 1.2, '#14417d', '#ffffff');
            pEntry.position.set(109, 2.2, -4.9); // on the north face, over the driveway
            scene.add(pEntry);

            // ---- Apron, gates, taxiway, runway ----
            flat(new THREE.PlaneGeometry(62, 112), conc, 178, Y.slab, -12); // apron
            AP.gates.forEach((gate, gi) => {
                // yellow lead-in line + gate number board on the terminal wall
                flat(new THREE.PlaneGeometry(30, 0.3), yellow, 168, Y.paint, gate.z);
                const board = mkTextSign('A' + (gi + 1), 1.4, 1.0, '#1e2a38', '#ffd24a');
                board.position.set(150.2, 6.2, gate.z);
                board.rotation.y = Math.PI / 2;
                scene.add(board);
            });
            flat(new THREE.PlaneGeometry(100, 6), asph, 156, Y.road, AP.twyZ);   // taxiway
            flat(new THREE.PlaneGeometry(110, 12), asph, 157, Y.road + 0.004, AP.rwyZ);  // runway
            for (let x = 106; x < 208; x += 7) flat(new THREE.PlaneGeometry(3.2, 0.3), white, x + 1.6, Y.paint, AP.rwyZ);
            [104.5, 209.5].forEach(ex => { // threshold piano keys
                for (let k = 0; k < 6; k++) flat(new THREE.PlaneGeometry(2.2, 0.7), white, ex, Y.paint, AP.rwyZ - 4.1 + k * 1.5);
            });
            const num5 = mkTextSign('5L', 2.6, 3, '#8f8f92', '#e8e8e2');
            num5.rotation.x = -Math.PI / 2; num5.rotation.z = -Math.PI / 2;
            layer(num5.material, 4); num5.position.set(111, Y.paint, AP.rwyZ);
            scene.add(num5);
            const num23 = mkTextSign('23R', 2.6, 3, '#8f8f92', '#e8e8e2');
            num23.rotation.x = -Math.PI / 2; num23.rotation.z = Math.PI / 2;
            layer(num23.material, 4); num23.position.set(203, Y.paint, AP.rwyZ);
            scene.add(num23);
            // taxiway connectors
            [[111, -67], [190, -67], [152, -67]].forEach(([cx, cz]) => flat(new THREE.PlaneGeometry(6, 8), asph, cx, Y.road, cz));

            // windsock
            const wsPole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 5, 6), new THREE.MeshStandardMaterial({ color: 0xcccccc }));
            wsPole.position.set(208, 2.5, -60);
            scene.add(wsPole);
            const sock = new THREE.Mesh(new THREE.ConeGeometry(0.35, 1.6, 8, 1, true), new THREE.MeshStandardMaterial({ color: 0xe07b39, side: THREE.DoubleSide }));
            sock.rotation.z = Math.PI / 2;
            sock.position.set(207, 4.7, -60);
            scene.add(sock);

            // control tower (flared cab, RDU-ish)
            const shaft = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.7, 17, 12), new THREE.MeshStandardMaterial({ color: 0xcfcbc2, roughness: 0.6 }));
            shaft.position.set(146, 8.5, -56);
            shaft.castShadow = true;
            scene.add(shaft);
            const cab = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 1.9, 2.4, 12), new THREE.MeshStandardMaterial({ color: 0x39485c, roughness: 0.2, metalness: 0.6 }));
            cab.position.set(146, 18.2, -56);
            scene.add(cab);
            const cap = new THREE.Mesh(new THREE.ConeGeometry(2.7, 0.9, 12), new THREE.MeshStandardMaterial({ color: 0xdfe3e8, roughness: 0.4, metalness: 0.5 }));
            cap.position.set(146, 19.9, -56);
            scene.add(cap);
            const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 3, 6), new THREE.MeshStandardMaterial({ color: 0x888888 }));
            mast.position.set(146, 21.8, -56);
            scene.add(mast);

            // ---- Jets at gates + bridges ----
            AP.gates.forEach(gate => {
                const jet = mkJet(gate.type, gate.livery);

                jet.rotation.y = -Math.PI / 2; // nose-in, facing the terminal
                scene.add(jet);
                gate.jet = jet;

                const br = mkJetBridge(gate);

            // static ground service parked at the gates
            const belt = mkBeltLoader();
            belt.position.set(158.5, 0, -27.5);
            belt.rotation.y = 1.9;
            scene.add(belt);
            airport.service.push(belt);
            const belt2 = mkBeltLoader();
            belt2.position.set(159.5, 0, -17.5);
            belt2.rotation.y = 1.6;
            scene.add(belt2);
            airport.service.push(belt2);
            const cater = mkCateringTruck();
            cater.position.set(160, 0, 27.5);
            cater.rotation.y = Math.PI / 2;
            scene.add(cater);
            airport.service.push(cater);
            const followMe = mkFollowMeCar();
            Object.assign(followMe.userData, { path: [{ x: 182, z: -62, spd: 7, dwell: 5 }, { x: 188, z: -62, spd: 8 },
                                          { x: 188, z: 38, spd: 8 }, { x: 182, z: 38, spd: 7, dwell: 4 }],
                                   wp: 0, dwellT: 0, loop: true });
            followMe.position.set(182, 0, -62);

            airport.tugs.push(followMe);

            // ---- moving service vehicles ----
            const tugA = mkApronTug(0x2f6f4f, 3);

            Object.assign(tugA.userData, { path: [{ x: 179, z: -58, spd: 5 }, { x: 187, z: -58, spd: 5 }, { x: 187, z: 34, spd: 5 }, { x: 179, z: 34, spd: 5, dwell: 3 }], wp: 0, dwellT: 0, loop: true });

            airport.tugs.push(tugA);
            const fuel = mkFuelTruck();
            Object.assign(fuel.userData, { path: [{ x: 180, z: 30, spd: 4, dwell: 4 }, { x: 180, z: -50, spd: 4 }, { x: 186, z: -50, spd: 4, dwell: 4 }, { x: 186, z: 30, spd: 4 }], wp: 0, dwellT: 0, loop: true });
            fuel.position.set(180, 0, 30);
            scene.add(fuel);
            airport.tugs.push(fuel);

            // ---- hotel courtesy buses looping town ↔ terminal curb ----
            // Hotel courtesy buses ride the same shared loop shape (mkLoopRoute above)
            const busA = mkCourtesyBus('GRAND METROPOLIS HOTEL', 0x6b1f2a);
            Object.assign(busA.userData, { path: mkLoopRoute(41, 6, -40, 6), wp: 5, dwellT: 0, loop: true });
            busA.position.set(60, 0, 1.8);
            scene.add(busA);
            const busB = mkCourtesyBus('SKYLINE SUITES', 0x14606b);
            Object.assign(busB.userData, { path: mkLoopRoute(37.5, 6, -12, 6), wp: 8, dwellT: 2, loop: true });
            busB.position.set(124.6, 0, -12);
            scene.add(busB);
            airport.buses.push(busA, busB);

            // travellers with luggage at the curb — waiting groups
            const caseCols = [0x7a4a2b, 0x2f4858, 0x8a2f3c, 0x333333, 0xb0a58c, 0x445d3a, 0x6b3b6e];
            for (let i = 0; i < 12; i++) {
                const fig = mkRooftopFigure();
                fig.scale.setScalar(2.2);
                const z = -46 + i * 5.6 + (Math.random() - 0.5) * 2;
                fig.position.set(126.5 + Math.random() * 1.6, 0.07, z);
                fig.rotation.y = Math.random() * Math.PI * 2;
                scene.add(fig);
                const case_ = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.5, 0.18),
                    new THREE.MeshStandardMaterial({ color: caseCols[i % caseCols.length], roughness: 0.7 }));
                case_.position.set(126.3, 0.32, z + 0.5);
                case_.rotation.y = Math.random() * Math.PI;
                scene.add(case_);
            }

            // travellers on the move: full mkPed variety strolling the curb and doors
            for (let i = 0; i < 9; i++) {
                const w = mkPed([0xff6b6b, 0x4ecdc4, 0xffe66d, 0x6c5ce7, 0xf2f2f2, 0x1b6ca8, 0xef8354, 0x3a7d44, 0xd7263d][i]);
                const z1 = -46 + Math.random() * 62, z2 = -46 + Math.random() * 62;
                w.userData.path = [
                    { x: 127 + Math.random() * 1.4, z: z1, spd: 1.1 + Math.random() * 0.5, dwell: 2 + Math.random() * 5 },

                    { x: 126.6 + Math.random() * 1.6, z: z2, spd: 1.1 + Math.random() * 0.5, dwell: 2 + Math.random() * 6 }
