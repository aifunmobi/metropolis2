            // Shared loop shape for ALL town↔airport road vehicles: mid-block town
            // stop pulled over to the south curb (never at an intersection), mid-block
            // U-turn at x=31, out to the airport curb slot, and back.
            // (function declaration: hoisted, so the buses above can use it too)
            function mkLoopRoute(stopX, stopDwell, slotZ, curbDwell) {
                return [
                    { x: stopX, z: -3.2, spd: 4, dwell: stopDwell },   // town curb stop (pull-over)
                    { x: stopX - 3, z: -1.8, spd: 5 },
                    { x: 31, z: -0.6, spd: 4 },                        // mid-block U-turn
                    { x: 31, z: 0.9, spd: 4 },
                    { x: 38, z: 1.8, spd: 8 },
                    { x: 112, z: 1.8, spd: 10 }, { x: 120, z: -2, spd: 7 },
                    { x: 122.6, z: slotZ + 6, spd: 7 },
                    { x: 124.6, z: slotZ, spd: 4, dwell: curbDwell },  // airport loading zone
                    { x: 122.6, z: slotZ - 6, spd: 6 }, { x: 122.6, z: -52, spd: 7 },
                    { x: 120, z: -57, spd: 5 }, { x: 117, z: -52, spd: 7 },
                    { x: 117, z: -6, spd: 8 }, { x: 112, z: -1.8, spd: 9 },
                    { x: 50, z: -1.8, spd: 10 }
                ];
            }

            // rideshare / taxi / private-car fleet cycling town ↔ terminal curb,
            // each with its own town curb slot and airport loading-zone slot
            const stopSlots = [-46, -42, -36, -31, -19, -14, -9, -4, 2]; // one slot per fleet car
            for (let i = 0; i < 9; i++) {
                const isTaxi = i < 4;
                const v = mkAirportCar(isTaxi ? 0xf2c718 : [0x4455aa, 0x993333, 0x447744, 0x222222, 0xd9d9d9][i - 4], isTaxi);
                const route = mkLoopRoute(31.5 + i * 1.3, 2 + Math.random() * 5, stopSlots[i], 4 + Math.random() * 6);
                Object.assign(v.userData, { path: route, wp: (i * 3) % route.length, dwellT: Math.random() * 4, loop: true });
                const w0 = route[v.userData.wp];
                v.position.set(w0.x, 0, w0.z);
                scene.add(v);
                airport.cars.push(v);
            }

            // taxi rank: cabs queued at the south curb waiting for fares
            for (let i = 0; i < 3; i++) {
                const cab = mkAirportCar(0xf2c718, true);
                cab.position.set(124.6, 0, -50 - i * 3.4);
                scene.add(cab);
            }

            // the departure/arrival cycle runs on the marked cycler gate
            airport.cycle = { state: 'idle', t: 0, v: 0, gate: AP.gates.find(gt => gt.cycler) };
            airport.built = true;
        }

        // One aircraft continuously cycles: undock → pushback → taxi → take off
        // east over the countryside → return on approach → land → taxi back → dock.
        function updAirport(t, dt) {
            if (!airport.built) return;
            // fleet queues behind each other AND behind city cars on the shared z=0 road
            const cityShared = cars.filter(c => c.userData.axis === 'x' && Math.abs(c.userData.roadPos) < 0.1 && c.position.x > 18);
            const roadVehicles = airport.cars.concat(airport.buses, cityShared);
            airport.buses.forEach(b => apFollowPath(b, dt, 2.5, roadVehicles));
            airport.tugs.forEach(v => apFollowPath(v, dt, 3, airport.tugs));
            airport.cars.forEach(v => apFollowPath(v, dt, 3.5, roadVehicles));

            // rolling wheels + rotating amber beacons across the whole ground fleet
            for (const v of airport.tugs.concat(airport.cars, airport.buses)) {
                const wp = v.userData.path && v.userData.path[v.userData.wp];
                if (wp && !(v.userData.dwellT > 0)) spinWheels(v, (wp.spd || 6) * dt);
            }
            for (const v of airport.tugs.concat(airport.service)) {
                if (!v.userData.beacons) continue;
                for (const b of v.userData.beacons) {
                    b.material.color.setHex(Math.sin(t * 9 + b.userData.lightPhase) > 0.3 ? 0xff9a1e : 0x4a3418);
                }
            }

            // 25s watchdog: a fleet vehicle wedged outside a scheduled dwell snaps
            // to its next waypoint — no jam may outlive the 30s rule
            const unwedge = (o) => {
                const u = o.userData;
                if (!u.wdPos || Math.hypot(o.position.x - u.wdPos.x, o.position.z - u.wdPos.z) > 0.6 || u.dwellT > 0) {
                    u.wdPos = { x: o.position.x, z: o.position.z, t };
                    return;
                }
                if (t - u.wdPos.t > 25) {
                    const wp = u.path[u.wp];
                    if (wp) { o.position.x = wp.x; o.position.z = wp.z; u.wp = (u.wp + 1) % u.path.length; }
                    u.wdPos = { x: o.position.x, z: o.position.z, t };
                }
            };
            airport.cars.forEach(unwedge);
            airport.buses.forEach(unwedge);
            airport.walkers.forEach(w => {
                apFollowPath(w, dt, 4);
                if (w.userData.dwellT <= 0) { // stride while moving
                    w.userData.walk = (w.userData.walk || 0) + dt * 7;
                    const sw = Math.sin(w.userData.walk) * 0.3;
                    if (w.userData.ll) w.userData.ll.rotation.x = sw;
                    if (w.userData.rl) w.userData.rl.rotation.x = -sw;
                }
            });

            const cy = airport.cycle;
            const gate = cy.gate;
            const jet = gate.jet;
            const gatePos = { x: AP.noseX + jet.userData.len / 2, z: gate.z };
            cy.t += dt;
            const ease = u => u * u * (3 - 2 * u);

            switch (cy.state) {
                case 'idle':
                    if (cy.t > 14) { cy.state = 'undock'; cy.t = 0; }
                    break;
                case 'undock': {
                    setBridge(gate.bridge, Math.max(0, 1 - cy.t / 3));
                    if (cy.t > 3.4) { cy.state = 'pushback'; cy.t = 0; }
                    break;
                }
                case 'pushback': {
                    const u = ease(Math.min(1, cy.t / 8));
                    jet.position.x = gatePos.x + (AP.taxiX - gatePos.x) * u;
                    jet.position.z = gatePos.z;
                    jet.rotation.y = -Math.PI / 2 - (Math.PI / 2) * u; // nose swings west → south
                    if (cy.t > 8.4) {
                        cy.state = 'taxiOut'; cy.t = 0;
                        jet.userData.path = [
                            { x: AP.taxiX, z: -56, spd: 7 }, { x: 170, z: AP.twyZ, spd: 7 },
                            { x: 118, z: AP.twyZ, spd: 8 }, { x: 111, z: -67, spd: 5 },
                            { x: 107, z: AP.rwyZ, spd: 5 }, { x: 112, z: AP.rwyZ, spd: 4 }
                        ];
                        jet.userData.wp = 0; jet.userData.dwellT = 0; jet.userData.loop = false;
                    }
                    break;
                }
                case 'taxiOut':
                    if (apFollowPath(jet, dt, 2.2)) { cy.state = 'takeoff'; cy.t = 0; cy.v = 4; jet.rotation.y = Math.PI / 2; }
                    break;
                case 'takeoff': {
                    cy.v = Math.min(52, cy.v + 14 * dt);
                    jet.position.x += cy.v * dt;
                    if (cy.v > 36) {
                        const climb = (cy.v - 36) / 16;
                        jet.position.y += climb * 14 * dt;
                        jet.rotation.x = -0.22 * Math.min(1, climb * 1.5);
                    }
                    if (jet.position.x > 330) { cy.state = 'away'; cy.t = 0; jet.visible = false; }
                    break;
                }
                case 'away':
                    if (cy.t > 9) {
                        cy.state = 'approach'; cy.t = 0; cy.v = 30;
                        jet.visible = true;
                        jet.position.set(335, 2.2 + (335 - 192) * 0.17, AP.rwyZ);
                        jet.rotation.y = -Math.PI / 2; // heading west, opposite-direction landing
                        jet.rotation.x = 0.06;
                    }
                    break;
                case 'approach': {
                    jet.position.x -= cy.v * dt;
                    jet.position.y = 2.2 + Math.max(0, (jet.position.x - 192) * 0.17)
                        - Math.min(1, Math.max(0, (jet.position.x - 192) / 30)) * 0; // glideslope
                    if (jet.position.x <= 192) {
                        jet.position.y = 0;
                        jet.rotation.x = 0;
                        cy.state = 'rollout';
                    }
                    break;
                }
                case 'rollout': {
                    cy.v = Math.max(5, cy.v - 10 * dt);
                    jet.position.x -= cy.v * dt;
                    if (jet.position.x <= 126) {
                        cy.state = 'taxiIn'; cy.t = 0;
                        jet.userData.path = [
                            { x: 120, z: -67, spd: 5 }, { x: 116, z: AP.twyZ, spd: 5 },
                            { x: 160, z: AP.twyZ, spd: 8 }, { x: 178, z: -57, spd: 6 },
                            { x: AP.taxiX, z: gate.z - 12, spd: 6 }, { x: AP.taxiX, z: gate.z, spd: 4 }
                        ];
                        jet.userData.wp = 0; jet.userData.dwellT = 0; jet.userData.loop = false;
                    }
                    break;
                }
                case 'taxiIn':
                    if (apFollowPath(jet, dt, 2.2)) { cy.state = 'turnIn'; cy.t = 0; cy.fromYaw = jet.rotation.y; }
                    break;
                case 'turnIn': {
                    const u = ease(Math.min(1, cy.t / 5));
                    jet.position.x = AP.taxiX + (gatePos.x - AP.taxiX) * u;
                    jet.position.z = gatePos.z;
                    let dy = -Math.PI / 2 - cy.fromYaw;
                    while (dy > Math.PI) dy -= Math.PI * 2;
                    while (dy < -Math.PI) dy += Math.PI * 2;
                    jet.rotation.y = cy.fromYaw + dy * u;
                    if (cy.t > 5.4) { cy.state = 'dock'; cy.t = 0; }
                    break;
                }
                case 'dock':
                    setBridge(gate.bridge, Math.min(1, cy.t / 3));
                    if (cy.t > 3.4) { cy.state = 'idle'; cy.t = 0; }
                    break;
            }
        }

        function placeCarOnRoad(car) {
            const roadIdx = Math.floor(Math.random() * (GRID.gridCount + 1));
            const roadPos = -halfSize + roadIdx * GRID.cellSize;
            const isHorizontal = Math.random() > 0.5;
            const direction = Math.random() > 0.5 ? 1 : -1;
            const startPos = -halfSize + Math.random() * totalSize;
            
            // Right-side driving: lane offset depends on direction
            // X-axis: going +X stays on +Z side, going -X stays on -Z side
            // Z-axis: going +Z stays on -X side, going -Z stays on +X side
            // Wide bodies (buses, packers) ride closer to the centre line — at the
            // standard 1.8 offset a 2.6m-wide truck overhangs the parking lane and
            // drives straight through the parked cars.
            const lane = Math.max(1.15, 1.8 - Math.max(0, vWid(car) - 1.25) * 0.5);
            let laneOffset;

            if (isHorizontal) {
                // X-axis road
                laneOffset = direction * lane; // +dir = +Z lane, -dir = -Z lane (correct)
                car.position.set(startPos, 0, roadPos + laneOffset);
                car.userData.roadPos = roadPos;
                car.userData.axis = 'x';
                car.userData.dir = direction;
                car.rotation.y = direction > 0 ? 0 : Math.PI;
            } else {
                // Z-axis road: flip the lane logic
                laneOffset = -direction * lane; // +dir(+Z) = -X lane, -dir(-Z) = +X lane
                car.position.set(roadPos + laneOffset, 0, startPos);
                car.userData.roadPos = roadPos;
                car.userData.axis = 'z';
                car.userData.dir = direction;
                car.rotation.y = direction > 0 ? -Math.PI / 2 : Math.PI / 2;
            }
            
            car.userData.laneOffset = laneOffset;
            car.userData.originalLaneOffset = laneOffset; // Store original lane for returning after passing
            car.userData.targetLaneOffset = laneOffset;
            car.userData.inPassingLane = false;
            car.userData.spd = 0.12 + Math.random() * 0.06;

            // Gridlock tracking
            car.userData.lastPos = { x: car.position.x, z: car.position.z };
            car.userData.stuckTime = 0;
            car.userData.beingHelped = false;
        }

        // ================= Shared vehicle kit =================
        // Every vehicle in the city draws from one parts bin: real tyres with rims and
        // hubs, tinted glass, chrome, lamp lenses. Wheels register on the parent so
        // updCars can spin them — static wheels are the loudest "this is a toy" tell.
        const CAR_TYRE_MAT = new THREE.MeshStandardMaterial({ color: 0x14161a, roughness: 0.95 });
        const CAR_RIM_MAT = new THREE.MeshStandardMaterial({ color: 0xb9bec4, roughness: 0.35, metalness: 0.85 });
        const CAR_HUB_MAT = new THREE.MeshStandardMaterial({ color: 0x6d7278, roughness: 0.5, metalness: 0.7 });
        const CAR_GLASS_MAT = new THREE.MeshStandardMaterial({ color: 0x1c2733, roughness: 0.12, metalness: 0.55 });
        const CAR_TRIM_MAT = new THREE.MeshStandardMaterial({ color: 0x23262b, roughness: 0.7 });
        const CAR_CHROME_MAT = new THREE.MeshStandardMaterial({ color: 0xc8ccd2, roughness: 0.25, metalness: 0.95 });
        const CAR_PLATE_MAT = new THREE.MeshStandardMaterial({ color: 0xe6e2d2, roughness: 0.6 });
        const CAR_STEEL_MAT = new THREE.MeshStandardMaterial({ color: 0x7f858c, roughness: 0.42, metalness: 0.8 });
        const CAR_LAMP_W = new THREE.MeshBasicMaterial({ color: 0xfff4d0 });
        const CAR_LAMP_A = new THREE.MeshBasicMaterial({ color: 0xff9a1e });
        const CAR_LAMP_R = new THREE.MeshBasicMaterial({ color: 0xcc1414 });
        const _wheelGeoCache = new Map();
        const _wheelGeo = (r, w, seg) => {
            const k = `${r}|${w}|${seg}`;
            if (!_wheelGeoCache.has(k)) _wheelGeoCache.set(k, new THREE.CylinderGeometry(r, r, w, seg));
            return _wheelGeoCache.get(k);
        };

        // Tyre + dished rim + hub cap, added as one spinnable unit
        // opts.zFwd: the airport fleet drives along its own +Z, so its axles run along
        // X. Without this every apron wheel would be mounted sideways.
        function vWheel(g, x, y, z, r = 0.2, w = 0.16, opts = {}) {
            const hub = new THREE.Group();
            if (opts.zFwd) hub.rotation.y = Math.PI / 2;
            const tyre = new THREE.Mesh(_wheelGeo(r, w, 14), CAR_TYRE_MAT);
            tyre.rotation.x = Math.PI / 2;
            tyre.castShadow = true;
            hub.add(tyre);
            const face = z >= 0 ? 1 : -1;
            const rim = new THREE.Mesh(_wheelGeo(r * 0.58, w * 1.06, 8), opts.rimMat || CAR_RIM_MAT);
            rim.rotation.x = Math.PI / 2;
            hub.add(rim);
            const cap = new THREE.Mesh(_wheelGeo(r * 0.22, w * 1.14, 8), CAR_HUB_MAT);
            cap.rotation.x = Math.PI / 2;
            hub.add(cap);
            // spokes read as motion blur once the wheel spins
            for (let i = 0; i < 5; i++) {
                const sp = new THREE.Mesh(new THREE.BoxGeometry(r * 1.05, 0.02, w * 0.5), CAR_HUB_MAT);
                sp.rotation.z = (i / 5) * Math.PI;
                sp.position.z = face * w * 0.32;
                hub.add(sp);
            }
            hub.position.set(x, y, z);
            g.add(hub);
            (g.userData.wheels || (g.userData.wheels = [])).push(hub);
            if (opts.dual) {
                const twin = hub.clone();
                if (opts.zFwd) twin.position.x = x + Math.sign(x) * w * 1.15;
                else twin.position.z = z + Math.sign(z) * w * 1.15;
                g.add(twin);
                g.userData.wheels.push(twin);
            }
            return hub;
        }

        // Flat lamp lens facing outward along +x / -x
        function vLamp(g, x, y, z, w, h, mat, dir = 1) {
            const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
            m.position.set(x, y, z);
            m.rotation.y = dir > 0 ? Math.PI / 2 : -Math.PI / 2;
            g.add(m);
            return m;
        }

        // Modern LED bar: alternating coloured modules under a smoked cover
        function vLightbar(g, x, y, z, len, colA, colB, modules = 6) {
            const bar = new THREE.Group();
            const base = new THREE.Mesh(new THREE.BoxGeometry(len, 0.07, 0.34), CAR_TRIM_MAT);
            bar.add(base);
            for (let i = 0; i < modules; i++) {
                const c = i % 2 ? colB : colA;
                const led = new THREE.Mesh(new THREE.BoxGeometry(len / modules * 0.82, 0.11, 0.3),
                    new THREE.MeshBasicMaterial({ color: c }));
                led.position.set(-len / 2 + len / modules * (i + 0.5), 0.08, 0);
                led.userData.emergencyLight = true;
                led.userData.lightColor = c;
                // offset phase so the bar sweeps instead of blinking as one block
                led.userData.lightPhase = (i % 2) * Math.PI;
                bar.add(led);
            }
            const feet = new THREE.Mesh(new THREE.BoxGeometry(len * 0.6, 0.05, 0.12), CAR_TRIM_MAT);
            feet.position.y = -0.05;
            bar.add(feet);
            bar.position.set(x, y, z);
            g.add(bar);
            g.userData.hasLightbar = true;
            return bar;
        }

        // Reflective chevrons / stripes down a flank
        function vStripe(g, len, h, y, zOff, col, opts = {}) {
            const mat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.45, metalness: 0.1 });
            for (const s of [1, -1]) {
                const m = new THREE.Mesh(new THREE.PlaneGeometry(len, h), mat);
                m.position.set(opts.x || 0, y, s * zOff);
                m.rotation.y = s > 0 ? 0 : Math.PI;
                g.add(m);
            }
        }

        // Body proportions per type: silhouette is what sells a vehicle at street level,
        // so each gets a different greenhouse, hood length and ride height — the
        // footprint stays 2.2 x 1.1 because the traffic logic is tuned to it.
        const CAR_TYPES = ['sedan', 'sedan', 'sedan', 'hatch', 'hatch', 'suv', 'suv', 'van', 'pickup', 'coupe'];

        function mkCar(col, forceType) {
            const g = new THREE.Group();
            const type = forceType || CAR_TYPES[Math.floor(Math.random() * CAR_TYPES.length)];
            const paint = new THREE.MeshStandardMaterial({ color: col, metalness: 0.35, roughness: 0.32 });

            // Body proportions per type: [lower height, lower y, cabin length, cabin height, cabin x, ride]
            const P = {
                sedan:  { lh: 0.44, cl: 1.05, ch: 0.42, cx: -0.14, ride: 0.02, taper: 0.9 },
                coupe:  { lh: 0.40, cl: 0.95, ch: 0.38, cx: -0.22, ride: 0.0,  taper: 0.86 },
                hatch:  { lh: 0.46, cl: 1.15, ch: 0.44, cx: -0.30, ride: 0.03, taper: 0.92 },
                suv:    { lh: 0.58, cl: 1.35, ch: 0.52, cx: -0.18, ride: 0.10, taper: 0.96 },
                van:    { lh: 0.62, cl: 1.55, ch: 0.62, cx: -0.22, ride: 0.08, taper: 1.0 },
                pickup: { lh: 0.50, cl: 0.85, ch: 0.48, cx:  0.05, ride: 0.09, taper: 0.94 }
            }[type];

            const lowerY = 0.24 + P.ride + P.lh / 2;
            const lower = new THREE.Mesh(new THREE.BoxGeometry(2.2, P.lh, 1.1), paint);
            lower.position.y = lowerY;
            lower.castShadow = true;
            g.add(lower);

            // Bonnet/boot shoulder — a thin capping slab breaks the slab-sided box
            const shoulder = new THREE.Mesh(new THREE.BoxGeometry(2.12, 0.1, 1.02), paint);
            shoulder.position.y = lowerY + P.lh / 2 + 0.04;
            g.add(shoulder);

            const cabY = lowerY + P.lh / 2 + P.ch / 2 + 0.05;
            const cab = new THREE.Mesh(new THREE.BoxGeometry(P.cl, P.ch, 1.02 * P.taper), paint);
            cab.position.set(P.cx, cabY, 0);
            cab.castShadow = true;
            g.add(cab);

            // Glasshouse: windscreen, backlight, side glazing
            const wsGeo = new THREE.PlaneGeometry(1.0 * P.taper, P.ch * 0.82);
            const front = new THREE.Mesh(wsGeo, CAR_GLASS_MAT);
            front.position.set(P.cx + P.cl / 2 + 0.01, cabY, 0);
            front.rotation.y = Math.PI / 2;
            g.add(front);
            const back = new THREE.Mesh(wsGeo, CAR_GLASS_MAT);
            back.position.set(P.cx - P.cl / 2 - 0.01, cabY, 0);
            back.rotation.y = -Math.PI / 2;
            g.add(back);
            for (const s of [-1, 1]) {
                const side = new THREE.Mesh(new THREE.PlaneGeometry(P.cl * 0.88, P.ch * 0.72), CAR_GLASS_MAT);
                side.position.set(P.cx, cabY + 0.02, s * (1.02 * P.taper / 2 + 0.01));
                side.rotation.y = s > 0 ? 0 : Math.PI;
                g.add(side);
                // door mirror
                const mir = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.07, 0.06), CAR_TRIM_MAT);
                mir.position.set(P.cx + P.cl / 2 - 0.05, cabY - 0.02, s * 0.62);
                g.add(mir);
            }

            if (type === 'pickup') {   // open load bed behind the cab
                const bedFloor = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.06, 1.0), CAR_TRIM_MAT);
                bedFloor.position.set(-0.6, lowerY + P.lh / 2 + 0.06, 0);
                g.add(bedFloor);
                for (const [bw, bd, bx, bz] of [[0.95, 0.06, -0.6, 0.5], [0.95, 0.06, -0.6, -0.5]]) {
                    const wall = new THREE.Mesh(new THREE.BoxGeometry(bw, 0.24, bd), paint);
                    wall.position.set(bx, lowerY + P.lh / 2 + 0.18, bz);
                    g.add(wall);
                }
                const tail = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.24, 1.0), paint);
                tail.position.set(-1.07, lowerY + P.lh / 2 + 0.18, 0);
                g.add(tail);
            }

            // Bumpers + grille + plate
            for (const s of [1, -1]) {
                const bump = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.16, 1.08), CAR_TRIM_MAT);
                bump.position.set(s * 1.09, 0.24 + P.ride + 0.14, 0);
                g.add(bump);
                const plate = new THREE.Mesh(new THREE.PlaneGeometry(0.38, 0.12), CAR_PLATE_MAT);
                plate.position.set(s * 1.15, 0.24 + P.ride + 0.15, 0);
                plate.rotation.y = s > 0 ? Math.PI / 2 : -Math.PI / 2;
                g.add(plate);
            }
            const grille = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.16), CAR_CHROME_MAT);
            grille.position.set(1.11, lowerY + 0.08, 0);
            grille.rotation.y = Math.PI / 2;
            g.add(grille);

            // Rocker panel + door shut lines: flat slab sides catch no light
            for (const s of [-1, 1]) {
                const rocker = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.1, 0.06), CAR_TRIM_MAT);
                rocker.position.set(0, 0.24 + P.ride + 0.05, s * 0.55);
                g.add(rocker);
                const handle = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.04, 0.04), CAR_CHROME_MAT);
                handle.position.set(P.cx, lowerY + P.lh / 2 - 0.04, s * 0.56);
                g.add(handle);
            }
            if (type === 'suv' || type === 'van') {   // roof rails
                for (const s of [-1, 1]) {
                    const rail = new THREE.Mesh(new THREE.BoxGeometry(P.cl * 0.85, 0.05, 0.05), CAR_TRIM_MAT);
                    rail.position.set(P.cx, cabY + P.ch / 2 + 0.03, s * 0.34);
                    g.add(rail);
                }
            }

            // Wheels with rims, tucked into arches
            const wheelY = 0.2 + P.ride;
            [[0.68, 0.53], [0.68, -0.53], [-0.68, 0.53], [-0.68, -0.53]].forEach(([wx, wz]) => {
                vWheel(g, wx, wheelY, wz, 0.2, 0.16);
                const arch = new THREE.Mesh(new THREE.BoxGeometry(0.58, 0.13, 0.09), CAR_TRIM_MAT);
                arch.position.set(wx, wheelY + 0.19, wz * 1.03);
                g.add(arch);
            });

            // Exhaust tip
            const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.16, 6), CAR_CHROME_MAT);
            pipe.rotation.z = Math.PI / 2;
            pipe.position.set(-1.12, 0.24 + P.ride + 0.05, 0.32);
            g.add(pipe);

            const hlMat = new THREE.MeshBasicMaterial({ color: 0x333322 }); // Dim when off
            g.userData.headlights = [];

        // Kerbside parking. Static meshes, no AI — a street with no parked cars reads
        // as a movie set. Placed clear of crossings, bus stops and hydrant spots.
        function mkParkedCars() {
            const cols = [0x8d1f1f, 0x1f3a8d, 0xd8d8d2, 0x2c2c30, 0x4a5a66, 0x7d6a4f, 0x2f5f43,
                          0xb5b7ba, 0x6b2f52, 0xc9803a, 0x35404a, 0xe0dcc8];
            const roadLines = Array.from({ length: GRID.gridCount + 1 }, (_, j) => -halfSize + j * GRID.cellSize);
            const nearCross = v => roadLines.some(p => Math.abs(v - p) < GRID.roadWidth / 2 + 5.6);
            const lane = GRID.roadWidth / 2 - 0.7;   // tight to the kerb, clear of the widest bodies

            for (const roadPos of roadLines) {
                for (let v = -halfSize + 4; v < halfSize - 4; v += 3.4) {
                    if (nearCross(v)) continue;
                    for (const s of [-1, 1]) {
                        if (Math.random() < 0.52) continue;   // gappy, like real kerbs
                        const col = cols[Math.floor(Math.random() * cols.length)];
                        const a = mkCar(col);
                        a.position.set(v + (Math.random() - 0.5) * 0.5, 0, roadPos + s * lane);
                        a.rotation.y = s > 0 ? 0 : Math.PI;
                        a.rotation.y += (Math.random() - 0.5) * 0.06;   // nobody parks straight
                        scene.add(a);
                        addObstacle(a.position.x, a.position.z, 1.3);

                        if (Math.random() < 0.5) continue;
                        const b = mkCar(cols[Math.floor(Math.random() * cols.length)]);
                        b.position.set(roadPos + s * lane, 0, v + (Math.random() - 0.5) * 0.5);
                        b.rotation.y = (s > 0 ? -Math.PI / 2 : Math.PI / 2) + (Math.random() - 0.5) * 0.06;
                        scene.add(b);
                        addObstacle(b.position.x, b.position.z, 1.3);
                    }
                }
            }
        }

        // Every sidewalk tile that faces a road, with the outward rotation baked in
        function sidewalkSpots() {
            const spots = [];
            const innerSize = GRID.cellSize - GRID.roadWidth;
            const off = innerSize / 2 - GRID.sidewalkWidth / 2;
            for (let bx = 0; bx < GRID.gridCount; bx++) {
                for (let bz = 0; bz < GRID.gridCount; bz++) {
                    const cx = -halfSize + bx * GRID.cellSize + GRID.cellSize / 2;
                    const cz = -halfSize + bz * GRID.cellSize + GRID.cellSize / 2;
                    for (let u = -5; u <= 5; u += 2.5) {
                        spots.push({ x: cx + u, z: cz - off, r: Math.PI });
                        spots.push({ x: cx + u, z: cz + off, r: 0 });
                        spots.push({ x: cx - off, z: cz + u, r: -Math.PI / 2 });
                        spots.push({ x: cx + off, z: cz + u, r: Math.PI / 2 });
                    }
                }
            }
            for (let i = spots.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [spots[i], spots[j]] = [spots[j], spots[i]];
            }
            return spots;
        }

        function mkDogWalkerUnit() {
            const g = new THREE.Group();
            const handler = slPed();
            g.add(handler);
            const dogCols = [0x8b5a2b, 0xf0ece2, 0x2a2a2a, 0xc98a3f, 0x9a9a94, 0x5a4030];
            const n = 1 + Math.floor(Math.random() * 3);
            const dogs = [];
            for (let i = 0; i < n; i++) {
                const dog = mkDog(dogCols[Math.floor(Math.random() * dogCols.length)]);
                const off = (i - (n - 1) / 2) * 0.34;
                dog.position.set(0.85 + Math.random() * 0.3, 0, off);
                g.add(dog);
                dogs.push(dog);
                // Leash: an actual segment from the handler's hand to the collar.
                // Euler-fudging the angles left it pointing off past the dog.
                const A = new THREE.Vector3(0.22, 0.62, 0);
                const B = new THREE.Vector3(dog.position.x + 0.24, 0.4, off);
                const seg = B.clone().sub(A);
                const leash = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 1, 4),
                    new THREE.MeshBasicMaterial({ color: 0x3a3a3a }));
                leash.position.copy(A).addScaledVector(seg, 0.5);
                leash.scale.y = seg.length();
                leash.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), seg.clone().normalize());
                g.add(leash);
            }
            g.userData = { handler, dogs, walk: 0 };
            return g;
        }

        function mkStreetLife() {
            // Cinema on the biggest central building that hasn't already got a rooftop act
            const central = buildings
                .filter(b => b.userData.width >= 5 && Math.abs(b.position.x) < halfSize - 14 && Math.abs(b.position.z) < halfSize - 14)
                .sort((a, b) => (b.userData.width * b.userData.height) - (a.userData.width * a.userData.height));
            if (central.length) mkCinema(central[0]);

            const spots = sidewalkSpots();
            const taken = [];
            const free = (s, minD) => !taken.some(t => Math.hypot(t.x - s.x, t.z - s.z) < minD) &&
                (!streetLife.cinema || Math.hypot(streetLife.cinema.door.x - s.x, streetLife.cinema.door.z - s.z) > 8);
            const claim = minD => {
                for (let i = 0; i < spots.length; i++) {
                    if (free(spots[i], minD)) { const s = spots.splice(i, 1)[0]; taken.push(s); return s; }
                }
                return null;
            };
            // Push the pitch back off the kerb so customers stand on pavement, not tarmac
            const put = (obj, s, back = 1.5, radius = 1.2) => {
                obj.position.set(s.x - Math.sin(s.r) * back, 0.15, s.z - Math.cos(s.r) * back);
                obj.rotation.y = s.r;
                scene.add(obj);
                if (radius) addObstacle(obj.position.x, obj.position.z, radius);
            };

            // Food carts, each with a customer or two
            for (let i = 0; i < 6; i++) {
                const s = claim(9); if (!s) break;
                const kind = CART_KINDS[i % CART_KINDS.length];
                const cart = mkFoodCart(kind);
                put(cart, s);
                streetLife.vendors.push(cart);
                const vendor = slPed();
                vendor.position.set(-0.1, 0, -0.75);
                vendor.rotation.y = Math.PI;
                cart.add(vendor);
                addIdler(vendor, 'serve');
                for (let c = 0; c < 1 + Math.floor(Math.random() * 2); c++) {
                    const cust = slPed();
                    cust.position.set(-0.5 + Math.random() * 1.2, 0, 0.95 + Math.random() * 0.4);
                    cust.rotation.y = Math.PI + (Math.random() - 0.5) * 0.5;
                    cart.add(cust);
                    addIdler(cust, 'wait');
                }
            }

            for (let i = 0; i < 3; i++) {
                const s = claim(11); if (!s) break;
                put(mkNewsstand(), s);
            }

            const kinds = ['painter', 'sketcher', 'chalk', 'painter', 'chalk'];
            for (let i = 0; i < 5; i++) {
                const s = claim(10); if (!s) break;
                const a = mkStreetArtist(kinds[i]);
                put(a, s);
                // a couple of onlookers, backs to the street
                for (let o = 0; o < 1 + Math.floor(Math.random() * 3); o++) {
                    const p = slPed();
                    p.position.set((Math.random() - 0.5) * 2.2, 0, 1.5 + Math.random() * 0.8);
                    p.rotation.y = Math.PI + (Math.random() - 0.5) * 0.6;
                    a.add(p);
                    addIdler(p, 'watch');
                }
            }

            // Dog walkers patrol the block perimeters
            for (let i = 0; i < 5; i++) {
                const s = claim(6); if (!s) break;
                const u = mkDogWalkerUnit();
                put(u, s);
                u.userData.blockCX = Math.round((s.x + halfSize) / GRID.cellSize - 0.5) * GRID.cellSize - halfSize + GRID.cellSize / 2;
                u.userData.blockCZ = Math.round((s.z + halfSize) / GRID.cellSize - 0.5) * GRID.cellSize - halfSize + GRID.cellSize / 2;
                u.userData.ring = (GRID.cellSize - GRID.roadWidth) / 2 - GRID.sidewalkWidth / 2;
                u.userData.theta = Math.atan2(s.z - u.userData.blockCZ, s.x - u.userData.blockCX);
                u.userData.spd = 0.16 + Math.random() * 0.08;
                streetLife.walkers.push(u);
            }
        }

        // ---- People vs vehicles ----
        // Traffic only ever looked at peds[], so the cinema queue, dog walkers and
        // street performers were invisible to it and got driven through.
        let people = [];
        function refreshPeople() {
            people.length = 0;
            for (const p of peds) {
                const st = p.userData.state;
                if (!p.visible || st === 'insideBuilding' || st === 'onBus' || st === 'inSubway') continue;
                people.push(p);
            }
            const c = streetLife.cinema;
            if (c) {
                for (const p of c.queue) people.push(p);
                for (const p of c.leavers) people.push(p);
            }
            for (const w of streetLife.walkers) people.push(w);
            for (const pf of performers) if (pf && pf.visible) people.push(pf);
        }

        // Braking only covers what is in front. Someone who walks into a flank, or a
        // vehicle running its own controller (gridlock response, police chase, parade
        // floats) which skips the braking checks entirely, would still pass straight
        // through a body — so nothing is allowed to end a frame with a person inside it.
        const _contactVeh = [];
        function pushPeopleOutOfVehicles() {
            _contactVeh.length = 0;
            for (const c of cars) _contactVeh.push(c);
            for (const b of bicycles) _contactVeh.push(b);
            if (omnibus) _contactVeh.push(omnibus);
            // the garbage truck is meant to hoover people up — leave it alone
            if (specialEvent && specialEvent.entities)
                for (const e of specialEvent.entities)
                    if (e.userData && (e.userData.spd || e.userData.isBrokenDown)) _contactVeh.push(e);

            for (const v of _contactVeh) {
                const hl = vHalf(v) + 0.2, hw = vWid(v) / 2 + 0.2;
                const cy = Math.cos(v.rotation.y), sy = Math.sin(v.rotation.y);
                const reach = hl + 1;
                for (const p of people) {
                    const dx = p.position.x - v.position.x, dz = p.position.z - v.position.z;
                    if (Math.abs(dx) > reach || Math.abs(dz) > reach) continue;
                    const lx = dx * cy - dz * sy;          // world -> vehicle local (+x is nose)
                    const lz = dx * sy + dz * cy;
                    if (Math.abs(lx) > hl || Math.abs(lz) > hw) continue;
                    // shove the body out through whichever face it is nearest
                    let nx = lx, nz = lz;
                    if (hw - Math.abs(lz) <= hl - Math.abs(lx)) nz = (lz < 0 ? -hw : hw);
                    else nx = (lx < 0 ? -hl : hl);
                    p.position.x = v.position.x + nx * cy + nz * sy;
                    p.position.z = v.position.z - nx * sy + nz * cy;
                }
            }
        }

        // One pass per frame keeps every walking body out of the static furniture.
        // Doing it here rather than inside updPeds covers all of its states at once.
        let _watchdogT = 0;
        function resolveWalkers(t, dt) {
            for (const p of peds) {
                if (!p.visible || p.userData.state === 'insideBuilding' || p.userData.state === 'onBus') continue;
                resolveObstacles(p, 0.2);
            }
            const c = streetLife.cinema;
            if (c) {
                for (const p of c.queue) resolveObstacles(p, 0.24);
                for (const p of c.leavers) resolveObstacles(p, 0.24);
            }

            // Mutual separation — bodies used to occupy the same square metre.
            // Split the correction so neither is teleported and the pair stays stable.
            for (let i = 0; i < peds.length; i++) {
                const a = peds[i];
                if (!a.visible || a.userData.state === 'insideBuilding' || a.userData.state === 'onBus') continue;
                for (let j = i + 1; j < peds.length; j++) {
                    const b = peds[j];
                    if (!b.visible || b.userData.state === 'insideBuilding' || b.userData.state === 'onBus') continue;
                    const dx = b.position.x - a.position.x, dz = b.position.z - a.position.z;
                    const d2 = dx * dx + dz * dz;
                    if (d2 > 0.2116 || d2 < 1e-6) continue;   // 0.46m apart is touching
                    const dist = Math.sqrt(d2);
                    const push = (0.46 - dist) / 2;
                    const ux = dx / dist * push, uz = dz / dist * push;
                    a.position.x -= ux; a.position.z -= uz;
                    b.position.x += ux; b.position.z += uz;
                }
            }

            // Watchdog: anything that hasn't moved in 12s gets a fresh errand. Peds
            // could previously deadlock waiting to cross behind a car that never moved.
            if (t - _watchdogT < 3) return;
            const step = t - _watchdogT;
            _watchdogT = t;
            for (const p of peds) {
                const u = p.userData;
                if (u.state === 'insideBuilding' || u.state === 'onBus') { u.stillFor = 0; continue; }
                const last = u.lastSeen || (u.lastSeen = { x: p.position.x, z: p.position.z });
                const moved = Math.hypot(p.position.x - last.x, p.position.z - last.z);
                last.x = p.position.x; last.z = p.position.z;
                u.stillFor = moved < 0.12 ? (u.stillFor || 0) + step : 0;
                if (u.stillFor > 12) {
                    u.stillFor = 0;
                    u.state = 'walking';
                    u.waitTime = 0;
                    u.targetEntrance = null;
                    p.visible = true;
                    setNewPedTarget(p);
                }
            }
        }

        // Ambient figures were dead-still, which reads worse than no figure at all.
        // Each gets a cheap idle: weight shift, a working hand, an occasional look round.
        const idlers = [];
        function addIdler(fig, kind) {
            idlers.push({
                fig, kind,
                baseY: fig.position.y, baseRotY: fig.rotation.y, baseRotX: fig.rotation.x,
                phase: Math.random() * Math.PI * 2,
                rate: 0.7 + Math.random() * 0.7,
                lookT: Math.random() * 6, look: 0
            });
        }

        function updIdlers(t, dt) {
            for (const d of idlers) {
                const f = d.fig;
                const s = Math.sin(t * d.rate + d.phase);
                // weight shifts from foot to foot
                f.position.y = d.baseY + Math.abs(s) * 0.018;
                if (f.userData.ll) {
                    f.userData.ll.rotation.x = s * 0.06;
                    f.userData.rl.rotation.x = -s * 0.06;
                }
                // every few seconds, glance somewhere else
                d.lookT -= dt;
                if (d.lookT <= 0) {
                    d.lookT = 2.5 + Math.random() * 5;
                    d.look = (Math.random() - 0.5) * (d.kind === 'watch' ? 0.9 : 0.5);
                }
                f.rotation.y += (d.baseRotY + d.look - f.rotation.y) * Math.min(1, dt * 2.5);

                if (d.kind === 'serve') {          // reaching across the counter
                    f.rotation.x = d.baseRotX + Math.max(0, Math.sin(t * 1.6 + d.phase)) * 0.22;
                } else if (d.kind === 'paint') {   // brush strokes
                    f.rotation.x = d.baseRotX + Math.sin(t * 3.1 + d.phase) * 0.09;
                    f.rotation.z = Math.sin(t * 2.2 + d.phase) * 0.06;
                } else if (d.kind === 'sketch') {
                    f.rotation.x = d.baseRotX + Math.sin(t * 4.2 + d.phase) * 0.07;
                } else if (d.kind === 'chalk') {   // sweeping across the pavement
                    f.rotation.x = d.baseRotX + Math.abs(Math.sin(t * 1.4 + d.phase)) * 0.14;
                    f.rotation.z = Math.sin(t * 1.9 + d.phase) * 0.13;
                } else if (d.kind === 'wait') {    // shifting about in a queue
                    f.rotation.z = s * 0.03;
                }
            }
        }

        // Marquee chase, steam, artists' brush strokes, dog walkers, cinema queue
        function updStreetLife(t, dt) {
            updIdlers(t, dt);
            // Marquee bulbs: a running chase, plus everything brighter after dark
            const glow = isNight ? 1 : 0.55;
            for (const b of streetLife.bulbs) {
                const on = b.userData.steady || ((Math.floor(t * 6) + b.userData.chase) % 3) !== 0;
                b.material.color.setRGB(on ? 1 * glow : 0.28 * glow, on ? 0.94 * glow : 0.24 * glow, on ? 0.72 * glow : 0.18 * glow);
            }

            for (const p of streetLife.steam) {
                const u = p.userData;
                u.t += dt * u.rate;
                if (u.t > 1) u.t -= 1;
                p.position.y = 1.14 + u.t * 0.7;
                p.position.x = u.x + Math.sin(u.t * 4) * 0.09;
                p.scale.setScalar(0.5 + u.t * 1.7);
                p.material.opacity = 0.26 * (1 - u.t);
            }

            for (const u of streetLife.walkers) {
                const d = u.userData;
                // Steered, not teleported. The old version recomputed the position from
                // a parametric ring every frame and then let the collision pass shove it
                // back — the two fought each other and the walker vibrated. Now position
                // is integrated, heading is smoothed, and obstacles are a steering force.
                const rx = u.position.x - d.blockCX, rz = u.position.z - d.blockCZ;
                const ang = Math.atan2(rz, rx);
                const ca = Math.cos(ang), sa = Math.sin(ang);
                const k = 1 / Math.max(Math.abs(ca), Math.abs(sa), 0.75);
                const tx = d.blockCX + ca * d.ring * k, tz = d.blockCZ + sa * d.ring * k;

                let hx = -sa, hz = ca;                                   // tangent, anticlockwise
                hx += (tx - u.position.x) * 0.7;                          // pull back onto the pavement
                hz += (tz - u.position.z) * 0.7;

                let slow = 1;
                const near = nearObstacles(u.position.x, u.position.z);
                for (let i = 0; i < near.length; i++) {
                    const ob = near[i];
                    const ox = u.position.x - ob.x, oz = u.position.z - ob.z;
                    const dist = Math.hypot(ox, oz);
                    const reach = ob.r + 1.7;                            // handler plus dogs out front
                    if (dist < reach && dist > 1e-3) {
                        const wgt = (reach - dist) / reach;
                        hx += (ox / dist) * wgt * 3.4;
                        hz += (oz / dist) * wgt * 3.4;
                        if (dist < ob.r + 0.95) slow = Math.min(slow, 0.2);
                    }
                }
                // give way to people on foot as well
                for (let i = 0; i < peds.length; i++) {
                    const q = peds[i];
                    if (!q.visible) continue;
                    const ox = u.position.x - q.position.x, oz = u.position.z - q.position.z;
                    const dist = Math.hypot(ox, oz);
                    if (dist < 1.5 && dist > 1e-3) {
                        const wgt = (1.5 - dist) / 1.5;
                        hx += (ox / dist) * wgt * 1.8;
                        hz += (oz / dist) * wgt * 1.8;
                        if (dist < 0.8) slow = Math.min(slow, 0.3);
                    }
                }

                const hl = Math.hypot(hx, hz) || 1;
                hx /= hl; hz /= hl;
                const ease = Math.min(1, dt * 4);
                d.hx = d.hx === undefined ? hx : d.hx + (hx - d.hx) * ease;
                d.hz = d.hz === undefined ? hz : d.hz + (hz - d.hz) * ease;
                const nl = Math.hypot(d.hx, d.hz) || 1;
                d.hx /= nl; d.hz /= nl;

                const step = d.spd * slow * dt * 4;
                u.position.x += d.hx * step;
                u.position.z += d.hz * step;
                u.position.y = 0.15;
                resolveObstacles(u, 0.35);   // backstop only; the force field does the work

                // heading follows the path, taking the short way round
                const want = Math.atan2(d.hx, d.hz);
                let turn = want - u.rotation.y;
                while (turn > Math.PI) turn -= Math.PI * 2;
                while (turn < -Math.PI) turn += Math.PI * 2;
                u.rotation.y += turn * Math.min(1, dt * 5);

                d.walk += dt * 6 * slow;
                const sw = Math.sin(d.walk) * 0.3;
                if (d.handler.userData.ll) d.handler.userData.ll.rotation.x = sw;
                if (d.handler.userData.rl) d.handler.userData.rl.rotation.x = -sw;
                d.dogs.forEach((dog, i) => {
                    const ds = Math.sin(d.walk * 1.7 + i);
                    dog.userData.legs[0].rotation.x = ds * 0.5;
                    dog.userData.legs[3].rotation.x = ds * 0.5;
                    dog.userData.legs[1].rotation.x = -ds * 0.5;
                    dog.userData.legs[2].rotation.x = -ds * 0.5;
                    dog.userData.tail.rotation.x = Math.sin(d.walk * 3 + i) * 0.6;
                    dog.position.y = Math.abs(ds) * 0.015;
                });
            }

            updCinemaCrowd(t, dt);
        }

        // Queue shuffles forward, front of the queue buys and goes in, others come out
        function updCinemaCrowd(t, dt) {
            const c = streetLife.cinema;
            if (!c) return;

            c.spawnT -= dt;
            if (c.spawnT <= 0 && c.queue.length < 4) {
                c.spawnT = 2 + Math.random() * 3;
                const p = slPed();
                const slot = c.queue.length;
                p.position.set(c.queueStart.x + c.queueStep * (slot + 2.2), 0.15,
                               c.queueStart.z + (Math.random() - 0.5) * 0.3);
                p.rotation.y = Math.PI / 2;
                p.userData.slot = slot;
                p.userData.walk = Math.random() * 6;
                scene.add(p);
                c.queue.push(p);
            }

            for (let i = 0; i < c.queue.length; i++) {
                const p = c.queue[i];
                const tx = c.queueStart.x + c.queueStep * i;
                const dz = c.queueStart.z - p.position.z;
                const dx = tx - p.position.x;
                const dist = Math.hypot(dx, dz);
                if (dist > 0.06) {
                    const step = Math.min(dist, 1.3 * dt);
                    p.position.x += (dx / dist) * step;
                    p.position.z += (dz / dist) * step;
                    p.rotation.y = Math.atan2(dx, dz);
                    p.userData.walk += dt * 7;
                    const sw = Math.sin(p.userData.walk) * 0.32;
                    if (p.userData.ll) p.userData.ll.rotation.x = sw;
                    if (p.userData.rl) p.userData.rl.rotation.x = -sw;
                } else if (i === 0) {
                    p.userData.served = (p.userData.served || 0) + dt;
                    p.rotation.y = Math.PI / 2;   // facing the box office
                    if (p.userData.served > 2.5) {
                        c.queue.shift();
                        p.userData.mode = 'in';
                        p.userData.target = c.door.clone();
                        c.leavers.push(p);
                    }
                }
            }

            // Ticket holders walk in and vanish; other patrons spill out and disperse
            c.leaveT -= dt;
            if (c.leaveT <= 0) {
                c.leaveT = 4 + Math.random() * 6;
                const p = slPed();
                p.position.copy(c.door);
                p.userData.mode = 'out';
                p.userData.walk = Math.random() * 6;
                p.userData.target = new THREE.Vector3(
                    c.door.x + (Math.random() - 0.5) * 14, 0.15, c.door.z + 5 + Math.random() * 6);
                scene.add(p);
                c.leavers.push(p);
            }

            for (let i = c.leavers.length - 1; i >= 0; i--) {
                const p = c.leavers[i];
                const dx = p.userData.target.x - p.position.x;
                const dz = p.userData.target.z - p.position.z;
                const dist = Math.hypot(dx, dz);
                if (dist < 0.25) {
                    scene.remove(p);
                    c.leavers.splice(i, 1);
                    continue;
                }
                const step = Math.min(dist, (p.userData.mode === 'in' ? 1.4 : 1.1) * dt);
                p.position.x += (dx / dist) * step;
                p.position.z += (dz / dist) * step;
                p.rotation.y = Math.atan2(dx, dz);
                p.userData.walk += dt * 7;
                const sw = Math.sin(p.userData.walk) * 0.32;
                if (p.userData.ll) p.userData.ll.rotation.x = sw;
                if (p.userData.rl) p.userData.rl.rotation.x = -sw;
            }
        }

        function mkPeds() {
            const cols = [0xff6b6b, 0x4ecdc4, 0xffe66d, 0x95e1d3, 0xf38181, 0xaa96da, 0x6c5ce7, 0xfdcb6e,
                          0xd7263d, 0x1b6ca8, 0x3a7d44, 0xf2f2f2, 0x2d2d2d, 0xef8354, 0x7768ae, 0xb9d872];
            const innerSize = GRID.cellSize - GRID.roadWidth;
            
            for (let i = 0; i < CFG.peds; i++) {
                const p = mkPed(cols[Math.floor(Math.random() * cols.length)]);
                
                const bx = Math.floor(Math.random() * GRID.gridCount);
                const bz = Math.floor(Math.random() * GRID.gridCount);
                const blockCenterX = -halfSize + bx * GRID.cellSize + GRID.cellSize / 2;
                const blockCenterZ = -halfSize + bz * GRID.cellSize + GRID.cellSize / 2;
                
                const side = Math.floor(Math.random() * 4);
                const swOffset = GRID.sidewalkWidth / 2;
                const alongOffset = (Math.random() - 0.5) * (innerSize - 4);
                
                if (side === 0) p.position.set(blockCenterX + alongOffset, 0.15, blockCenterZ - innerSize/2 + swOffset);
                else if (side === 1) p.position.set(blockCenterX + alongOffset, 0.15, blockCenterZ + innerSize/2 - swOffset);
                else if (side === 2) p.position.set(blockCenterX - innerSize/2 + swOffset, 0.15, blockCenterZ + alongOffset);
                else p.position.set(blockCenterX + innerSize/2 - swOffset, 0.15, blockCenterZ + alongOffset);
                
                p.userData.currentBlock = { x: bx, z: bz };
                p.userData.state = 'walking';
                setNewPedTarget(p);

                p.userData.spd = (0.02 + Math.random() * 0.015) * (p.userData.spdMul || 1);
                p.userData.walk = Math.random() * Math.PI * 2;
                p.userData.stuckTime = 0;
                p.userData.beingHelped = false;
                peds.push(p);
                scene.add(p);
            }
        }

        function setNewPedTarget(p) {
            const innerSize = GRID.cellSize - GRID.roadWidth;
            const bx = p.userData.currentBlock.x;
            const bz = p.userData.currentBlock.z;
            const blockCenterX = -halfSize + bx * GRID.cellSize + GRID.cellSize / 2;
            const blockCenterZ = -halfSize + bz * GRID.cellSize + GRID.cellSize / 2;
            const swOffset = GRID.sidewalkWidth / 2;
            
            // Determine which side of sidewalk pedestrian is currently on
            const relX = p.position.x - blockCenterX;
            const relZ = p.position.z - blockCenterZ;
            const halfInner = innerSize / 2;
            
            // Figure out current sidewalk side (0=north, 1=south, 2=west, 3=east)
            let currentSide = -1;
            if (Math.abs(relZ + halfInner) < 2) currentSide = 0; // North sidewalk
            else if (Math.abs(relZ - halfInner) < 2) currentSide = 1; // South sidewalk
            else if (Math.abs(relX + halfInner) < 2) currentSide = 2; // West sidewalk
            else if (Math.abs(relX - halfInner) < 2) currentSide = 3; // East sidewalk
            
            // 20% chance to cross to another block
            if (Math.random() < 0.20 && p.userData.state === 'walking') {
                const dir = Math.floor(Math.random() * 4);
                let newBx = bx, newBz = bz;
                
                if (dir === 0 && bz > 0) newBz--;
                else if (dir === 1 && bz < GRID.gridCount - 1) newBz++;
                else if (dir === 2 && bx > 0) newBx--;
                else if (dir === 3 && bx < GRID.gridCount - 1) newBx++;
                
                if (newBx !== bx || newBz !== bz) {
                    const crosswalk = findNearestCrosswalk(p.position, newBx - bx, newBz - bz);
                    if (crosswalk) {
                        p.userData.state = 'towardsCrosswalk';
                        p.userData.pendingCrosswalk = crosswalk;
                        p.userData.pendingBlock = { x: newBx, z: newBz };

                        // Wait on the curb (OFF the asphalt — standing in the road held up
                        // traffic), on whichever side the ped is coming from
                        const curb = GRID.roadWidth / 2 + 0.7;
                        if (crosswalk.axis === 'z') {
                            const cd = newBz > bz ? 1 : -1;
                            p.userData.target = new THREE.Vector3(crosswalk.x, 0.15, crosswalk.z - cd * curb);
                        } else {
                            const cd = newBx > bx ? 1 : -1;
                            p.userData.target = new THREE.Vector3(crosswalk.x - cd * curb, 0.15, crosswalk.z);
                        }
                        return;
                    }
                }
            }
            
            // 10% chance to go to a building entrance on CURRENT sidewalk side
            if (Math.random() < 0.10 && buildingEntrances.length > 0 && currentSide >= 0) {
                // Find entrance on the same side we're walking on
                let validEntrances = buildingEntrances.filter(ent => {
                    // Check if entrance is in this block
                    const dx = Math.abs(ent.x - blockCenterX);
                    const dz = Math.abs(ent.z - blockCenterZ);
                    if (dx > halfInner + 2 || dz > halfInner + 2) return false;
                    
                    // Check if entrance faces the sidewalk we're on
                    if (currentSide === 0 && ent.side === 1) return true; // North sidewalk, door faces north
                    if (currentSide === 1 && ent.side === 0) return true; // South sidewalk, door faces south
                    if (currentSide === 2 && ent.side === 3) return true; // West sidewalk, door faces west
                    if (currentSide === 3 && ent.side === 2) return true; // East sidewalk, door faces east
                    return false;
                });
                
                if (validEntrances.length > 0) {
                    const entrance = validEntrances[Math.floor(Math.random() * validEntrances.length)];
                    p.userData.state = 'toBuilding';
                    p.userData.targetEntrance = entrance;
                    p.userData.target = new THREE.Vector3(entrance.x, 0.15, entrance.z);
                    return;
                }
            }

            // 15% chance to notice a nearby performer when walking
            if (Math.random() < 0.15 && p.userData.state === 'walking' && performers.length > 0) {
                // Find nearest performer within attraction radius
                let nearestPerformer = null;
                let nearestDist = PERFORMER_CFG.attractRadius;

                for (const performer of performers) {
                    // Skip if performer already has max crowd
                    if (performer.userData.watchers.length >= PERFORMER_CFG.maxCrowd) continue;

                    const dx = performer.position.x - p.position.x;
                    const dz = performer.position.z - p.position.z;
                    const dist = Math.sqrt(dx * dx + dz * dz);

                    if (dist < nearestDist) {
                        nearestDist = dist;
                        nearestPerformer = performer;
                    }
                }

                if (nearestPerformer) {
                    // Calculate semicircle position around performer
                    const crowdAngle = nearestPerformer.rotation.y + Math.PI; // Face same way as performer faces
                    const angleSpread = Math.PI * 0.8; // 144 degree semicircle
                    const watcherIndex = nearestPerformer.userData.watchers.length;
                    const angleOffset = (watcherIndex / PERFORMER_CFG.maxCrowd - 0.5) * angleSpread;
                    const watchAngle = crowdAngle + angleOffset;

                    const watchX = nearestPerformer.position.x + Math.sin(watchAngle) * PERFORMER_CFG.crowdRadius;
                    const watchZ = nearestPerformer.position.z + Math.cos(watchAngle) * PERFORMER_CFG.crowdRadius;

                    p.userData.state = 'towardPerformer';
                    p.userData.target = new THREE.Vector3(watchX, 0.15, watchZ);
                    p.userData.watchingPerformer = nearestPerformer;
                    p.userData.watchDuration = 10 + Math.random() * 20; // 10-30 seconds watching
                    p.userData.watchStartTime = null; // Set when arrived

                    // Add to performer's watcher list
                    nearestPerformer.userData.watchers.push(p);
                    return;
                }
            }

            // 8% chance to go to subway station when walking
            if (Math.random() < 0.08 && p.userData.state === 'walking' && subwayStations.length > 0) {
                // Find nearest subway station
                let nearestStation = null;
                let nearestDist = 30; // Max attraction distance

                for (const station of subwayStations) {
                    const dx = station.x - p.position.x;
                    const dz = station.z - p.position.z;
                    const dist = Math.sqrt(dx * dx + dz * dz);

                    if (dist < nearestDist) {
                        nearestDist = dist;
                        nearestStation = station;
                    }
                }

                if (nearestStation && subwayPassengers.length < SUBWAY_MAX_PASSENGERS) {
                    p.userData.state = 'toSubwayStation';
                    p.userData.targetStation = nearestStation;
                    // Target the entrance position (slightly in front of station)
                    p.userData.target = new THREE.Vector3(
                        nearestStation.x + Math.sin(nearestStation.rotation) * 2,
                        0.15,
                        nearestStation.z + Math.cos(nearestStation.rotation) * 2
                    );
                    return;
                }
            }

            // Default: walk along current sidewalk to a random point, staying on same side
            let targetX, targetZ;
            const alongOffset = (Math.random() - 0.5) * (innerSize - 2);
            
            if (currentSide === 0 || currentSide === 1) {
                // On north or south sidewalk - walk east/west
                targetX = blockCenterX + alongOffset;
                targetZ = currentSide === 0 ? blockCenterZ - halfInner + swOffset : blockCenterZ + halfInner - swOffset;
            } else if (currentSide === 2 || currentSide === 3) {
                // On west or east sidewalk - walk north/south
                targetX = currentSide === 2 ? blockCenterX - halfInner + swOffset : blockCenterX + halfInner - swOffset;
                targetZ = blockCenterZ + alongOffset;
            } else {
                // Not on a sidewalk - pick nearest sidewalk corner
                const side = Math.floor(Math.random() * 4);
                if (side === 0) {
                    targetX = blockCenterX + alongOffset;
                    targetZ = blockCenterZ - halfInner + swOffset;
                } else if (side === 1) {
                    targetX = blockCenterX + alongOffset;
                    targetZ = blockCenterZ + halfInner - swOffset;
                } else if (side === 2) {
                    targetX = blockCenterX - halfInner + swOffset;
                    targetZ = blockCenterZ + alongOffset;
                } else {
                    targetX = blockCenterX + halfInner - swOffset;
                    targetZ = blockCenterZ + alongOffset;
                }
            }
            
            p.userData.target = new THREE.Vector3(targetX, 0.15, targetZ);
            p.userData.state = 'walking';
        }

        function findNearestCrosswalk(pos, dx, dz) {
            let best = null, bestDist = Infinity;
            
            for (const cw of crosswalks) {
                if ((dz !== 0 && cw.axis === 'z') || (dx !== 0 && cw.axis === 'x')) {
                    const dist = Math.abs(pos.x - cw.x) + Math.abs(pos.z - cw.z);
                    if (dist < bestDist) {
                        bestDist = dist;
                        best = cw;
                    }
                }
            }
            return best;
        }

        function mkBicycles() {
