                g.userData.bulb = bulb;
                // No PointLight - too expensive with many streetlights

                g.position.set(x, 0, z);
                g.rotation.y = rotation;

                streetlights.push(g);
                scene.add(g);
                addObstacle(x, z, 0.32);
            }
        }

        function mkBuildings() {
            const innerSize = GRID.cellSize - GRID.roadWidth - GRID.sidewalkWidth * 2;
            // Realistic mixed palette: concrete, limestone, sandstone, steel, dark glass
            const types = [
                { minH: 18, maxH: 65, col: 0xb4b8be },
                { minH: 12, maxH: 45, col: 0xc8bda8 },
                { minH: 28, maxH: 85, col: 0x8d99a8 },
                { minH: 10, maxH: 30, col: 0xbfa98c },
                { minH: 30, maxH: 85, col: 0x5e6e80 },
                { minH: 14, maxH: 40, col: 0xa8746a }
            ];
            
            for (let bx = 0; bx < GRID.gridCount; bx++) {
                for (let bz = 0; bz < GRID.gridCount; bz++) {
                    const blockCenterX = -halfSize + bx * GRID.cellSize + GRID.cellSize / 2;
                    const blockCenterZ = -halfSize + bz * GRID.cellSize + GRID.cellSize / 2;
                    // Track columns (x = ±36) get a single centered building: the subway
                    // tunnel is carved through the building center, so an offset pair
                    // would put the track through a solid wall
                    const onTrackColumn = bx === 0 || bx === GRID.gridCount - 1;
                    const numBuildings = onTrackColumn ? 1 : 1 + Math.floor(Math.random() * 2);

                    for (let i = 0; i < numBuildings; i++) {
                        const t = types[Math.floor(Math.random() * types.length)];
                        let h = t.minH + Math.random() * (t.maxH - t.minH);
                        const maxW = (innerSize - 2) / numBuildings;
                        const w = Math.min(maxW, 5 + Math.random() * 7);
                        const d = Math.min(innerSize - 4, 5 + Math.random() * 7);
                        
                        const offsetX = numBuildings > 1 ? (i - 0.5) * (innerSize / 2) : 0;
                        const bPosX = blockCenterX + offsetX;
                        const bPosZ = blockCenterZ;
                        const tunnelInfo = getSubwayTunnelInfo(bPosX, bPosZ, w, d);
                        // Buildings shorter than the tunnel top would be built solid
                        // with the track slicing through the roof — raise them
                        if (tunnelInfo) h = Math.max(h, tunnelInfo.tunnelBottom + tunnelInfo.tunnelHeight + 2);
                        // Paired buildings: no shops on the face pointing at the neighbor
                        const skipSides = numBuildings > 1 ? (i === 0 ? [2] : [3]) : [];
                        const b = mkBuilding(w, h, d, t.col, tunnelInfo, skipSides);
                        b.position.set(bPosX, 0, bPosZ);
                        b.userData.height = h;
                        b.userData.width = w;
                        b.userData.depth = d;
                        
                        // Store global entrance positions
                        b.userData.entrances.forEach(ent => {
                            buildingEntrances.push({
                                x: b.position.x + ent.localX,
                                z: b.position.z + ent.localZ,
                                side: ent.side,
                                building: b
                            });
                        });
                        
                        buildings.push(b);
                        scene.add(b);

                        // Track buildings with rooftop features for figure placement
                        if (b.userData.hasRooftopFeature) {
                            activeRooftops.push({
                                building: b,
                                x: bPosX,
                                z: bPosZ,
                                height: h,
                                width: w,
                                depth: d,
                                type: b.userData.rooftopType
                            });

                            // Add static figures to gardens and pools
                            const numFigs = b.userData.rooftopType === 'pool'
                                ? ROOFTOP_CFG.figuresPerPool[0] + Math.floor(Math.random() * (ROOFTOP_CFG.figuresPerPool[1] - ROOFTOP_CFG.figuresPerPool[0] + 1))
                                : ROOFTOP_CFG.figuresPerGarden[0] + Math.floor(Math.random() * (ROOFTOP_CFG.figuresPerGarden[1] - ROOFTOP_CFG.figuresPerGarden[0] + 1));

                            for (let f = 0; f < numFigs; f++) {
                                const fig = mkRooftopFigure();
                                const fx = (Math.random() - 0.5) * w * 0.5;
                                const fz = (Math.random() - 0.5) * d * 0.5;
                                fig.position.set(fx, h + 0.05, fz);
                                fig.userData.baseX = fx;
                                fig.userData.baseZ = fz;
                                fig.userData.buildingHeight = h;
                                b.add(fig);
                                rooftopFigures.push(fig);
                            }
                        }
                    }
                }
            }

            // ---- Guaranteed nightlife: one lush rooftop bar, one techno club,
            // and at least one rooftop pool (every pool comes with a swimmer) ----
            const addRoofFigs = (b, n) => {
                for (let f = 0; f < n; f++) {
                    const fig = mkRooftopFigure();
                    const fx = (Math.random() - 0.5) * b.userData.width * 0.5;
                    const fz = (Math.random() - 0.5) * b.userData.depth * 0.5;
                    fig.position.set(fx, b.userData.height + 0.05, fz);
                    fig.userData.baseX = fx;
                    fig.userData.baseZ = fz;
                    fig.userData.buildingHeight = b.userData.height;
                    b.add(fig);
                    rooftopFigures.push(fig);
                }
            };
            const nearTrack = b => Math.abs(b.position.x + 36) < b.userData.width / 2 + 2 ||
                                   Math.abs(b.position.z - 36) < b.userData.depth / 2 + 2;
            const barCandidates = buildings.filter(b =>
                !b.userData.hasRooftopFeature && !nearTrack(b) &&
                b.userData.height >= 14 &&
                b.userData.width >= 5.5 && b.userData.depth >= 5.5
            ).sort((a, b2) => b2.userData.width * b2.userData.depth - a.userData.width * a.userData.depth);

            const barNames = {
                techno: { emoji: '🔊', name: 'VOLTAGE', blurb: 'Rooftop techno. The BPM exceeds the noise ordinance and the bass is load-bearing.' },
                lush: { emoji: '🌿', name: 'The Hanging Gardens', blurb: 'Rooftop botany with a two-mojito minimum. Please do not feed the ferns.' }
            };
            const barStyles = ['techno', 'lush'];
            let placedBars = 0, lastBarPos = null;
            for (const pass of [28, 0]) { // prefer spread-out bars; settle for any second host
            for (const b of barCandidates) {
                if (placedBars >= 2) break;
                if (b.userData.hasRooftopFeature) continue;
                if (pass && lastBarPos && Math.hypot(b.position.x - lastBarPos.x, b.position.z - lastBarPos.z) < pass) continue;
                const style = barStyles[placedBars];
                b.add(mkRooftopBar(b.userData.width, b.userData.depth, b.userData.height, style));
                b.userData.hasRooftopFeature = true;
                b.userData.rooftopType = 'bar';
                if (b.userData.roofClutter) b.userData.roofClutter.visible = false;
                addRoofFigs(b, 5);
                // parapet name sign — also feeds the hover tooltip
                const info = barNames[style];
                const sign = mkTextSign(info.name, 5, 0.9,
                    style === 'techno' ? '#12001a' : '#1e3b24',
                    style === 'techno' ? '#ff44cc' : '#ffd27a');
                sign.position.set(0, b.userData.height + 2.6, -b.userData.depth / 2 + 0.2);
                sign.material.side = THREE.DoubleSide;
                sign.userData.shop = info;
                b.add(sign);
                shopHitMeshes.push(sign);
                lastBarPos = b.position;
                placedBars++;
            }
            }

            if (!buildings.some(b => b.userData.rooftopType === 'pool')) {
                const host = barCandidates.find(b => !b.userData.hasRooftopFeature);
                if (host) {
                    host.add(mkRooftopPool(host.userData.width, host.userData.depth, host.userData.height));
                    host.userData.hasRooftopFeature = true;
                    host.userData.rooftopType = 'pool';
                    if (host.userData.roofClutter) host.userData.roofClutter.visible = false;
                    addRoofFigs(host, 2);
                }
            }
        }

        // Check if a building position needs a subway tunnel
        function getSubwayTunnelInfo(bx, bz, w, d) {
            // Subway tracks form a rectangular loop along the outer block centers:
            // vertical tracks at x = ±36, horizontal tracks at z = ±36
            const trackXs = [-halfSize + 12, halfSize - 12];
            const trackZs = [-halfSize + 12, halfSize - 12];
            // Opening hugs the train: beam bottom is trackHeight-0.5, train top
            // is trackHeight+1.8, train is 2 wide with guard rails at ±1.1
            const tunnelWidth = 3;    // Width of tunnel opening
            const tunnelHeight = 3.5; // Height of tunnel opening
            const tunnelBottom = SUBWAY_CFG.trackHeight - 1; // Bottom of tunnel

            const intersectsVertical = trackXs.some(tx => Math.abs(bx - tx) < w/2 + 1);
            const intersectsHorizontal = trackZs.some(tz => Math.abs(bz - tz) < d/2 + 1);

            // Corner building needs both tunnels
            if (intersectsVertical && intersectsHorizontal) {
                return { direction: 'both', tunnelWidth, tunnelHeight, tunnelBottom };
            }
            // Check if building intersects with vertical track (x = -36)
            if (intersectsVertical) {
                return { direction: 'z', tunnelWidth, tunnelHeight, tunnelBottom };
            }
            // Check if building intersects with horizontal track (z = 36)
            if (intersectsHorizontal) {
                return { direction: 'x', tunnelWidth, tunnelHeight, tunnelBottom };
            }
            return null;
        }

        // Window look: shared geometries, per-building style + pane size, per-window tones
        // Taller than the glass: the texture now carries a lintel shadow and a sill
        const WIN_GEO = new THREE.PlaneGeometry(1.3, 1.85);
        const DOOR_GEO = new THREE.PlaneGeometry(1.1, 2.3);
        const FIG_GEO = new THREE.PlaneGeometry(0.55, 0.95);
        const WIN_LIT_COLORS = [0xffeeaa, 0xffe093, 0xfff2cf, 0xcfe0ff, 0xffd98a];
        const WIN_DARK_BASE = 0x8fa2b8;   // reflective, not a black hole
        // Fraction of windows lit, by hour: evenings glow, late night dims, daytime mostly off
        const WIN_LIT_P = () => {
            const t = timeOfDay;
            if (t >= 0.72 && t < 0.95) return 0.55; // evening: everyone's home
            if (t >= 0.95 || t < 0.2) return 0.28;  // late night: half the city asleep
            if (t < 0.28) return 0.15;              // dawn: early risers
            return 0.08;                            // daytime
        };
        const WIN_STYLES = ['plain', 'plain', 'cross', 'cross', 'grid6']; // weighted pick
        const windowFigures = [];

        // Balcony shared parts
        const BAL_PLAT_GEO = new THREE.BoxGeometry(1.7, 0.09, 0.75);
        const BAL_RAIL_GEO = new THREE.BoxGeometry(1.7, 0.06, 0.05);
        const BAL_SIDE_GEO = new THREE.BoxGeometry(0.05, 0.06, 0.75);
        const BAL_POST_GEO = new THREE.BoxGeometry(0.05, 0.95, 0.05);
        const BAL_MAT = new THREE.MeshStandardMaterial({ color: 0x3c4148, roughness: 0.6, metalness: 0.4 });
        const BAL_PLAT_MAT = new THREE.MeshStandardMaterial({ color: 0x9b9b96, roughness: 0.9 });

        // Unlit panes are unlit MeshBasic mirrors, so they never darken on their own —
        // without this the whole city glows pale blue at midnight.
        let winDayF = 1;
        const _winCol = new THREE.Color();
        function setWindowLit(win, lit) {
            win.userData.isLit = lit;
            win.material.map = lit ? win.userData.texLit : win.userData.texDark;
            if (lit) win.material.color.setHex(win.userData.litColor);
            else win.material.color.copy(_winCol.setHex(win.userData.darkColor).multiplyScalar(winDayF));
            if (win.userData.figure) win.userData.figure.visible = lit;
        }

        function mkWindowMesh(bStyle, isDoor = false) {
            // ~8% of regular windows are open (sash up); doors use the slider texture
            const styleName = isDoor ? 'door' : (Math.random() < 0.08 ? 'open' : bStyle.style);
            const texPair = TEX.win[styleName];
            const lit = Math.random() < WIN_LIT_P();
            const litCol = WIN_LIT_COLORS[Math.floor(Math.random() * WIN_LIT_COLORS.length)];
            const darkCol = new THREE.Color(WIN_DARK_BASE).offsetHSL(0, 0, (Math.random() - 0.5) * 0.08).getHex();
            const m = new THREE.Mesh(isDoor ? DOOR_GEO : WIN_GEO, new THREE.MeshBasicMaterial({
                map: lit ? texPair.lit : texPair.dark,
                color: lit ? litCol : darkCol
            }));
            if (!isDoor) m.scale.set(bStyle.sx, bStyle.sy, 1);
            m.userData.isLit = lit;
            m.userData.litColor = litCol;
            m.userData.darkColor = darkCol;
            m.userData.texLit = texPair.lit;
            m.userData.texDark = texPair.dark;
            allWindows.push(m);
            return m;
        }

        // ~6.5% of windows get an animated backlit silhouette; those stay lit so it
        // shows (about 2/7 of them are TV watchers with the blue screen-glow)
        function maybeAddFigure(g, win) {
            if (Math.random() >= 0.065) return;
            const def = TEX.figures[Math.floor(Math.random() * TEX.figures.length)];
            const tex = def.frames ? def.frames[0] : def.tex;
            const fig = new THREE.Mesh(FIG_GEO, new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
            fig.position.copy(win.position);
            fig.rotation.copy(win.rotation);
            // nudge outward along the window normal so the shadow sits on the glass
            const n = new THREE.Vector3(0, 0, 1).applyEuler(win.rotation);
            fig.position.addScaledVector(n, 0.02);
            fig.userData = {
                def, win,
                baseX: fig.position.x, baseZ: fig.position.z, baseY: fig.position.y,
                normal: n, phase: Math.random() * Math.PI * 2,
                rate: 0.6 + Math.random() * 0.8, frame: 0
            };
            g.add(fig);
            windowFigures.push(fig);
            win.userData.figure = fig;
            win.userData.hasFigure = true;
            setWindowLit(win, true); // backlight on
        }

        function mkBalcony(g, x, y, z, rotY) {
            const b = new THREE.Group();
            const plat = new THREE.Mesh(BAL_PLAT_GEO, BAL_PLAT_MAT);
            plat.position.set(0, 0, 0.38);

            const rail = new THREE.Mesh(BAL_RAIL_GEO, BAL_MAT);

                side.position.set(sx, 0.95, 0.38);
                b.add(side);

            [-0.78, 0, 0.78].forEach(px => {
                const post = new THREE.Mesh(BAL_POST_GEO, BAL_MAT);
                post.position.set(px, 0.48, 0.71);
                b.add(post);
            });
            b.position.set(x, y, z);
            b.rotation.y = rotY;
            g.add(b);
        }

        function getShopTex(i) {

            const s = SHOP_CATALOG[i];
            const st = shopStyle(i);

            // Product window: lit interior (tint varies), display layout varies per shop
            const winTex = _winCanvasTex(256, 192, (ctx, W, H) => {
                const grad = ctx.createLinearGradient(0, 0, 0, H);
                grad.addColorStop(0, 'rgb(56,46,38)');
                grad.addColorStop(1, `rgb(${st.tint})`);
                ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
                ctx.textAlign = 'center';
                const shelf = y => { ctx.fillStyle = 'rgba(72,52,32,0.85)'; ctx.fillRect(16, y + 4, W - 32, 6); };
                const item = (x, y, size) => {
                    ctx.font = `${size}px system-ui`;

                if (st.winStyle === 0) {

            let awnMat;

                    ctx.fillStyle = '#efe8da'; ctx.fillRect(0, 0, W, H);

        let SHOP_DECK = [];

            return TEX.openSign;
        }

        // One shop unit: window + sign + awning (+ maybe OPEN sign, browsing silhouette)
        function addShopUnit(g, faceX, faceY, faceZ, rotY, shopIdx) {
            const shop = SHOP_CATALOG[shopIdx];
            const tx = getShopTex(shopIdx);
            const sg = new THREE.Group();          // local frame: +z faces the street
            sg.position.set(faceX, faceY, faceZ);
            sg.rotation.y = rotY;

            // Shopfront joinery: pilasters either side, a fascia the sign sits on, and
            // a stall riser under the glass. Without them a sign floats on bare brick.
            const joinery = new THREE.MeshStandardMaterial({ color: SHOP_JOINERY[shopIdx % SHOP_JOINERY.length], roughness: 0.7 });
            const fascia = new THREE.Mesh(SHOP_FASCIA_GEO, joinery);
            fascia.position.set(0, 2.3, 0.05);
            fascia.castShadow = true;
            fascia.userData.shop = shop;
            sg.add(fascia); shopHitMeshes.push(fascia);
            for (const s of [-1, 1]) {
                const pil = new THREE.Mesh(SHOP_PILASTER_GEO, joinery);
                pil.position.set(s * 1.28, 1.32, 0.05);
                pil.castShadow = true;
                sg.add(pil);
            }
            const riser = new THREE.Mesh(SHOP_RISER_GEO, joinery);
            riser.position.set(0, 0.13, 0.06);
            sg.add(riser);
            const step = new THREE.Mesh(SHOP_STEP_GEO, BAL_PLAT_MAT);
            step.position.set(0, 0.04, 0.28);
            sg.add(step);

            const win = new THREE.Mesh(SHOP_WIN_GEO, tx.winMat);
            win.position.set(0, 1.15, 0.03);
            win.userData.shop = shop;
            sg.add(win); shopHitMeshes.push(win);

            const sign = new THREE.Mesh(SHOP_SIGN_GEO, tx.signMat);
            sign.position.set(0, 2.32, 0.11);
            sign.userData.shop = shop;
            sg.add(sign); shopHitMeshes.push(sign);

            if (tx.style.blade) {
                // hanging blade sign perpendicular to the facade instead of an awning
                const blade = new THREE.Mesh(SHOP_BLADE_GEO, tx.bladeMat);
                blade.position.set(-1.05, 2.1, 0.32);
                blade.rotation.y = Math.PI / 2;
                blade.userData.shop = shop;
                sg.add(blade); shopHitMeshes.push(blade);
                const bracket = new THREE.Mesh(SHOP_BRACKET_GEO, BAL_MAT);
                bracket.position.set(-1.05, 2.42, 0.16);
                sg.add(bracket);
            } else {
                const awn = new THREE.Mesh(SHOP_AWNING_GEO, tx.awnMat);
                awn.position.set(0, 2.0, 0.42);
                awn.rotation.x = 0.28;
                awn.castShadow = true;
                awn.userData.shop = shop;
                sg.add(awn); shopHitMeshes.push(awn);
            }

            if (Math.random() < 0.4) { // neon OPEN sign, flickers in updShops
                const open = new THREE.Mesh(SHOP_OPEN_GEO, new THREE.MeshBasicMaterial({ map: getOpenSignTex(), color: 0xff4455 }));
                open.position.set(-0.75, 1.62, 0.04);
                open.userData = { rate: 1.5 + Math.random() * 4, phase: Math.random() * Math.PI * 2 };
                sg.add(open); shopOpenSigns.push(open);
            }

            if (Math.random() < 0.3) { // browsing silhouette inside the window (no couch potatoes in shops)
                const defs = TEX.figures.filter(d => d.type !== 'tv');
                const def = defs[Math.floor(Math.random() * defs.length)];
                const fig = new THREE.Mesh(FIG_GEO, new THREE.MeshBasicMaterial({ map: def.frames ? def.frames[0] : def.tex, transparent: true }));
                fig.position.set((Math.random() - 0.5) * 1.1, 0.95, 0.04);
                fig.userData = {
                    def, baseX: fig.position.x, baseY: 0.95, baseZ: 0.04,
                    normal: new THREE.Vector3(0, 0, 1), phase: Math.random() * Math.PI * 2,
                    rate: 0.6 + Math.random() * 0.8, frame: 0
                };
                sg.add(fig);
                windowFigures.push(fig);
            }

            addShopClutter(sg, tx.style);
            g.add(sg);
        }

        // Pavement dressing outside a shop: A-board, planter, crates, café set.
        // Empty pavement right up to the glass is what makes a street feel unlived-in.
        const CLUTTER = {
            board: new THREE.MeshStandardMaterial({ color: 0x2f2a24, roughness: 0.9 }),
            pot: new THREE.MeshStandardMaterial({ color: 0x8a5b42, roughness: 0.95 }),
            leaf: new THREE.MeshStandardMaterial({ color: 0x3d7a38, roughness: 0.9 }),
            crate: new THREE.MeshStandardMaterial({ color: 0x9b7a4e, roughness: 0.95 }),
            metal: new THREE.MeshStandardMaterial({ color: 0x54595f, roughness: 0.5, metalness: 0.6 }),
            bin: new THREE.MeshStandardMaterial({ color: 0x35472f, roughness: 0.8 })
        };
        function addShopClutter(sg, st) {
            if (Math.random() > 0.55) return;
            const x = (Math.random() - 0.5) * 1.6;
            const z = 0.95 + Math.random() * 0.5;
            const roll = Math.random();

            if (roll < 0.3) {                       // sandwich board
                const b = new THREE.Group();
                for (const s of [-1, 1]) {
                    const panel = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.72, 0.03), CLUTTER.board);
                    panel.position.set(0, 0.38, s * 0.12);
                    panel.rotation.x = s * 0.28;
                    panel.castShadow = true;
                    b.add(panel);
                }
                const chalk = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.5),
                    new THREE.MeshBasicMaterial({ color: 0xe8e3d4 }));
                chalk.position.set(0, 0.4, 0.22);
                chalk.rotation.x = 0.28;
                b.add(chalk);
                b.position.set(x, 0, z);
                b.rotation.y = (Math.random() - 0.5) * 0.7;
                sg.add(b);
            } else if (roll < 0.58) {               // planter with a shrub
                const p = new THREE.Group();
                const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.19, 0.34, 8), CLUTTER.pot);
                pot.position.y = 0.17; pot.castShadow = true;
                p.add(pot);
                for (let i = 0; i < 3; i++) {
                    const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.16 + Math.random() * 0.07, 6, 5), CLUTTER.leaf);
                    leaf.position.set((Math.random() - 0.5) * 0.2, 0.42 + Math.random() * 0.14, (Math.random() - 0.5) * 0.2);
                    p.add(leaf);
                }
                p.position.set(x, 0, z);
                sg.add(p);
            } else if (roll < 0.78) {               // stacked produce crates
                const c = new THREE.Group();
                const n = 2 + Math.floor(Math.random() * 2);
                for (let i = 0; i < n; i++) {
                    const cr = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.22, 0.36), CLUTTER.crate);
                    cr.position.set((Math.random() - 0.5) * 0.12, 0.11 + i * 0.23, 0);
                    cr.rotation.y = (Math.random() - 0.5) * 0.3;
                    cr.castShadow = true;
                    c.add(cr);
                }
                c.position.set(x, 0, z);
                sg.add(c);
            } else if (roll < 0.9) {                // pavement café: table + two stools
                const t = new THREE.Group();
                const top = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.05, 12),
                    new THREE.MeshStandardMaterial({ color: st.lightSign ? 0xd8d2c4 : 0x8d6e50, roughness: 0.7 }));
                top.position.y = 0.7; top.castShadow = true;
                t.add(top);
                const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.06, 0.7, 6), CLUTTER.metal);
                stem.position.y = 0.35;
                t.add(stem);
                for (const s of [-1, 1]) {
                    const stool = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.05, 10), CLUTTER.metal);
                    stool.position.set(s * 0.55, 0.45, 0.1);
                    t.add(stool);
                    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, 0.45, 5), CLUTTER.metal);
                    leg.position.set(s * 0.55, 0.22, 0.1);
                    t.add(leg);
                }
                t.position.set(x, 0, z + 0.3);
                sg.add(t);
            } else {                                 // wheelie bin
                const bin = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.62, 0.38), CLUTTER.bin);
                bin.position.set(x, 0.33, z);
                bin.castShadow = true;
                sg.add(bin);
                const lid = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.06, 0.42), CLUTTER.bin);
                lid.position.set(x, 0.66, z - 0.02);
                lid.rotation.x = -0.1;
                sg.add(lid);
            }
        }

        // Line every street-facing ground floor with shops, skipping entrance doors
        function mkStorefronts(g, w, d, entranceSides, skipSides) {
            const faces = [
                { side: 0, len: w, rotY: 0 },
                { side: 1, len: w, rotY: Math.PI },
                { side: 2, len: d, rotY: Math.PI / 2 },
                { side: 3, len: d, rotY: -Math.PI / 2 }
            ];
            faces.forEach(f => {
                if (skipSides.includes(f.side)) return;
                if (Math.random() < 0.1) return; // the occasional bare frontage
                const n = Math.floor((f.len - 0.6) / 2.8);
                for (let i = 0; i < n; i++) {
                    const u = (i - (n - 1) / 2) * 2.8;
                    if (entranceSides.includes(f.side) && Math.abs(u) < 1.4) continue; // door slot
                    const idx = drawShopIdx(); // globally unique until catalog runs dry
                    const e = 0.03;
                    if (f.side === 0) addShopUnit(g, u, 0, d / 2 + e, 0, idx);
                    else if (f.side === 1) addShopUnit(g, u, 0, -d / 2 - e, Math.PI, idx);
                    else if (f.side === 2) addShopUnit(g, w / 2 + e, 0, u, Math.PI / 2, idx);
                    else addShopUnit(g, -w / 2 - e, 0, u, -Math.PI / 2, idx);
                }
            });
        }

        // Flicker the OPEN neons
        function updShops(t) {
            for (const o of shopOpenSigns) {
                const on = Math.sin(t * o.userData.rate + o.userData.phase) > -0.6;
                o.material.color.setHex(on ? 0xff4455 : 0x40090d);
            }
        }

        // Tooltip: raycast from crosshair (pointer lock) or mouse at shop meshes
        const _shopRC = new THREE.Raycaster();
        _shopRC.far = 45;
        const _rcCenter = new THREE.Vector2(0, 0);
        const mouseNDC = new THREE.Vector2(0, 0);
        const mousePx = { x: 0, y: 0 };
        let _lastShopRay = 0;
        function updShopTooltip(t) {
            if (t - _lastShopRay < 0.1) return;
            _lastShopRay = t;
            const locked = !!document.pointerLockElement;
            _shopRC.setFromCamera(locked ? _rcCenter : mouseNDC, cam);
            const hits = _shopRC.intersectObjects(shopHitMeshes, false);
            const tip = $('tooltip');
            if (hits.length && hits[0].object.userData.shop) {
                const s = hits[0].object.userData.shop;
                tip.innerHTML = `<b>${s.emoji} ${s.name}</b><div class="tipsub">${s.blurb}</div>`;
                tip.style.left = locked ? '50%' : mousePx.x + 'px';
                tip.style.top = locked ? '47%' : mousePx.y + 'px';
                tip.classList.add('show');
            } else {
                tip.classList.remove('show');
            }
        }

        // ---- Facade material scaling ----
        // A BoxGeometry's UVs run 0-1 on every face, so one material stretches a single
        // texture tile across an entire 40m wall — bricks come out the size of a car.
        // Tiling per face by real metres is what makes the masonry read at street level.
        const FACADE_TILE = 3.5;     // one tile == one storey
        const _texTileCache = new Map();
        function tiledTex(base, rx, ry) {
            rx = Math.max(1, Math.round(rx));
            ry = Math.max(1, Math.round(ry));
            const key = `${base.uuid}|${rx}|${ry}`;
            let t = _texTileCache.get(key);
            if (!t) {
                t = base.clone();
                t.wrapS = t.wrapT = THREE.RepeatWrapping;
                t.repeat.set(rx, ry);
                t.needsUpdate = true;
                _texTileCache.set(key, t);
            }
            return t;
        }

        // One box of building mass, correctly tiled on all four walls plus a tar roof on top.
        // BoxGeometry material order is +X, -X, +Y, -Y, +Z, -Z.
        function facadeBox(fv, tint, rough, w, h, d) {
            const wall = len => new THREE.MeshStandardMaterial({
                color: tint, roughness: rough, metalness: fv.metal,
                map: tiledTex(fv.tex, len / FACADE_TILE, h / FACADE_TILE)
            });
            const roof = new THREE.MeshStandardMaterial({
                color: 0xffffff, roughness: 0.97,
                map: tiledTex(TEX.roof, w / 5, d / 5)
            });
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [wall(d), wall(d), roof, roof, wall(w), wall(w)]);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData.facade = true;
            return mesh;
        }

        const PLINTH_H = 3.2;   // ground-floor base: clears storefront signs and awnings
        const COPING_MAT = new THREE.MeshStandardMaterial({ color: 0x9a958c, roughness: 0.9 });
        const PLINTH_TONES = [0xa79f93, 0xb3a894, 0x94999f, 0xbdae97, 0x8b9096, 0xc2b9a8];
        const HVAC_MAT = new THREE.MeshStandardMaterial({ color: 0x9aa0a6, roughness: 0.6, metalness: 0.5 });
        const HVAC_DARK = new THREE.MeshStandardMaterial({ color: 0x4a4f55, roughness: 0.7, metalness: 0.4 });
        const TANK_MAT = new THREE.MeshStandardMaterial({ color: 0x6b4c33, roughness: 0.92 });
        const PIPE_MAT = new THREE.MeshStandardMaterial({ color: 0x8c8f93, roughness: 0.45, metalness: 0.7 });

        // Cornice + parapet + rooftop plant. A flat-topped extrusion reads as a
        // placeholder; the crown is what makes a box read as a building.
        function mkRoofKit(g, w, h, d, withClutter) {
            const cornice = new THREE.Mesh(new THREE.BoxGeometry(w + 0.5, 0.42, d + 0.5), COPING_MAT);
            cornice.position.y = h - 0.32;   // top face sits clear of the roof deck at y=h
            cornice.castShadow = true;
            g.add(cornice);

            // Parapet ring — hollow so the roof deck stays visible from above
            const pt = 0.28, ph = 0.75 + Math.random() * 0.5;
            const py = h + ph / 2 - 0.06;   // bed the parapet into the deck, not onto it
            [[w + 0.3, pt, 0, (d) / 2 + pt / 2], [w + 0.3, pt, 0, -(d) / 2 - pt / 2]].forEach(([bw, bt, x, z]) => {
                const m = new THREE.Mesh(new THREE.BoxGeometry(bw, ph, bt), COPING_MAT);
                m.position.set(x, py, z); m.castShadow = true; g.add(m);
            });
            [[pt, d + 0.3, w / 2 + pt / 2], [pt, d + 0.3, -w / 2 - pt / 2]].forEach(([bt, bd, x]) => {
                const m = new THREE.Mesh(new THREE.BoxGeometry(bt, ph, bd), COPING_MAT);
                m.position.set(x, py, 0); m.castShadow = true; g.add(m);
            });

            if (!withClutter) return null;

            const clutter = new THREE.Group();
            clutter.position.y = h - 0.03;   // bed the plant into the deck
            const spread = (fx, fz) => [(Math.random() - 0.5) * w * fx, (Math.random() - 0.5) * d * fz];

            // Stair bulkhead — every real roof has one
            const bw = Math.min(2.2, w * 0.35), bd = Math.min(2.0, d * 0.35);
            const bulk = new THREE.Mesh(new THREE.BoxGeometry(bw, 1.9, bd), HVAC_DARK);
            const [sx, sz] = spread(0.4, 0.4);
            bulk.position.set(sx, 0.95, sz);
            bulk.castShadow = true;
            clutter.add(bulk);
            const bcap = new THREE.Mesh(new THREE.BoxGeometry(bw + 0.2, 0.12, bd + 0.2), COPING_MAT);
            bcap.position.set(sx, 1.93, sz);   // overlap the bulkhead rather than butt to it
            clutter.add(bcap);

            // Rooftop AC units with fan grilles
            const nAC = 1 + Math.floor(Math.random() * 3);
            for (let i = 0; i < nAC; i++) {
                const uw = 0.9 + Math.random() * 0.8, ud = 0.7 + Math.random() * 0.6, uh = 0.5 + Math.random() * 0.4;
                const unit = new THREE.Mesh(new THREE.BoxGeometry(uw, uh, ud), HVAC_MAT);
                const [ux, uz] = spread(0.75, 0.75);
                unit.position.set(ux, uh / 2, uz);
                unit.castShadow = true;
                clutter.add(unit);
                const fan = new THREE.Mesh(new THREE.CylinderGeometry(Math.min(uw, ud) * 0.32, Math.min(uw, ud) * 0.32, 0.06, 10), HVAC_DARK);
                fan.position.set(ux, uh + 0.03, uz);
                clutter.add(fan);
            }

            // Vent pipes
            for (let i = 0; i < 1 + Math.floor(Math.random() * 3); i++) {
                const ph2 = 0.5 + Math.random() * 0.9;
                const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, ph2, 6), PIPE_MAT);
                const [px2, pz2] = spread(0.8, 0.8);
                pipe.position.set(px2, ph2 / 2, pz2);
                clutter.add(pipe);
            }

            // Wooden water tower on a steel frame — the skyline signature
            if (h > 22 && Math.min(w, d) > 5 && Math.random() < 0.35) {
                const tank = new THREE.Group();
                const legH = 1.4, r = Math.min(1.15, Math.min(w, d) * 0.22);
                const barrel = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 2.1, 12), TANK_MAT);
                barrel.position.y = legH + 1.05;
                barrel.castShadow = true;
                tank.add(barrel);
                const cone = new THREE.Mesh(new THREE.ConeGeometry(r * 1.08, 0.6, 12), HVAC_DARK);
                cone.position.y = legH + 2.4;
                tank.add(cone);
                [0, 1, 2, 3].forEach(i => {
                    const a = i * Math.PI / 2 + Math.PI / 4;
                    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, legH, 5), PIPE_MAT);
                    leg.position.set(Math.cos(a) * r * 0.72, legH / 2, Math.sin(a) * r * 0.72);
                    tank.add(leg);
                });
                [0.55, 1.55].forEach(y => {
                    const band = new THREE.Mesh(new THREE.TorusGeometry(r + 0.02, 0.035, 4, 12), PIPE_MAT);
                    band.position.y = legH + y; band.rotation.x = Math.PI / 2;
                    tank.add(band);
                });
                const [tx, tz] = spread(0.35, 0.35);
                tank.position.set(tx, 0, tz);
                clutter.add(tank);
            }

            g.add(clutter);
            return clutter;
        }

        function mkBuilding(w, h, d, col, tunnelInfo = null, skipSides = []) {
            const g = new THREE.Group();

            // Per-building facade: pick a material family (plaster/brick/marble/steel/cement/glass),
            // jitter tint + roughness. Colorful textures stay near-white; neutral ones take the type color.
            const fv = TEX.facades[Math.floor(Math.random() * TEX.facades.length)];
            const tint = fv.tinted ? new THREE.Color(col) : new THREE.Color(0xf0f0ee);
            tint.offsetHSL((Math.random() - 0.5) * 0.03, (Math.random() - 0.5) * 0.08, (Math.random() - 0.5) * 0.07);
            const rough = Math.max(0.15, fv.rough + (Math.random() - 0.5) * 0.15);
            const mkMass = (bw, bh, bd) => facadeBox(fv, tint, rough, bw, bh, bd);

            if (tunnelInfo && h > tunnelInfo.tunnelBottom + tunnelInfo.tunnelHeight) {
                // Building with tunnel - create as multiple parts
                const tunnelW = tunnelInfo.tunnelWidth;
                const tunnelH = tunnelInfo.tunnelHeight;
                const tunnelBot = tunnelInfo.tunnelBottom;
                const tunnelTop = tunnelBot + tunnelH;

                if (tunnelInfo.direction === 'both') {
                    // Corner building - tunnels in both X and Z directions
                    // Bottom section (full footprint)
                    if (tunnelBot > 0) {
                        const bottom = mkMass(w, tunnelBot, d);
                        bottom.position.y = tunnelBot / 2;
                        g.add(bottom);
                    }

                    // Four corner pillars at tunnel height
                    const pillarW = (w - tunnelW) / 2;
                    const pillarD = (d - tunnelW) / 2;
                    if (pillarW > 0 && pillarD > 0) {
                        const corners = [
                            [-(w/2 - pillarW/2), -(d/2 - pillarD/2)],
                            [(w/2 - pillarW/2), -(d/2 - pillarD/2)],
                            [-(w/2 - pillarW/2), (d/2 - pillarD/2)],
                            [(w/2 - pillarW/2), (d/2 - pillarD/2)]
                        ];
                        corners.forEach(([px, pz]) => {
                            const pillar = mkMass(pillarW, tunnelH, pillarD);
                            pillar.position.set(px, tunnelBot + tunnelH/2, pz);
                            g.add(pillar);
                        });
                    }

                    // Top section (full footprint)
                    const topHeight = h - tunnelTop;
                    if (topHeight > 0) {
                        const top = mkMass(w, topHeight, d);
                        top.position.y = tunnelTop + topHeight / 2;
                        g.add(top);
                    }

                    // Add dark cross-shaped tunnel interior
                    const tunnelMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
                    const interiorZ = new THREE.Mesh(new THREE.BoxGeometry(tunnelW - 0.2, tunnelH - 0.2, d + 0.1), tunnelMat);
                    interiorZ.position.y = tunnelBot + tunnelH/2;
                    g.add(interiorZ);
                    const interiorX = new THREE.Mesh(new THREE.BoxGeometry(w + 0.1, tunnelH - 0.2, tunnelW - 0.2), tunnelMat);
                    interiorX.position.y = tunnelBot + tunnelH/2;
                    g.add(interiorX);
                } else if (tunnelInfo.direction === 'z') {
                    // Tunnel runs through building in Z direction
                    // Bottom section (ground to tunnel bottom)
                    if (tunnelBot > 0) {
                        const bottom = mkMass(w, tunnelBot, d);
                        bottom.position.y = tunnelBot / 2;
                        g.add(bottom);
                    }

                    // Left pillar (tunnel height section, left of tunnel)
                    const pillarWidth = (w - tunnelW) / 2;
                    if (pillarWidth > 0) {
                        const leftPillar = mkMass(pillarWidth, tunnelH, d);
                        leftPillar.position.set(-(w/2 - pillarWidth/2), tunnelBot + tunnelH/2, 0);
                        g.add(leftPillar);

                        const rightPillar = mkMass(pillarWidth, tunnelH, d);
                        rightPillar.position.set(w/2 - pillarWidth/2, tunnelBot + tunnelH/2, 0);
                        g.add(rightPillar);
                    }

                    // Top section (tunnel top to building height)
                    const topHeight = h - tunnelTop;
                    if (topHeight > 0) {
                        const top = mkMass(w, topHeight, d);
                        top.position.y = tunnelTop + topHeight / 2;
                        g.add(top);
                    }
                } else if (tunnelInfo.direction === 'x') {
                    // Tunnel runs through building in X direction
                    // Bottom section
                    if (tunnelBot > 0) {
                        const bottom = mkMass(w, tunnelBot, d);
                        bottom.position.y = tunnelBot / 2;
                        g.add(bottom);
                    }

                    // Front and back pillars
                    const pillarDepth = (d - tunnelW) / 2;
                    if (pillarDepth > 0) {
                        const frontPillar = mkMass(w, tunnelH, pillarDepth);
                        frontPillar.position.set(0, tunnelBot + tunnelH/2, d/2 - pillarDepth/2);
                        g.add(frontPillar);

                        const backPillar = mkMass(w, tunnelH, pillarDepth);
                        backPillar.position.set(0, tunnelBot + tunnelH/2, -(d/2 - pillarDepth/2));
                        g.add(backPillar);
                    }

                    // Top section
                    const topHeight = h - tunnelTop;
                    if (topHeight > 0) {
                        const top = mkMass(w, topHeight, d);
                        top.position.y = tunnelTop + topHeight / 2;
                        g.add(top);
                    }
                }

                // Add dark tunnel interior for visual depth (skip 'both' - already handled above)
                if (tunnelInfo.direction !== 'both') {
                    const tunnelMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
                    if (tunnelInfo.direction === 'z') {
                        const tunnelInterior = new THREE.Mesh(new THREE.BoxGeometry(tunnelW - 0.2, tunnelH - 0.2, d + 0.1), tunnelMat);
                        tunnelInterior.position.y = tunnelBot + tunnelH/2;
                        g.add(tunnelInterior);
                    } else {
                        const tunnelInterior = new THREE.Mesh(new THREE.BoxGeometry(w + 0.1, tunnelH - 0.2, tunnelW - 0.2), tunnelMat);
                        tunnelInterior.position.y = tunnelBot + tunnelH/2;
                        g.add(tunnelInterior);
                    }
                }
            } else if (h > PLINTH_H + 4) {
                // Base + shaft + belt course. A single extrusion from pavement to roof
                // is the thing that makes procedural cities read as programmer art:
                // real streets have a heavier stone storey the shops sit in.
                const plinth = new THREE.Mesh(
                    new THREE.BoxGeometry(w, PLINTH_H, d),
                    new THREE.MeshStandardMaterial({
                        color: PLINTH_TONES[Math.floor(Math.random() * PLINTH_TONES.length)],
                        roughness: 0.85,
                        map: tiledTex(TEX.facadeCement, w / 2.2, PLINTH_H / 2.2)
                    })
                );
                plinth.position.y = PLINTH_H / 2;
                plinth.castShadow = true;
                plinth.receiveShadow = true;
                plinth.userData.facade = true;
                g.add(plinth);

                const shaft = mkMass(w, h - PLINTH_H, d);
                shaft.position.y = PLINTH_H + (h - PLINTH_H) / 2;
                g.add(shaft);

                // String course: the shadow line where the base meets the shaft
                const belt = new THREE.Mesh(new THREE.BoxGeometry(w + 0.26, 0.22, d + 0.26), COPING_MAT);
                belt.position.y = PLINTH_H;
                belt.castShadow = true;
                g.add(belt);
            } else {
                const m = mkMass(w, h, d);
                m.position.y = h / 2;
                g.add(m);
            }

            g.userData.roofClutter = mkRoofKit(g, w, h, d, true);

            // Add entrance doors (1-2 per building)
            const numEntrances = 1 + Math.floor(Math.random() * 2);
            const sides = [0, 1, 2, 3].sort(() => Math.random() - 0.5).slice(0, numEntrances);
            g.userData.entrances = [];
            
            sides.forEach(side => {
                const doorMat = new THREE.MeshStandardMaterial({ color: 0x553322 });
                const door = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.5, 0.1), doorMat);
                const frameMat = new THREE.MeshStandardMaterial({ color: 0x444444 });
                const frame = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2.8, 0.05), frameMat);
                
                let entrancePos = { x: 0, z: 0, side: side };
                
                if (side === 0) { // Front (positive Z)
                    door.position.set(0, 1.25, d/2 + 0.05);
                    frame.position.set(0, 1.4, d/2 + 0.02);
                    entrancePos.localX = 0;
                    entrancePos.localZ = d/2 + 0.5;
                } else if (side === 1) { // Back (negative Z)
                    door.position.set(0, 1.25, -d/2 - 0.05);
                    door.rotation.y = Math.PI;
                    frame.position.set(0, 1.4, -d/2 - 0.02);
                    entrancePos.localX = 0;
                    entrancePos.localZ = -d/2 - 0.5;
                } else if (side === 2) { // Right (positive X)
                    door.position.set(w/2 + 0.05, 1.25, 0);
                    door.rotation.y = Math.PI / 2;
                    frame.position.set(w/2 + 0.02, 1.4, 0);
                    frame.rotation.y = Math.PI / 2;
                    entrancePos.localX = w/2 + 0.5;
                    entrancePos.localZ = 0;
                } else { // Left (negative X)
                    door.position.set(-w/2 - 0.05, 1.25, 0);
                    door.rotation.y = -Math.PI / 2;
                    frame.position.set(-w/2 - 0.02, 1.4, 0);
                    frame.rotation.y = Math.PI / 2;
                    entrancePos.localX = -w/2 - 0.5;
                    entrancePos.localZ = 0;
                }
                
                g.add(door);
                g.add(frame);
                g.userData.entrances.push(entrancePos);
            });

            mkStorefronts(g, w, d, sides, skipSides);

            // Walls occlude shop tooltips: any facade mesh joins the ray targets without shop data
            g.traverse(o => { if (o.isMesh && o.userData.facade) shopHitMeshes.push(o); });

            // Windows start above the stone base and stop short of the cornice
            const rows = Math.max(1, Math.floor((h - PLINTH_H - 1.6) / 3.5));
            const colsW = Math.max(1, Math.floor(w / 1.75));
            const colsD = Math.max(1, Math.floor(d / 1.75));

            // Per-building window identity: one mullion style + pane size for the whole facade
            const bStyle = {
                style: WIN_STYLES[Math.floor(Math.random() * WIN_STYLES.length)],
                sx: 0.85 + Math.random() * 0.4,
                sy: 0.9 + Math.random() * 0.4
            };
            const hasBalconies = Math.random() < 0.3;

            for (let r = 0; r < rows; r++) {
                const yWin = PLINTH_H + 1.75 + r * 3.5;
                for (let c = 0; c < colsW; c++) {
                    const xPos = colsW > 1 ? -w/2 + 0.85 + c * ((w - 1.7) / (colsW - 1)) : 0;

                    // Front/back faces: some slots become balcony sliding doors (not ground floor)
                    [[d/2, 0], [-d/2, Math.PI]].forEach(([zFace, rotY]) => {
                        const zSign = zFace > 0 ? 1 : -1;
                        if (hasBalconies && r >= 1 && Math.random() < 0.22) {
                            const door = mkWindowMesh(bStyle, true);
                            door.position.set(xPos, yWin - 0.45, zFace + zSign * 0.01);
                            door.rotation.y = rotY;
                            g.add(door);
                            mkBalcony(g, xPos, yWin - 1.6, zFace + zSign * 0.02, rotY);
                            maybeAddFigure(g, door);
                        } else {
                            const win = mkWindowMesh(bStyle);
                            win.position.set(xPos, yWin, zFace + zSign * 0.01);
                            win.rotation.y = rotY;
                            g.add(win);
                            maybeAddFigure(g, win);
                        }
                    });
                }

                for (let c = 0; c < colsD; c++) {
                    const zPos = colsD > 1 ? -d/2 + 0.85 + c * ((d - 1.7) / (colsD - 1)) : 0;

                    const wr = mkWindowMesh(bStyle);
                    wr.position.set(w/2 + 0.01, yWin, zPos);
                    wr.rotation.y = Math.PI / 2;
                    g.add(wr);
                    maybeAddFigure(g, wr);

                    const wl = mkWindowMesh(bStyle);
                    wl.position.set(-w/2 - 0.01, yWin, zPos);
                    wl.rotation.y = -Math.PI / 2;
                    g.add(wl);
                    maybeAddFigure(g, wl);
                }
            }
            
            if (h > 40) {
                const antenna = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.12, 0.12, 8),
                    new THREE.MeshStandardMaterial({ color: 0x666666 })
                );
                antenna.position.y = h + 4;
                g.add(antenna);
            }

            // Add rooftop features to some buildings
            // ~20% of tall buildings (h > 25) get gardens
            if (h > 25 && Math.random() < 0.20) {
                const garden = mkRooftopGarden(w, d, h);
                g.add(garden);
                g.userData.hasRooftopFeature = true;
                g.userData.rooftopType = 'garden';
                if (g.userData.roofClutter) g.userData.roofClutter.visible = false;
            }
            // ~10% of remaining buildings get pools (only if no garden, and h > 20)
            else if (h > 20 && Math.random() < 0.10) {
                const pool = mkRooftopPool(w, d, h);
                g.add(pool);
                g.userData.hasRooftopFeature = true;
                g.userData.rooftopType = 'pool';
                if (g.userData.roofClutter) g.userData.roofClutter.visible = false;
            }

            return g;
        }

        // Create a rooftop garden with grass, planters, and shrubs
        function mkRooftopGarden(w, d, h) {
            const g = new THREE.Group();
            g.position.y = h;

            // Green grass patch - slightly smaller than roof
            const grassMat = new THREE.MeshStandardMaterial({ color: 0x4a7c4e, roughness: 0.9 });
            grassMat.polygonOffset = true; grassMat.polygonOffsetFactor = -2; grassMat.polygonOffsetUnits = -4;
            const grass = new THREE.Mesh(new THREE.PlaneGeometry(w - 1, d - 1), grassMat);
            grass.rotation.x = -Math.PI / 2;
            grass.position.y = 0.05;   // 1cm above a roof 80m up is inside depth precision
            grass.receiveShadow = true;
            g.add(grass);

            // Add 2-4 planter boxes on edges
            const numPlanters = 2 + Math.floor(Math.random() * 3);
            const planterMat = new THREE.MeshStandardMaterial({ color: 0x8b4513, roughness: 0.8 });
            const shrubMat = new THREE.MeshStandardMaterial({ color: 0x2d5a2d, roughness: 0.9 });

            for (let i = 0; i < numPlanters; i++) {
                const planter = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.4, 0.8), planterMat);
                planter.castShadow = true;
                planter.receiveShadow = true;

                // Position on edges with some randomness
                const edge = Math.floor(Math.random() * 4);
                const offset = (Math.random() - 0.5) * 0.6;
                if (edge === 0) planter.position.set(offset * (w - 2), 0.2, (d - 2) / 2 * 0.8);
                else if (edge === 1) planter.position.set(offset * (w - 2), 0.2, -(d - 2) / 2 * 0.8);
                else if (edge === 2) planter.position.set((w - 2) / 2 * 0.8, 0.2, offset * (d - 2));
                else planter.position.set(-(w - 2) / 2 * 0.8, 0.2, offset * (d - 2));

                g.add(planter);

                // Add shrub on top of some planters (1-3 shrubs total)
                if (i < 1 + Math.floor(Math.random() * 3)) {
                    const shrub = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), shrubMat);
                    shrub.position.copy(planter.position);
                    shrub.position.y = 0.55;
                    shrub.castShadow = true;
                    g.add(shrub);
                }
            }

            return g;
        }

        // Create a rooftop pool with water, rim, and loungers
        function mkRooftopPool(w, d, h) {
            const g = new THREE.Group();
            g.position.y = h;

            // Pool basin (recessed slightly)
            const poolW = w * 0.6;
            const poolD = d * 0.4;
            const basinMat = new THREE.MeshStandardMaterial({ color: 0x1a5276, roughness: 0.5 });
            const basin = new THREE.Mesh(new THREE.BoxGeometry(poolW, 0.3, poolD), basinMat);
            basin.position.y = -0.1;
            basin.castShadow = true;
            basin.receiveShadow = true;
            g.add(basin);

            // Water surface - bright blue with transparency
            const waterMat = new THREE.MeshStandardMaterial({
                color: 0x4fc3f7,
                roughness: 0.1,
                metalness: 0.3,
                opacity: 0.8,
                transparent: true
            });
            const water = new THREE.Mesh(new THREE.PlaneGeometry(poolW - 0.1, poolD - 0.1), waterMat);
            water.rotation.x = -Math.PI / 2;
            water.position.y = 0.05;
            g.add(water);

            // Pool edge/rim - white border
            const rimMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.6 });
            const rimThickness = 0.15;

            // Front and back rims
            const rimFront = new THREE.Mesh(new THREE.BoxGeometry(poolW + rimThickness * 2, 0.1, rimThickness), rimMat);
            rimFront.position.set(0, 0.05, poolD / 2 + rimThickness / 2);
            rimFront.castShadow = true;
            g.add(rimFront);

            const rimBack = new THREE.Mesh(new THREE.BoxGeometry(poolW + rimThickness * 2, 0.1, rimThickness), rimMat);
            rimBack.position.set(0, 0.05, -poolD / 2 - rimThickness / 2);
            rimBack.castShadow = true;
            g.add(rimBack);

            // Left and right rims
            const rimLeft = new THREE.Mesh(new THREE.BoxGeometry(rimThickness, 0.1, poolD), rimMat);
            rimLeft.position.set(-poolW / 2 - rimThickness / 2, 0.05, 0);
            rimLeft.castShadow = true;
            g.add(rimLeft);

            const rimRight = new THREE.Mesh(new THREE.BoxGeometry(rimThickness, 0.1, poolD), rimMat);
            rimRight.position.set(poolW / 2 + rimThickness / 2, 0.05, 0);
            rimRight.castShadow = true;
            g.add(rimRight);

            // Add 2 pool loungers
            const loungerMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.7 });
            for (let i = 0; i < 2; i++) {
                const lounger = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.1, 1.5), loungerMat);
                lounger.position.set(
                    (i === 0 ? -1 : 1) * (poolW / 2 + 0.8),
                    0.05,
                    (Math.random() - 0.5) * (poolD * 0.5)
                );
                lounger.castShadow = true;
                lounger.receiveShadow = true;
                g.add(lounger);
            }

            // A swimmer doing laps: prone body, flutter-kicking feet, gentle bob
            const swimmer = new THREE.Group();
            const skin = new THREE.MeshStandardMaterial({ color: 0xe0ac69, roughness: 0.6 });
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.09, 0.22), skin);
            torso.position.y = 0.05;
            swimmer.add(torso);
            const suit = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.1, 0.23), new THREE.MeshStandardMaterial({ color: 0xd81b60, roughness: 0.6 }));
            suit.position.set(-0.08, 0.05, 0);
            swimmer.add(suit);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), skin);
            head.position.set(0.32, 0.07, 0);
            swimmer.add(head);
            const feet = [];
            [-0.06, 0.06].forEach(fz => {
                const foot = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), skin);
                foot.position.set(-0.32, 0.04, fz);
                swimmer.add(foot);
                feet.push(foot);
            });
            swimmer.position.y = 0.06;
            g.add(swimmer);
            poolSwimmers.push({ s: swimmer, feet, range: Math.max(0.5, poolW / 2 - 0.7), phase: Math.random() * Math.PI * 2 });

            return g;
        }

        // ---- Rooftop bars: one lush garden bar, one techno club (placed in mkBuildings) ----
        const poolSwimmers = [];
        const rooftopBars = [];

        function mkRooftopBar(w, d, h, style) {
            const g = new THREE.Group();
            g.position.y = h;
            const bar = { g, style, tiles: [], lights: [], laser: null };
            const lush = style === 'lush';

            const deck = new THREE.Mesh(new THREE.PlaneGeometry(w - 0.8, d - 0.8),
                new THREE.MeshStandardMaterial({ color: lush ? 0x8a6f4d : 0x2a2d34, roughness: 0.9 }));
            deck.rotation.x = -Math.PI / 2;
            deck.position.y = 0.02;
            deck.receiveShadow = true;
            g.add(deck);

            // bar counter along the north edge, bottle shelf glowing behind
            const counter = new THREE.Mesh(new THREE.BoxGeometry(Math.min(w - 3, 5), 1.1, 0.7),
                new THREE.MeshStandardMaterial({ color: lush ? 0x6d4c41 : 0x1c1f26, roughness: 0.5 }));
            counter.position.set(0, 0.55, -d / 2 + 1.5);
            counter.castShadow = true;
            g.add(counter);
            for (let i = 0; i < 6; i++) {
                const bottle = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.28, 6),
                    new THREE.MeshBasicMaterial({ color: [0x66ddaa, 0xffcc55, 0xff6688, 0x88aaff, 0xccff66, 0xff9944][i] }));
                bottle.position.set(-1.25 + i * 0.5, 1.24, -d / 2 + 1.1);
                g.add(bottle);
            }
            for (let i = 0; i < 3; i++) {
                const stool = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.55, 8),
                    new THREE.MeshStandardMaterial({ color: 0x555a60, roughness: 0.5, metalness: 0.5 }));
                stool.position.set(-1 + i, 0.28, -d / 2 + 2.3);
                g.add(stool);
            }

            // string lights around the parapet — animated in updRooftopBars
            for (let i = 0; i < 10; i++) {
                const a = (i / 10) * Math.PI * 2;
                const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6),
                    new THREE.MeshBasicMaterial({ color: lush ? 0xffd27a : 0xff44cc }));
                bulb.position.set(Math.cos(a) * (w / 2 - 0.7), 1.6 + Math.sin(a * 3) * 0.1, Math.sin(a) * (d / 2 - 0.7));
                g.add(bulb);
                bar.lights.push(bulb);
            }

            if (lush) {
                // planters, potted jungle, two mini palms, pergola over the counter
                const leafMat = new THREE.MeshStandardMaterial({ color: 0x2d6a35, roughness: 0.9 });
                const potMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.8 });
                for (let i = 0; i < 8; i++) {
                    const a = (i / 8) * Math.PI * 2 + 0.4;
                    const px = Math.cos(a) * (w / 2 - 1.2), pz = Math.sin(a) * (d / 2 - 1.2);
                    const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.2, 0.35, 8), potMat);
                    pot.position.set(px, 0.18, pz);
                    g.add(pot);
                    const bush = new THREE.Mesh(new THREE.SphereGeometry(0.34 + Math.random() * 0.15, 7, 7), leafMat);
                    bush.position.set(px, 0.62, pz);
                    bush.scale.y = 0.8 + Math.random() * 0.5;
                    g.add(bush);
                }
                [[-w / 4, d / 4], [w / 4, -d / 6]].forEach(([px, pz]) => {
                    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.09, 1.4, 6),
                        new THREE.MeshStandardMaterial({ color: 0x7a5c3e, roughness: 0.9 }));
                    trunk.position.set(px, 0.7, pz);
                    g.add(trunk);
                    for (let f = 0; f < 5; f++) {
                        const frond = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.03, 0.2), leafMat);
                        frond.position.set(px + Math.cos(f * 1.26) * 0.4, 1.45, pz + Math.sin(f * 1.26) * 0.4);
                        frond.rotation.y = -f * 1.26;
                        frond.rotation.z = 0.35;
                        g.add(frond);
                    }
                });
                const wood = new THREE.MeshStandardMaterial({ color: 0x6d4c41, roughness: 0.8 });
                [[-2.2, -d / 2 + 0.9], [2.2, -d / 2 + 0.9], [-2.2, -d / 2 + 2.7], [2.2, -d / 2 + 2.7]].forEach(([px, pz]) => {
                    const post = new THREE.Mesh(new THREE.BoxGeometry(0.12, 2.2, 0.12), wood);
                    post.position.set(px, 1.1, pz);
                    g.add(post);
                });
                for (let s = 0; s < 5; s++) {
                    const slat = new THREE.Mesh(new THREE.BoxGeometry(4.8, 0.05, 0.14), wood);
                    slat.position.set(0, 2.24, -d / 2 + 0.8 + s * 0.5);
                    g.add(slat);
                }
            } else {
                // techno: pulsing dance floor, DJ booth with decks, speaker stacks, laser
                // (3×3 floor so it fits the smallest qualifying roofs)
                for (let tx = 0; tx < 3; tx++) {
                    for (let tz = 0; tz < 3; tz++) {
                        const tile = new THREE.Mesh(new THREE.PlaneGeometry(0.92, 0.92),
                            new THREE.MeshBasicMaterial({ color: 0x220033 }));
                        tile.rotation.x = -Math.PI / 2;
                        tile.position.set(tx - 1, 0.03, tz - 1 - 0.2);
                        g.add(tile);
                        bar.tiles.push(tile);
                    }
                }
                const booth = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 0.7),
                    new THREE.MeshStandardMaterial({ color: 0x14161c, roughness: 0.4 }));
                booth.position.set(0, 0.5, d / 2 - 1.3);
                g.add(booth);
                [-0.45, 0.45].forEach(dx => {
                    const deckPlate = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.06, 12),
                        new THREE.MeshStandardMaterial({ color: 0x888e96, metalness: 0.7, roughness: 0.3 }));
                    deckPlate.position.set(dx, 1.05, d / 2 - 1.3);
                    g.add(deckPlate);
                });
                [[-1.6, d / 2 - 1.2], [1.6, d / 2 - 1.2]].forEach(([px, pz]) => {
                    const spk = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.5, 0.6),
                        new THREE.MeshStandardMaterial({ color: 0x101216, roughness: 0.6 }));
                    spk.position.set(px, 0.75, pz);
                    spk.castShadow = true;
                    g.add(spk);
                    const cone = new THREE.Mesh(new THREE.CircleGeometry(0.18, 10),
                        new THREE.MeshBasicMaterial({ color: 0x30343c }));
                    cone.position.set(px, 0.9, pz - 0.31);
                    cone.rotation.y = Math.PI;
                    g.add(cone);
                });
                const laser = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 7),
                    new THREE.MeshBasicMaterial({ color: 0xff00cc }));
                laser.position.set(0, 2.2, 0);
                g.add(laser);
                bar.laser = laser;
            }

            rooftopBars.push(bar);
            return g;
        }

        // Techno tiles/lights strobe through hues; lush string lights breathe warm
        function updRooftopBars(t) {
            for (const bar of rooftopBars) {
                if (bar.style === 'techno') {
                    bar.tiles.forEach((tile, i) => {
                        if ((Math.floor(t * 5) + i) % 3 === 0) tile.material.color.setHSL((t * 0.45 + i * 0.09) % 1, 0.95, 0.5);
                    });
                    bar.lights.forEach((l, i) => l.material.color.setHSL((t * 0.7 + i * 0.23) % 1, 1, 0.6));
                    if (bar.laser) {
                        bar.laser.rotation.y = t * 2.4;
                        bar.laser.rotation.x = 0.25 + Math.sin(t * 1.6) * 0.22;
                    }
                } else {
                    bar.lights.forEach((l, i) => {
                        const f = 0.8 + 0.2 * Math.sin(t * 2.2 + i * 1.7);
                        l.material.color.setRGB(f, 0.8 * f, 0.42 * f);
                    });
                }
            }
        }

        function updPoolSwimmers(t) {
            for (const ps of poolSwimmers) {
                const u = Math.sin(t * 0.55 + ps.phase);
                ps.s.position.x = u * ps.range;
                ps.s.rotation.y = Math.cos(t * 0.55 + ps.phase) >= 0 ? 0 : Math.PI; // face swim direction
                ps.s.position.y = 0.06 + Math.sin(t * 3.1 + ps.phase) * 0.015;      // gentle bob
                ps.s.rotation.z = Math.sin(t * 2.2 + ps.phase) * 0.08;              // body roll
                ps.feet.forEach((f, i) => { f.position.y = 0.05 + Math.sin(t * 9 + i * Math.PI) * 0.04; });
            }
        }

        // Create a tiny rooftop figure (person visible from above)
        function mkRooftopFigure() {
            const g = new THREE.Group();

            // Very small person visible from above (scale ~0.3)
            // Body
            const body = new THREE.Mesh(
                new THREE.CylinderGeometry(0.06, 0.08, 0.25, 6),
                new THREE.MeshStandardMaterial({
                    color: [0xff6b6b, 0x4ecdc4, 0xffe66d, 0x95e1d3, 0xf38181][Math.floor(Math.random() * 5)]
                })
            );
            body.position.y = 0.15;
            body.castShadow = true;
            g.add(body);

            // Head
            const head = new THREE.Mesh(
                new THREE.SphereGeometry(0.05, 6, 6),
                new THREE.MeshStandardMaterial({ color: 0xffcc99 })
            );
            head.position.y = 0.32;
            g.add(head);

            // Simple animation data
            g.userData.baseY = 0;
            g.userData.wanderAngle = Math.random() * Math.PI * 2;
            g.userData.wanderSpeed = 0.01 + Math.random() * 0.02;
            g.userData.wanderRadius = 0.5 + Math.random() * 1;
            g.userData.phase = Math.random() * Math.PI * 2;

            return g;
        }

        // Create a rooftop party with string lights and figures
        function mkRooftopParty(building, x, z, h, w, d) {
            const party = new THREE.Group();
            party.position.set(x, h + 0.1, z);

            // String lights - create a perimeter of small glowing spheres
            const lightMat = new THREE.MeshBasicMaterial({ color: 0xffee88 });
            const stringLights = [];
            const numLights = 12;

            for (let i = 0; i < numLights; i++) {
                const angle = (i / numLights) * Math.PI * 2;
                const radius = Math.min(w, d) * 0.35;
                const lx = Math.cos(angle) * radius;
                const lz = Math.sin(angle) * radius;

                const light = new THREE.Mesh(
                    new THREE.SphereGeometry(0.08, 6, 6),
                    lightMat.clone()
                );
                light.position.set(lx, 0.3, lz);
                light.userData.baseIntensity = 1;
                light.userData.phase = Math.random() * Math.PI * 2;
                stringLights.push(light);
                party.add(light);
            }

            // Add connecting wire between lights (thin dark line)
            const wireMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
            for (let i = 0; i < numLights; i++) {
                const next = (i + 1) % numLights;
                const l1 = stringLights[i];
                const l2 = stringLights[next];

                const wire = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.01, 0.01, 0.5, 4),
                    wireMat
                );
                wire.position.set(
                    (l1.position.x + l2.position.x) / 2,
                    0.3,
                    (l1.position.z + l2.position.z) / 2
                );
                wire.rotation.z = Math.PI / 2;
                wire.rotation.y = Math.atan2(
                    l2.position.z - l1.position.z,
                    l2.position.x - l1.position.x
                );
                party.add(wire);
            }

            // Add party figures
            const numFigures = ROOFTOP_CFG.figuresPerParty[0] +
                Math.floor(Math.random() * (ROOFTOP_CFG.figuresPerParty[1] - ROOFTOP_CFG.figuresPerParty[0]));

            const figures = [];
            for (let i = 0; i < numFigures; i++) {
                const fig = mkRooftopFigure();
                const fx = (Math.random() - 0.5) * w * 0.6;
                const fz = (Math.random() - 0.5) * d * 0.6;
                fig.position.set(fx, 0, fz);
                fig.userData.baseX = fx;
                fig.userData.baseZ = fz;
                party.add(fig);
                figures.push(fig);
            }

            party.userData.stringLights = stringLights;
            party.userData.figures = figures;
            party.userData.spawnTime = clock.getElapsedTime();
            party.userData.duration = ROOFTOP_CFG.partyDuration[0] +
                Math.random() * (ROOFTOP_CFG.partyDuration[1] - ROOFTOP_CFG.partyDuration[0]);
            party.userData.building = building;

            return party;
        }

        // Spawn a rooftop party on a suitable building
        function spawnRooftopParty() {
            if (rooftopParties.length >= ROOFTOP_CFG.maxParties) return;

            // Prefer buildings with existing features, but can use any tall building
            let candidates = activeRooftops.filter(r =>
                !rooftopParties.some(p => p.userData.building === r.building)
            );

            // If no active rooftops available, use tall buildings without parties
            if (candidates.length === 0) {
                candidates = buildings
                    .filter(b => b.userData.height > 30)
                    .filter(b => !rooftopParties.some(p => p.userData.building === b))
                    .map(b => ({
                        building: b,
                        x: b.position.x,
                        z: b.position.z,
                        height: b.userData.height,
                        width: b.userData.width,
                        depth: b.userData.depth
                    }));
            }

            if (candidates.length === 0) return;

            const target = candidates[Math.floor(Math.random() * candidates.length)];
            const party = mkRooftopParty(
                target.building,
                target.x,
                target.z,
                target.height,
                target.width,
                target.depth
            );

            rooftopParties.push(party);
            scene.add(party);
        }

        // Update rooftop parties - spawn, animate, despawn
        function updRooftopParties(t) {
            // Check for party spawn
            if (t - lastPartySpawn > ROOFTOP_CFG.partySpawnInterval) {
                lastPartySpawn = t;
                if (Math.random() < ROOFTOP_CFG.partySpawnChance) {
                    spawnRooftopParty();
                }
            }

            // Update existing parties
            for (let i = rooftopParties.length - 1; i >= 0; i--) {
                const party = rooftopParties[i];
                const elapsed = t - party.userData.spawnTime;

                // Check if party should end
                if (elapsed > party.userData.duration) {
                    scene.remove(party);
                    rooftopParties.splice(i, 1);
                    continue;
                }

                // Animate string lights (gentle twinkling)
                party.userData.stringLights.forEach((light, idx) => {
                    const twinkle = 0.7 + 0.3 * Math.sin(t * 3 + light.userData.phase);
                    light.material.color.setHex(
                        twinkle > 0.85 ? 0xffffaa : 0xffee88
                    );
                });

                // Animate figures (subtle wandering)
                party.userData.figures.forEach(fig => {
                    const wanderX = Math.sin(t * fig.userData.wanderSpeed + fig.userData.phase) * fig.userData.wanderRadius;
                    const wanderZ = Math.cos(t * fig.userData.wanderSpeed * 1.3 + fig.userData.phase) * fig.userData.wanderRadius;
                    fig.position.x = fig.userData.baseX + wanderX * 0.3;
                    fig.position.z = fig.userData.baseZ + wanderZ * 0.3;
                    // Face movement direction
                    fig.rotation.y = Math.atan2(wanderX, wanderZ);
                });
            }
        }

        // Update static rooftop figures on gardens and pools
        function updRooftopFigures(t) {
            rooftopFigures.forEach(fig => {
                // Gentle wandering animation
                const wanderX = Math.sin(t * fig.userData.wanderSpeed + fig.userData.phase) * fig.userData.wanderRadius;
                const wanderZ = Math.cos(t * fig.userData.wanderSpeed * 1.1 + fig.userData.phase) * fig.userData.wanderRadius;
                fig.position.x = fig.userData.baseX + wanderX;
                fig.position.z = fig.userData.baseZ + wanderZ;
                fig.rotation.y = Math.atan2(wanderX, wanderZ);
            });
        }
