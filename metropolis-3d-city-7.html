                new THREE.BoxGeometry(moatWidth, 0.5, 60),
                moatMat
            );
            moatRight.position.set(52.5, 0.25, 0);
            castle.add(moatRight);

            // 2. Main castle body (scaled up 2.5x)
            const mainBody = new THREE.Mesh(
                new THREE.BoxGeometry(90, 40, 45),
                stoneMat
            );
            mainBody.position.set(0, 4 + 20, 0);
            mainBody.castShadow = true;
            mainBody.receiveShadow = true;
            castle.add(mainBody);

            // Add illuminated windows to main castle body (all 4 faces)
            addHotelWindowsAllSides(mainBody, 85, 35, 40, 0xffffaa);

            // 3. Battlements (crenellated top) - scaled up
            const battlementMat = stoneMat.clone();
            for (let i = 0; i < 15; i++) {
                const battlement = new THREE.Mesh(
                    new THREE.BoxGeometry(2.5, 5, 2.5),
                    battlementMat
                );
                battlement.position.set(-40 + i * 5.5, 4 + 40 + 2.5, 23); // Front edge
                battlement.castShadow = true;
                castle.add(battlement);
            }
            // Back edge battlements
            for (let i = 0; i < 15; i++) {
                const battlement = new THREE.Mesh(
                    new THREE.BoxGeometry(2.5, 5, 2.5),
                    battlementMat
                );
                battlement.position.set(-40 + i * 5.5, 4 + 40 + 2.5, -23);
                battlement.castShadow = true;
                castle.add(battlement);
            }

            // 4. Entry gate (scaled up 2.5x)
            const gate = new THREE.Mesh(
                new THREE.BoxGeometry(15, 20, 1),
                gateMat
            );
            gate.position.set(0, 4 + 10, 23);
            castle.add(gate);

            // 5. Corner turrets (4 total) with conical tops (scaled up 2.5x)
            const turretPositions = [
                { x: -45, z: 22.5, color: redTurret },   // Front-left: red
                { x: 45, z: 22.5, color: blueTurret },   // Front-right: blue
                { x: -45, z: -22.5, color: blueTurret }, // Back-left: blue
                { x: 45, z: -22.5, color: redTurret }    // Back-right: red
            ];

            turretPositions.forEach(tp => {
                const turretMat = new THREE.MeshStandardMaterial({
                    color: tp.color,
                    roughness: 0.6,
                    metalness: 0.2
                });

                // Turret cylinder (scaled up)
                const turret = new THREE.Mesh(
                    new THREE.CylinderGeometry(6, 6, 30, 16),
                    turretMat
                );
                turret.position.set(tp.x, 4 + 15, tp.z);
                turret.castShadow = true;
                castle.add(turret);

                // Conical roof (scaled up)
                const cone = new THREE.Mesh(
                    new THREE.ConeGeometry(8, 12, 16),
                    turretMat
                );
                cone.position.set(tp.x, 4 + 30 + 6, tp.z);
                cone.castShadow = true;
                castle.add(cone);

                // Flag hint (scaled up)
                const flagMat = new THREE.MeshStandardMaterial({ color: tp.color });
                const flag = new THREE.Mesh(
                    new THREE.BoxGeometry(0.25, 7.5, 5),
                    flagMat
                );
                flag.position.set(tp.x, 4 + 30 + 12 + 4, tp.z + 2.5);
                castle.add(flag);
            });

            // 6. Central tower (taller, white with gold spire) - scaled up 2.5x
            const centralTower = new THREE.Mesh(
                new THREE.CylinderGeometry(7.5, 7.5, 50, 16),
                stoneMat
            );
            centralTower.position.set(0, 4 + 25, -12.5);
            centralTower.castShadow = true;
            castle.add(centralTower);

            // Gold spire on central tower (scaled up)
            const goldMat = new THREE.MeshStandardMaterial({
                color: goldSpire,
                metalness: 0.8,
                roughness: 0.3
            });
            const spire = new THREE.Mesh(
                new THREE.ConeGeometry(10, 15, 16),
                goldMat
            );
            spire.position.set(0, 4 + 50 + 7.5, -12.5);
            spire.castShadow = true;
            castle.add(spire);

            // Position on south side of Strip (positive Z), between Luxor and Bellagio
            const stripStartX = theStrip.userData.startX;
            const stripEndX = theStrip.userData.endX;
            const stripCenterZ = theStrip.userData.centerZ;
            const sidewalkWidth = theStrip.userData.sidewalkWidth;
            const stripWidth = theStrip.userData.width;
            const stripLength = stripEndX - stripStartX;

            castle.position.set(
                stripStartX + stripLength * 0.30, // Between Luxor and Bellagio
                0,
                stripCenterZ + stripWidth / 2 + sidewalkWidth + 90 // South side - well back from road
            );

            // Rotate to face Strip (entrance faces north toward road)
            castle.rotation.y = Math.PI;

            // Store userData for Phase 3 lighting
            castle.userData = {
                type: 'excalibur',
                hasTurrets: true
            };

            // Add to landmarks array
            vegasLandmarks.push(castle);

            scene.add(castle);
            return castle;
        }

        // Create tourist stores along the Vegas Strip
        function mkVegasTouristStores() {
            const stripStartX = theStrip.userData.startX;
            const stripEndX = theStrip.userData.endX;
            const stripCenterZ = theStrip.userData.centerZ;
            const sidewalkWidth = theStrip.userData.sidewalkWidth;
            const stripWidth = theStrip.userData.width;

            const storeTypes = [
                { name: 'SOUVENIRS', color: 0xff6600, roofColor: 0xcc4400 },
                { name: 'GIFTS', color: 0x33cc99, roofColor: 0x228866 },
                { name: 'T-SHIRTS', color: 0xff3366, roofColor: 0xcc2244 },
                { name: 'PHOTOS', color: 0x6666ff, roofColor: 0x4444cc },
                { name: 'SNACKS', color: 0xffcc00, roofColor: 0xcc9900 },
                { name: 'DRINKS', color: 0x00ccff, roofColor: 0x0099cc },
                { name: 'CASINO', color: 0xcc0000, roofColor: 0x990000 },
                { name: 'SLOTS', color: 0x9933ff, roofColor: 0x6622cc }
            ];

            // Place stores along both sides of the Strip (on the sidewalk area)
            const numStores = 16; // 8 per side
            const storeSpacing = (stripEndX - stripStartX - 40) / (numStores / 2);

            for (let i = 0; i < numStores; i++) {
                const side = i < numStores / 2 ? 1 : -1; // South then North
                const idx = i % (numStores / 2);
                const storeType = storeTypes[i % storeTypes.length];

                const store = new THREE.Group();

                // Store building (small box)
                const storeWidth = 6 + Math.random() * 2;
                const storeDepth = 5 + Math.random() * 2;
                const storeHeight = 4 + Math.random() * 2;

                const buildingMat = new THREE.MeshStandardMaterial({
                    color: storeType.color,
                    roughness: 0.7
                });
                const building = new THREE.Mesh(
                    new THREE.BoxGeometry(storeWidth, storeHeight, storeDepth),
                    buildingMat
                );
                building.position.y = storeHeight / 2;
                building.castShadow = true;
                store.add(building);

                // Roof (slightly larger, flat)
                const roofMat = new THREE.MeshStandardMaterial({ color: storeType.roofColor });
                const roof = new THREE.Mesh(
                    new THREE.BoxGeometry(storeWidth + 0.5, 0.3, storeDepth + 0.5),
                    roofMat
                );
                roof.position.y = storeHeight + 0.15;
                store.add(roof);

                // Store front windows (large glass)
                const glassMat = new THREE.MeshStandardMaterial({
                    color: 0x88ccff,
                    metalness: 0.9,
                    roughness: 0.1,
                    transparent: true,
                    opacity: 0.7
                });
                const windowFront = new THREE.Mesh(
                    new THREE.PlaneGeometry(storeWidth - 1, storeHeight - 1.5),
                    glassMat
                );
                windowFront.position.set(0, storeHeight / 2 + 0.3, storeDepth / 2 + 0.05);
                store.add(windowFront);

                // Awning over entrance
                const awningMat = new THREE.MeshStandardMaterial({ color: 0xcc0000 });
                const awning = new THREE.Mesh(
                    new THREE.BoxGeometry(storeWidth + 1, 0.15, 2),
                    awningMat
                );
                awning.position.set(0, storeHeight - 0.5, storeDepth / 2 + 1);
                store.add(awning);

                // Sign with store name
                const signMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
                const sign = new THREE.Mesh(
                    new THREE.BoxGeometry(storeWidth - 0.5, 0.8, 0.1),
                    signMat
                );
                sign.position.set(0, storeHeight + 0.6, storeDepth / 2 + 0.1);
                store.add(sign);

                // Position store along Strip
                const xPos = stripStartX + 25 + idx * storeSpacing;
                const zOffset = stripWidth / 2 + sidewalkWidth - 1; // On sidewalk edge
                store.position.set(xPos, 0, side * zOffset);

                // Rotate to face the road
                if (side === 1) {
                    store.rotation.y = Math.PI; // South side faces north (toward road)
                }
                // North side already faces south (toward road)

                scene.add(store);
            }
        }

        // Add illuminated windows to Vegas hotel buildings (front and back faces only)
        function addHotelWindows(building, width, height, depth, color = 0xffffcc) {
            const windowMat = new THREE.MeshStandardMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: 0.3
            });

            const windowSize = 0.8;
            const windowSpacing = 1.5; // Denser grid (was 2)

            // Front and back faces
            for (const zSide of [1, -1]) {
                const cols = Math.floor(width / windowSpacing) - 1;
                const rows = Math.floor(height / windowSpacing) - 1;

                for (let c = 0; c < cols; c++) {
                    for (let r = 0; r < rows; r++) {
                        if (Math.random() > 0.3) { // 70% windows lit
                            const win = new THREE.Mesh(
                                new THREE.PlaneGeometry(windowSize, windowSize),
                                windowMat.clone()
                            );
                            win.position.set(
                                -width/2 + windowSpacing + c * windowSpacing,
                                windowSpacing + r * windowSpacing,
                                zSide * depth/2 + zSide * 0.05
                            );
                            if (zSide < 0) win.rotation.y = Math.PI;
                            win.userData.isVegasWindow = true;
                            building.add(win);
                            vegasWindows.push(win);
                        }
                    }
                }
            }
        }

        // Add illuminated windows to all 4 faces of Vegas hotel buildings
        function addHotelWindowsAllSides(building, width, height, depth, color = 0xffffcc) {
            const windowMat = new THREE.MeshStandardMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: 0.5 // Brighter for Vegas
            });

            const windowSize = 2.0; // Large windows like Metropolis
            const windowSpacing = 3.5; // Spacing for visible grid pattern

            // BoxGeometry is centered, so offset y by -height/2 to start from bottom
            const yOffset = -height / 2;

            // Front and back faces (Z axis)
            for (const zSide of [1, -1]) {
                const cols = Math.floor(width / windowSpacing) - 2;
                const rows = Math.floor(height / windowSpacing) - 2;

                for (let c = 0; c < cols; c++) {
                    for (let r = 0; r < rows; r++) {
                        if (Math.random() > 0.25) { // 75% windows lit
                            const win = new THREE.Mesh(
                                new THREE.PlaneGeometry(windowSize, windowSize),
                                windowMat.clone()
                            );
                            win.position.set(
                                -width/2 + windowSpacing * 1.5 + c * windowSpacing,
                                yOffset + windowSpacing * 1.5 + r * windowSpacing,
                                zSide * depth/2 + zSide * 0.1
                            );
                            if (zSide < 0) win.rotation.y = Math.PI;
                            win.userData.isVegasWindow = true;
                            building.add(win);
                            vegasWindows.push(win);
                        }
                    }
                }
            }

            // Left and right faces (X axis)
            for (const xSide of [1, -1]) {
                const cols = Math.floor(depth / windowSpacing) - 2;
                const rows = Math.floor(height / windowSpacing) - 2;

                for (let c = 0; c < cols; c++) {
                    for (let r = 0; r < rows; r++) {
                        if (Math.random() > 0.25) { // 75% windows lit
                            const win = new THREE.Mesh(
                                new THREE.PlaneGeometry(windowSize, windowSize),
                                windowMat.clone()
                            );
                            win.position.set(
                                xSide * width/2 + xSide * 0.1,
                                yOffset + windowSpacing * 1.5 + r * windowSpacing,
                                -depth/2 + windowSpacing * 1.5 + c * windowSpacing
                            );
                            win.rotation.y = xSide > 0 ? Math.PI / 2 : -Math.PI / 2;
                            win.userData.isVegasWindow = true;
                            building.add(win);
                            vegasWindows.push(win);
                        }
                    }
                }
            }
        }

        // Update Vegas hotel windows with occasional flickering
        function updVegasWindows() {
            vegasWindows.forEach(win => {
                if (Math.random() < 0.001) { // Occasional flicker
                    const mat = win.material;
                    const lit = Math.random() > 0.3;
                    mat.emissiveIntensity = lit ? 0.3 + Math.random() * 0.2 : 0;
                }
            });
        }

        function mkStreetlights() {
            const poleHeight = 6;
            const armLength = 2;
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.8 });
            const bulbMat = new THREE.MeshBasicMaterial({ color: 0x222211 }); // Off by default

            // Place streetlights along all roads
            for (let i = 0; i <= GRID.gridCount; i++) {
                const roadPos = -halfSize + i * GRID.cellSize;

                // Horizontal roads (along X axis)
                for (let x = -halfSize + 8; x < halfSize - 4; x += 16) {
                    // Skip intersection areas
                    const nearIntersection = Array.from({length: GRID.gridCount + 1}, (_, j) =>
                        -halfSize + j * GRID.cellSize
                    ).some(iPos => Math.abs(x - iPos) < GRID.roadWidth);

                    if (!nearIntersection) {
                        // North side of road
                        mkStreetlight(x, roadPos - GRID.roadWidth/2 - 1, 0);
                        // South side of road
                        mkStreetlight(x, roadPos + GRID.roadWidth/2 + 1, Math.PI);
                    }
                }

                // Vertical roads (along Z axis)
                for (let z = -halfSize + 8; z < halfSize - 4; z += 16) {
                    const nearIntersection = Array.from({length: GRID.gridCount + 1}, (_, j) =>
                        -halfSize + j * GRID.cellSize
                    ).some(iPos => Math.abs(z - iPos) < GRID.roadWidth);

                    if (!nearIntersection) {
                        // East side of road
                        mkStreetlight(roadPos + GRID.roadWidth/2 + 1, z, -Math.PI/2);
                        // West side of road
                        mkStreetlight(roadPos - GRID.roadWidth/2 - 1, z, Math.PI/2);
                    }
                }
            }

            function mkStreetlight(x, z, rotation) {
                const g = new THREE.Group();

                // Pole
                const pole = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.12, 0.15, poleHeight, 8),
                    poleMat
                );
                pole.position.y = poleHeight / 2;
                g.add(pole);

                // Curved arm
                const arm = new THREE.Mesh(
                    new THREE.BoxGeometry(armLength, 0.1, 0.1),
                    poleMat
                );
                arm.position.set(armLength/2, poleHeight - 0.1, 0);
                g.add(arm);

                // Light housing
                const housing = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.3, 0.4, 0.3, 8),
                    poleMat
                );
                housing.position.set(armLength, poleHeight - 0.3, 0);
                g.add(housing);

                // Bulb (visual) - use emissive material instead of PointLight for performance
                const bulbMaterial = new THREE.MeshBasicMaterial({ color: 0x222211 });
                const bulb = new THREE.Mesh(
                    new THREE.SphereGeometry(0.25, 8, 8),
                    bulbMaterial
                );
                bulb.position.set(armLength, poleHeight - 0.5, 0);
                g.add(bulb);
                g.userData.bulb = bulb;
                // No PointLight - too expensive with many streetlights

                g.position.set(x, 0, z);
                g.rotation.y = rotation;

                streetlights.push(g);
                scene.add(g);
            }
        }

        function mkBuildings() {
            const innerSize = GRID.cellSize - GRID.roadWidth - GRID.sidewalkWidth * 2;
            const types = [
                { minH: 18, maxH: 65, col: 0x8899aa },
                { minH: 12, maxH: 45, col: 0x99aabb },
                { minH: 28, maxH: 85, col: 0x7788aa },
                { minH: 10, maxH: 30, col: 0xaabbcc }
            ];
            
            for (let bx = 0; bx < GRID.gridCount; bx++) {
                for (let bz = 0; bz < GRID.gridCount; bz++) {
                    const blockCenterX = -halfSize + bx * GRID.cellSize + GRID.cellSize / 2;
                    const blockCenterZ = -halfSize + bz * GRID.cellSize + GRID.cellSize / 2;
                    const numBuildings = 1 + Math.floor(Math.random() * 2);
                    
                    for (let i = 0; i < numBuildings; i++) {
                        const t = types[Math.floor(Math.random() * types.length)];
                        const h = t.minH + Math.random() * (t.maxH - t.minH);
                        const maxW = (innerSize - 2) / numBuildings;
                        const w = Math.min(maxW, 5 + Math.random() * 7);
                        const d = Math.min(innerSize - 4, 5 + Math.random() * 7);
                        
                        const offsetX = numBuildings > 1 ? (i - 0.5) * (innerSize / 2) : 0;
                        const bPosX = blockCenterX + offsetX;
                        const bPosZ = blockCenterZ;
                        const tunnelInfo = getSubwayTunnelInfo(bPosX, bPosZ, w, d);
                        const b = mkBuilding(w, h, d, t.col, tunnelInfo);
                        b.position.set(bPosX, 0, bPosZ);
                        b.userData.height = h;
                        b.userData.width = w;
                        b.userData.depth = d;
                        
                        // Store global entrance positions
                        b.userData.entrances.forEach(ent => {
                            buildingEntrances.push({
                                x: b.position.x + ent.localX,
                                z: b.position.z + ent.localZ,
                                side: ent.side,
                                building: b
                            });
                        });
                        
                        buildings.push(b);
                        scene.add(b);

                        // Track buildings with rooftop features for figure placement
                        if (b.userData.hasRooftopFeature) {
                            activeRooftops.push({
                                building: b,
                                x: bPosX,
                                z: bPosZ,
                                height: h,
                                width: w,
                                depth: d,
                                type: b.userData.rooftopType
                            });

                            // Add static figures to gardens and pools
                            const numFigs = b.userData.rooftopType === 'pool'
                                ? ROOFTOP_CFG.figuresPerPool[0] + Math.floor(Math.random() * (ROOFTOP_CFG.figuresPerPool[1] - ROOFTOP_CFG.figuresPerPool[0] + 1))
                                : ROOFTOP_CFG.figuresPerGarden[0] + Math.floor(Math.random() * (ROOFTOP_CFG.figuresPerGarden[1] - ROOFTOP_CFG.figuresPerGarden[0] + 1));

                            for (let f = 0; f < numFigs; f++) {
                                const fig = mkRooftopFigure();
                                const fx = (Math.random() - 0.5) * w * 0.5;
                                const fz = (Math.random() - 0.5) * d * 0.5;
                                fig.position.set(fx, h + 0.05, fz);
                                fig.userData.baseX = fx;
                                fig.userData.baseZ = fz;
                                fig.userData.buildingHeight = h;
                                b.add(fig);
                                rooftopFigures.push(fig);
                            }
                        }
                    }
                }
            }
        }

        // Check if a building position needs a subway tunnel
        function getSubwayTunnelInfo(bx, bz, w, d) {
            // Subway now runs elevated ABOVE the road center - no building intersections needed
            return null;
        }

        function mkBuilding(w, h, d, col, tunnelInfo = null) {
            const g = new THREE.Group();

            const mat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.7, metalness: 0.1 });

            if (tunnelInfo && h > tunnelInfo.tunnelBottom + tunnelInfo.tunnelHeight) {
                // Building with tunnel - create as multiple parts
                const tunnelW = tunnelInfo.tunnelWidth;
                const tunnelH = tunnelInfo.tunnelHeight;
                const tunnelBot = tunnelInfo.tunnelBottom;
                const tunnelTop = tunnelBot + tunnelH;

                if (tunnelInfo.direction === 'both') {
                    // Corner building - tunnels in both X and Z directions
                    // Bottom section (full footprint)
                    if (tunnelBot > 0) {
                        const bottom = new THREE.Mesh(new THREE.BoxGeometry(w, tunnelBot, d), mat);
                        bottom.position.y = tunnelBot / 2;
                        bottom.castShadow = true;
                        bottom.receiveShadow = true;
                        g.add(bottom);
                    }

                    // Four corner pillars at tunnel height
                    const pillarW = (w - tunnelW) / 2;
                    const pillarD = (d - tunnelW) / 2;
                    if (pillarW > 0 && pillarD > 0) {
                        const corners = [
                            [-(w/2 - pillarW/2), -(d/2 - pillarD/2)],
                            [(w/2 - pillarW/2), -(d/2 - pillarD/2)],
                            [-(w/2 - pillarW/2), (d/2 - pillarD/2)],
                            [(w/2 - pillarW/2), (d/2 - pillarD/2)]
                        ];
                        corners.forEach(([px, pz]) => {
                            const pillar = new THREE.Mesh(new THREE.BoxGeometry(pillarW, tunnelH, pillarD), mat);
                            pillar.position.set(px, tunnelBot + tunnelH/2, pz);
                            pillar.castShadow = true;
                            g.add(pillar);
                        });
                    }

                    // Top section (full footprint)
                    const topHeight = h - tunnelTop;
                    if (topHeight > 0) {
                        const top = new THREE.Mesh(new THREE.BoxGeometry(w, topHeight, d), mat);
                        top.position.y = tunnelTop + topHeight / 2;
                        top.castShadow = true;
                        top.receiveShadow = true;
                        g.add(top);
                    }

                    // Add dark cross-shaped tunnel interior
                    const tunnelMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
                    const interiorZ = new THREE.Mesh(new THREE.BoxGeometry(tunnelW - 0.2, tunnelH - 0.2, d + 0.1), tunnelMat);
                    interiorZ.position.y = tunnelBot + tunnelH/2;
                    g.add(interiorZ);
                    const interiorX = new THREE.Mesh(new THREE.BoxGeometry(w + 0.1, tunnelH - 0.2, tunnelW - 0.2), tunnelMat);
                    interiorX.position.y = tunnelBot + tunnelH/2;
                    g.add(interiorX);
                } else if (tunnelInfo.direction === 'z') {
                    // Tunnel runs through building in Z direction
                    // Bottom section (ground to tunnel bottom)
                    if (tunnelBot > 0) {
                        const bottom = new THREE.Mesh(new THREE.BoxGeometry(w, tunnelBot, d), mat);
                        bottom.position.y = tunnelBot / 2;
                        bottom.castShadow = true;
                        bottom.receiveShadow = true;
                        g.add(bottom);
                    }

                    // Left pillar (tunnel height section, left of tunnel)
                    const pillarWidth = (w - tunnelW) / 2;
                    if (pillarWidth > 0) {
                        const leftPillar = new THREE.Mesh(new THREE.BoxGeometry(pillarWidth, tunnelH, d), mat);
                        leftPillar.position.set(-(w/2 - pillarWidth/2), tunnelBot + tunnelH/2, 0);
                        leftPillar.castShadow = true;
                        g.add(leftPillar);

                        const rightPillar = new THREE.Mesh(new THREE.BoxGeometry(pillarWidth, tunnelH, d), mat);
                        rightPillar.position.set(w/2 - pillarWidth/2, tunnelBot + tunnelH/2, 0);
                        rightPillar.castShadow = true;
                        g.add(rightPillar);
                    }

                    // Top section (tunnel top to building height)
                    const topHeight = h - tunnelTop;
                    if (topHeight > 0) {
                        const top = new THREE.Mesh(new THREE.BoxGeometry(w, topHeight, d), mat);
                        top.position.y = tunnelTop + topHeight / 2;
                        top.castShadow = true;
                        top.receiveShadow = true;
                        g.add(top);
                    }
                } else if (tunnelInfo.direction === 'x') {
                    // Tunnel runs through building in X direction
                    // Bottom section
                    if (tunnelBot > 0) {
                        const bottom = new THREE.Mesh(new THREE.BoxGeometry(w, tunnelBot, d), mat);
                        bottom.position.y = tunnelBot / 2;
                        bottom.castShadow = true;
                        bottom.receiveShadow = true;
                        g.add(bottom);
                    }

                    // Front and back pillars
                    const pillarDepth = (d - tunnelW) / 2;
                    if (pillarDepth > 0) {
                        const frontPillar = new THREE.Mesh(new THREE.BoxGeometry(w, tunnelH, pillarDepth), mat);
                        frontPillar.position.set(0, tunnelBot + tunnelH/2, d/2 - pillarDepth/2);
                        frontPillar.castShadow = true;
                        g.add(frontPillar);

                        const backPillar = new THREE.Mesh(new THREE.BoxGeometry(w, tunnelH, pillarDepth), mat);
                        backPillar.position.set(0, tunnelBot + tunnelH/2, -(d/2 - pillarDepth/2));
                        backPillar.castShadow = true;
                        g.add(backPillar);
                    }

                    // Top section
                    const topHeight = h - tunnelTop;
                    if (topHeight > 0) {
                        const top = new THREE.Mesh(new THREE.BoxGeometry(w, topHeight, d), mat);
                        top.position.y = tunnelTop + topHeight / 2;
                        top.castShadow = true;
                        top.receiveShadow = true;
                        g.add(top);
                    }
                }

                // Add dark tunnel interior for visual depth (skip 'both' - already handled above)
                if (tunnelInfo.direction !== 'both') {
                    const tunnelMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
                    if (tunnelInfo.direction === 'z') {
                        const tunnelInterior = new THREE.Mesh(new THREE.BoxGeometry(tunnelW - 0.2, tunnelH - 0.2, d + 0.1), tunnelMat);
                        tunnelInterior.position.y = tunnelBot + tunnelH/2;
                        g.add(tunnelInterior);
                    } else {
                        const tunnelInterior = new THREE.Mesh(new THREE.BoxGeometry(w + 0.1, tunnelH - 0.2, tunnelW - 0.2), tunnelMat);
                        tunnelInterior.position.y = tunnelBot + tunnelH/2;
                        g.add(tunnelInterior);
                    }
                }

                // Add decorative tunnel portal frames
                const portalMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.6 });
                const portalFrameThickness = 0.4;
                const portalArchSegments = 12;

                function addTunnelPortal(px, pz, rotY) {
                    const portal = new THREE.Group();

                    // Left pillar
                    const leftPillar = new THREE.Mesh(
                        new THREE.BoxGeometry(portalFrameThickness, tunnelH, portalFrameThickness),
                        portalMat
                    );
                    leftPillar.position.set(-tunnelW/2 - portalFrameThickness/2, tunnelBot + tunnelH/2, 0);
                    portal.add(leftPillar);

                    // Right pillar
                    const rightPillar = new THREE.Mesh(
                        new THREE.BoxGeometry(portalFrameThickness, tunnelH, portalFrameThickness),
                        portalMat
                    );
                    rightPillar.position.set(tunnelW/2 + portalFrameThickness/2, tunnelBot + tunnelH/2, 0);
                    portal.add(rightPillar);

                    // Arch top (semicircular segments)
                    for (let i = 0; i <= portalArchSegments; i++) {
                        const angle = (i / portalArchSegments) * Math.PI;
                        const ax = Math.cos(angle) * (tunnelW/2 + portalFrameThickness/2);
                        const ay = Math.sin(angle) * (tunnelH * 0.3) + tunnelBot + tunnelH;
                        const archSeg = new THREE.Mesh(
                            new THREE.BoxGeometry(portalFrameThickness * 0.8, portalFrameThickness * 0.8, portalFrameThickness),
                            portalMat
                        );
                        archSeg.position.set(ax, ay, 0);
                        portal.add(archSeg);
                    }

                    // Keystone at arch center
                    const keystone = new THREE.Mesh(
                        new THREE.BoxGeometry(portalFrameThickness * 1.2, portalFrameThickness * 1.5, portalFrameThickness * 1.2),
                        new THREE.MeshStandardMaterial({ color: 0x666666, roughness: 0.5 })
                    );
                    keystone.position.set(0, tunnelBot + tunnelH + tunnelH * 0.3, 0);
                    portal.add(keystone);

                    portal.position.set(px, 0, pz);
                    portal.rotation.y = rotY;
                    g.add(portal);
                }

                if (tunnelInfo.direction === 'both') {
                    // Four portals for corner building
                    addTunnelPortal(0, d/2, 0);           // Front (Z+)
                    addTunnelPortal(0, -d/2, Math.PI);    // Back (Z-)
                    addTunnelPortal(w/2, 0, Math.PI/2);   // Right (X+)
                    addTunnelPortal(-w/2, 0, -Math.PI/2); // Left (X-)
                } else if (tunnelInfo.direction === 'z') {
                    // Two portals for Z-direction tunnel
                    addTunnelPortal(0, d/2, 0);
                    addTunnelPortal(0, -d/2, Math.PI);
                } else if (tunnelInfo.direction === 'x') {
                    // Two portals for X-direction tunnel
                    addTunnelPortal(w/2, 0, Math.PI/2);
                    addTunnelPortal(-w/2, 0, -Math.PI/2);
                }
            } else {
                // Regular solid building
                const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
                m.position.y = h / 2;
                m.castShadow = true;
                m.receiveShadow = true;
                g.add(m);
            }
            
            // Add entrance doors (1-2 per building)
            const numEntrances = 1 + Math.floor(Math.random() * 2);
            const sides = [0, 1, 2, 3].sort(() => Math.random() - 0.5).slice(0, numEntrances);
            g.userData.entrances = [];
            
            sides.forEach(side => {
                const doorMat = new THREE.MeshStandardMaterial({ color: 0x553322 });
                const door = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.5, 0.1), doorMat);
                const frameMat = new THREE.MeshStandardMaterial({ color: 0x444444 });
                const frame = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2.8, 0.05), frameMat);
                
                let entrancePos = { x: 0, z: 0, side: side };
                
                if (side === 0) { // Front (positive Z)
                    door.position.set(0, 1.25, d/2 + 0.05);
                    frame.position.set(0, 1.4, d/2 + 0.02);
                    entrancePos.localX = 0;
                    entrancePos.localZ = d/2 + 0.5;
                } else if (side === 1) { // Back (negative Z)
                    door.position.set(0, 1.25, -d/2 - 0.05);
                    door.rotation.y = Math.PI;
                    frame.position.set(0, 1.4, -d/2 - 0.02);
                    entrancePos.localX = 0;
                    entrancePos.localZ = -d/2 - 0.5;
                } else if (side === 2) { // Right (positive X)
                    door.position.set(w/2 + 0.05, 1.25, 0);
                    door.rotation.y = Math.PI / 2;
                    frame.position.set(w/2 + 0.02, 1.4, 0);
                    frame.rotation.y = Math.PI / 2;
                    entrancePos.localX = w/2 + 0.5;
                    entrancePos.localZ = 0;
                } else { // Left (negative X)
                    door.position.set(-w/2 - 0.05, 1.25, 0);
                    door.rotation.y = -Math.PI / 2;
                    frame.position.set(-w/2 - 0.02, 1.4, 0);
                    frame.rotation.y = Math.PI / 2;
                    entrancePos.localX = -w/2 - 0.5;
                    entrancePos.localZ = 0;
                }
                
                g.add(door);
                g.add(frame);
                g.userData.entrances.push(entrancePos);
            });
            
            const rows = Math.floor(h / 3.5);
            const colsW = Math.max(1, Math.floor(w / 2.2));
            const colsD = Math.max(1, Math.floor(d / 2.2));
            
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < colsW; c++) {
                    const xPos = colsW > 1 ? -w/2 + 1.1 + c * ((w - 2.2) / (colsW - 1)) : 0;
                    
                    const isLit1 = Math.random() > 0.3;
                    const wf = new THREE.Mesh(
                        new THREE.PlaneGeometry(0.9, 1.4),
                        new THREE.MeshBasicMaterial({ color: isLit1 ? 0xffeeaa : 0x334455 })
                    );
                    wf.position.set(xPos, 3 + r * 3.5, d/2 + 0.01);
                    wf.userData.isLit = isLit1;
                    allWindows.push(wf);
                    g.add(wf);
                    
                    const isLit2 = Math.random() > 0.3;
                    const wb = new THREE.Mesh(
                        new THREE.PlaneGeometry(0.9, 1.4),
                        new THREE.MeshBasicMaterial({ color: isLit2 ? 0xffeeaa : 0x334455 })
                    );
                    wb.position.set(xPos, 3 + r * 3.5, -d/2 - 0.01);
                    wb.rotation.y = Math.PI;
                    wb.userData.isLit = isLit2;
                    allWindows.push(wb);
                    g.add(wb);
                }
                
                for (let c = 0; c < colsD; c++) {
                    const zPos = colsD > 1 ? -d/2 + 1.1 + c * ((d - 2.2) / (colsD - 1)) : 0;
                    
                    const isLit3 = Math.random() > 0.3;
                    const wr = new THREE.Mesh(
                        new THREE.PlaneGeometry(0.9, 1.4),
                        new THREE.MeshBasicMaterial({ color: isLit3 ? 0xffeeaa : 0x334455 })
                    );
                    wr.position.set(w/2 + 0.01, 3 + r * 3.5, zPos);
                    wr.rotation.y = Math.PI / 2;
                    wr.userData.isLit = isLit3;
                    allWindows.push(wr);
                    g.add(wr);
                    
                    const isLit4 = Math.random() > 0.3;
                    const wl = new THREE.Mesh(
                        new THREE.PlaneGeometry(0.9, 1.4),
                        new THREE.MeshBasicMaterial({ color: isLit4 ? 0xffeeaa : 0x334455 })
                    );
                    wl.position.set(-w/2 - 0.01, 3 + r * 3.5, zPos);
                    wl.rotation.y = -Math.PI / 2;
                    wl.userData.isLit = isLit4;
                    allWindows.push(wl);
                    g.add(wl);
                }
            }
            
            if (h > 40) {
                const antenna = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.12, 0.12, 8),
                    new THREE.MeshStandardMaterial({ color: 0x666666 })
                );
                antenna.position.y = h + 4;
                g.add(antenna);

                // Red warning light at top of antenna
                const warningLight = new THREE.Mesh(
                    new THREE.SphereGeometry(0.4, 12, 12),
                    new THREE.MeshBasicMaterial({ color: 0xff0000 })
                );
                warningLight.position.y = h + 8.2;
                g.add(warningLight);
                warningLights.push(warningLight);
            }

            // Add rooftop features to some buildings
            // ~20% of tall buildings (h > 25) get gardens
            if (h > 25 && Math.random() < 0.20) {
                const garden = mkRooftopGarden(w, d, h);
                g.add(garden);
                g.userData.hasRooftopFeature = true;
                g.userData.rooftopType = 'garden';
            }
            // ~10% of remaining buildings get pools (only if no garden, and h > 20)
            else if (h > 20 && Math.random() < 0.10) {
                const pool = mkRooftopPool(w, d, h);
                g.add(pool);
                g.userData.hasRooftopFeature = true;
                g.userData.rooftopType = 'pool';
            }

            return g;
        }

        // Create a rooftop garden with grass, planters, and shrubs
        function mkRooftopGarden(w, d, h) {
            const g = new THREE.Group();
            g.position.y = h;

            // Green grass patch - slightly smaller than roof
            const grassMat = new THREE.MeshStandardMaterial({ color: 0x4a7c4e, roughness: 0.9 });
            const grass = new THREE.Mesh(new THREE.PlaneGeometry(w - 1, d - 1), grassMat);
            grass.rotation.x = -Math.PI / 2;
            grass.position.y = 0.01;
            grass.receiveShadow = true;
            g.add(grass);

            // Add 2-4 planter boxes on edges
            const numPlanters = 2 + Math.floor(Math.random() * 3);
            const planterMat = new THREE.MeshStandardMaterial({ color: 0x8b4513, roughness: 0.8 });
            const shrubMat = new THREE.MeshStandardMaterial({ color: 0x2d5a2d, roughness: 0.9 });

            for (let i = 0; i < numPlanters; i++) {
                const planter = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.4, 0.8), planterMat);
                planter.castShadow = true;
                planter.receiveShadow = true;

                // Position on edges with some randomness
                const edge = Math.floor(Math.random() * 4);
                const offset = (Math.random() - 0.5) * 0.6;
                if (edge === 0) planter.position.set(offset * (w - 2), 0.2, (d - 2) / 2 * 0.8);
                else if (edge === 1) planter.position.set(offset * (w - 2), 0.2, -(d - 2) / 2 * 0.8);
                else if (edge === 2) planter.position.set((w - 2) / 2 * 0.8, 0.2, offset * (d - 2));
                else planter.position.set(-(w - 2) / 2 * 0.8, 0.2, offset * (d - 2));

                g.add(planter);

                // Add shrub on top of some planters (1-3 shrubs total)
                if (i < 1 + Math.floor(Math.random() * 3)) {
                    const shrub = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), shrubMat);
                    shrub.position.copy(planter.position);
                    shrub.position.y = 0.55;
                    shrub.castShadow = true;
                    g.add(shrub);
                }
            }

            return g;
        }

        // Create a rooftop pool with water, rim, and loungers
        function mkRooftopPool(w, d, h) {
            const g = new THREE.Group();
            g.position.y = h;

            // Pool basin (recessed slightly)
            const poolW = w * 0.6;
            const poolD = d * 0.4;
            const basinMat = new THREE.MeshStandardMaterial({ color: 0x1a5276, roughness: 0.5 });
            const basin = new THREE.Mesh(new THREE.BoxGeometry(poolW, 0.3, poolD), basinMat);
            basin.position.y = -0.1;
            basin.castShadow = true;
            basin.receiveShadow = true;
            g.add(basin);

            // Water surface - bright blue with transparency
            const waterMat = new THREE.MeshStandardMaterial({
                color: 0x4fc3f7,
                roughness: 0.1,
                metalness: 0.3,
                opacity: 0.8,
                transparent: true
            });
            const water = new THREE.Mesh(new THREE.PlaneGeometry(poolW - 0.1, poolD - 0.1), waterMat);
            water.rotation.x = -Math.PI / 2;
            water.position.y = 0.05;
            g.add(water);

            // Pool edge/rim - white border
            const rimMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.6 });
            const rimThickness = 0.15;

            // Front and back rims
            const rimFront = new THREE.Mesh(new THREE.BoxGeometry(poolW + rimThickness * 2, 0.1, rimThickness), rimMat);
            rimFront.position.set(0, 0.05, poolD / 2 + rimThickness / 2);
            rimFront.castShadow = true;
            g.add(rimFront);

            const rimBack = new THREE.Mesh(new THREE.BoxGeometry(poolW + rimThickness * 2, 0.1, rimThickness), rimMat);
            rimBack.position.set(0, 0.05, -poolD / 2 - rimThickness / 2);
            rimBack.castShadow = true;
            g.add(rimBack);

            // Left and right rims
            const rimLeft = new THREE.Mesh(new THREE.BoxGeometry(rimThickness, 0.1, poolD), rimMat);
            rimLeft.position.set(-poolW / 2 - rimThickness / 2, 0.05, 0);
            rimLeft.castShadow = true;
            g.add(rimLeft);

            const rimRight = new THREE.Mesh(new THREE.BoxGeometry(rimThickness, 0.1, poolD), rimMat);
            rimRight.position.set(poolW / 2 + rimThickness / 2, 0.05, 0);
            rimRight.castShadow = true;
            g.add(rimRight);

            // Add 2 pool loungers
            const loungerMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.7 });
            for (let i = 0; i < 2; i++) {
                const lounger = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.1, 1.5), loungerMat);
                lounger.position.set(
                    (i === 0 ? -1 : 1) * (poolW / 2 + 0.8),
                    0.05,
                    (Math.random() - 0.5) * (poolD * 0.5)
                );
                lounger.castShadow = true;
                lounger.receiveShadow = true;
                g.add(lounger);
            }

            return g;
        }

        // Create a tiny rooftop figure (person visible from above)
        function mkRooftopFigure() {
            const g = new THREE.Group();

            // Very small person visible from above (scale ~0.3)
            // Body
            const body = new THREE.Mesh(
                new THREE.CylinderGeometry(0.06, 0.08, 0.25, 6),
                new THREE.MeshStandardMaterial({
                    color: [0xff6b6b, 0x4ecdc4, 0xffe66d, 0x95e1d3, 0xf38181][Math.floor(Math.random() * 5)]
                })
            );
            body.position.y = 0.15;
            body.castShadow = true;
            g.add(body);

            // Head
            const head = new THREE.Mesh(
                new THREE.SphereGeometry(0.05, 6, 6),
                new THREE.MeshStandardMaterial({ color: 0xffcc99 })
            );
            head.position.y = 0.32;
            g.add(head);

            // Simple animation data
            g.userData.baseY = 0;
            g.userData.wanderAngle = Math.random() * Math.PI * 2;
            g.userData.wanderSpeed = 0.01 + Math.random() * 0.02;
            g.userData.wanderRadius = 0.5 + Math.random() * 1;
            g.userData.phase = Math.random() * Math.PI * 2;

            return g;
        }

        // Create a rooftop party with string lights and figures
        function mkRooftopParty(building, x, z, h, w, d) {
            const party = new THREE.Group();
            party.position.set(x, h + 0.1, z);

            // String lights - create a perimeter of small glowing spheres
            const lightMat = new THREE.MeshBasicMaterial({ color: 0xffee88 });
            const stringLights = [];
            const numLights = 12;

            for (let i = 0; i < numLights; i++) {
                const angle = (i / numLights) * Math.PI * 2;
                const radius = Math.min(w, d) * 0.35;
                const lx = Math.cos(angle) * radius;
                const lz = Math.sin(angle) * radius;

                const light = new THREE.Mesh(
                    new THREE.SphereGeometry(0.08, 6, 6),
                    lightMat.clone()
                );
                light.position.set(lx, 0.3, lz);
                light.userData.baseIntensity = 1;
                light.userData.phase = Math.random() * Math.PI * 2;
                stringLights.push(light);
                party.add(light);
            }

            // Add connecting wire between lights (thin dark line)
            const wireMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
            for (let i = 0; i < numLights; i++) {
                const next = (i + 1) % numLights;
                const l1 = stringLights[i];
                const l2 = stringLights[next];

                const wire = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.01, 0.01, 0.5, 4),
                    wireMat
                );
                wire.position.set(
                    (l1.position.x + l2.position.x) / 2,
                    0.3,
                    (l1.position.z + l2.position.z) / 2
                );
                wire.rotation.z = Math.PI / 2;
                wire.rotation.y = Math.atan2(
                    l2.position.z - l1.position.z,
                    l2.position.x - l1.position.x
                );
                party.add(wire);
            }

            // Add party figures
            const numFigures = ROOFTOP_CFG.figuresPerParty[0] +
                Math.floor(Math.random() * (ROOFTOP_CFG.figuresPerParty[1] - ROOFTOP_CFG.figuresPerParty[0]));

            const figures = [];
            for (let i = 0; i < numFigures; i++) {
                const fig = mkRooftopFigure();
                const fx = (Math.random() - 0.5) * w * 0.6;
                const fz = (Math.random() - 0.5) * d * 0.6;
                fig.position.set(fx, 0, fz);
                fig.userData.baseX = fx;
                fig.userData.baseZ = fz;
                party.add(fig);
                figures.push(fig);
            }

            party.userData.stringLights = stringLights;
            party.userData.figures = figures;
            party.userData.spawnTime = clock.getElapsedTime();
            party.userData.duration = ROOFTOP_CFG.partyDuration[0] +
                Math.random() * (ROOFTOP_CFG.partyDuration[1] - ROOFTOP_CFG.partyDuration[0]);
            party.userData.building = building;

            return party;
        }

        // Spawn a rooftop party on a suitable building
        function spawnRooftopParty() {
            if (rooftopParties.length >= ROOFTOP_CFG.maxParties) return;

            // Prefer buildings with existing features, but can use any tall building
            let candidates = activeRooftops.filter(r =>
                !rooftopParties.some(p => p.userData.building === r.building)
            );

            // If no active rooftops available, use tall buildings without parties
            if (candidates.length === 0) {
                candidates = buildings
                    .filter(b => b.userData.height > 30)
                    .filter(b => !rooftopParties.some(p => p.userData.building === b))
                    .map(b => ({
                        building: b,
                        x: b.position.x,
                        z: b.position.z,
                        height: b.userData.height,
                        width: b.userData.width,
                        depth: b.userData.depth
                    }));
            }

            if (candidates.length === 0) return;

            const target = candidates[Math.floor(Math.random() * candidates.length)];
            const party = mkRooftopParty(
                target.building,
                target.x,
                target.z,
                target.height,
                target.width,
                target.depth
            );

            rooftopParties.push(party);
            scene.add(party);
        }

        // Update rooftop parties - spawn, animate, despawn
        function updRooftopParties(t) {
            // Check for party spawn
            if (t - lastPartySpawn > ROOFTOP_CFG.partySpawnInterval) {
                lastPartySpawn = t;
                if (Math.random() < ROOFTOP_CFG.partySpawnChance) {
                    spawnRooftopParty();
                }
            }

            // Update existing parties
            for (let i = rooftopParties.length - 1; i >= 0; i--) {
                const party = rooftopParties[i];
                const elapsed = t - party.userData.spawnTime;

                // Check if party should end
                if (elapsed > party.userData.duration) {
                    scene.remove(party);
                    rooftopParties.splice(i, 1);
                    continue;
                }

                // Animate string lights (gentle twinkling)
                party.userData.stringLights.forEach((light, idx) => {
                    const twinkle = 0.7 + 0.3 * Math.sin(t * 3 + light.userData.phase);
                    light.material.color.setHex(
                        twinkle > 0.85 ? 0xffffaa : 0xffee88
                    );
                });

                // Animate figures (subtle wandering)
                party.userData.figures.forEach(fig => {
                    const wanderX = Math.sin(t * fig.userData.wanderSpeed + fig.userData.phase) * fig.userData.wanderRadius;
                    const wanderZ = Math.cos(t * fig.userData.wanderSpeed * 1.3 + fig.userData.phase) * fig.userData.wanderRadius;
                    fig.position.x = fig.userData.baseX + wanderX * 0.3;
                    fig.position.z = fig.userData.baseZ + wanderZ * 0.3;
                    // Face movement direction
                    fig.rotation.y = Math.atan2(wanderX, wanderZ);
                });
            }
        }

        // Update static rooftop figures on gardens and pools
        function updRooftopFigures(t) {
            rooftopFigures.forEach(fig => {
                // Gentle wandering animation
                const wanderX = Math.sin(t * fig.userData.wanderSpeed + fig.userData.phase) * fig.userData.wanderRadius;
                const wanderZ = Math.cos(t * fig.userData.wanderSpeed * 1.1 + fig.userData.phase) * fig.userData.wanderRadius;
                fig.position.x = fig.userData.baseX + wanderX;
                fig.position.z = fig.userData.baseZ + wanderZ;
                fig.rotation.y = Math.atan2(wanderX, wanderZ);
            });
        }

        function mkBillboards() {
            const tallBuildings = buildings.filter(b => b.userData.height > 45);
            const selected = tallBuildings.sort(() => Math.random() - 0.5).slice(0, 3);
            
            const brands = [
                { name: 'Drink Cola', bg: 0xcc0000, text: 0xffffff },
                { name: 'Be Happy', bg: 0x0066cc, text: 0xffff00 },
                { name: 'Visit Jill', bg: 0x8b0000, text: 0xffdd00 }
            ];
            
            selected.forEach((building, idx) => {
                building.userData.hasBillboard = true;
                const brand = brands[idx % brands.length];
                const h = building.userData.height;
                
                const billboard = new THREE.Group();
                
                // Support poles - attached to building roof
                const poleMat = new THREE.MeshStandardMaterial({ color: 0x444444 });
                const pole1 = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 5), poleMat);
                pole1.position.set(-2.5, 2.5, 0);
                billboard.add(pole1);
                const pole2 = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 5), poleMat);
                pole2.position.set(2.5, 2.5, 0);
                billboard.add(pole2);
                
                // Sign background
                const signBg = new THREE.Mesh(
                    new THREE.BoxGeometry(7, 3.5, 0.3),
                    new THREE.MeshStandardMaterial({ color: brand.bg })
                );
                signBg.position.y = 5.5;
                billboard.add(signBg);
                
                // Animated light border
                const borderMat = new THREE.MeshBasicMaterial({ color: brand.text });
                for (let i = 0; i < 16; i++) {
                    const light = new THREE.Mesh(new THREE.SphereGeometry(0.1), borderMat.clone());
                    const angle = (i / 16) * Math.PI * 2;
                    const x = Math.cos(angle) * 3.2;
                    const y = Math.sin(angle) * 1.5 + 5.5;
                    light.position.set(x, y, 0.2);
                    light.userData.lightIndex = i;
                    light.userData.isBillboardLight = true;
                    billboard.add(light);
                }
                
                // Create actual text using canvas texture
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');
                
                // Background
                ctx.fillStyle = brand.bg === 0xcc0000 ? '#cc0000' : brand.bg === 0x0066cc ? '#0066cc' : '#111111';
                ctx.fillRect(0, 0, 512, 256);
                
                // Text
                ctx.fillStyle = brand.text === 0xffffff ? '#ffffff' : brand.text === 0xffff00 ? '#ffff00' : '#ff0000';
                ctx.font = 'bold 64px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(brand.name, 256, 128);
                
                const texture = new THREE.CanvasTexture(canvas);
                const textPlane = new THREE.Mesh(
                    new THREE.PlaneGeometry(6, 3),
                    new THREE.MeshBasicMaterial({ map: texture })
                );
                textPlane.position.set(0, 5.5, 0.2);
                billboard.add(textPlane);
                
                // Back side text

                    new THREE.PlaneGeometry(6, 3),
                    new THREE.MeshBasicMaterial({ map: texture })

                // Neon glow effect

                    transparent: true, 
                    opacity: 0.3
