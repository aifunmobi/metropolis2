                glow.position.set(0, 5.5, 0.25);
                glow.userData.isGlow = true;
                billboard.add(glow);
                
                // Position billboard centered on building roof
                billboard.position.set(building.position.x, h, building.position.z);
                billboard.userData.brand = brand;
                billboards.push(billboard);
                scene.add(billboard);
            });

            // Add PAY TAXES flashing sign
            const taxBuildings = tallBuildings.filter(b => !selected.includes(b));
            if (taxBuildings.length > 0) {
                const taxBuilding = taxBuildings[Math.floor(Math.random() * taxBuildings.length)];
                taxBuilding.userData.hasBillboard = true;
                const h = taxBuilding.userData.height;

                const taxSign = new THREE.Group();

                // Support poles
                const poleMat = new THREE.MeshStandardMaterial({ color: 0x444444 });
                const pole1 = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 5), poleMat);
                pole1.position.set(-3, 2.5, 0);
                taxSign.add(pole1);
                const pole2 = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 5), poleMat);
                pole2.position.set(3, 2.5, 0);
                taxSign.add(pole2);

                // Sign background - black
                const signBg = new THREE.Mesh(
                    new THREE.BoxGeometry(8, 4, 0.3),
                    new THREE.MeshStandardMaterial({ color: 0x111111 })
                );
                signBg.position.y = 5.5;
                taxSign.add(signBg);

                // Create flashing text planes (one on, one off)
                const createTaxTexture = (textColor) => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 512;
                    canvas.height = 256;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#111111';
                    ctx.fillRect(0, 0, 512, 256);
                    ctx.fillStyle = textColor;
                    ctx.font = 'bold 72px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('PAY TAXES', 256, 128);
                    return new THREE.CanvasTexture(canvas);
                };

                const textureOn = createTaxTexture('#00ff00');
                const textureOff = createTaxTexture('#003300');

                const textPlaneOn = new THREE.Mesh(
                    new THREE.PlaneGeometry(7, 3.5),
                    new THREE.MeshBasicMaterial({ map: textureOn })
                );
                textPlaneOn.position.set(0, 5.5, 0.2);
                textPlaneOn.userData.isTaxSign = true;
                taxSign.add(textPlaneOn);

                const textPlaneOff = new THREE.Mesh(
                    new THREE.PlaneGeometry(7, 3.5),
                    new THREE.MeshBasicMaterial({ map: textureOff })
                );
                textPlaneOff.position.set(0, 5.5, 0.2);
                textPlaneOff.visible = false;
                textPlaneOff.userData.isTaxSignOff = true;
                taxSign.add(textPlaneOff);

                // Back side
                const textPlaneOnBack = new THREE.Mesh(
                    new THREE.PlaneGeometry(7, 3.5),
                    new THREE.MeshBasicMaterial({ map: textureOn })
                );
                textPlaneOnBack.position.set(0, 5.5, -0.2);
                textPlaneOnBack.rotation.y = Math.PI;
                textPlaneOnBack.userData.isTaxSign = true;
                taxSign.add(textPlaneOnBack);

                const textPlaneOffBack = new THREE.Mesh(
                    new THREE.PlaneGeometry(7, 3.5),
                    new THREE.MeshBasicMaterial({ map: textureOff })
                );
                textPlaneOffBack.position.set(0, 5.5, -0.2);
                textPlaneOffBack.rotation.y = Math.PI;
                textPlaneOffBack.visible = false;
                textPlaneOffBack.userData.isTaxSignOff = true;
                taxSign.add(textPlaneOffBack);

                taxSign.position.set(taxBuilding.position.x, h, taxBuilding.position.z);
                taxSign.userData.isTaxBillboard = true;
                billboards.push(taxSign);
                scene.add(taxSign);
            }

            // Add Marlboro Country billboard with flashing lights
            const marlboroBuildings = tallBuildings.filter(b => !selected.includes(b) && b !== taxBuildings[0]);
            if (marlboroBuildings.length > 0) {
                const marlboroBuilding = marlboroBuildings[Math.floor(Math.random() * marlboroBuildings.length)];
                marlboroBuilding.userData.hasBillboard = true;
                const h = marlboroBuilding.userData.height;

                const marlboroSign = new THREE.Group();

                // Support poles
                const poleMat = new THREE.MeshStandardMaterial({ color: 0x8b4513 }); // Brown rustic poles
                const pole1 = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 6), poleMat);
                pole1.position.set(-4, 3, 0);
                marlboroSign.add(pole1);
                const pole2 = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 6), poleMat);
                pole2.position.set(4, 3, 0);
                marlboroSign.add(pole2);

                // Sign background - warm sunset orange/red
                const signBg = new THREE.Mesh(
                    new THREE.BoxGeometry(10, 5, 0.3),
                    new THREE.MeshStandardMaterial({ color: 0xcc4400 })
                );
                signBg.position.y = 6.5;
                marlboroSign.add(signBg);

                // Create Marlboro Country texture
                const createMarlboroTexture = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 512;
                    canvas.height = 256;
                    const ctx = canvas.getContext('2d');
                    // Sunset gradient background
                    const gradient = ctx.createLinearGradient(0, 0, 0, 256);
                    gradient.addColorStop(0, '#cc4400');
                    gradient.addColorStop(0.5, '#dd6622');
                    gradient.addColorStop(1, '#cc4400');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, 512, 256);
                    // Text
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 42px Georgia';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('MARLBORO', 256, 100);
                    ctx.font = 'italic 36px Georgia';
                    ctx.fillText('Country', 256, 160);
                    return new THREE.CanvasTexture(canvas);
                };

                const marlboroTexture = createMarlboroTexture();
                const textPlane = new THREE.Mesh(
                    new THREE.PlaneGeometry(9, 4.5),
                    new THREE.MeshBasicMaterial({ map: marlboroTexture })
                );
                textPlane.position.set(0, 6.5, 0.2);
                marlboroSign.add(textPlane);

                // Back side
                const textPlaneBack = new THREE.Mesh(
                    new THREE.PlaneGeometry(9, 4.5),
                    new THREE.MeshBasicMaterial({ map: marlboroTexture })
                );
                textPlaneBack.position.set(0, 6.5, -0.2);
                textPlaneBack.rotation.y = Math.PI;
                marlboroSign.add(textPlaneBack);

                // Flashing border lights - warm white/yellow
                for (let i = 0; i < 24; i++) {
                    const light = new THREE.Mesh(
                        new THREE.SphereGeometry(0.12),
                        new THREE.MeshBasicMaterial({ color: 0xffdd44 })
                    );
                    // Position lights around the border
                    let lx, ly;
                    if (i < 6) { // Top
                        lx = -4.5 + i * 1.8;
                        ly = 9;
                    } else if (i < 12) { // Right
                        lx = 4.5;
                        ly = 9 - (i - 6) * 0.9;
                    } else if (i < 18) { // Bottom
                        lx = 4.5 - (i - 12) * 1.8;
                        ly = 4;
                    } else { // Left
                        lx = -4.5;
                        ly = 4 + (i - 18) * 0.9;
                    }
                    light.position.set(lx, ly, 0.25);
                    light.userData.lightIndex = i;
                    light.userData.isMarlboroLight = true;
                    marlboroSign.add(light);
                }

                marlboroSign.position.set(marlboroBuilding.position.x, h, marlboroBuilding.position.z);
                marlboroSign.userData.isMarlboroBillboard = true;
                billboards.push(marlboroSign);
                scene.add(marlboroSign);
            }

            // Add aircraft warning lights on remaining tall buildings
            const usedBuildings = [...selected, taxBuildings[0], marlboroBuildings[0]].filter(Boolean);
            const warningBuildings = tallBuildings.filter(b => !usedBuildings.includes(b) && b.userData.height > 50);

            warningBuildings.forEach(building => {
                building.userData.hasBillboard = true;
                const h = building.userData.height;
                const warningGroup = new THREE.Group();

                // Vertical pole/antenna
                const poleMat = new THREE.MeshStandardMaterial({ color: 0x666666 });
                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, h * 0.3), poleMat);
                pole.position.y = h * 0.15;
                warningGroup.add(pole);

                // Red warning lights from top to bottom
                const numLights = Math.floor(h * 0.3 / 4) + 1; // One light every ~4 units
                for (let i = 0; i < numLights; i++) {
                    const light = new THREE.Mesh(
                        new THREE.SphereGeometry(0.2),
                        new THREE.MeshBasicMaterial({ color: 0xff0000 })
                    );
                    const lightY = h * 0.3 - (i * 4);
                    light.position.y = lightY;
                    light.userData.isWarningLight = true;
                    light.userData.lightIndex = i;
                    light.userData.totalLights = numLights;
                    warningGroup.add(light);
                }

                warningGroup.position.set(building.position.x, h, building.position.z);
                warningGroup.userData.isWarningTower = true;
                billboards.push(warningGroup);
                scene.add(warningGroup);
            });
        }

        // Enhanced rooftop amenities for buildings without billboards
        let rooftopAmenities = []; // Track all animated rooftop elements

        function mkRooftopAmenities() {
            // Get all buildings that don't have billboards - more activity on rooftops!
            const eligibleBuildings = buildings.filter(b =>
                !b.userData.hasBillboard &&
                b.userData.height >= 8 &&  // Lower height requirement for more rooftop activity
                b.userData.width >= 5 &&
                b.userData.depth >= 5
            );

            eligibleBuildings.forEach(building => {
                const w = building.userData.width;
                const d = building.userData.depth;
                const h = building.userData.height;

                // Choose a rooftop type
                const roofType = Math.random();
                let amenityGroup;

                if (roofType < 0.35) {
                    // Rooftop bar
                    amenityGroup = mkRooftopBar(w, d, h);
                } else if (roofType < 0.6) {
                    // Pool lounge area
                    amenityGroup = mkRooftopPoolLounge(w, d, h);
                } else if (roofType < 0.8) {
                    // Dining terrace
                    amenityGroup = mkRooftopDining(w, d, h);
                } else {
                    // Lounge/seating area
                    amenityGroup = mkRooftopLounge(w, d, h);
                }

                // Position at building location (h already defined above)
                amenityGroup.position.set(building.position.x, h, building.position.z);
                scene.add(amenityGroup);
                building.userData.hasRooftopAmenity = true;
            });
        }

        // Create an animated rooftop figure
        function mkAnimatedRooftopPerson() {
            const g = new THREE.Group();
            const skinColors = [0xffe4c4, 0xd2a679, 0x8b6914, 0xc68642, 0xffdbac];
            const shirtColors = [0xff6b6b, 0x4ecdc4, 0xffe66d, 0x95e1d3, 0xf38181, 0x6c5ce7, 0x00b894, 0xfdcb6e];
            const pantsColors = [0x2d3436, 0x636e72, 0x0984e3, 0x6c5ce7, 0xdfe6e9];

            const skinColor = skinColors[Math.floor(Math.random() * skinColors.length)];
            const shirtColor = shirtColors[Math.floor(Math.random() * shirtColors.length)];
            const pantsColor = pantsColors[Math.floor(Math.random() * pantsColors.length)];

            // Body/torso
            const body = new THREE.Mesh(
                new THREE.CylinderGeometry(0.08, 0.1, 0.3, 8),
                new THREE.MeshStandardMaterial({ color: shirtColor })
            );
            body.position.y = 0.25;
            g.add(body);

            // Head
            const head = new THREE.Mesh(
                new THREE.SphereGeometry(0.08, 8, 8),
                new THREE.MeshStandardMaterial({ color: skinColor })
            );
            head.position.y = 0.48;
            g.add(head);

            // Legs
            const legMat = new THREE.MeshStandardMaterial({ color: pantsColor });
            const leftLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.2, 6), legMat);
            leftLeg.position.set(-0.04, 0.1, 0);
            g.add(leftLeg);
            const rightLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.2, 6), legMat);
            rightLeg.position.set(0.04, 0.1, 0);
            g.add(rightLeg);

            // Arms
            const armMat = new THREE.MeshStandardMaterial({ color: skinColor });
            const leftArm = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.15, 6), armMat);
            leftArm.position.set(-0.12, 0.3, 0);
            leftArm.rotation.z = 0.3;
            leftArm.userData.isArm = true;
            g.add(leftArm);
            const rightArm = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.15, 6), armMat);
            rightArm.position.set(0.12, 0.3, 0);
            rightArm.rotation.z = -0.3;
            rightArm.userData.isArm = true;
            g.add(rightArm);

            g.userData.leftLeg = leftLeg;
            g.userData.rightLeg = rightLeg;
            g.userData.leftArm = leftArm;
            g.userData.rightArm = rightArm;
            g.userData.phase = Math.random() * Math.PI * 2;
            g.userData.walkSpeed = 0.3 + Math.random() * 0.3; // Slower movement
            g.userData.wanderRadius = 0.2 + Math.random() * 0.3; // Much smaller wander - stay in place mostly
            g.userData.baseX = 0;
            g.userData.baseZ = 0;
            g.userData.isAnimatedPerson = true;

            g.castShadow = true;
            return g;
        }

        // Rooftop bar with counter, stools, bartender
        function mkRooftopBar(w, d, h) {
            const g = new THREE.Group();
            g.position.y = h;

            // Floor/deck
            const deckMat = new THREE.MeshStandardMaterial({ color: 0x8b7355, roughness: 0.8 });
            const deck = new THREE.Mesh(new THREE.PlaneGeometry(w - 0.5, d - 0.5), deckMat);
            deck.rotation.x = -Math.PI / 2;
            deck.position.y = 0.02;
            deck.receiveShadow = true;
            g.add(deck);

            // Bar counter
            const barMat = new THREE.MeshStandardMaterial({ color: 0x5d4e37, roughness: 0.6 });
            const barW = Math.min(w * 0.7, 4);
            const bar = new THREE.Mesh(new THREE.BoxGeometry(barW, 0.6, 0.5), barMat);
            bar.position.set(0, 0.3, -d * 0.3);
            bar.castShadow = true;
            g.add(bar);

            // Bar top (lighter wood)
            const barTop = new THREE.Mesh(
                new THREE.BoxGeometry(barW + 0.1, 0.08, 0.6),
                new THREE.MeshStandardMaterial({ color: 0x8b7355, roughness: 0.5 })
            );
            barTop.position.set(0, 0.64, -d * 0.3);
            g.add(barTop);

            // Bar stools (shorter to match lower bar)
            const stoolMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const numStools = Math.floor(barW / 0.8);
            for (let i = 0; i < numStools; i++) {
                const stoolX = -barW / 2 + 0.5 + i * (barW - 1) / Math.max(numStools - 1, 1);
                // Stool base
                const base = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.18, 0.05, 12), stoolMat);
                base.position.set(stoolX, 0.025, -d * 0.3 + 0.7);
                g.add(base);
                // Stool pole
                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.35, 8), stoolMat);
                pole.position.set(stoolX, 0.2, -d * 0.3 + 0.7);
                g.add(pole);
                // Stool seat
                const seat = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.15, 0.12, 0.08, 12),
                    new THREE.MeshStandardMaterial({ color: 0x8b0000 })
                );
                seat.position.set(stoolX, 0.42, -d * 0.3 + 0.7);
                g.add(seat);
            }

            // Bottles on bar (decorative)
            const bottleColors = [0x00aa44, 0x884400, 0xaa4400, 0x004488];
            for (let i = 0; i < 5; i++) {
                const bottle = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.04, 0.05, 0.25, 8),
                    new THREE.MeshStandardMaterial({ color: bottleColors[i % bottleColors.length], transparent: true, opacity: 0.8 })
                );
                bottle.position.set(-barW / 2 + 0.3 + i * 0.4, 0.8, -d * 0.3 - 0.1);
                g.add(bottle);
            }

            // Umbrellas - wide variety of colors
            const umbrellaColors = [
                0xff6b6b, 0xff9f43, 0xfeca57, 0x48dbfb, 0x1dd1a1, 0x5f27cd,
                0xff9ff3, 0x54a0ff, 0x00d2d3, 0xf368e0, 0xff7675, 0x74b9ff,
                0xa29bfe, 0xfd79a8, 0x00cec9, 0xe17055, 0x81ecec, 0xdfe6e9
            ];
            for (let i = 0; i < 2; i++) {
                const umbrella = mkUmbrella(umbrellaColors[Math.floor(Math.random() * umbrellaColors.length)]);
                umbrella.position.set((i === 0 ? -1 : 1) * (w * 0.25), 0, d * 0.2);
                g.add(umbrella);
            }

            // Tables near umbrellas
            for (let i = 0; i < 2; i++) {
                const table = mkSmallTable();
                table.position.set((i === 0 ? -1 : 1) * (w * 0.25), 0, d * 0.2);
                g.add(table);
            }

            // String lights
            const stringLights = mkStringLights(w * 0.8, d * 0.6);
            stringLights.position.set(0, 2.5, 0);
            g.add(stringLights);

            // "Jill's Bar" text on back of bar counter (first bar only)
            if (!mkRooftopBar.signAdded) {
                mkRooftopBar.signAdded = true;

                // Create canvas texture with "JILL'S BAR" in block letters
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#5d4e37'; // Match bar color
                ctx.fillRect(0, 0, 512, 128);
                ctx.fillStyle = '#ffdd00'; // Gold text
                ctx.font = '900 72px Impact, Arial Black, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText("JILL'S BAR", 256, 64);

                const texture = new THREE.CanvasTexture(canvas);
                const sign = new THREE.Mesh(
                    new THREE.PlaneGeometry(barW * 0.9, 0.3),
                    new THREE.MeshBasicMaterial({ map: texture })
                );
                // Position on front face of bar counter (facing customers/stools)
                sign.position.set(0, 0.3, -d * 0.3 + 0.26);
                g.add(sign);
            }

            // Animated people - lots of activity at the bar!
            // Keep people in front of bar (positive z area) to avoid walking into bar counter
            const numPeople = 8 + Math.floor(Math.random() * 6); // 8-13 people
            const people = [];
            const barZ = -d * 0.3; // Bar counter z position
            for (let i = 0; i < numPeople; i++) {
                const person = mkAnimatedRooftopPerson();
                const px = (Math.random() - 0.5) * (w - 1);
                // Spawn in front of bar only (between bar and front edge)
                const pz = barZ + 1 + Math.random() * (d * 0.5 - 1);
                person.position.set(px, 0, pz);
                person.userData.baseX = px;
                person.userData.baseZ = pz;
                // Scale up slightly so people are more visible
                person.scale.set(1.3, 1.3, 1.3);
                g.add(person);
                people.push(person);
            }
            g.userData.people = people;
            // Restrict bounds to area in front of bar
            g.userData.bounds = { w: w - 1, d: d * 0.5, minZ: barZ + 0.8 };
            rooftopAmenities.push(g);

            return g;
        }

        // Pool lounge with enhanced features
        function mkRooftopPoolLounge(w, d, h) {
            const g = new THREE.Group();
            g.position.y = h;

            // Pool deck
            const deckMat = new THREE.MeshStandardMaterial({ color: 0xd4c4b5, roughness: 0.7 });
            const deck = new THREE.Mesh(new THREE.PlaneGeometry(w - 0.5, d - 0.5), deckMat);
            deck.rotation.x = -Math.PI / 2;
            deck.position.y = 0.02;
            deck.receiveShadow = true;
            g.add(deck);

            // Pool
            const poolW = Math.min(w * 0.5, 4);
            const poolD = Math.min(d * 0.4, 3);
            const basinMat = new THREE.MeshStandardMaterial({ color: 0x1a5276, roughness: 0.5 });
            const basin = new THREE.Mesh(new THREE.BoxGeometry(poolW, 0.3, poolD), basinMat);
            basin.position.set(0, -0.1, -d * 0.15);
            g.add(basin);

            // Water
            const waterMat = new THREE.MeshStandardMaterial({
                color: 0x4fc3f7,
                roughness: 0.1,
                metalness: 0.3,
                opacity: 0.85,
                transparent: true
            });
            const water = new THREE.Mesh(new THREE.PlaneGeometry(poolW - 0.1, poolD - 0.1), waterMat);
            water.rotation.x = -Math.PI / 2;
            water.position.set(0, 0.05, -d * 0.15);
            g.add(water);

            // Pool rim
            const rimMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.6 });
            [[poolW + 0.2, 0.1, 0.15, 0, poolD / 2 + 0.075], [poolW + 0.2, 0.1, 0.15, 0, -poolD / 2 - 0.075],
             [0.15, 0.1, poolD, -poolW / 2 - 0.075, 0], [0.15, 0.1, poolD, poolW / 2 + 0.075, 0]].forEach(([rw, rh, rd, rx, rz]) => {
                const rim = new THREE.Mesh(new THREE.BoxGeometry(rw, rh, rd), rimMat);
                rim.position.set(rx, 0.05, rz - d * 0.15);
                g.add(rim);
            });

            // Lounge chairs
            const chairColors = [0xffffff, 0x4169e1, 0xff6347];
            for (let i = 0; i < 4; i++) {
                const chair = mkLoungeChair(chairColors[i % chairColors.length]);

                chair.position.set(side * (poolW / 2 + 0.8), 0, -d * 0.15 + (i % 2 === 0 ? -0.5 : 0.5));
                chair.rotation.y = side * Math.PI / 2;
                g.add(chair);
            }

            // Umbrellas - random vibrant colors
            const poolUmbrellaColors = [
                0xff6b6b, 0xff9f43, 0xfeca57, 0x48dbfb, 0x1dd1a1, 0x5f27cd,
                0xff9ff3, 0x54a0ff, 0x00d2d3, 0xf368e0, 0xff7675, 0x74b9ff
            ];
            for (let i = 0; i < 2; i++) {
                const umbrella = mkUmbrella(poolUmbrellaColors[Math.floor(Math.random() * poolUmbrellaColors.length)]);
                umbrella.position.set((i === 0 ? -1 : 1) * (poolW / 2 + 1.2), 0, -d * 0.15);
                g.add(umbrella);
            }

            // Small table with drinks
            const drinkTable = mkSmallTable();
            drinkTable.position.set(-poolW / 2 - 0.8, 0, -d * 0.15 + 0.8);
            g.add(drinkTable);

            // Animated people - pool party!
            const numPeople = 6 + Math.floor(Math.random() * 5); // 6-10 people
            const people = [];
            for (let i = 0; i < numPeople; i++) {
                const person = mkAnimatedRooftopPerson();
                // Some near pool, some around the deck
                const nearPool = Math.random() < 0.5;

        // Update animated rooftop people
        function updRooftopAmenities(t) {
            rooftopAmenities.forEach(amenity => {
                if (amenity.userData.people && amenity.userData.bounds) {
                    const bounds = amenity.userData.bounds;
                    const halfW = bounds.w / 2;
                    const halfD = bounds.d / 2;

                    amenity.userData.people.forEach(person => {
                        // Walking animation
                        const walkPhase = t * person.userData.walkSpeed + person.userData.phase;

                        // Wander around
                        const wanderX = Math.sin(walkPhase * 0.3) * person.userData.wanderRadius;
                        const wanderZ = Math.cos(walkPhase * 0.23) * person.userData.wanderRadius;
                        let newX = person.userData.baseX + wanderX;
                        let newZ = person.userData.baseZ + wanderZ;

                        // Clamp to rooftop bounds - keep people on the roof!
                        newX = Math.max(-halfW, Math.min(halfW, newX));
                        // Use minZ if set (for bars to keep people away from counter)
                        const minZ = bounds.minZ !== undefined ? bounds.minZ : -halfD;
                        newZ = Math.max(minZ, Math.min(halfD, newZ));

                        person.position.x = newX;
                        person.position.z = newZ;

                        // Face movement direction
                        person.rotation.y = Math.atan2(
                            Math.cos(walkPhase * 0.3) * person.userData.wanderRadius,
                            -Math.sin(walkPhase * 0.23) * person.userData.wanderRadius
                        );

                        // Leg animation
                        if (person.userData.leftLeg && person.userData.rightLeg) {
                            person.userData.leftLeg.rotation.x = Math.sin(walkPhase * 2) * 0.3;
                            person.userData.rightLeg.rotation.x = -Math.sin(walkPhase * 2) * 0.3;
                        }

                        // Arm swing
                        if (person.userData.leftArm && person.userData.rightArm) {
                            person.userData.leftArm.rotation.x = -Math.sin(walkPhase * 2) * 0.2;
                            person.userData.rightArm.rotation.x = Math.sin(walkPhase * 2) * 0.2;
                        }
                    });
                }

                // Animate string lights (if present)
                amenity.traverse(child => {
                    if (child.userData && child.userData.isStringLight) {
                        const twinkle = 0.7 + 0.3 * Math.sin(t * 2 + child.userData.phase);
                        child.material.color.setHex(twinkle > 0.85 ? 0xffffcc : 0xffffaa);
                    }
                });
            });
        }

        function mkTL() {
            const g = new THREE.Group();
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const boxMat = new THREE.MeshStandardMaterial({ color: 0x222222 });

            g.userData.lts = [];

            // 4 corners of intersection - each gets a pole with signal
            // Signal on corner, rotated 180 degrees to face approaching traffic
            const corners = [
                // SW corner - faces WEST toward westbound traffic (-X dir)
                { x: -5, z: 5, facingX: -1, facingZ: 0, axis: 'x', dir: -1 },
                // NW corner - faces NORTH toward northbound traffic (-Z dir)
                { x: -5, z: -5, facingX: 0, facingZ: -1, axis: 'z', dir: -1 },
                // NE corner - faces EAST toward eastbound traffic (+X dir)
                { x: 5, z: -5, facingX: 1, facingZ: 0, axis: 'x', dir: 1 },
                // SE corner - faces SOUTH toward southbound traffic (+Z dir)
                { x: 5, z: 5, facingX: 0, facingZ: 1, axis: 'z', dir: 1 }
            ];

            corners.forEach(corner => {
                // Pole - street corner style
                const pole = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.08, 0.1, 5),
                    poleMat
                );
                pole.position.set(corner.x, 2.5, corner.z);
                pole.castShadow = true;
                g.add(pole);

                // Signal housing (vertical 3-light box)
                const box = new THREE.Mesh(
                    new THREE.BoxGeometry(0.5, 1.2, 0.35),
                    boxMat
                );
                box.position.set(corner.x, 5.3, corner.z);
                box.rotation.y = Math.atan2(corner.facingX, corner.facingZ);
                g.add(box);

                // Visor/hood over the signal (extends in facing direction)
                const visor = new THREE.Mesh(
                    new THREE.BoxGeometry(0.6, 0.1, 0.5),
                    boxMat
                );
                visor.position.set(
                    corner.x + corner.facingX * 0.2,
                    5.95,
                    corner.z + corner.facingZ * 0.2
                );
                visor.rotation.y = Math.atan2(corner.facingX, corner.facingZ);
                g.add(visor);

                // Three lights: red (top), yellow (middle), green (bottom)
                const colors = [0xff0000, 0xffff00, 0x00ff00];
                const yPositions = [5.65, 5.3, 4.95];

                colors.forEach((col, idx) => {
                    const light = new THREE.Mesh(
                        new THREE.SphereGeometry(0.1),
                        new THREE.MeshBasicMaterial({ color: 0x222222 })
                    );
                    // Position lights on the front face of signal box
                    light.position.set(
                        corner.x + corner.facingX * 0.2,
                        yPositions[idx],
                        corner.z + corner.facingZ * 0.2
                    );
                    light.userData.axis = corner.axis;
                    light.userData.lightIndex = idx; // 0=red, 1=yellow, 2=green
                    light.userData.activeCol = col;
                    g.add(light);
                    g.userData.lts.push(light);
                });
            });

            return g;
        }

        let omnibus = null;
        let omnibusStops = [];
        let omnibusPassengers = [];
        const OMNIBUS_MAX_PASSENGERS = 8;
        
        function createOmnibusLine() {
            // Create bus stops around the city center (inner loop)
            const innerRoad1 = -halfSize + 1 * GRID.cellSize; // First inner road
            const innerRoad2 = -halfSize + 2 * GRID.cellSize; // Second inner road
            const innerRoad3 = -halfSize + 3 * GRID.cellSize; // Third inner road
            const sidewalkOffset = GRID.roadWidth / 2 + GRID.sidewalkWidth / 2; // Place signs on sidewalk
            const laneOffset = GRID.roadWidth / 4; // Bus drives in the road lane

            // Bus stops for passengers (on sidewalk) - these are where people wait
            // Right-side driving: East=+Z sidewalk, South=-X sidewalk, West=-Z sidewalk, North=+X sidewalk
            omnibusStops = [
                { x: innerRoad1 + 8, z: innerRoad1 + sidewalkOffset, dir: 'east' },
                { x: innerRoad3 - sidewalkOffset, z: innerRoad1 + 8, dir: 'south' },
                { x: innerRoad3 - 8, z: innerRoad3 - sidewalkOffset, dir: 'west' },
                { x: innerRoad1 + sidewalkOffset, z: innerRoad3 - 8, dir: 'north' }
            ];

            // Route waypoints - bus follows these in order (includes stops and corners)
            // Route: Stop0 -> SE corner -> Stop1 -> NE corner -> Stop2 -> NW corner -> Stop3 -> SW corner -> loop
            // Right-side driving: East(+X)=+Z, South(+Z)=-X, West(-X)=-Z, North(-Z)=+X
            const omnibusRoute = [
                // Stop 0 - going EAST along innerRoad1, right side = +Z
                { x: innerRoad1 + 8, z: innerRoad1 + laneOffset, isStop: true, stopIdx: 0 },
                // SE corner - transition from east lane to south lane
                { x: innerRoad3 - laneOffset, z: innerRoad1 + laneOffset, isStop: false },
                // Stop 1 - going SOUTH along innerRoad3 (x-road), right side = -X
                { x: innerRoad3 - laneOffset, z: innerRoad1 + 8, isStop: true, stopIdx: 1 },
                // NE corner - transition from south lane to west lane
                { x: innerRoad3 - laneOffset, z: innerRoad3 - laneOffset, isStop: false },
                // Stop 2 - going WEST along innerRoad3, right side = -Z
                { x: innerRoad3 - 8, z: innerRoad3 - laneOffset, isStop: true, stopIdx: 2 },
                // NW corner - transition from west lane to north lane
                { x: innerRoad1 + laneOffset, z: innerRoad3 - laneOffset, isStop: false },
                // Stop 3 - going NORTH along innerRoad1 (x-road), right side = +X
                { x: innerRoad1 + laneOffset, z: innerRoad3 - 8, isStop: true, stopIdx: 3 },
                // SW corner - transition from north lane to east lane
                { x: innerRoad1 + laneOffset, z: innerRoad1 + laneOffset, isStop: false }
            ];

            // Create bus stop signs (on sidewalk)
            omnibusStops.forEach((stop, i) => {

                stop.sign = stopSign;

            // Create the omnibus (start at first waypoint)
            omnibus = mkOmnibus();
            omnibus.route = omnibusRoute;

            omnibus.userData.lastPos = { x: omnibus.position.x, z: omnibus.position.z };
            omnibus.userData.stuckTime = 0;
            scene.add(omnibus);

            notify('🚌 Omnibus Line 1 now running!', 3000);
        }

        function updWrecker(t) {
            // Detect intersection gridlock (3+ cars stuck within 15 units of each other)
            if (!intersectionGridlock && wreckers.length === 0) {
                const stuckCars = cars.filter(c =>
                    c.userData.stuckTime > 20 &&
                    !c.userData.isEmergency &&
                    !c.userData.wreckerAssigned
                );

                // Check if multiple cars stuck near each other (intersection gridlock)
                if (stuckCars.length >= 3) {
                    // Find cluster of stuck cars
                    for (const car of stuckCars) {
                        const nearbyStuck = stuckCars.filter(other => {
                            if (other === car) return false;
                            const dx = other.position.x - car.position.x;
                            const dz = other.position.z - car.position.z;
                            return Math.sqrt(dx * dx + dz * dz) < 15;
                        });

                        if (nearbyStuck.length >= 2) {
                            // Found intersection gridlock!
                            const gridlockCars = [car, ...nearbyStuck];
                            const centerX = gridlockCars.reduce((sum, c) => sum + c.position.x, 0) / gridlockCars.length;
                            const centerZ = gridlockCars.reduce((sum, c) => sum + c.position.z, 0) / gridlockCars.length;

                            intersectionGridlock = { x: centerX, z: centerZ, cars: gridlockCars };

                            // Dispatch police car
                            const policeCar = emergencyVehicles.find(ev => ev.userData.emergencyType === 'police');
                            if (policeCar && !policeChaseTarget && !policeCar.userData.respondingToGridlock) {
                                policeCar.userData.respondingToGridlock = true;
                                policeCar.userData.gridlockCenter = { x: centerX, z: centerZ };
                            }

                            // Dispatch wreckers for each stuck car (max 4)
                            const toTow = gridlockCars.slice(0, 4);
                            notify(`🚨 Intersection gridlock! Dispatching police + ${toTow.length} wreckers!`, 4000);

                            toTow.forEach((stuckCar, i) => {
                                stuckCar.userData.wreckerAssigned = true;
                                setTimeout(() => {
                                    const newWrecker = mkWrecker();
                                    newWrecker.userData.target = stuckCar;
                                    newWrecker.userData.state = 'driving';
                                    newWrecker.userData.spd = 0.18;

                                    // Spawn from different edges
                                    const edges = [
                                        { x: -halfSize - 10, z: stuckCar.position.z },
                                        { x: halfSize + 10, z: stuckCar.position.z },
                                        { x: stuckCar.position.x, z: -halfSize - 10 },
                                        { x: stuckCar.position.x, z: halfSize + 10 }
                                    ];
                                    const edge = edges[i % edges.length];
                                    newWrecker.position.set(edge.x, 0, edge.z);

                                    scene.add(newWrecker);
                                    wreckers.push(newWrecker);
                                }, i * 500); // Stagger spawns
                            });
                            break;
                        }
                    }
                }

                // Also check for single stuck vehicle (120+ seconds)
                if (!intersectionGridlock) {
                    const longStuck = cars.find(c =>
                        c.userData.stuckTime > 120 &&
                        !c.userData.isEmergency &&
                        !c.userData.wreckerAssigned
                    );
                    if (longStuck) {
                        longStuck.userData.wreckerAssigned = true;
                        const newWrecker = mkWrecker();
                        newWrecker.userData.target = longStuck;
                        newWrecker.userData.state = 'driving';
                        newWrecker.userData.spd = 0.15;
                        const edge = Math.random() > 0.5 ? halfSize + 10 : -halfSize - 10;
                        newWrecker.position.set(edge, 0, longStuck.position.z);
                        scene.add(newWrecker);
                        wreckers.push(newWrecker);
                        notify('🚛 Wrecker dispatched for stuck vehicle!', 3000);
                    }
                }

                // Check for stuck omnibus (60+ seconds)
                if (omnibus && omnibus.userData.stuckTime > 60 && !omnibus.userData.wreckerAssigned) {
                    omnibus.userData.wreckerAssigned = true;
                    const newWrecker = mkWrecker();
                    newWrecker.userData.target = omnibus;
                    newWrecker.userData.state = 'driving';
                    newWrecker.userData.spd = 0.18;
                    const edge = Math.random() > 0.5 ? halfSize + 10 : -halfSize - 10;
                    newWrecker.position.set(edge, 0, omnibus.position.z);
                    scene.add(newWrecker);
                    wreckers.push(newWrecker);
                    notify('🚛 Wrecker dispatched for stuck omnibus!', 3000);
                }
            }

            // Update police responding to gridlock
            const policeCar = emergencyVehicles.find(ev => ev.userData.emergencyType === 'police');
            if (policeCar && policeCar.userData.respondingToGridlock && policeCar.userData.gridlockCenter) {
                const target = policeCar.userData.gridlockCenter;
                const dx = target.x - policeCar.position.x;
                const dz = target.z - policeCar.position.z;
                const dist = Math.sqrt(dx * dx + dz * dz);

                if (dist < 8) {
                    // Arrived - stay at scene until wreckers done
                    policeCar.rotation.y = Math.atan2(dx, dz);
                } else {
                    const speed = 0.25;
                    policeCar.position.x += (dx / dist) * speed;
                    policeCar.position.z += (dz / dist) * speed;
                    policeCar.rotation.y = Math.atan2(dx, dz);
                }
            }

            // Update all active wreckers
            wreckers.forEach((wrecker, idx) => {
                if (wrecker.userData.state === 'driving') {
                    const target = wrecker.userData.target;
                    if (!target || !target.parent) {
                        // Target already removed
                        wrecker.userData.state = 'leaving';
                        wrecker.userData.leaveDir = wrecker.position.x > 0 ? 1 : -1;
                        return;
                    }

                    const dx = target.position.x - wrecker.position.x;
                    const dz = target.position.z - wrecker.position.z;
                    const dist = Math.sqrt(dx * dx + dz * dz);

                    if (dist < 4) {
                        wrecker.userData.state = 'towing';
                        wrecker.userData.towTimer = 0;
                    } else {
                        wrecker.position.x += (dx / dist) * wrecker.userData.spd;
                        wrecker.position.z += (dz / dist) * wrecker.userData.spd;
                        wrecker.rotation.y = Math.atan2(dx, dz) - Math.PI / 2;
                    }
                } else if (wrecker.userData.state === 'towing') {
                    wrecker.userData.towTimer += 0.016;

                    if (wrecker.userData.towTimer > 2.5) {
                        const target = wrecker.userData.target;
                        if (target === omnibus && omnibus.route) {
                            omnibus.position.set(omnibus.route[0].x, 0, omnibus.route[0].z);
                            omnibus.userData.currentWaypoint = 0;
                            omnibus.userData.state = 'moving';
                            omnibus.userData.stuckTime = 0;
                            omnibus.userData.wreckerAssigned = false;
                        } else if (target) {
                            const carIdx = cars.indexOf(target);
                            if (carIdx >= 0) {
                                scene.remove(target);
                                cars.splice(carIdx, 1);
                                setTimeout(() => {
                                    const newCar = mkCar(0x000000 + Math.floor(Math.random() * 0xffffff));
                                    placeCarOnRoad(newCar);
                                    cars.push(newCar);
                                    scene.add(newCar);
                                }, 3000);
                            }
                        }
                        wrecker.userData.state = 'leaving';
                        wrecker.userData.leaveDir = wrecker.position.x > 0 ? 1 : -1;
                    }
                } else if (wrecker.userData.state === 'leaving') {
                    wrecker.position.x += wrecker.userData.leaveDir * wrecker.userData.spd * 1.5;
                    wrecker.rotation.y = wrecker.userData.leaveDir > 0 ? -Math.PI / 2 : Math.PI / 2;

                    if (Math.abs(wrecker.position.x) > halfSize + 25) {
                        scene.remove(wrecker);
                        wreckers.splice(idx, 1);

                        // Check if all wreckers done
                        if (wreckers.length === 0 && intersectionGridlock) {
                            intersectionGridlock = null;
                            if (policeCar && policeCar.userData.respondingToGridlock) {
                                policeCar.userData.respondingToGridlock = false;
                                policeCar.userData.gridlockCenter = null;
                                policeCar.userData.returningToRoad = true;
                                notify('✅ Intersection cleared!', 2500);
                            }
                        }
                    }
                }
            });
        }

        function updOmnibus(t) {
            if (!omnibus || !omnibus.route) return;

            const route = omnibus.route;
            const nextWaypoint = route[(omnibus.userData.currentWaypoint + 1) % route.length];

            // Ring bell occasionally
            if (omnibus.userData.bell && Math.random() < 0.002) {
                omnibus.userData.bell.scale.setScalar(1.3);
                setTimeout(() => {
                    if (omnibus.userData.bell) omnibus.userData.bell.scale.setScalar(1);
                }, 100);
            }

            if (omnibus.userData.state === 'moving') {
                // Move toward next waypoint
                const dx = nextWaypoint.x - omnibus.position.x;
                const dz = nextWaypoint.z - omnibus.position.z;
                const dist = Math.sqrt(dx * dx + dz * dz);

                if (dist < 0.5) {
                    // Arrived at waypoint
                    omnibus.position.set(nextWaypoint.x, 0, nextWaypoint.z);
                    omnibus.userData.currentWaypoint = (omnibus.userData.currentWaypoint + 1) % route.length;

                    if (nextWaypoint.isStop) {
                        // This is a bus stop - stop for passengers
                        omnibus.userData.state = 'stopping';
                        omnibus.userData.stopTimer = 0;
                        omnibus.userData.currentStopIdx = nextWaypoint.stopIdx;
                    }
                    // If not a stop (just a corner), keep moving to next waypoint
                } else {
                    // Check for obstacles ahead
                    let omnibusBlocked = false;
                    const dirX = dx / dist;
                    const dirZ = dz / dist;

                    // Check cars - use proper forward/lateral distance
                    for (const car of cars) {
                        const cdx = car.position.x - omnibus.position.x;
                        const cdz = car.position.z - omnibus.position.z;
                        const forward = cdx * dirX + cdz * dirZ;
                        const lateral = Math.abs(cdx * (-dirZ) + cdz * dirX);
                        if (forward > 0 && forward < 8 && lateral < 2.5) {
                            omnibusBlocked = true;
                            break;
                        }
                    }

                    // Check emergency vehicles
                    if (!omnibusBlocked) {
                        for (const ev of emergencyVehicles) {
                            const edx = ev.position.x - omnibus.position.x;
                            const edz = ev.position.z - omnibus.position.z;
                            const forward = edx * dirX + edz * dirZ;
                            const lateral = Math.abs(edx * (-dirZ) + edz * dirX);
                            if (forward > 0 && forward < 8 && lateral < 2.5) {
                                omnibusBlocked = true;
                                break;
                            }
                        }
                    }

                    // Check bicycles
                    if (!omnibusBlocked) {
                        for (const bike of bicycles) {
                            const bdx = bike.position.x - omnibus.position.x;
                            const bdz = bike.position.z - omnibus.position.z;
                            const forward = bdx * dirX + bdz * dirZ;
                            const lateral = Math.abs(bdx * (-dirZ) + bdz * dirX);
                            if (forward > 0 && forward < 6 && lateral < 2) {
                                omnibusBlocked = true;
                                break;
                            }
                        }
                    }

                    // Check garbage truck
                    if (!omnibusBlocked && garbageTruck && garbageTruckActive) {
                        const gdx = garbageTruck.position.x - omnibus.position.x;
                        const gdz = garbageTruck.position.z - omnibus.position.z;
                        const forward = gdx * dirX + gdz * dirZ;
                        const lateral = Math.abs(gdx * (-dirZ) + gdz * dirX);
                        if (forward > 0 && forward < 10 && lateral < 3) {
                            omnibusBlocked = true;
                        }
                    }

                    // Check wreckers
                    if (!omnibusBlocked) {
                        for (const wrecker of wreckers) {
                            const wdx = wrecker.position.x - omnibus.position.x;
                            const wdz = wrecker.position.z - omnibus.position.z;
                            const forward = wdx * dirX + wdz * dirZ;
                            const lateral = Math.abs(wdx * (-dirZ) + wdz * dirX);
                            if (forward > 0 && forward < 10 && lateral < 3) {
                                omnibusBlocked = true;
                                break;
                            }
                        }
                    }

                    // Check pedestrians (but not ones waiting for bus)
                    if (!omnibusBlocked) {
                        for (const ped of peds) {
                            if (!ped.visible) continue;
                            if (ped.userData.waitingForBus) continue;
                            const pdx = ped.position.x - omnibus.position.x;
                            const pdz = ped.position.z - omnibus.position.z;
                            const forward = pdx * dirX + pdz * dirZ;
                            const lateral = Math.abs(pdx * (-dirZ) + pdz * dirX);
                            if (forward > 0 && forward < 5 && lateral < 2) {
                                omnibusBlocked = true;
                                break;
                            }
                        }
                    }

                    if (!omnibusBlocked) {
                        // Keep moving
                        const speed = omnibus.userData.spd;
                        omnibus.position.x += (dx / dist) * speed;
                        omnibus.position.z += (dz / dist) * speed;

                        // Face direction of travel (front of bus is +X, so subtract PI/2)
                        omnibus.rotation.y = Math.atan2(dx, dz) - Math.PI / 2;

                        // Reset stuck time when moving
                        omnibus.userData.stuckTime = 0;
                        omnibus.userData.lastPos = { x: omnibus.position.x, z: omnibus.position.z };
                    } else {
                        // Increment stuck time when blocked
                        omnibus.userData.stuckTime += 0.016;
                    }
                }
            } else if (omnibus.userData.state === 'stopping') {
                omnibus.userData.stopTimer += 0.016;

                if (omnibus.userData.stopTimer > 0.5) {
                    omnibus.userData.state = 'boarding';
                    omnibus.userData.stopTimer = 0;

                    // Get the actual bus stop for passenger operations
                    const stop = omnibusStops[omnibus.userData.currentStopIdx];

                    // Let passengers off
                    const numOff = Math.min(omnibusPassengers.length, Math.floor(Math.random() * 3));
                    for (let i = 0; i < numOff; i++) {
                        disembarkPassenger(stop);
                    }

                    // Board waiting passengers - pick up all waiting (up to capacity)
                    const numBoard = Math.min(
                        stop.waitingPeds.length,
                        OMNIBUS_MAX_PASSENGERS - omnibusPassengers.length
                    );
                    for (let i = 0; i < numBoard; i++) {
                        boardPassenger(stop);
                    }

                    updatePassengerDots();
                }
            } else if (omnibus.userData.state === 'boarding') {
                omnibus.userData.stopTimer += 0.016;

                if (omnibus.userData.stopTimer > 2) {
                    // Done boarding, continue route
                    omnibus.userData.state = 'moving';
                }
            }
            
            // Randomly assign pedestrians to wait at stops
            if (Math.random() < 0.003) {
                assignPedToStop();
            }

            // Dispatch jitneys to crowded stops (check every ~2 seconds)
            if (Math.random() < 0.008) {
                updJitneyDispatch();
            }

            // Update jitney pickups
            updJitneyPickup();
        }

        function assignPedToStop() {
            // Find a random walking pedestrian near a bus stop
            const eligiblePeds = peds.filter(p =>
                p.userData.state === 'walking' &&
                !p.userData.waitingForBus &&
                p.userData.state !== 'toSubwayStation' &&
                p.userData.state !== 'inSubway'
            );
            
            if (eligiblePeds.length === 0) return;
            
            const ped = eligiblePeds[Math.floor(Math.random() * eligiblePeds.length)];
            
            // Find nearest bus stop
            let nearestStop = null;
            let nearestDist = Infinity;
            omnibusStops.forEach(stop => {
                const dx = stop.x - ped.position.x;
                const dz = stop.z - ped.position.z;
                const dist = Math.sqrt(dx * dx + dz * dz);
                if (dist < nearestDist && dist < 25) {
                    nearestDist = dist;
                    nearestStop = stop;
                }
            });
            
            if (nearestStop && nearestStop.waitingPeds.length < 4) {
                // Send pedestrian to bus stop
                ped.userData.waitingForBus = true;
                ped.userData.targetStop = nearestStop;
                ped.userData.state = 'toBusStop';
                
                // Position near the bench
                const offset = nearestStop.waitingPeds.length * 0.5;
                ped.userData.target = new THREE.Vector3(
                    nearestStop.x + 0.8 + offset * 0.3,
                    0.15,
                    nearestStop.z + (Math.random() - 0.5) * 0.5
                );
                
                nearestStop.waitingPeds.push(ped);
            }
        }
        
        function boardPassenger(stop) {
            if (stop.waitingPeds.length === 0) return;
            
            const ped = stop.waitingPeds.shift();
            if (ped) {
                // Remove from scene, add to bus
                ped.visible = false;
                ped.userData.state = 'onBus';
                ped.userData.waitingForBus = false;
                omnibusPassengers.push(ped);
            }
        }
        
        function disembarkPassenger(stop) {
            if (omnibusPassengers.length === 0) return;
            
            const ped = omnibusPassengers.shift();
            if (ped) {
                // Place near the bus stop
                ped.position.set(
                    stop.x + 1.5 + Math.random(),
                    0.15,
                    stop.z + (Math.random() - 0.5) * 2
                );
                ped.visible = true;
                ped.userData.state = 'walking';
                ped.userData.waitingForBus = false;
                
                // Find which block they're in
                const bx = Math.floor((ped.position.x + halfSize) / GRID.cellSize);
                const bz = Math.floor((ped.position.z + halfSize) / GRID.cellSize);
                ped.userData.currentBlock = { 
                    x: Math.max(0, Math.min(bx, GRID.gridCount - 1)), 
                    z: Math.max(0, Math.min(bz, GRID.gridCount - 1)) 
                };
                
                setNewPedTarget(ped);
            }
        }
        
        function updatePassengerDots() {
            if (!omnibus || !omnibus.userData.passengerDots) return;
            
            omnibus.userData.passengerDots.forEach((dot, i) => {
                if (i < omnibusPassengers.length) {
                    dot.material.color.setHex(0x44ff44);
                    dot.material.opacity = 1;
                } else {
                    dot.material.color.setHex(0x333333);
                    dot.material.opacity = 0.3;
                }
            });
        }

        // Dispatch jitneys to crowded bus stops
        function updJitneyDispatch() {
            // Find stops with 3+ waiting passengers
            const crowdedStops = omnibusStops.filter(stop => stop.waitingPeds && stop.waitingPeds.length >= 3);
            if (crowdedStops.length === 0) return;

            // Find available jitneys (not already heading to a stop)
            const jitneys = cars.filter(c => c.userData.busType === 'jitney' && !c.userData.dispatchedToStop);
            if (jitneys.length === 0) return;

            crowdedStops.forEach(stop => {
                // Find nearest jitney not already dispatched
                let nearestJitney = null;
                let nearestDist = Infinity;

                jitneys.forEach(jitney => {
                    if (jitney.userData.dispatchedToStop) return;
                    const dx = stop.x - jitney.position.x;
                    const dz = stop.z - jitney.position.z;
                    const dist = Math.sqrt(dx * dx + dz * dz);
                    if (dist < nearestDist) {
                        nearestDist = dist;
                        nearestJitney = jitney;
                    }
                });

                if (nearestJitney && nearestDist < 60) {
                    nearestJitney.userData.dispatchedToStop = stop;
                    nearestJitney.userData.dispatchTimeout = 10; // seconds before giving up
                }
            });
        }

        // Handle jitney pickup at stops
        function updJitneyPickup() {
            cars.forEach(car => {
                if (car.userData.busType !== 'jitney') return;

                const stop = car.userData.dispatchedToStop;
                if (!stop) return;

                // Check if arrived at stop
                const dx = stop.x - car.position.x;
                const dz = stop.z - car.position.z;
                const dist = Math.sqrt(dx * dx + dz * dz);

                if (dist < 5) {
                    // Pick up waiting passengers (up to 4)
                    const numPickup = Math.min(stop.waitingPeds.length, 4);
                    for (let i = 0; i < numPickup; i++) {
                        const ped = stop.waitingPeds.shift();
                        if (ped) {
                            ped.visible = false;
                            ped.userData.state = 'onBus';
                            ped.userData.waitingForBus = false;
                            // Jitney passengers get dropped off after a delay
                            setTimeout(() => {
                                if (ped) {
                                    ped.position.set(
                                        car.position.x + (Math.random() - 0.5) * 4,
                                        0.15,
                                        car.position.z + (Math.random() - 0.5) * 4
                                    );
                                    ped.visible = true;
                                    ped.userData.state = 'walking';
                                    // Find which block they're in
                                    const bx = Math.floor((ped.position.x + halfSize) / GRID.cellSize);
                                    const bz = Math.floor((ped.position.z + halfSize) / GRID.cellSize);
                                    ped.userData.currentBlock = { x: Math.max(0, Math.min(GRID.gridCount - 1, bx)), z: Math.max(0, Math.min(GRID.gridCount - 1, bz)) };
                                    setNewPedTarget(ped);
                                }
                            }, 3000 + Math.random() * 5000);
                        }
                    }
                    car.userData.dispatchedToStop = null;
                } else {
                    // Timeout check
                    car.userData.dispatchTimeout -= 0.016;
                    if (car.userData.dispatchTimeout <= 0) {
                        car.userData.dispatchedToStop = null;
                    }
                }
            });
        }

        function mkSubwayTrack(startX, startZ, endX, endZ) {
            const g = new THREE.Group();

            // For east-west track (same Z), create beam along X axis directly
            const isEastWest = Math.abs(startZ - endZ) < 0.1;
            const length = isEastWest ? Math.abs(endX - startX) : Math.abs(endZ - startZ);
            const centerX = (startX + endX) / 2;
            const centerZ = (startZ + endZ) / 2;

            // Main track beam - oriented correctly for direction
            const beamGeo = isEastWest
                ? new THREE.BoxGeometry(length, 0.5, 2.5)  // Long along X
                : new THREE.BoxGeometry(2.5, 0.5, length); // Long along Z
            const beam = new THREE.Mesh(beamGeo, new THREE.MeshStandardMaterial({ color: 0x444444 }));
            beam.position.set(centerX, SUBWAY_CFG.trackHeight - 0.25, centerZ);
            beam.receiveShadow = true;
            g.add(beam);

            // Rails on top of beam
            const railMat = new THREE.MeshStandardMaterial({ color: 0x666666, metalness: 0.5 });
            [-0.6, 0.6].forEach(offset => {
                const railGeo = isEastWest
                    ? new THREE.BoxGeometry(length, 0.1, 0.1)
                    : new THREE.BoxGeometry(0.1, 0.1, length);
                const rail = new THREE.Mesh(railGeo, railMat);
                if (isEastWest) {
                    rail.position.set(centerX, SUBWAY_CFG.trackHeight + 0.05, centerZ + offset);
                } else {
                    rail.position.set(centerX + offset, SUBWAY_CFG.trackHeight + 0.05, centerZ);
                }
                g.add(rail);
            });

            // Guard rails on both sides
            const guardMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
            [-1.3, 1.3].forEach(offset => {
                const guardGeo = isEastWest
                    ? new THREE.BoxGeometry(length, 0.8, 0.08)
                    : new THREE.BoxGeometry(0.08, 0.8, length);
                const guard = new THREE.Mesh(guardGeo, guardMat);
                if (isEastWest) {
                    guard.position.set(centerX, SUBWAY_CFG.trackHeight + 0.4, centerZ + offset);
                } else {
                    guard.position.set(centerX + offset, SUBWAY_CFG.trackHeight + 0.4, centerZ);
                }
                g.add(guard);
            });

            // Support columns every 12 units - directly under the track beam
            const pillarMat = new THREE.MeshStandardMaterial({ color: 0x666666 });
            const numSupports = Math.floor(length / 12) + 1;
            for (let i = 0; i <= numSupports; i++) {
                const t = i / numSupports;
                const px = isEastWest ? startX + (endX - startX) * t : centerX;
                const pz = isEastWest ? centerZ : startZ + (endZ - startZ) * t;

                const pillar = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.3, 0.35, SUBWAY_CFG.trackHeight - 0.25, 12),
                    pillarMat
                );
                pillar.position.set(px, (SUBWAY_CFG.trackHeight - 0.25) / 2, pz);
                pillar.castShadow = true;
                g.add(pillar);
            }

            g.userData = { type: 'subwayTrack' };
            return g;
        }

        function createSubwayLine() {
            // Simple STRAIGHT elevated subway line above the main east-west road
            // Track runs directly above road center (z = 0)
            const trackZ = 0; // Directly above road center
            const trackExtent = totalSize / 2 + 25; // Track extends beyond visible area

            // Waypoints include off-screen endpoints so train goes out of view
            // isStation: true means it's a real station (train stops), false means just a waypoint
            subwayStations = [
                { x: -trackExtent - 10, z: trackZ, name: 'Off West', isStation: false },
                { x: -36, z: trackZ, name: 'West End', rotation: 0, isStation: true },
                { x: -12, z: trackZ, name: 'Downtown', rotation: 0, isStation: true },
                { x: 12, z: trackZ, name: 'Central', rotation: 0, isStation: true },
                { x: 36, z: trackZ, name: 'East End', rotation: 0, isStation: true },
                { x: trackExtent + 10, z: trackZ, name: 'Off East', isStation: false }
            ];

            // Create station structures only for real stations
            let stationNum = 1;
            subwayStations.forEach((station) => {
                if (!station.isStation) return;

                const stationMesh = mkSubwayStation(stationNum++);
                stationMesh.position.set(station.x, 0, station.z);
                stationMesh.rotation.y = station.rotation;
                scene.add(stationMesh);
                station.mesh = stationMesh;

                // Add big SUBWAY sign on the sidewalk (offset from track)
                const subwaySign = mkSubwaySign();
                subwaySign.position.set(station.x, 0, station.z - GRID.roadWidth/2 - 2);
                // Rotate every other sign by 90 degrees
                if (stationNum % 2 === 0) {
                    subwaySign.rotation.y = Math.PI / 2;
                }
                scene.add(subwaySign);
            });

            // Create ONE straight elevated track extending to edges of playing field
            const track = mkSubwayTrack(
                -trackExtent,  // Start at west edge of playing field
                trackZ,
                trackExtent,   // End at east edge of playing field
                trackZ
            );
            scene.add(track);

            // Create train and position off-screen (will enter from west)
            subwayTrain = mkSubwayTrain();
            subwayTrain.position.set(
                subwayStations[0].x,  // Start off-screen west
                SUBWAY_CFG.trackHeight,
                trackZ
            );
            // Train is built along X axis - no rotation needed for east-west travel
            // rotation.y = 0 means facing +X (east), Math.PI means facing -X (west)
            subwayTrain.rotation.y = 0; // Start facing east
            subwayTrain.userData.direction = 1; // 1 = going east, -1 = going west
            scene.add(subwayTrain);

            notify('Subway Line now running!', 3000);
        }

        function updSubway(t) {
            if (!subwayTrain) return;

            const currentStation = subwayStations[subwayTrain.userData.currentStation];
            const nextWaypoint = subwayStations[subwayTrain.userData.nextStation];

            if (subwayTrain.userData.state === 'moving') {
                // For straight line: only move along X axis
                const dx = nextWaypoint.x - subwayTrain.position.x;
                const dist = Math.abs(dx);

                if (dist < 0.05) {
                    // Arrived at waypoint (very close - smooth stop)
                    subwayTrain.position.x = nextWaypoint.x;

                    // Only stop at real stations, not off-screen waypoints
                    if (nextWaypoint.isStation) {
                        subwayTrain.userData.state = 'stopping';
                        subwayTrain.userData.stopTimer = 0;
                    } else {
                        // Off-screen waypoint - reverse direction immediately
                        subwayTrain.userData.currentStation = subwayTrain.userData.nextStation;
                        subwayTrain.userData.direction *= -1;
                        subwayTrain.userData.nextStation += subwayTrain.userData.direction;
                        subwayTrain.rotation.y = subwayTrain.userData.direction > 0 ? 0 : Math.PI;
                    }
                } else {
                    // Move toward next waypoint (only X movement for straight track)
                    let speed = subwayTrain.userData.spd;
                    const dir = subwayTrain.userData.direction || 1;

                    // Smooth deceleration when approaching a station (within 8 units)
                    if (nextWaypoint.isStation && dist < 8) {
                        // Ease out: speed reduces as we get closer
                        const slowFactor = Math.max(0.15, dist / 8);
                        speed *= slowFactor;
                    }

                    subwayTrain.position.x += dir * speed;

                    // Train rotation based on direction (0 = facing +X, PI = facing -X)
                    subwayTrain.rotation.y = dir > 0 ? 0 : Math.PI;
                }
            } else if (subwayTrain.userData.state === 'stopping') {
                subwayTrain.userData.stopTimer += 0.016;

                if (subwayTrain.userData.stopTimer > SUBWAY_CFG.stopDuration) {
                    // Update station indices for back-and-forth movement
                    subwayTrain.userData.currentStation = subwayTrain.userData.nextStation;

                    // Move to next waypoint
                    const dir = subwayTrain.userData.direction || 1;
                    let nextIdx = subwayTrain.userData.nextStation + dir;

                    // Clamp to valid range (shouldn't happen, but safety check)
                    if (nextIdx >= subwayStations.length) nextIdx = subwayStations.length - 1;
                    if (nextIdx < 0) nextIdx = 0;

                    subwayTrain.userData.nextStation = nextIdx;
                    subwayTrain.userData.state = 'moving';
                }
            }

            // Update station activity lights based on nearby pedestrians
            subwayStations.forEach(station => {
                if (!station.mesh) return;

                // Check for pedestrians heading to or at this station
                let hasActivity = false;
                for (const p of peds) {
                    if (p.userData.targetStation === station ||
                        (p.userData.exitStation === station && p.userData.state === 'inSubway')) {
                        hasActivity = true;
                        break;
                    }
                }

                // Also show activity when train is stopped at this station
                if (subwayTrain && subwayTrain.userData.state === 'stopping') {
                    const trainStation = subwayStations[subwayTrain.userData.nextStation];
                    if (trainStation === station) hasActivity = true;
                }

                // Update activity light
                station.mesh.traverse(child => {
                    if (child.userData.isActivityLight) {
                        child.material.opacity = hasActivity ? 0.8 : 0.2;
                        child.material.color.setHex(hasActivity ? 0x00ff00 : 0x004400);
                    }
                });
            });
        }

        function placeCarOnRoad(car) {
            let roadIdx = Math.floor(Math.random() * (GRID.gridCount + 1));
            let roadPos = -halfSize + roadIdx * GRID.cellSize;
            let isHorizontal = Math.random() > 0.5;

            // Skip the subway road (z=0, roadIdx=2) for horizontal roads
            // The subway runs along X-axis at z=0 with pillars
            if (isHorizontal && Math.abs(roadPos) < 1) {
                // Pick a different road or switch to vertical
                if (Math.random() > 0.5) {
                    isHorizontal = false; // Switch to vertical road at same position
                } else {
                    // Pick a different horizontal road (not the center one)
                    const otherRoads = [0, 1, 3, 4]; // Exclude roadIdx 2
                    roadIdx = otherRoads[Math.floor(Math.random() * otherRoads.length)];
                    roadPos = -halfSize + roadIdx * GRID.cellSize;
                }
            }

            const direction = Math.random() > 0.5 ? 1 : -1;
            let startPos = -halfSize + Math.random() * totalSize;

            // Avoid spawning at intersections (within 6 units of a cross-road)
            for (let i = 0; i <= GRID.gridCount; i++) {
                const crossRoad = -halfSize + i * GRID.cellSize;
                if (Math.abs(startPos - crossRoad) < 6) {
                    // Move away from intersection
                    startPos = crossRoad + (startPos > crossRoad ? 8 : -8);
                    break;
                }
            }
            
            // Right-side driving: lane offset depends on direction
            // X-axis: going +X stays on +Z side, going -X stays on -Z side
            // Z-axis: going +Z stays on -X side, going -Z stays on +X side
            let laneOffset;
            
            if (isHorizontal) {
                // X-axis road
                laneOffset = direction * 1.8; // +dir = +Z lane, -dir = -Z lane (correct)
                car.position.set(startPos, 0, roadPos + laneOffset);
                car.userData.roadPos = roadPos;
                car.userData.axis = 'x';
                car.userData.dir = direction;
                car.rotation.y = direction > 0 ? 0 : Math.PI;
            } else {
                // Z-axis road: flip the lane logic
                laneOffset = -direction * 1.8; // +dir(+Z) = -X lane, -dir(-Z) = +X lane
                car.position.set(roadPos + laneOffset, 0, startPos);
                car.userData.roadPos = roadPos;
                car.userData.axis = 'z';
                car.userData.dir = direction;
                car.rotation.y = direction > 0 ? -Math.PI / 2 : Math.PI / 2;
            }
            
            car.userData.laneOffset = laneOffset;
            car.userData.originalLaneOffset = laneOffset; // Store original lane for returning after passing
            car.userData.inPassingLane = false;
            car.userData.spd = 0.12 + Math.random() * 0.06;

            // Gridlock tracking
            car.userData.lastPos = { x: car.position.x, z: car.position.z };
            car.userData.stuckTime = 0;
            car.userData.beingHelped = false;
        }
