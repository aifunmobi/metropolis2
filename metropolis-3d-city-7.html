<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metropolis - 3D City Explorer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #87CEEB; font-family: system-ui, sans-serif; }
        #c { width: 100vw; height: 100vh; display: block; }
        
        #hud {
            position: fixed; top: 20px; left: 20px;
            color: #000; font-size: 14px; z-index: 100;
            background: rgba(255,255,255,0.8); padding: 10px 15px; border-radius: 8px;
            pointer-events: none;
        }
        #hud div { margin-bottom: 4px; }
        #hud .label { color: #666; font-size: 10px; }
        
        #weather { position: fixed; top: 20px; right: 20px; color: #333; font-size: 14px; z-index: 100; 
            background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; }
        
        #controls {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: #333; font-size: 12px; text-align: center; z-index: 100;
            background: rgba(255,255,255,0.9); padding: 10px 20px; border-radius: 8px;
        }
        
        #minimap {
            position: fixed; bottom: 70px; right: 20px;
            width: 130px; height: 130px; border-radius: 50%;
            border: 3px solid rgba(0,100,200,0.6);
            background: rgba(200,230,255,0.9); z-index: 100; overflow: hidden;
        }
        #minimap canvas { width: 100%; height: 100%; }
        
        #loading {
            position: fixed; inset: 0; background: linear-gradient(135deg, #87CEEB, #4a90c2);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; transition: opacity 0.8s;
        }
        #loading.done { opacity: 0; pointer-events: none; }
        #loading h1 { color: #fff; font-size: 42px; letter-spacing: 8px; margin-bottom: 25px; text-shadow: 2px 2px 10px rgba(0,0,0,0.3); }
        #bar { width: 280px; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; overflow: hidden; }
        #prog { width: 0%; height: 100%; background: #fff; transition: width 0.2s; }
        #ltxt { margin-top: 12px; color: #fff; font-size: 11px; letter-spacing: 2px; }
        
        #notif {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.95); border: 2px solid #4a90c2; padding: 18px 35px;
            color: #333; font-size: 16px; z-index: 200; opacity: 0; transition: opacity 0.4s;
            text-align: center; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        #notif.show { opacity: 1; }

        #traffic-menu {
            position: fixed; top: 20px; right: 140px; z-index: 100;
            background: rgba(255,255,255,0.9); padding: 8px 12px; border-radius: 8px;
            font-size: 14px; color: #333;
        }
        #traffic-menu select {
            background: #fff; border: 1px solid #ccc; border-radius: 4px;
            padding: 4px 8px; font-size: 13px; cursor: pointer;
            margin-left: 5px;
        }
        #traffic-menu select:hover { border-color: #888; }
    </style>
</head>
<body>
    <div id="loading">
        <h1>METROPOLIS</h1>
        <div id="bar"><div id="prog"></div></div>
        <div id="ltxt">INITIALIZING...</div>
    </div>
    
    <canvas id="c"></canvas>
    
    <div id="hud">
        <div><span class="label">ALT</span> <span id="alt">0</span>m</div>
        <div><span class="label">SPD</span> <span id="spd">0</span>km/h</div>
        <div><span class="label">POS</span> <span id="pos">0,0</span></div>
        <div><span class="label">TIME</span> <span id="time">12:00</span></div>
    </div>
    
    <div id="traffic-menu">
        🚗 Traffic:
        <select id="traffic-level">
            <option value="light">Light</option>
            <option value="midday">Mid Day</option>
            <option value="rush">Rush Hour</option>
        </select>
    </div>
    <div id="weather">☀️ Sunny 24°C</div>
    <div id="minimap"><canvas id="mm"></canvas></div>
    <div id="controls">WASD: Move • Q/E: Up/Down • Mouse: Look • Scroll: Zoom • R: Rain • T: Cycle time • Space: Boost • Click to start</div>
    <div id="notif"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://esm.sh/three@0.160.0"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        
        const $ = id => document.getElementById(id);
        
        const GRID = {
            cellSize: 24,
            roadWidth: 8,
            sidewalkWidth: 2,
            gridCount: 4
        };
        
        // Base traffic config (Light traffic)
        const CFG_BASE = { cars: 10, emergencyVehicles: 2, peds: 40, bikes: 3, flocks: 4, taxis: 4 };

        // Traffic multipliers for different levels
        const TRAFFIC_LEVELS = {
            light: 1,
            midday: 3,
            rush: 5
        };

        let currentTrafficLevel = 'light';
        let CFG = { ...CFG_BASE };

        const SKY_COLORS = {
            midnight: 0x0a1525,    // Deep dark blue (no violet)
            dawn: 0xffb366,        // Orange/pink
            day: 0x87CEEB,         // Sky blue
            dusk: 0xff8855,        // Orange (less red/violet)
            night: 0x142538        // Dark blue (no violet)
        };

        const BIRD_CFG = {
            flockSizes: [3, 5, 6, 8],     // Possible flock sizes for variety
            speed: 0.15,                   // Base bird speed
            turnSpeed: 0.03,               // How fast birds can turn
            separationDist: 2,             // Minimum distance between birds
            cohesionDist: 15,              // Max distance for cohesion
            alignmentDist: 10,             // Max distance for alignment
            separationWeight: 1.5,         // Weight of separation force
            cohesionWeight: 0.8,           // Weight of cohesion force
            alignmentWeight: 1.0,          // Weight of alignment force
            wanderWeight: 0.3,             // Weight of random wandering
            minHeight: 15,                 // Minimum flying height
            maxHeight: 60,                 // Maximum flying height
            boundaryMargin: 50,            // How far outside city birds can go
            landingChance: 0.002,          // Per-frame chance a flying bird decides to land
            minLandTime: 5,                // Minimum seconds to stay landed
            maxLandTime: 15,               // Maximum seconds to stay landed
            scatterDistance: 3,            // Distance at which pedestrians scare birds
            landingSpeed: 0.08,            // Speed when descending to land
            takeoffSpeed: 0.12             // Speed when taking off
        };

        const SUBWAY_CFG = {
            trackHeight: 6,           // Height of elevated track above ground
            trainSpeed: 0.12,         // Train movement speed
            stopDuration: 5,          // Seconds train waits at station
            stationSpacing: 40        // Approximate distance between stations
        };

        const ROOFTOP_CFG = {
            partySpawnInterval: 60,    // Seconds between party spawn checks
            partySpawnChance: 0.4,     // Chance to spawn party when checked
            partyDuration: [90, 180],  // Min/max seconds a party lasts
            maxParties: 2,             // Maximum simultaneous parties
            figuresPerGarden: [1, 3],  // Min/max figures on gardens
            figuresPerPool: [1, 2],    // Min/max figures near pools
            figuresPerParty: [4, 8]    // Min/max figures at parties
        };

        let scene, cam, renderer, clock;
        let sunLight = null;      // Directional light reference
        let ambientLight = null;  // Ambient light reference
        let hemiLight = null;     // Hemisphere light reference
        let buildings = [], cars = [], emergencyVehicles = [], peds = [], tlights = [];
        let bicycles = [];
        let taxis = [];
        let highwayCars = []; // Cars traveling on highway between Metropolis and Vegas
        let buildingEntrances = [];
        let allWindows = [];
        let billboards = [];
        let streetlights = [];
        let warningLights = [];  // Red pulsating lights on antenna poles
        let activeRooftops = [];  // Buildings with rooftop features (gardens/pools) for figure placement
        let vel = null, baseSpd = 0.5, boost = false;
        let raining = false, rain = null;

        // Vegas infrastructure
        let theStrip = null;
        let temperatureBillboard = null;
        let welcomeSign = null; // Welcome to Fabulous Las Vegas sign

        // Vegas landmarks for lighting system (Phase 3)
        let vegasLandmarks = [];
        let vegasWindows = []; // Windows on Vegas hotels for flickering animation

        // Global reference for Phase 4 Bellagio fountain show
        let bellagioFountainLake = null;
        
        // Weather system
        let weatherState = 'sunny'; // 'sunny', 'cloudy', 'rain', 'storm'
        let weatherTimer = 0;
        let nextWeatherChange = 30 + Math.random() * 60; // First change in 30-90 seconds
        let stormDebris = [];
        let lightning = null;
        let lastLightning = 0;
        let windDirection = { x: 0, z: 0 };
        let windStrength = 0;

        // Vegas weather - always sunny, independent of Metropolis
        let vegasWeatherState = 'sunny'; // Vegas never changes from sunny
        let vegasTemperature = 95 + Math.floor(Math.random() * 20); // Cached temp for stable HUD
        let vegasTemperatureTimer = 0; // Timer for slow temperature updates

        // Day/night cycle system
        let timeOfDay = 0.25; // 0-1 where 0=midnight, 0.25=dawn, 0.5=noon, 0.75=dusk
        let dayNightSpeed = 0.005; // How fast time passes (full cycle in ~200 seconds at 60fps)
        let isNight = false; // Computed from timeOfDay for quick checks
        let prevIsNight; // Track previous night state for transition detection
        let sunMesh = null;   // Visual sun sphere
        let moonMesh = null;  // Visual moon sphere

        let yaw = 0, pitch = -0.3, keys = {}, discoveries = new Set();
        let secrets = [], mmCtx;

        // Bird flock system
        let flocks = [];  // Array of flock groups, each containing birds[]

        // Subway system
        let subwayTrain = null;
        let subwayStations = [];
        let subwayTrack = null;
        let subwayPassengers = [];      // Pedestrians currently riding subway
        const SUBWAY_MAX_PASSENGERS = 12;

        // Rooftop party system
        let rooftopParties = [];      // Active rooftop party events
        let rooftopFigures = [];      // All rooftop figures (static + party)
        let lastPartySpawn = 0;       // Timer for party spawning

        let lastWindowToggle = 0;
        let lastBikeSpawn = 0;
        let policeChaseTarget = null;
        
        // Gridlock detection system
        let lastGridlockCheck = 0;
        let trafficCop = null;
        let trafficCopTarget = null;
        
        // Special events system
        let specialEvent = null;
        let eventEntities = [];
        let lastEventCheck = 0;
        let eventCooldown = 0;

        // Garbage truck system
        let garbageTruck = null;
        let lastGarbageTruck = 0;
        let garbageTruckActive = false;
        let suctionActive = false;

        // Wrecker/Tow truck system
        let wreckers = []; // Array of active wreckers
        let intersectionGridlock = null; // Track active intersection gridlock response

        let crosswalks = [];
        let signalizedIntersections = []; // Intersections with crosswalks and signals

        const totalSize = GRID.cellSize * GRID.gridCount;
        const halfSize = totalSize / 2;

        const VEGAS_CFG = {
            // Vegas zone is located east of Metropolis (positive X direction)
            zoneStartX: halfSize + 60,        // Highway starts 60 units past Metropolis edge (desert buffer)
            zoneWidth: 120,                   // Vegas zone width (expanded for landmarks)
            zoneDepth: 100,                   // Vegas zone depth (Z axis)
            stripWidth: 12,                   // The Strip is wider than regular roads
            stripLength: 140,                 // Length of The Strip (doubled for real Vegas spacing)
            highwayWidth: 10,                 // Highway wider than city roads
            highwayLength: 100,               // Length of connecting highway (longer journey)
            highwayExtension: 80              // Highway continues past Vegas into distance
        };

        function prog(p, t) {
            $('prog').style.width = p + '%';
            $('ltxt').textContent = t.toUpperCase();
        }

        async function init() {
            prog(5, 'Creating universe...');

            vel = new THREE.Vector3();
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 100, 450);
            
            cam = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 500);
            cam.position.set(0, 40, 0);
            
            renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true });
            renderer.setSize(innerWidth, innerHeight);
            renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            
            clock = new THREE.Clock();
            
            prog(10, 'Lighting...');
            mkLighting();
            mkCelestialBodies();

            prog(20, 'City layout...');
            mkCityLayout();
            mkVegasZoneGround();
            mkVegasHighway();
            mkHighwayCars();
            mkRoute66Sign();

            prog(54, 'The Strip...');
            theStrip = mkTheStrip();
            temperatureBillboard = mkTemperatureBillboard();
            welcomeSign = mkWelcomeSign();
            mkLuxorPyramid();
            mkParisEiffelTower();
            mkBellagio();
            mkCaesarsPalace();
            mkExcaliburCastle();
            mkVegasTouristStores();

            prog(50, 'Buildings...');
            mkBuildings();
            
            prog(60, 'Billboards...');
            mkBillboards();

            prog(65, 'Rooftop amenities...');
            mkRooftopAmenities();

            prog(70, 'Traffic system...');
            mkTrafficLights();
            mkStreetlights();
            mkCars();
            mkEmergencyVehicles();
            mkBuses();
            mkTaxis();

            prog(80, 'Population...');
            mkPeds();
            mkBicycles();
            
            prog(90, 'Secrets...');
            mkSecrets();
            mkFlocks();

            prog(98, 'Systems...');
            setupMM();
            setupInput();
            setupTrafficMenu();

            prog(100, 'Welcome');
            setTimeout(() => {
                $('loading').classList.add('done');
                notify('🌆 Welcome to Metropolis<br>Click to look around!', 3500);
            }, 400);
            
            animate();
        }

        function mkLighting() {
            ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            sunLight = new THREE.DirectionalLight(0xfffacd, 1.2);
            sunLight.position.set(80, 120, 60);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 10;
            sunLight.shadow.camera.far = 300;
            sunLight.shadow.camera.left = -120;
            sunLight.shadow.camera.right = 120;
            sunLight.shadow.camera.top = 120;
            sunLight.shadow.camera.bottom = -120;
            scene.add(sunLight);

            hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x3d5c3d, 0.5);
            scene.add(hemiLight);
        }

        function mkCelestialBodies() {
            // Sun - bright yellow sphere with glow effect
            const sunGeo = new THREE.SphereGeometry(8, 32, 32);
            const sunMat = new THREE.MeshBasicMaterial({
                color: 0xffdd44,
                transparent: true,
                opacity: 1.0
            });
            sunMesh = new THREE.Mesh(sunGeo, sunMat);
            sunMesh.position.set(0, 100, 0); // Will be updated by updDayNight
            scene.add(sunMesh);

            // Sun glow halo
            const glowGeo = new THREE.SphereGeometry(12, 32, 32);
            const glowMat = new THREE.MeshBasicMaterial({
                color: 0xffff88,
                transparent: true,
                opacity: 0.3,
                side: THREE.BackSide
            });
            const sunGlow = new THREE.Mesh(glowGeo, glowMat);
            sunMesh.add(sunGlow); // Attach glow to sun

            // Moon - pale white/gray sphere
            const moonGeo = new THREE.SphereGeometry(5, 32, 32);
            const moonMat = new THREE.MeshBasicMaterial({
                color: 0xeeeecc,
                transparent: true,
                opacity: 1.0
            });
            moonMesh = new THREE.Mesh(moonGeo, moonMat);
            moonMesh.position.set(0, -100, 0); // Start below horizon
            scene.add(moonMesh);

            // Moon crater details (simple dark spots)
            const craterMat = new THREE.MeshBasicMaterial({ color: 0xccccaa });
            const craterPositions = [
                { x: 1, y: 0.5, z: 4, size: 0.8 },
                { x: -1.5, y: -0.8, z: 3.5, size: 1.0 },
                { x: 0.5, y: 1.2, z: 3.8, size: 0.6 }
            ];
            craterPositions.forEach(cp => {
                const crater = new THREE.Mesh(
                    new THREE.CircleGeometry(cp.size, 12),
                    craterMat
                );
                crater.position.set(cp.x, cp.y, cp.z);
                crater.lookAt(0, 0, 0); // Face outward from center
                moonMesh.add(crater);
            });
        }

        function mkCityLayout() {
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(totalSize + 50, totalSize + 50),
                new THREE.MeshStandardMaterial({ color: 0x4a6a4a, roughness: 0.9 })
            );
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.1;
            ground.receiveShadow = true;
            scene.add(ground);
            
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.9 }); // Dark gray asphalt (90% black)
            const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.8 });
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            
            for (let i = 0; i <= GRID.gridCount; i++) {
                const pos = -halfSize + i * GRID.cellSize;
                
                const hRoad = new THREE.Mesh(new THREE.PlaneGeometry(totalSize + 10, GRID.roadWidth), roadMat);
                hRoad.rotation.x = -Math.PI / 2;
                hRoad.position.set(0, 0.01, pos);
                scene.add(hRoad);
                
                const vRoad = new THREE.Mesh(new THREE.PlaneGeometry(GRID.roadWidth, totalSize + 10), roadMat);
                vRoad.rotation.x = -Math.PI / 2;
                vRoad.position.set(pos, 0.01, 0);
                scene.add(vRoad);
                
                for (let j = 0; j < GRID.gridCount; j++) {
                    const segStart = -halfSize + j * GRID.cellSize + GRID.roadWidth / 2 + 2;
                    const segEnd = -halfSize + (j + 1) * GRID.cellSize - GRID.roadWidth / 2 - 2;
                    
                    for (let k = segStart; k < segEnd; k += 5) {
                        const hLine = new THREE.Mesh(new THREE.PlaneGeometry(3, 0.2), lineMat);
                        hLine.rotation.x = -Math.PI / 2;
                        hLine.position.set(k + 1.5, 0.02, pos);
                        scene.add(hLine);
                        
                        const vLine = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 3), lineMat);
                        vLine.rotation.x = -Math.PI / 2;
                        vLine.position.set(pos, 0.02, k + 1.5);
                        scene.add(vLine);
                    }
                }
            }
            
            for (let bx = 0; bx < GRID.gridCount; bx++) {
                for (let bz = 0; bz < GRID.gridCount; bz++) {
                    const blockCenterX = -halfSize + bx * GRID.cellSize + GRID.cellSize / 2;
                    const blockCenterZ = -halfSize + bz * GRID.cellSize + GRID.cellSize / 2;
                    const innerSize = GRID.cellSize - GRID.roadWidth;
                    const swDepth = GRID.sidewalkWidth;
                    
                    const nSw = new THREE.Mesh(new THREE.BoxGeometry(innerSize, 0.15, swDepth), sidewalkMat);
                    nSw.position.set(blockCenterX, 0.075, blockCenterZ - innerSize/2 + swDepth/2);
                    scene.add(nSw);
                    
                    const sSw = new THREE.Mesh(new THREE.BoxGeometry(innerSize, 0.15, swDepth), sidewalkMat);
                    sSw.position.set(blockCenterX, 0.075, blockCenterZ + innerSize/2 - swDepth/2);
                    scene.add(sSw);
                    
                    const wSw = new THREE.Mesh(new THREE.BoxGeometry(swDepth, 0.15, innerSize - swDepth * 2), sidewalkMat);
                    wSw.position.set(blockCenterX - innerSize/2 + swDepth/2, 0.075, blockCenterZ);
                    scene.add(wSw);
                    
                    const eSw = new THREE.Mesh(new THREE.BoxGeometry(swDepth, 0.15, innerSize - swDepth * 2), sidewalkMat);
                    eSw.position.set(blockCenterX + innerSize/2 - swDepth/2, 0.075, blockCenterZ);
                    scene.add(eSw);
                }
            }
            
            // Randomly select which interior intersections get crosswalks and signals
            // Interior intersections are at i,j from 1 to GRID.gridCount-1
            for (let i = 1; i < GRID.gridCount; i++) {
                for (let j = 1; j < GRID.gridCount; j++) {
                    // ~60% chance of having crosswalks at this intersection
                    if (Math.random() < 0.6) {
                        const ix = -halfSize + i * GRID.cellSize;
                        const iz = -halfSize + j * GRID.cellSize;
                        signalizedIntersections.push({ x: ix, z: iz });

                        // Create all 4 crosswalks around this intersection
                        const hw = GRID.roadWidth / 2;

                        // North crosswalk (crossing Z-axis road, north of intersection)
                        for (let s = 0; s < 6; s++) {
                            const stripe = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 3), whiteMat);
                            stripe.rotation.x = -Math.PI / 2;
                            stripe.position.set(ix - hw + 1.5 + s * 1, 0.02, iz - hw - 3);
                            scene.add(stripe);
                        }
                        crosswalks.push({ x: ix, z: iz - hw - 3, axis: 'x', width: GRID.roadWidth });

                        // South crosswalk (crossing Z-axis road, south of intersection)
                        for (let s = 0; s < 6; s++) {
                            const stripe = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 3), whiteMat);
                            stripe.rotation.x = -Math.PI / 2;
                            stripe.position.set(ix - hw + 1.5 + s * 1, 0.02, iz + hw + 3);
                            scene.add(stripe);
                        }
                        crosswalks.push({ x: ix, z: iz + hw + 3, axis: 'x', width: GRID.roadWidth });

                        // West crosswalk (crossing X-axis road, west of intersection)
                        for (let s = 0; s < 6; s++) {
                            const stripe = new THREE.Mesh(new THREE.PlaneGeometry(3, 0.5), whiteMat);
                            stripe.rotation.x = -Math.PI / 2;
                            stripe.position.set(ix - hw - 3, 0.02, iz - hw + 1.5 + s * 1);
                            scene.add(stripe);
                        }
                        crosswalks.push({ x: ix - hw - 3, z: iz, axis: 'z', width: GRID.roadWidth });

                        // East crosswalk (crossing X-axis road, east of intersection)
                        for (let s = 0; s < 6; s++) {
                            const stripe = new THREE.Mesh(new THREE.PlaneGeometry(3, 0.5), whiteMat);
                            stripe.rotation.x = -Math.PI / 2;
                            stripe.position.set(ix + hw + 3, 0.02, iz - hw + 1.5 + s * 1);
                            scene.add(stripe);
                        }
                        crosswalks.push({ x: ix + hw + 3, z: iz, axis: 'z', width: GRID.roadWidth });
                    }
                }
            }
        }

        function mkVegasZoneGround() {
            // Create desert ground extending from Metropolis edge past Vegas (includes highway extension)
            const desertMat = new THREE.MeshStandardMaterial({
                color: 0xc2956e, // Sandy desert color
                roughness: 0.95
            });

            // Calculate Vegas ground dimensions (include Strip length + highway extension)
            const stripEndX = VEGAS_CFG.zoneStartX + VEGAS_CFG.highwayLength + VEGAS_CFG.stripLength;
            const extensionEndX = stripEndX + VEGAS_CFG.highwayExtension;
            const vegasGroundWidth = extensionEndX - halfSize;
            const vegasGroundDepth = VEGAS_CFG.zoneDepth;

            // Vegas ground plane positioned to extend from Metropolis edge to past Vegas
            const vegasGround = new THREE.Mesh(
                new THREE.PlaneGeometry(vegasGroundWidth, vegasGroundDepth),
                desertMat
            );
            vegasGround.rotation.x = -Math.PI / 2;
            vegasGround.position.set(
                halfSize + vegasGroundWidth / 2,
                0,
                0
            );
            vegasGround.receiveShadow = true;
            scene.add(vegasGround);

            return vegasGround;
        }

        function mkVegasHighway() {
            const highwayGroup = new THREE.Group();

            // Highway road surface - dark asphalt
            const roadMat = new THREE.MeshStandardMaterial({
                color: 0x333333,
                roughness: 0.9
            });

            // Main highway extending from Metropolis east edge to Vegas zone
            // Starts at halfSize (Metropolis edge) and extends to Vegas
            const startX = halfSize;
            const endX = VEGAS_CFG.zoneStartX + VEGAS_CFG.highwayLength;
            const highwayLength = endX - startX;

            const highway = new THREE.Mesh(
                new THREE.PlaneGeometry(highwayLength, VEGAS_CFG.highwayWidth),
                roadMat
            );
            highway.rotation.x = -Math.PI / 2;
            highway.position.set(startX + highwayLength / 2, 0.02, 0); // Centered on Z=0
            highwayGroup.add(highway);

            // Lane markings - white dashed center line
            const lineMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const dashLength = 3;
            const gapLength = 2;
            for (let x = startX + 2; x < endX - 2; x += dashLength + gapLength) {
                const dash = new THREE.Mesh(
                    new THREE.PlaneGeometry(dashLength, 0.3),
                    lineMat
                );
                dash.rotation.x = -Math.PI / 2;
                dash.position.set(x + dashLength / 2, 0.03, 0);
                highwayGroup.add(dash);
            }

            // Edge lines - solid white
            const edgeY = 0.03;
            const edgeOffset = VEGAS_CFG.highwayWidth / 2 - 0.5;
            for (const side of [-1, 1]) {
                const edge = new THREE.Mesh(
                    new THREE.PlaneGeometry(highwayLength - 4, 0.25),
                    lineMat
                );
                edge.rotation.x = -Math.PI / 2;
                edge.position.set(startX + highwayLength / 2, edgeY, side * edgeOffset);
                highwayGroup.add(edge);
            }

            // Desert ground alongside highway
            const desertMat = new THREE.MeshStandardMaterial({
                color: 0xc2956e, // Sandy desert color
                roughness: 0.95
            });

            // Desert strips on both sides of highway
            const desertWidth = 25;
            for (const side of [-1, 1]) {
                const desert = new THREE.Mesh(
                    new THREE.PlaneGeometry(highwayLength + 20, desertWidth),
                    desertMat
                );
                desert.rotation.x = -Math.PI / 2;
                desert.position.set(
                    startX + highwayLength / 2,
                    0.005,
                    side * (VEGAS_CFG.highwayWidth / 2 + desertWidth / 2)
                );
                highwayGroup.add(desert);
            }

            // Highway extension past Vegas Strip into distance
            const stripEndX = VEGAS_CFG.zoneStartX + VEGAS_CFG.highwayLength + VEGAS_CFG.stripLength;
            const extLength = VEGAS_CFG.highwayExtension;

            // Extension road surface
            const extRoad = new THREE.Mesh(
                new THREE.PlaneGeometry(extLength, VEGAS_CFG.highwayWidth),
                roadMat
            );
            extRoad.rotation.x = -Math.PI / 2;
            extRoad.position.set(stripEndX + extLength / 2, 0.02, 0);
            highwayGroup.add(extRoad);

            // Extension dashed center line
            for (let x = stripEndX + 2; x < stripEndX + extLength - 2; x += dashLength + gapLength) {
                const dash = new THREE.Mesh(
                    new THREE.PlaneGeometry(dashLength, 0.3),
                    lineMat
                );
                dash.rotation.x = -Math.PI / 2;
                dash.position.set(x + dashLength / 2, 0.03, 0);
                highwayGroup.add(dash);
            }

            // Extension edge lines
            for (const side of [-1, 1]) {
                const extEdge = new THREE.Mesh(
                    new THREE.PlaneGeometry(extLength - 4, 0.25),
                    lineMat
                );
                extEdge.rotation.x = -Math.PI / 2;
                extEdge.position.set(stripEndX + extLength / 2, edgeY, side * edgeOffset);
                highwayGroup.add(extEdge);
            }

            // Extension desert strips
            for (const side of [-1, 1]) {
                const extDesert = new THREE.Mesh(
                    new THREE.PlaneGeometry(extLength + 10, desertWidth),
                    desertMat
                );
                extDesert.rotation.x = -Math.PI / 2;
                extDesert.position.set(
                    stripEndX + extLength / 2,
                    0.005,
                    side * (VEGAS_CFG.highwayWidth / 2 + desertWidth / 2)
                );
                highwayGroup.add(extDesert);
            }

            scene.add(highwayGroup);
            return highwayGroup;
        }

        function mkHighwayCars() {
            // Spawn varied vehicles traveling between Metropolis and Vegas
            const numVehicles = 12 + Math.floor(Math.random() * 5); // 12-16 vehicles
            const carColors = [0xff3333, 0x3366ff, 0x33cc33, 0xffcc00, 0xcc33ff, 0x33cccc, 0xff6600, 0x999999, 0xffffff, 0x111111];

            // Highway bounds (includes extension past Vegas)
            const highwayStartX = halfSize - 10;
            const highwayEndX = VEGAS_CFG.zoneStartX + VEGAS_CFG.highwayLength + VEGAS_CFG.stripLength + VEGAS_CFG.highwayExtension;
            // US right-hand traffic: eastbound on right (south/+Z), westbound on left (north/-Z)
            const laneEastbound = 2.5;   // South side (toward Vegas)
            const laneWestbound = -2.5;  // North side (toward Metropolis)

            for (let i = 0; i < numVehicles; i++) {
                let vehicle;
                const vehicleType = Math.random();

                // Vehicle variety: 50% cars, 15% sports cars, 15% tour buses, 10% RVs, 10% taxis
                if (vehicleType < 0.50) {
                    const col = carColors[Math.floor(Math.random() * carColors.length)];
                    vehicle = mkCar(col);
                    vehicle.userData.vehicleType = 'car';
                } else if (vehicleType < 0.65) {
                    vehicle = mkSportsCar();
                    vehicle.userData.vehicleType = 'sports';
                } else if (vehicleType < 0.80) {
                    vehicle = mkTourBus();
                    vehicle.userData.vehicleType = 'tourbus';
                } else if (vehicleType < 0.90) {
                    vehicle = mkRV();
                    vehicle.userData.vehicleType = 'rv';
                } else {
                    vehicle = mkTaxi();
                    vehicle.userData.vehicleType = 'taxi';
                }

                // 50% chance eastbound, 50% westbound
                const dir = Math.random() < 0.5 ? 1 : -1;
                const laneZ = dir === 1 ? laneEastbound : laneWestbound;

                // Spread vehicles along highway length
                const xPos = highwayStartX + Math.random() * (highwayEndX - highwayStartX);

                vehicle.position.set(xPos, 0, laneZ);

                // Car model faces +X by default, so:
                // Eastbound (dir=1): face +X = rotation.y = 0
                // Westbound (dir=-1): face -X = rotation.y = Math.PI
                vehicle.rotation.y = dir === 1 ? 0 : Math.PI;

                // Highway vehicle properties
                vehicle.userData.isHighwayCar = true;
                vehicle.userData.highwayDir = dir;
                // Speed varies by vehicle type
                const baseSpeed = vehicle.userData.vehicleType === 'tourbus' ? 0.25 :
                                  vehicle.userData.vehicleType === 'rv' ? 0.22 :
                                  vehicle.userData.vehicleType === 'sports' ? 0.4 :
                                  0.3;
                vehicle.userData.highwaySpeed = baseSpeed + Math.random() * 0.08;
                vehicle.userData.highwayStartX = highwayStartX;
                vehicle.userData.highwayEndX = highwayEndX;

                highwayCars.push(vehicle);
                scene.add(vehicle);
            }
        }

        function updHighwayCars() {
            highwayCars.forEach(car => {
                // Move car along highway
                car.position.x += car.userData.highwayDir * car.userData.highwaySpeed;

                const startX = car.userData.highwayStartX;
                const endX = car.userData.highwayEndX;

                // Wrap around at highway ends
                if (car.userData.highwayDir === 1 && car.position.x > endX) {
                    // Eastbound reached end, reset to start
                    car.position.x = startX;
                } else if (car.userData.highwayDir === -1 && car.position.x < startX) {
                    // Westbound reached start, reset to end
                    car.position.x = endX;
                }
            });
        }

        function mkRoute66Sign() {
            const sign = new THREE.Group();

            // Sign post - weathered wood or metal

                color: 0x665544,
                roughness: 0.8
            });
            const post = new THREE.Mesh(
                new THREE.CylinderGeometry(0.15, 0.18, 4, 8),
                postMat
            );
            post.position.y = 2;
            sign.add(post);

            // Shield-shaped sign using canvas texture
            // Route 66 signs have distinctive shield shape
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // White background
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 256, 256);

            // Black border/shield outline
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(128, 20);      // Top center
            ctx.lineTo(220, 60);      // Top right
            ctx.lineTo(220, 200);     // Bottom right
            ctx.lineTo(128, 240);     // Bottom center
            ctx.lineTo(36, 200);      // Bottom left
            ctx.lineTo(36, 60);       // Top left
            ctx.closePath();
            ctx.stroke();
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // "ROUTE" text
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 28px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('ROUTE', 128, 70);

            // "66" large text
            ctx.font = 'bold 80px Arial';
            ctx.fillText('66', 128, 160);

            // State text (optional)
            ctx.font = '18px Arial';
            ctx.fillText('US', 128, 210);

            const texture = new THREE.CanvasTexture(canvas);
            const signPlane = new THREE.Mesh(
                new THREE.PlaneGeometry(2, 2),
                new THREE.MeshBasicMaterial({ map: texture, transparent: true })
            );
            signPlane.position.y = 4.5;

            signBack.rotation.y = Math.PI;

        function mkTheStrip() {
            const strip = new THREE.Group();

            // Strip continues straight from highway (along X axis) - no T-intersection
            const stripStartX = VEGAS_CFG.zoneStartX + VEGAS_CFG.highwayLength;
            const stripCenterZ = 0;
            const sidewalkWidth = 4; // Wide Vegas sidewalks for tourists
            const lotWidth = 30; // Space for casino buildings

            // Main road surface - runs along X axis (east-west)
            const roadMat = new THREE.MeshStandardMaterial({
                color: 0x2a2a2a,
                roughness: 0.85
            });

            const stripRoad = new THREE.Mesh(
                new THREE.PlaneGeometry(VEGAS_CFG.stripLength, VEGAS_CFG.stripWidth),
                roadMat
            );
            stripRoad.rotation.x = -Math.PI / 2;
            stripRoad.position.set(stripStartX + VEGAS_CFG.stripLength / 2, 0.02, stripCenterZ);
            strip.add(stripRoad);

            // Lane markings - double yellow center line (runs along X)
            const yellowMat = new THREE.MeshStandardMaterial({ color: 0xffcc00 });
            for (const offset of [-0.2, 0.2]) {
                const centerLine = new THREE.Mesh(
                    new THREE.PlaneGeometry(VEGAS_CFG.stripLength - 4, 0.15),
                    yellowMat
                );
                centerLine.rotation.x = -Math.PI / 2;
                centerLine.position.set(stripStartX + VEGAS_CFG.stripLength / 2, 0.025, offset);
                strip.add(centerLine);
            }

            // White edge lines (along X axis)
            const whiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const edgeOffset = VEGAS_CFG.stripWidth / 2 - 0.5;
            for (const side of [-1, 1]) {
                const edgeLine = new THREE.Mesh(
                    new THREE.PlaneGeometry(VEGAS_CFG.stripLength - 4, 0.2),
                    whiteMat
                );
                edgeLine.rotation.x = -Math.PI / 2;
                edgeLine.position.set(stripStartX + VEGAS_CFG.stripLength / 2, 0.025, side * edgeOffset);
                strip.add(edgeLine);
            }

            // Sidewalks on north and south sides of The Strip
            const sidewalkMat = new THREE.MeshStandardMaterial({
                color: 0xccccbb,
                roughness: 0.8
            });

            for (const side of [-1, 1]) {
                const sidewalk = new THREE.Mesh(
                    new THREE.PlaneGeometry(VEGAS_CFG.stripLength, sidewalkWidth),
                    sidewalkMat
                );
                sidewalk.rotation.x = -Math.PI / 2;
                sidewalk.position.set(
                    stripStartX + VEGAS_CFG.stripLength / 2,
                    0.015,
                    side * (VEGAS_CFG.stripWidth / 2 + sidewalkWidth / 2)
                );
                strip.add(sidewalk);

                // Curb between road and sidewalk (runs along X)
                const curbMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
                const curb = new THREE.Mesh(
                    new THREE.BoxGeometry(VEGAS_CFG.stripLength, 0.15, 0.3),
                    curbMat
                );
                curb.position.set(
                    stripStartX + VEGAS_CFG.stripLength / 2,
                    0.075,
                    side * (VEGAS_CFG.stripWidth / 2 + 0.15)
                );
                strip.add(curb);
            }

            // Vegas ground/lot areas on north and south sides (where casinos go)
            const lotMat = new THREE.MeshStandardMaterial({
                color: 0xd4c4a8,
                roughness: 0.9
            });

            for (const side of [-1, 1]) {
                const lot = new THREE.Mesh(
                    new THREE.PlaneGeometry(VEGAS_CFG.stripLength + 20, lotWidth),
                    lotMat
                );
                lot.rotation.x = -Math.PI / 2;
                lot.position.set(
                    stripStartX + VEGAS_CFG.stripLength / 2,
                    0.02, // Higher to avoid z-fighting with desert ground
                    side * (VEGAS_CFG.stripWidth / 2 + sidewalkWidth + lotWidth / 2)
                );
                strip.add(lot);
            }

            // No T-intersection needed - Strip continues straight from highway

            scene.add(strip);

            // Store Strip boundaries for new layout (X-axis oriented)
            strip.userData = {
                centerZ: stripCenterZ,
                startX: stripStartX,
                endX: stripStartX + VEGAS_CFG.stripLength,
                width: VEGAS_CFG.stripWidth,
                sidewalkWidth: sidewalkWidth,
                lotWidth: lotWidth
            };

            return strip;
        }

        function mkTemperatureBillboard() {
            const billboard = new THREE.Group();

            // Billboard structure - Vegas-style with support poles
            const poleMat = new THREE.MeshStandardMaterial({
                color: 0x666666,
                metalness: 0.7
            });

            // Two support poles
            const poleHeight = 8;
            for (const offset of [-2, 2]) {
                const pole = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.2, 0.25, poleHeight, 8),
                    poleMat
                );
                pole.position.set(offset, poleHeight / 2, 0);
                billboard.add(pole);
            }

            // Sign backing - dark for contrast
            const backingMat = new THREE.MeshStandardMaterial({
                color: 0x111111,
                roughness: 0.3
            });
            const backing = new THREE.Mesh(
                new THREE.BoxGeometry(6, 3, 0.3),
                backingMat
            );
            backing.position.set(0, poleHeight + 1.5, 0);
            billboard.add(backing);

            // Create canvas for temperature display
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // Store canvas and texture for updates
            billboard.userData.canvas = canvas;
            billboard.userData.ctx = ctx;

            // Initial temperature
            billboard.userData.temperature = 95 + Math.floor(Math.random() * 20);
            billboard.userData.lastTempUpdate = 0;

            // Draw initial temperature
            drawTemperature(billboard);

            const texture = new THREE.CanvasTexture(canvas);
            billboard.userData.texture = texture;

            const display = new THREE.Mesh(
                new THREE.PlaneGeometry(5.5, 2.75),
                new THREE.MeshBasicMaterial({ map: texture })
            );
            display.position.set(0, poleHeight + 1.5, 0.2);
            billboard.add(display);

            // Back side
            const displayBack = display.clone();
            displayBack.rotation.y = Math.PI;
            displayBack.position.z = -0.2;
            billboard.add(displayBack);

            // Red LED-style border lights
            const ledMat = new THREE.MeshBasicMaterial({ color: 0xff3333 });
            for (let i = 0; i < 20; i++) {
                const led = new THREE.Mesh(
                    new THREE.SphereGeometry(0.08),
                    ledMat.clone()
                );
                // Position around border
                const t = i / 20;
                if (t < 0.25) {
                    led.position.set(-2.7 + (t * 4) * 5.4, poleHeight + 3, 0.2);
                } else if (t < 0.5) {
                    led.position.set(2.7, poleHeight + 3 - ((t - 0.25) * 4) * 2.8, 0.2);
                } else if (t < 0.75) {
                    led.position.set(2.7 - ((t - 0.5) * 4) * 5.4, poleHeight + 0.2, 0.2);
                } else {
                    led.position.set(-2.7, poleHeight + 0.2 + ((t - 0.75) * 4) * 2.8, 0.2);
                }
                led.userData.ledIndex = i;
                billboard.add(led);
            }

            // Position billboard at The Strip entrance
            // Position at Strip entrance (where highway meets Strip), on south side
            const stripStartX = VEGAS_CFG.zoneStartX + VEGAS_CFG.highwayLength;
            billboard.position.set(
                stripStartX + 25, // Near start of Strip
                0,
                VEGAS_CFG.stripWidth / 2 + 8 // South side of road
            );

            // Rotate 90 degrees to face incoming traffic from Metropolis (west)
            billboard.rotation.y = -Math.PI / 2;

            scene.add(billboard);

            // Store reference for updates
            return billboard;
        }

        function drawTemperature(billboard) {
            const ctx = billboard.userData.ctx;
            const canvas = billboard.userData.canvas;
            const temp = billboard.userData.temperature;

            // Clear canvas
            ctx.fillStyle = '#111111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // "TEMPERATURE" header
            ctx.fillStyle = '#ffcc00';
            ctx.font = 'bold 32px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('TEMPERATURE', canvas.width / 2, 50);

            // Large temperature number with LED-style appearance
            ctx.fillStyle = '#ff3333';
            ctx.font = 'bold 100px Arial';
            ctx.fillText(temp + '°F', canvas.width / 2, 160);

            // "LAS VEGAS" footer
            ctx.fillStyle = '#ffffff';
            ctx.font = '24px Arial';
            ctx.fillText('LAS VEGAS', canvas.width / 2, 220);
        }

        function updTemperatureBillboard(billboard, time) {
            // Update temperature every 30 seconds with small fluctuation
            if (time - billboard.userData.lastTempUpdate > 30) {
                billboard.userData.lastTempUpdate = time;

                // Temperature fluctuates between 95-115°F
                const currentTemp = billboard.userData.temperature;
                const change = Math.floor(Math.random() * 5) - 2; // -2 to +2
                billboard.userData.temperature = Math.max(95, Math.min(115, currentTemp + change));

                drawTemperature(billboard);
                billboard.userData.texture.needsUpdate = true;
            }

            // Animate LED border lights (chase pattern)
            billboard.children.forEach(child => {
                if (child.userData.ledIndex !== undefined) {
                    const phase = (time * 2 + child.userData.ledIndex * 0.5) % (Math.PI * 2);
                    const intensity = 0.5 + 0.5 * Math.sin(phase);
                    child.material.color.setRGB(intensity, intensity * 0.2, intensity * 0.2);
                }
            });
        }

        // Create the iconic "Welcome to Fabulous Las Vegas" sign

            );
            blueAccent.position.y = 9;
            sign.add(blueAccent);

            // Canvas texture for text
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // Draw sign text
            ctx.fillStyle = '#cc0000';
            ctx.fillRect(0, 0, 512, 512);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 44px serif';
            ctx.textAlign = 'center';
            ctx.fillText('WELCOME', 256, 130);
            ctx.font = 'italic 54px serif';
            ctx.fillText('to Fabulous', 256, 210);
            ctx.font = 'bold 90px serif';
            ctx.fillText('LAS VEGAS', 256, 330);
            ctx.font = 'bold 40px serif';
            ctx.fillText('NEVADA', 256, 400);

            const texture = new THREE.CanvasTexture(canvas);
            const textPlane = new THREE.Mesh(
                new THREE.PlaneGeometry(9, 9),
                new THREE.MeshBasicMaterial({ map: texture, transparent: true })
            );
            textPlane.position.set(0, 14, 0.4);
            sign.add(textPlane);

            // Back side
            const textPlaneBack = textPlane.clone();
            textPlaneBack.rotation.y = Math.PI;
            textPlaneBack.position.z = -0.4;
            sign.add(textPlaneBack);

            // Support poles
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
            for (const xOff of [-2.5, 2.5]) {
                const pole = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.25, 0.25, 10, 8),
                    poleMat
                );
                pole.position.set(xOff, 5, 0);
                sign.add(pole);
            }

            // Circle medallion at top
            const circleMat = new THREE.MeshStandardMaterial({
                color: 0xffd700,
                metalness: 0.7
            });
            const circle = new THREE.Mesh(
                new THREE.CircleGeometry(1.8, 16),
                circleMat
            );
            circle.position.set(0, 22.5, 0.3);
            sign.add(circle);

            // Back of circle
            const circleBack = new THREE.Mesh(
                new THREE.CircleGeometry(1.8, 16),
                circleMat
            );
            circleBack.rotation.y = Math.PI;
            circleBack.position.set(0, 22.5, -0.3);
            sign.add(circleBack);

            // Chase lights around perimeter (20 bulbs)
            const lights = [];
            const bulbGeo = new THREE.SphereGeometry(0.25, 8, 8);

            // Position bulbs around diamond perimeter
            const numBulbs = 20;
            for (let i = 0; i < numBulbs; i++) {
                const angle = (i / numBulbs) * Math.PI * 2 - Math.PI / 4;
                const radius = diamondSize * 0.55;
                const bulb = new THREE.Mesh(bulbGeo, new THREE.MeshBasicMaterial({ color: 0xffff00 }));
                bulb.position.set(
                    Math.cos(angle) * radius,
                    14 + Math.sin(angle) * radius,
                    0.5
                );
                bulb.userData.lightIndex = i;
                lights.push(bulb);
                sign.add(bulb);
            }

            sign.userData.lights = lights;
            sign.userData.chasePhase = 0;

            // Position at Vegas entrance (where highway meets Strip)
            const stripStartX = theStrip.userData.startX;
            sign.position.set(
                stripStartX - 15, // Just before Strip starts
                0,
                18 // South side of road, visible when approaching
            );

            // Rotate 90 degrees to face incoming traffic from Metropolis (west)
            sign.rotation.y = -Math.PI / 2;

            scene.add(sign);
            return sign;
        }

        // Update welcome sign chase lights
        function updWelcomeSign() {
            if (!welcomeSign) return;
            const lights = welcomeSign.userData.lights;
            welcomeSign.userData.chasePhase += 0.15;

            lights.forEach((bulb, i) => {
                // Create a classic chase light pattern - groups of 3 lit bulbs rotating around
                const phase = (welcomeSign.userData.chasePhase + i * 0.5) % (Math.PI * 2);
                const brightness = Math.sin(phase) > 0.3 ? 1 : 0.15;
                bulb.material.color.setHex(brightness > 0.5 ? 0xffff00 : 0x444400);
            });
        }

        function mkParisEiffelTower() {
            const tower = new THREE.Group();

            const ironColor = 0x4a4a4a;
            const ironMat = new THREE.MeshStandardMaterial({
                color: ironColor,
                metalness: 0.7,
                roughness: 0.4
            });
            const platformMat = new THREE.MeshStandardMaterial({
                color: 0x5a5a5a,
                metalness: 0.6,
                roughness: 0.5
            });

            // Base/foundation - square platform (scaled up 2.5x)
            const foundation = new THREE.Mesh(
                new THREE.BoxGeometry(35, 2, 35),
                new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.9 })
            );
            foundation.position.y = 1;
            foundation.receiveShadow = true;
            tower.add(foundation);

            // Four angled legs (base section) - scaled up 2.5x
            const legHeight = 30;
            const legRadius = 1.25;
            const legSpread = 12; // Distance from center at base
            const legTopSpread = 5; // Distance from center at top

            for (let i = 0; i < 4; i++) {
                const angle = (i * Math.PI / 2) + Math.PI / 4; // 45, 135, 225, 315 degrees
                const leg = new THREE.Mesh(
                    new THREE.CylinderGeometry(legRadius * 0.7, legRadius, legHeight, 8),
                    ironMat
                );

                // Calculate positions
                const baseX = Math.cos(angle) * legSpread;
                const baseZ = Math.sin(angle) * legSpread;
                const topX = Math.cos(angle) * legTopSpread;
                const topZ = Math.sin(angle) * legTopSpread;

                // Position at midpoint
                leg.position.set(
                    (baseX + topX) / 2,
                    legHeight / 2 + 2,
                    (baseZ + topZ) / 2
                );

                // Angle the leg inward
                const dx = topX - baseX;
                const dz = topZ - baseZ;
                const angleX = Math.atan2(dx, legHeight);
                const angleZ = Math.atan2(dz, legHeight);
                leg.rotation.z = angleX;
                leg.rotation.x = -angleZ;

                leg.castShadow = true;
                tower.add(leg);
            }

            // First observation deck (at top of legs) - scaled up
            const deck1 = new THREE.Mesh(
                new THREE.CylinderGeometry(10, 10, 0.8, 8),
                platformMat
            );
            deck1.position.y = legHeight + 2;
            deck1.castShadow = true;
            tower.add(deck1);

            // Middle section - tapered cylinder (scaled up 2.5x)
            const middleHeight = 30;
            const middleSection = new THREE.Mesh(
                new THREE.CylinderGeometry(3, 5.5, middleHeight, 8),
                ironMat
            );
            middleSection.position.y = legHeight + 2 + middleHeight / 2;
            middleSection.castShadow = true;
            tower.add(middleSection);

            // Second observation deck (at top of middle section) - scaled up
            const deck2 = new THREE.Mesh(
                new THREE.CylinderGeometry(7.5, 7.5, 0.6, 8),
                platformMat
            );
            deck2.position.y = legHeight + 2 + middleHeight;
            deck2.castShadow = true;
            tower.add(deck2);

            // Top spire section (scaled up 2.5x)
            const spireHeight = 25;
            const spire = new THREE.Mesh(
                new THREE.CylinderGeometry(0.5, 1.5, spireHeight, 8),
                ironMat
            );
            spire.position.y = legHeight + 2 + middleHeight + spireHeight / 2;
            spire.castShadow = true;
            tower.add(spire);

            // Antenna at very top (scaled up 1.5x)
            const antenna = new THREE.Mesh(
                new THREE.CylinderGeometry(0.075, 0.15, 4.5, 6),
                ironMat
            );
            antenna.position.y = legHeight + 2 + middleHeight + spireHeight + 2.25;
            tower.add(antenna);

            // Position on north side of Strip (negative Z), middle
            const stripStartX = theStrip.userData.startX;
            const stripEndX = theStrip.userData.endX;
            const stripCenterZ = theStrip.userData.centerZ;
            const sidewalkWidth = theStrip.userData.sidewalkWidth;
            const stripWidth = theStrip.userData.width;
            const stripLength = stripEndX - stripStartX;

            tower.position.set(
                stripStartX + stripLength * 0.35, // Toward entrance
                0,
                stripCenterZ - stripWidth / 2 - sidewalkWidth - 70 // North side - well back from road
            );

            // Store userData for Phase 3 lighting
            tower.userData = {
                type: 'paris',
                hasLights: true
            };

            // Add to landmarks array
            vegasLandmarks.push(tower);

            scene.add(tower);
            return tower;
        }

            return caesars;
