        // Roll the wheels at the right rate for the distance covered. Static wheels on a
        // moving car is the detail the eye catches even when nothing else is wrong.
        // ---- Vehicle footprints ----
        // Every gap test used to be a hardcoded centre-to-centre constant tuned for a
        // 2.2m hatchback. Once the fleet contained a 14m artic and a 10m packer those
        // constants meant long vehicles drove straight through each other, so all
        // clearances are now derived from the actual bodies.
        const VEH_LEN = { car: 2.3, police: 2.6, fire: 5.4, ambulance: 5.2, doubledecker: 4.8,
                          jitney: 3.4, omnibus: 4.2, garbage: 10.6, semi: 14.6, icecream: 4.7, bike: 1.7 };
        const vLen = v => (v && v.userData.len) || 2.5;
        const vWid = v => (v && v.userData.wid) || 1.2;
        const vHalf = v => vLen(v) / 2;
        // Longitudinal clearance between two bodies, plus a reaction gap that grows with speed
        const vGap = (a, b, react = 1.5) => vHalf(a) + vHalf(b) + react + (a.userData.spd || 0) * 14;
        // Lateral clearance: two bodies side by side just touching
        const vSide = (a, b, m = 0.45) => (vWid(a) + vWid(b)) / 2 + m;
        function vehSize(g, len, wid) { g.userData.len = len; g.userData.wid = wid; return g; }

        function spinWheels(v, dist) {
            const wheels = v.userData.wheels;
            if (!wheels) return;
            const a = dist / (v.userData.wheelR || 0.2);
            for (const w of wheels) w.rotation.z -= a;
        }

        function updCars(t) {
            const carLength = 2.5;
            const safeDistance = carLength * 5; // 5 car lengths for emergency vehicles
            
            cars.forEach(car => {
                // Cars on special missions (gridlock response, bike chase, fallen-person
                // ambulance, off-road return) are driven by their own controllers —
                // normal driving would fight them and slide the car sideways.
                if (car.userData.respondingToGridlock || car.userData.returningToRoad ||
                    car === ambulanceForFallen ||
                    (typeof policecar !== 'undefined' && car === policecar && policeChaseTarget)) return;

                let shouldStop = false;
                const myHalf = vHalf(car), myWid = vWid(car);
                const stopDist = myHalf + 5.5 + (car.userData.spd || 0) * 12;
                const wasMoving = car.userData.moving; // last frame's state, for pass-idle tracking
                car.userData.moving = false; // set true below when the car actually advances

                // Check traffic lights (emergency vehicles ignore)
                if (!car.userData.isEmergency) {
                    tlights.forEach(tl => {
                        const ix = tl.userData.intersection.x;
                        const iz = tl.userData.intersection.z;
                        const phase = (t + tl.userData.phase) % 10;
                        // X-axis: GREEN 0-4.5, YELLOW 4.5-5, RED 5-10
                        // Z-axis: RED 0-5, GREEN 5-9.5, YELLOW 9.5-10
                        const isRedForX = phase >= 5;
                        
                        if (car.userData.axis === 'x') {
                            const dist = (ix - car.position.x) * car.userData.dir;
                            if (dist > 0 && dist < stopDist && Math.abs(car.position.z - iz) < 5) {
                                if (isRedForX) shouldStop = true;
                            }
                        } else {
                            const dist = (iz - car.position.z) * car.userData.dir;
                            if (dist > 0 && dist < stopDist && Math.abs(car.position.x - ix) < 5) {
                                if (!isRedForX) shouldStop = true;
                            }
                        }
                    });
                }
                
                // Check for pedestrians physically ON the roadway (curb/sidewalk standers
                // must not freeze traffic — that caused permanent citywide gridlock)
                let pedBlock = false;
                for (const ped of people) {
                    const pedLat = car.userData.axis === 'x' ? ped.position.z : ped.position.x;
                    // stepping off the kerb counts; standing on it does not
                    if (Math.abs(pedLat - car.userData.roadPos) > GRID.roadWidth / 2 + 0.5) continue;
                    const dx = ped.position.x - car.position.x;
                    const dz = ped.position.z - car.position.z;
                    const ahead = (car.userData.axis === 'x' ? dx : dz) * car.userData.dir;
                    const lateral = car.userData.axis === 'x' ? dz : dx;
                    if (ahead > -myHalf && ahead < myHalf + 5.5 && Math.abs(lateral) < myWid / 2 + 1.1) {
                        shouldStop = true;
                        pedBlock = true;
                    }
                }
                
                // Check for emergency vehicles - only yield if they're behind you and approaching
                if (!car.userData.isEmergency) {
                    emergencyVehicles.forEach(ev => {
                        if (ev.userData.axis !== car.userData.axis) return; // Different roads, ignore
                        
                        const dx = ev.position.x - car.position.x;
                        const dz = ev.position.z - car.position.z;
                        const dist = Math.sqrt(dx * dx + dz * dz);
                        
                        // Only yield if emergency vehicle is behind us and within range
                        if (dist < safeDistance) {
                            if (car.userData.axis === 'x') {
                                // Emergency vehicle behind us (opposite of our direction)
                                const evBehind = dx * car.userData.dir < 0;
                                const sameLane = Math.abs(dz) < 3;
                                // Emergency vehicle approaching (moving toward us)
                                const evApproaching = ev.userData.dir === car.userData.dir;
                                if (evBehind && sameLane && evApproaching) {
                                    // Pull over - don't stop, just slow down and let them pass
                                    // Actually for simplicity, just don't block - keep moving
                                }
                            } else {
                                const evBehind = dz * car.userData.dir < 0;
                                const sameLane = Math.abs(dx) < 3;
                                const evApproaching = ev.userData.dir === car.userData.dir;
                                if (evBehind && sameLane && evApproaching) {
                                    // Keep moving, don't block
                                }
                            }
                        }
                    });
                }
                
                // Check for cars ahead - widen detection to prevent clipping
                let carAheadBlock = false;
                cars.forEach(other => {
                    if (other === car) return;
                    const dx = other.position.x - car.position.x;
                    const dz = other.position.z - car.position.z;
                    const dist = Math.sqrt(dx * dx + dz * dz);

                    // Check cars on same axis (same road direction)
                    if (other.userData.axis === car.userData.axis) {
                        const gap = vGap(car, other);
                        const side = vSide(car, other);
                        if (car.userData.axis === 'x') {
                            const ahead = dx * car.userData.dir;
                            if (ahead > 0 && ahead < gap && Math.abs(dz) < side) {
                                shouldStop = true;
                                carAheadBlock = true;
                            }
                        } else {
                            const ahead = dz * car.userData.dir;
                            if (ahead > 0 && ahead < gap && Math.abs(dx) < side) {
                                shouldStop = true;
                                carAheadBlock = true;
                            }
                        }
                    }
                    // Cross traffic: yield at the conflict point where our lanes cross.
                    // Stop BEFORE entering (myDist > 2) — never freeze mid-intersection —
                    // and only when the other car is inside or closer to the crossing.
                    else {
                        let myDist, theirDist;
                        if (car.userData.axis === 'x') {
                            myDist = dx * car.userData.dir;                                  // me → their lane line
                            theirDist = -dz * other.userData.dir;                            // them → my lane line
                        } else {
                            myDist = dz * car.userData.dir;
                            theirDist = -dx * other.userData.dir;
                        }
                        // tight yield box: brake only for cross traffic genuinely in/at the crossing
                        const myClear = vHalf(car) + 1.4, theirClear = vHalf(other) + 1.4;
                        if (myDist > myClear * 0.6 && myDist < myClear + 3.2 &&
                            theirDist > -theirClear && theirDist < theirClear + 2.6) {
                            if (theirDist < myDist || (theirDist === myDist && other.id < car.id)) {
                                shouldStop = true;
                            }
                        }
                    }
                });
                
                // Check for bicycles ahead (they share the road and ignore lights)
                bicycles.forEach(bike => {
                    const dx = bike.position.x - car.position.x;
                    const dz = bike.position.z - car.position.z;
                    const bGap = vGap(car, bike, 1.8), bSide = vSide(car, bike, 0.7);
                    if (car.userData.axis === 'x') {
                        const ahead = dx * car.userData.dir;
                        if (ahead > 0 && ahead < bGap && Math.abs(dz) < bSide) shouldStop = true;
                    } else {
                        const ahead = dz * car.userData.dir;
                        if (ahead > 0 && ahead < bGap && Math.abs(dx) < bSide) shouldStop = true;
                    }
                });

                // Check for ALL event vehicles (parade floats, semis, limos...), not just broken ones
                let obstacleAhead = false;
                if (specialEvent && specialEvent.entities) {
                    specialEvent.entities.forEach(entity => {
                        if (!entity.userData.isBrokenDown && !entity.userData.spd) return;
                        const dx = entity.position.x - car.position.x;
                        const dz = entity.position.z - car.position.z;
                        
                        const eGap = vGap(car, entity, 2.2), eSide = vSide(car, entity, 0.6);
                        if (car.userData.axis === 'x') {
                            const ahead = dx * car.userData.dir;
                            if (ahead > 0 && ahead < eGap && Math.abs(dz) < eSide) {
                                obstacleAhead = true;
                            }
                        } else {
                            const ahead = dz * car.userData.dir;
                            if (ahead > 0 && ahead < eGap && Math.abs(dx) < eSide) {
                                obstacleAhead = true;
                            }
                        }
                    });
                }
                
                // Check for garbage truck
                if (garbageTruck && garbageTruckActive) {
                    const dx = garbageTruck.position.x - car.position.x;
                    const dz = garbageTruck.position.z - car.position.z;
                    
                    const gGap = vGap(car, garbageTruck, 2.5), gSide = vSide(car, garbageTruck, 0.6);
                    if (car.userData.axis === 'x') {
                        const ahead = dx * car.userData.dir;
                        if (ahead > 0 && ahead < gGap && Math.abs(dz) < gSide) {
                            obstacleAhead = true;
                        }
                    } else {
                        const ahead = dz * car.userData.dir;
                        if (ahead > 0 && ahead < gGap && Math.abs(dx) < gSide) {
                            obstacleAhead = true;
                        }
                    }
                }
                
                // Check for airport fleet vehicles (taxis, courtesy buses) on shared roads
                if (airport.built) {
                    // lateral < 1.3: taxis pulled over at the curb don't stall the lane
                    for (const av of airport.cars.concat(airport.buses)) {
                        const dx = av.position.x - car.position.x;
                        const dz = av.position.z - car.position.z;
                        const aGap = vGap(car, av, 1.6);
                        if (car.userData.axis === 'x') {
                            if (dx * car.userData.dir > 0 && dx * car.userData.dir < aGap && Math.abs(dz) < 1.3) { obstacleAhead = true; break; }
                        } else {
                            if (dz * car.userData.dir > 0 && dz * car.userData.dir < aGap && Math.abs(dx) < 1.3) { obstacleAhead = true; break; }
                        }
                    }
                }

                // Check for omnibus
                if (omnibus) {
                    const dx = omnibus.position.x - car.position.x;
                    const dz = omnibus.position.z - car.position.z;
                    
                    const oGap = vGap(car, omnibus, 2.0), oSide = vSide(car, omnibus, 0.6);
                    if (car.userData.axis === 'x') {
                        const ahead = dx * car.userData.dir;
                        if (ahead > 0 && ahead < oGap && Math.abs(dz) < oSide) {
                            obstacleAhead = true;
                        }
                    } else {
                        const ahead = dz * car.userData.dir;
                        if (ahead > 0 && ahead < oGap && Math.abs(dx) < oSide) {
                            obstacleAhead = true;
                        }
                    }
                }
                
                // Lane discipline: laneOffset drifts smoothly toward targetLaneOffset —
                // vehicles never teleport sideways or flip direction.
                if (car.userData.targetLaneOffset === undefined) car.userData.targetLaneOffset = car.userData.laneOffset;
                const laneBefore = car.userData.laneOffset;
                car.userData.laneOffset += Math.max(-0.05, Math.min(0.05, car.userData.targetLaneOffset - car.userData.laneOffset));
                const dLat = car.userData.laneOffset - laneBefore;
                // steer the nose into the velocity vector (heading map: +x→0, -x→π, +z→-π/2, -z→+π/2),
                // lean capped (~22°) and rotation rate-limited so cars can never whip around
                const steer = (spd) => {
                    const vA = Math.max(spd, 0.02) * car.userData.dir;
                    const lat = Math.max(-Math.abs(vA) * 0.42, Math.min(Math.abs(vA) * 0.42, dLat));
                    const target = car.userData.axis === 'x' ? -Math.atan2(lat, vA) : -Math.atan2(vA, lat);
                    let dy = target - car.rotation.y;
                    while (dy > Math.PI) dy -= Math.PI * 2;
                    while (dy < -Math.PI) dy += Math.PI * 2;
                    car.rotation.y += dy * 0.18;
                };
                car.userData.inPassingLane = Math.abs(car.userData.laneOffset - car.userData.originalLaneOffset) > 0.2;

                // While borrowing the oncoming lane: merge home as soon as our lane has room,
                // or immediately when someone is coming head-on (they have right of way).
                // The oncoming lane is for ACTIVE passing only — never for waiting: a car
                // that idles there is forced home the moment there's physical space.
                if (car.userData.inPassingLane) {
                    let laneRoom = true, sideClear = true, oncoming = false;
                    const myLat = car.userData.axis === 'x' ? car.position.z : car.position.x;
                    const homeLat = car.userData.roadPos + car.userData.originalLaneOffset;
                    cars.forEach(other => {
                        if (other === car || other.userData.axis !== car.userData.axis) return;
                        const along = car.userData.axis === 'x' ? other.position.x - car.position.x : other.position.z - car.position.z;
                        const otherLat = car.userData.axis === 'x' ? other.position.z : other.position.x;
                        if (Math.abs(otherLat - homeLat) < 1.5 && Math.abs(along) < 4) laneRoom = false;
                        if (Math.abs(otherLat - homeLat) < 1.5 && Math.abs(along) < 2.4) sideClear = false;
                        const aheadOfMe = along * car.userData.dir;
                        if (other.userData.dir !== car.userData.dir && Math.abs(otherLat - myLat) < 1.5 && aheadOfMe > 0 && aheadOfMe < 14) oncoming = true;
                    });
                    car.userData.passIdle = wasMoving ? 0 : (car.userData.passIdle || 0) + 0.016;
                    if (laneRoom || oncoming || (car.userData.passIdle > 1.5 && sideClear)) {
                        if (car.userData.targetLaneOffset !== car.userData.originalLaneOffset) {
                            car.userData.noPassUntil = t + 5; // cool off before weaving out again
                        }
                        car.userData.targetLaneOffset = car.userData.originalLaneOffset;
                    }
                } else {
                    car.userData.passIdle = 0;
                }
                const laneChanging = Math.abs(car.userData.targetLaneOffset - car.userData.laneOffset) > 0.05;

                // Move car if not stopped
                if (!shouldStop && !obstacleAhead) {
                    const speed = car.userData.isEmergency ? car.userData.spd * 1.5 : car.userData.spd;
                    car.userData.moving = true;
                    steer(speed);
                    spinWheels(car, speed);

                    if (car.userData.axis === 'x') {
                        car.position.x += speed * car.userData.dir;
                        car.position.z = car.userData.roadPos + car.userData.laneOffset;
                        if (car.position.x > halfSize + 15) car.position.x = -halfSize - 15;
                        if (car.position.x < -halfSize - 15) car.position.x = halfSize + 15;
                    } else {
                        car.position.z += speed * car.userData.dir;
                        car.position.x = car.userData.roadPos + car.userData.laneOffset;
                        if (car.position.z > halfSize + 15) car.position.z = -halfSize - 15;
                        if (car.position.z < -halfSize - 15) car.position.z = halfSize + 15;
                    }
                } else {
                    // Blocked. Real drivers wait in line. Borrowing the oncoming lane is only
                    // for stalled obstacles (events, garbage truck, omnibus) or emergency
                    // vehicles boxed in by traffic — and only after yielding to oncoming.
                    // Buses always wait; nobody passes a pedestrian.
                    // Emergencies only pass a car physically blocking their lane — never a
                    // red light or intersection yield (that caused constant lane weaving)
                    const wantsPass = !car.userData.inPassingLane && !laneChanging && !car.userData.isBus && !pedBlock &&
                        t > (car.userData.noPassUntil || 0) &&
                        (obstacleAhead || (car.userData.isEmergency && carAheadBlock));
                    if (wantsPass) {
                        const margin = car.userData.isEmergency ? 15 : 25;
                        const passLat = car.userData.roadPos - car.userData.originalLaneOffset;
                        let gapClear = true;
                        cars.forEach(other => {
                            if (other === car || other.userData.axis !== car.userData.axis) return;
                            const along = (car.userData.axis === 'x' ? other.position.x - car.position.x : other.position.z - car.position.z) * car.userData.dir;
                            const otherLat = car.userData.axis === 'x' ? other.position.z : other.position.x;
                            if (Math.abs(otherLat - passLat) >= 1.5) return;
                            // oncoming car approaching the gap, or anyone already alongside
                            if ((other.userData.dir !== car.userData.dir && along > -2 && along < margin) || Math.abs(along) < 8) gapClear = false;
                        });
                        if (gapClear) car.userData.targetLaneOffset = -car.userData.originalLaneOffset;
                    }
                    // Creep forward ONLY while actively skirting a stalled obstacle. When
                    // held for any other reason (red light, car ahead, yield), the car
                    // still settles laterally toward its target lane — it may never
                    // PARK in the oncoming lane.
                    if (laneChanging && !pedBlock && obstacleAhead && !shouldStop) {
                        const speed = car.userData.spd * 0.4;
                        car.userData.moving = true;
                        steer(speed);
                        if (car.userData.axis === 'x') {
                            car.position.x += speed * car.userData.dir;
                            car.position.z = car.userData.roadPos + car.userData.laneOffset;
                        } else {
                            car.position.z += speed * car.userData.dir;
                            car.position.x = car.userData.roadPos + car.userData.laneOffset;
                        }
                    } else if (car.userData.axis === 'x') {
                        car.position.z = car.userData.roadPos + car.userData.laneOffset;
                    } else {
                        car.position.x = car.userData.roadPos + car.userData.laneOffset;
                    }
                }
            });

            resolveVehicleOverlaps();
        }

        // Hard guarantee: no two vehicles interpenetrate, even when steering logic misses.
        // Same-lane overlaps push the rear car back; cross-axis overlaps back both off.
        function resolveVehicleOverlaps() {
            for (let i = 0; i < cars.length; i++) {
                const a = cars[i];
                for (let j = i + 1; j < cars.length; j++) {
                    const b = cars[j];
                    const dx = b.position.x - a.position.x;
                    const dz = b.position.z - a.position.z;

                    if (a.userData.axis === b.userData.axis) {
                        const along = a.userData.axis === 'x' ? dx : dz;
                        const lateral = a.userData.axis === 'x' ? dz : dx;
                        if (Math.abs(lateral) < 1.4 && Math.abs(along) < 2.6) {
                            // rear car = the one the other is "ahead" of; push it back
                            const bAheadOfA = along * a.userData.dir > 0;
                            const rear = bAheadOfA ? a : b;
                            const shift = (2.6 - Math.abs(along)) * rear.userData.dir;
                            if (rear.userData.axis === 'x') rear.position.x -= shift;
                            else rear.position.z -= shift;
                        }
                    } else if (Math.abs(dx) < 2.2 && Math.abs(dz) < 2.2) {
                        const pen = (2.2 - Math.max(Math.abs(dx), Math.abs(dz))) / 2 + 0.05;
                        for (const v of [a, b]) {
                            if (v.userData.axis === 'x') v.position.x -= pen * v.userData.dir;
                            else v.position.z -= pen * v.userData.dir;
                        }
                    }
                }
            }

            // Cars never interpenetrate non-car vehicles either: omnibus, garbage
            // truck, event vehicles (floats, semis), airport taxis and buses. The
            // car always yields — it gets pushed back along its own axis.
            const externals = [];
            if (omnibus) externals.push({ o: omnibus, lat: 1.9 });
            if (garbageTruck && garbageTruckActive) externals.push({ o: garbageTruck, lat: 1.9 });
            if (specialEvent && specialEvent.entities) for (const e of specialEvent.entities) externals.push({ o: e, lat: 1.9 });
            if (airport.built) {
                // tighter width: fleet cars parked at curbs must not shove passing traffic
                for (const v of airport.cars) externals.push({ o: v, lat: 1.25 });
                for (const v of airport.buses) externals.push({ o: v, lat: 1.4 });
            }
            for (const car of cars) {
                for (const ext of externals) {
                    const dx = ext.o.position.x - car.position.x;
                    const dz = ext.o.position.z - car.position.z;
                    const along = car.userData.axis === 'x' ? dx : dz;
                    const lateral = car.userData.axis === 'x' ? dz : dx;
                    if (Math.abs(along) < 3.2 && Math.abs(lateral) < ext.lat) {
                        const dir = along !== 0 ? Math.sign(along) : car.userData.dir;
                        const shift = (3.2 - Math.abs(along)) * dir;
                        if (car.userData.axis === 'x') car.position.x -= shift;
                        else car.position.z -= shift;
                    }
                }
            }
        }

        function updEmergencyLights(t) {
            emergencyVehicles.forEach(ev => {
                ev.traverse(child => {
                    if (child.userData.emergencyLight) {
                        const flash = Math.sin(t * 15 + (child.userData.lightPhase || 0)) > 0;
                        child.material.color.setHex(flash ? child.userData.lightColor : 0x2a2a2e);
                    }
                });
            });
        }
        
        function updGridlock(t) {
            // Check every second
            if (t - lastGridlockCheck < 1) return;
            lastGridlockCheck = t;
            
            // Update stuck time for all cars
            cars.forEach(car => {
                if (!car.userData.lastPos) {
                    car.userData.lastPos = { x: car.position.x, z: car.position.z };
                    car.userData.stuckTime = 0;
                    return;
                }
                
                const dx = car.position.x - car.userData.lastPos.x;
                const dz = car.position.z - car.userData.lastPos.z;
                const moved = Math.sqrt(dx * dx + dz * dz);
                
                if (moved < 0.5) {
                    // Car hasn't moved much
                    car.userData.stuckTime = (car.userData.stuckTime || 0) + 1;
                } else {
                    car.userData.stuckTime = 0;
                    car.userData.beingHelped = false;
                }
                
                car.userData.lastPos = { x: car.position.x, z: car.position.z };
            });

            // Hard guarantee: NO jam lives past ~25s — anything still wedged gets towed
            // outright, even while the police car is busy (emergencies and buses too)
            cars.forEach(c => { if (c.userData.stuckTime > 25) clearGridlock(c); });

            // Bicycles get the same watchdog: a wedged cyclist walks it to the road
            // edge and rides back in (they were able to block buses indefinitely)
            bicycles.forEach(b => {
                const u = b.userData;
                if (!u.lastPosB) { u.lastPosB = { x: b.position.x, z: b.position.z }; u.stuckB = 0; return; }
                const moved = Math.hypot(b.position.x - u.lastPosB.x, b.position.z - u.lastPosB.z);
                u.stuckB = moved < 0.4 ? (u.stuckB || 0) + 1 : 0;
                u.lastPosB = { x: b.position.x, z: b.position.z };
                if (u.stuckB > 18 && u.axis) {
                    u.stuckB = 0;
                    const start = u.dir > 0 ? -halfSize - 5 : halfSize + 5;
                    if (u.axis === 'x') { b.position.x = start; b.position.z = u.roadPos + u.laneOffset; }
                    else { b.position.z = start; b.position.x = u.roadPos + u.laneOffset; }
                }
            });

            // Find a stuck car or pedestrian that needs help (stuck > 15 seconds)
            if (!trafficCop && !trafficCopTarget) {
                // Check for stuck cars first (dispatch early so the cop theater has
                // time to play out before the 25s hard tow fires)
                const stuckCar = cars.find(c =>
                    c.userData.stuckTime > 8 &&
                    !c.userData.beingHelped &&
                    !c.userData.isEmergency
                );

                // Also check for stuck pedestrians
                const stuckPed = peds.find(p =>
                    p.userData.stuckTime > 15 &&
                    !p.userData.beingHelped
                );

                const stuckEntity = stuckCar || stuckPed;

                if (stuckEntity) {
                    // Dispatch police car to help!
                    stuckEntity.userData.beingHelped = true;
                    trafficCopTarget = stuckEntity;

                    // Find the police car
                    const policeCar = emergencyVehicles.find(ev => ev.userData.emergencyType === 'police');
                    if (policeCar && !policeChaseTarget) {
                        // Use police car instead of traffic cop pedestrian
                        policeCar.userData.respondingToGridlock = true;
                        policeCar.userData.gridlockTarget = stuckEntity;
                        trafficCop = policeCar; // Reuse trafficCop variable to track response
                        notify('🚔 Police car dispatched to assist!', 2500);
                    } else {
                        // Fallback to traffic cop pedestrian if police is busy
                        spawnTrafficCop(stuckEntity);
                        notify('🚔 Traffic cop dispatched to clear gridlock!', 2500);
                    }
                }
            }
            
            // Update traffic cop or police car response
            if (trafficCop && trafficCopTarget) {
                const dx = trafficCopTarget.position.x - trafficCop.position.x;
                const dz = trafficCopTarget.position.z - trafficCop.position.z;
                const dist = Math.sqrt(dx * dx + dz * dz);

                // Check if this is a police car responding to gridlock
                if (trafficCop.userData.respondingToGridlock) {
                    if (dist < 6) {
                        // Police car arrived - clear the gridlock!
                        clearGridlock(trafficCopTarget);
                        trafficCop.userData.respondingToGridlock = false;
                        trafficCop.userData.gridlockTarget = null;
                        trafficCop.userData.returningToRoad = true;
                        trafficCopTarget.userData.beingHelped = false;
                        trafficCop = null;
                        trafficCopTarget = null;
                    } else {
                        // Police car drives toward stuck entity (this runs on a 1s tick,
                        // so speed is units-per-second, not per-frame).
                        // Car models face +x: heading = -atan2(dz,dx).
                        const speed = 2.5;
                        trafficCop.position.x += (dx / dist) * speed;
                        trafficCop.position.z += (dz / dist) * speed;
                        trafficCop.rotation.y = -Math.atan2(dz, dx);
                    }
                } else {
                    // Regular traffic cop pedestrian logic
                    if (dist < 3) {
                        // Arrived at gridlock - clear it!
                        clearGridlock(trafficCopTarget);

                        // Cop walks away
                        trafficCop.userData.state = 'leaving';
                        trafficCop.userData.leaveTimer = 0;
                    } else if (trafficCop.userData.state === 'approaching') {
                        // Walk toward stuck car
                        const speed = 0.08;
                        trafficCop.position.x += (dx / dist) * speed;
                        trafficCop.position.z += (dz / dist) * speed;
                        trafficCop.rotation.y = Math.atan2(dx, dz);

                        // Animate walking
                        trafficCop.userData.walk = (trafficCop.userData.walk || 0) + 0.2;
                        const sw = Math.sin(trafficCop.userData.walk) * 0.4;
                        if (trafficCop.userData.ll) trafficCop.userData.ll.rotation.x = sw;
                        if (trafficCop.userData.rl) trafficCop.userData.rl.rotation.x = -sw;
                    }

                    if (trafficCop.userData.state === 'leaving') {
                        trafficCop.userData.leaveTimer += 0.016;

                        // Walk to edge of road
                        trafficCop.position.x += 0.05;
                        trafficCop.rotation.y = Math.PI / 2;

                        trafficCop.userData.walk = (trafficCop.userData.walk || 0) + 0.2;
                        const sw = Math.sin(trafficCop.userData.walk) * 0.4;
                        if (trafficCop.userData.ll) trafficCop.userData.ll.rotation.x = sw;
                        if (trafficCop.userData.rl) trafficCop.userData.rl.rotation.x = -sw;

                        if (trafficCop.userData.leaveTimer > 3) {
                            // Remove cop
                            scene.remove(trafficCop);
                            trafficCop = null;
                            trafficCopTarget = null;
                        }
                    }
                }
            }

            // Update headlights based on time of day
            cars.forEach(car => {
                if (car.userData.headlights) {
                    const headlightColor = isNight ? 0xffffee : 0x333322;
                    car.userData.headlights.forEach(hl => {
                        if (hl.material) { // Mesh, not light
                            hl.material.color.setHex(headlightColor);
                        }
                    });
                }
            });
        }

        function spawnTrafficCop(targetCar) {
            const cop = new THREE.Group();
            
            // Blue police uniform
            const body = new THREE.Mesh(
                new THREE.CylinderGeometry(0.15, 0.18, 0.6, 8),
                new THREE.MeshStandardMaterial({ color: 0x000066 })
            );
            body.position.y = 0.45;
            cop.add(body);
            
            // Head
            const head = new THREE.Mesh(
                new THREE.SphereGeometry(0.12, 8, 8),
                new THREE.MeshStandardMaterial({ color: 0xffcc99 })
            );
            head.position.y = 0.85;
            cop.add(head);
            
            // Police cap
            const cap = new THREE.Mesh(
                new THREE.CylinderGeometry(0.14, 0.14, 0.08, 8),
                new THREE.MeshStandardMaterial({ color: 0x000044 })
            );
            cap.position.y = 0.95;
            cop.add(cap);
            
            // Cap brim
            const brim = new THREE.Mesh(
                new THREE.CylinderGeometry(0.16, 0.16, 0.02, 8),
                new THREE.MeshStandardMaterial({ color: 0x000033 })
            );
            brim.position.set(0.05, 0.92, 0);
            cop.add(brim);
            
            // Legs
            const legMat = new THREE.MeshStandardMaterial({ color: 0x000044 });
            const ll = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.35, 6), legMat);
            ll.position.set(0.07, 0.17, 0);
            cop.add(ll);
            cop.userData.ll = ll;
            
            const rl = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.35, 6), legMat);
            rl.position.set(-0.07, 0.17, 0);
            cop.add(rl);
            cop.userData.rl = rl;
            
            // Whistle (small yellow sphere)
            const whistle = new THREE.Mesh(
                new THREE.SphereGeometry(0.03, 6, 6),
                new THREE.MeshBasicMaterial({ color: 0xffff00 })
            );
            whistle.position.set(0.15, 0.7, 0.1);
            cop.add(whistle);
            
            // Position cop near the stuck car
            const offset = 8;
            cop.position.set(
                targetCar.position.x - offset,
                0,
                targetCar.position.z + (Math.random() - 0.5) * 4
            );
            
            cop.userData.state = 'approaching';
            cop.userData.walk = 0;
            
            trafficCop = cop;
            scene.add(cop);
        }
        
        function clearGridlock(stuckEntity) {
            // Tow, don't teleport-shuffle: the jammed vehicle leaves the map and re-enters
            // at the edge of its own road, same lane, same direction — like normal spawns.
            if (stuckEntity.userData && stuckEntity.userData.axis) {
                const c = stuckEntity;
                c.userData.laneOffset = c.userData.originalLaneOffset;
                c.userData.targetLaneOffset = c.userData.originalLaneOffset;
                if (c.userData.axis === 'x') {
                    c.position.x = -c.userData.dir * (halfSize + 15);
                    c.position.z = c.userData.roadPos + c.userData.laneOffset;
                } else {
                    c.position.z = -c.userData.dir * (halfSize + 15);
                    c.position.x = c.userData.roadPos + c.userData.laneOffset;
                }
                c.userData.stuckTime = 0;
                c.userData.beingHelped = false;
            } else if (stuckEntity.userData) {
                // Stuck pedestrian: send them walking again
                stuckEntity.userData.state = 'walking';
                stuckEntity.userData.waitingForBus = false;
                setNewPedTarget(stuckEntity);
                stuckEntity.userData.stuckTime = 0;
                stuckEntity.userData.beingHelped = false;
            }

            // Also unstick any nearby stuck pedestrians
            peds.forEach(p => {
                const dx = p.position.x - stuckEntity.position.x;
                const dz = p.position.z - stuckEntity.position.z;
                if (Math.sqrt(dx * dx + dz * dz) < 15 && p.userData.stuckTime > 5) {
                    p.userData.state = 'walking';
                    p.userData.stuckTime = 0;
                    setNewPedTarget(p);
                }
            });

            notify('🚛 Stalled vehicle towed — traffic cleared!', 2000);
        }

        // Street population by hour: quiet dawn, filling through the day to an afternoon
        // peak, thinning in the evening, near-empty overnight.
        function pedTargetFraction(t) {
            const pts = [[0, 0.10], [0.17, 0.10], [0.25, 0.45], [0.5, 1.0], [0.68, 1.0], [0.8, 0.35], [0.87, 0.15], [1, 0.10]];
            for (let i = 1; i < pts.length; i++) {
                if (t <= pts[i][0]) {
                    const [a, fa] = pts[i - 1], [b, fb] = pts[i];
                    return fa + (fb - fa) * ((t - a) / (b - a));
                }
            }
            return 0.10;
        }

        let lastPedPopCheck = 0;
        function updPedPopulation(t) {
            // The in-game day is short (~200s), so adjust twice a second to track dusk/dawn
            if (t - lastPedPopCheck < 0.5) return;
            lastPedPopCheck = t;
            const target = Math.round(CFG.peds * pedTargetFraction(timeOfDay));
            const active = peds.filter(p => p.userData.state !== 'offDuty');

            if (active.length > target) {
                // Someone heads home: pick the plain walker farthest from the camera
                let pick = null, best = -1;
                for (const w of active) {
                    if (w.userData.state !== 'walking' || !w.visible) continue;
                    const d = w.position.distanceTo(cam.position);
                    if (d > best) { best = d; pick = w; }
                }
                if (!pick) return;
                pick.userData.state = 'offDuty';
                pick.visible = false;
                pick.userData.waitingForBus = false;
                pick.userData.stuckTime = 0;
            } else if (active.length < target && buildingEntrances.length) {
                // Someone steps out: re-enter at a building doorway, ideally out of view
                const resting = peds.find(p => p.userData.state === 'offDuty');
                if (!resting) return;
                let ent = buildingEntrances[Math.floor(Math.random() * buildingEntrances.length)];
                for (let k = 0; k < 4; k++) {
                    const c = buildingEntrances[Math.floor(Math.random() * buildingEntrances.length)];
                    const dc = (c.x - cam.position.x) ** 2 + (c.z - cam.position.z) ** 2;
                    const de = (ent.x - cam.position.x) ** 2 + (ent.z - cam.position.z) ** 2;
                    if (dc > de) ent = c;
                }
                resting.position.set(ent.x, 0.15, ent.z);
                resting.visible = true;
                resting.userData.state = 'walking';
                const bx = Math.floor((resting.position.x + halfSize) / GRID.cellSize);
                const bz = Math.floor((resting.position.z + halfSize) / GRID.cellSize);
                resting.userData.currentBlock = {
                    x: Math.max(0, Math.min(bx, GRID.gridCount - 1)),
                    z: Math.max(0, Math.min(bz, GRID.gridCount - 1))
                };
                setNewPedTarget(resting);
            }
        }

        function updPeds(t) {
            peds.forEach((p, idx) => {
                if (p.userData.state === 'offDuty') return; // resting indoors until the streets need them
                if (!p.userData.target) {
                    setNewPedTarget(p);
                    return;
                }
                
                // Skip pedestrians on the bus
                if (p.userData.state === 'onBus') {
                    return;
                }
                
                // Handle waiting at bus stop — but nobody waits forever for a late bus
                if (p.userData.state === 'waitingForBus') {
                    p.userData.busWait = (p.userData.busWait || 0) + 0.016;
                    if (p.userData.busWait > 45) {
                        p.userData.waitingForBus = false;
                        if (p.userData.targetStop) {
                            const q = p.userData.targetStop.waitingPeds;
                            const qi = q.indexOf(p);
                            if (qi >= 0) q.splice(qi, 1);
                            p.userData.targetStop = null;
                        }
                        p.userData.state = 'walking';
                        setNewPedTarget(p);
                    }
                    return;
                }

                // Handle walking to bus stop
                if (p.userData.state === 'toBusStop') {
                    const to = p.userData.target.clone().sub(p.position);
                    to.y = 0;
                    const d = to.length();

                    if (d < 0.5) {
                        // Arrived at bus stop, wait
                        p.userData.state = 'waitingForBus';
                        p.userData.busWait = 0;
                    } else {
                        const dir = to.normalize();
                        p.position.x += dir.x * p.userData.spd;
                        p.position.z += dir.z * p.userData.spd;
                        p.rotation.y = Math.atan2(dir.x, dir.z);
                        
                        p.userData.walk += 0.15;
                        const sw = Math.sin(p.userData.walk) * 0.3;
                        if (p.userData.ll) p.userData.ll.rotation.x = sw;
                        if (p.userData.rl) p.userData.rl.rotation.x = -sw;
                    }
                    return;
                }
                
                // Handle being inside building
                if (p.userData.state === 'insideBuilding') {
                    p.userData.insideTime = (p.userData.insideTime || 0) + 0.016;
                    if (p.userData.insideTime > 3 + Math.random() * 5) {
                        // Exit building through the same door
                        if (p.userData.targetEntrance) {
                            // Position at the door
                            p.position.set(p.userData.targetEntrance.x, 0.15, p.userData.targetEntrance.z);
                            
                            // Move slightly away from door based on door facing
                            const entrance = p.userData.targetEntrance;
                            if (entrance.side === 0) p.position.z += 1.5;
                            else if (entrance.side === 1) p.position.z -= 1.5;
                            else if (entrance.side === 2) p.position.x += 1.5;
                            else p.position.x -= 1.5;
                        }
                        p.visible = true;
                        p.userData.state = 'exitingBuilding';
                        p.userData.insideTime = 0;
                        
                        // Set target to nearby sidewalk
                        const bx = p.userData.currentBlock.x;
                        const bz = p.userData.currentBlock.z;
                        const blockCenterX = -halfSize + bx * GRID.cellSize + GRID.cellSize / 2;
                        const blockCenterZ = -halfSize + bz * GRID.cellSize + GRID.cellSize / 2;
                        const innerSize = GRID.cellSize - GRID.roadWidth;
                        const swOffset = GRID.sidewalkWidth / 2;
                        
                        // Walk to nearest sidewalk edge
                        const side = Math.floor(Math.random() * 4);
                        if (side === 0) p.userData.target = new THREE.Vector3(blockCenterX, 0.15, blockCenterZ - innerSize/2 + swOffset);
                        else if (side === 1) p.userData.target = new THREE.Vector3(blockCenterX, 0.15, blockCenterZ + innerSize/2 - swOffset);
                        else if (side === 2) p.userData.target = new THREE.Vector3(blockCenterX - innerSize/2 + swOffset, 0.15, blockCenterZ);
                        else p.userData.target = new THREE.Vector3(blockCenterX + innerSize/2 - swOffset, 0.15, blockCenterZ);
                    }
                    return;
                }
                
                // Handle exiting building - walk to sidewalk then resume normal walking
                if (p.userData.state === 'exitingBuilding') {
                    const to = p.userData.target.clone().sub(p.position);
                    to.y = 0;
                    const d = to.length();
                    
                    if (d < 0.5) {
                        p.userData.state = 'walking';
                        p.userData.targetEntrance = null;
                        setNewPedTarget(p);
                    } else {
                        const dir = to.normalize();
                        p.position.x += dir.x * p.userData.spd;
                        p.position.z += dir.z * p.userData.spd;
                        p.rotation.y = Math.atan2(dir.x, dir.z);
                        
                        p.userData.walk += 0.15;
                        const sw = Math.sin(p.userData.walk) * 0.3;
                        if (p.userData.ll) p.userData.ll.rotation.x = sw;
                        if (p.userData.rl) p.userData.rl.rotation.x = -sw;
                    }
                    return;
                }

                // Handle walking toward performer
                if (p.userData.state === 'towardPerformer') {
                    const performer = p.userData.watchingPerformer;

                    // Check if performer left
                    if (!performer || !performers.includes(performer)) {
                        p.userData.state = 'walking';
                        p.userData.watchingPerformer = null;
                        setNewPedTarget(p);
                        return;
                    }

                    const to = p.userData.target.clone().sub(p.position);
                    to.y = 0;
                    const d = to.length();

                    if (d < 0.5) {
                        // Arrived at watching position
                        p.userData.state = 'watchingPerformer';
                        p.userData.watchStartTime = t;
                        // Face the performer
                        const toPerformer = new THREE.Vector3(
                            performer.position.x - p.position.x,
                            0,
                            performer.position.z - p.position.z
                        );
                        p.rotation.y = Math.atan2(toPerformer.x, toPerformer.z);
                    } else {
                        // Walk toward watching spot
                        const dir = to.normalize();
                        p.position.x += dir.x * p.userData.spd;
                        p.position.z += dir.z * p.userData.spd;
                        p.rotation.y = Math.atan2(dir.x, dir.z);

                        // Animate walking
                        p.userData.walk += 0.15;
                        const sw = Math.sin(p.userData.walk) * 0.3;
                        if (p.userData.ll) p.userData.ll.rotation.x = sw;
                        if (p.userData.rl) p.userData.rl.rotation.x = -sw;
                    }
                    return;
                }

                // Handle watching performer
                if (p.userData.state === 'watchingPerformer') {
                    const performer = p.userData.watchingPerformer;

                    // Check if performer left
                    if (!performer || !performers.includes(performer)) {
                        p.userData.state = 'walking';
                        p.userData.watchingPerformer = null;
                        setNewPedTarget(p);
                        return;
                    }

                    // Keep facing the performer (in case they move slightly)
                    const toPerformer = new THREE.Vector3(
                        performer.position.x - p.position.x,
                        0,
                        performer.position.z - p.position.z
                    );
                    p.rotation.y = Math.atan2(toPerformer.x, toPerformer.z);

                    // Stand still - reset leg positions
                    if (p.userData.ll) p.userData.ll.rotation.x = 0;
                    if (p.userData.rl) p.userData.rl.rotation.x = 0;

                    // Check if done watching
                    const watchElapsed = t - p.userData.watchStartTime;
                    if (watchElapsed > p.userData.watchDuration) {
                        // Remove from performer's watcher list
                        const watcherIdx = performer.userData.watchers.indexOf(p);
                        if (watcherIdx >= 0) {
                            performer.userData.watchers.splice(watcherIdx, 1);
                        }

                        p.userData.state = 'walking';
                        p.userData.watchingPerformer = null;
                        p.userData.watchStartTime = null;
                        setNewPedTarget(p);
                    }
                    return;
                }

                // Pedestrian walking to subway station
                if (p.userData.state === 'toSubwayStation') {
                    const dx = p.userData.target.x - p.position.x;
                    const dz = p.userData.target.z - p.position.z;
                    const dist = Math.sqrt(dx * dx + dz * dz);

                    if (dist < 0.5) {
                        // Arrived at station entrance - enter subway
                        p.userData.state = 'inSubway';
                        p.userData.subwayStartTime = t;
                        p.userData.rideDuration = 8 + Math.random() * 12; // 8-20 seconds ride
                        // Pick a different exit station
                        const currentIdx = subwayStations.indexOf(p.userData.targetStation);
                        const otherStations = subwayStations.filter((_, i) => i !== currentIdx);
                        p.userData.exitStation = otherStations[Math.floor(Math.random() * otherStations.length)];
                        p.visible = false; // Disappear into station
                        subwayPassengers.push(p);
                    } else {
                        // Walk toward station
                        const spd = p.userData.spd;
                        p.position.x += (dx / dist) * spd;
                        p.position.z += (dz / dist) * spd;
                        p.rotation.y = Math.atan2(dx, dz);

                        // Walking animation
                        p.userData.walk += 0.15;
                        const legSwing = Math.sin(p.userData.walk) * 0.3;
                        if (p.userData.ll) p.userData.ll.rotation.x = legSwing;
                        if (p.userData.rl) p.userData.rl.rotation.x = -legSwing;
                    }
                    return;
                }

                // Pedestrian riding subway (invisible, waiting to exit)
                if (p.userData.state === 'inSubway') {
                    if (t - p.userData.subwayStartTime > p.userData.rideDuration) {
                        // Exit at designated station
                        const exitStation = p.userData.exitStation;
                        p.position.set(
                            exitStation.x + Math.sin(exitStation.rotation) * 2 + (Math.random() - 0.5) * 2,
                            0.15,
                            exitStation.z + Math.cos(exitStation.rotation) * 2 + (Math.random() - 0.5) * 2
                        );
                        p.visible = true;
                        p.userData.state = 'walking';
                        p.userData.targetStation = null;
                        p.userData.exitStation = null;

                        // Remove from passengers
                        const idx = subwayPassengers.indexOf(p);
                        if (idx > -1) subwayPassengers.splice(idx, 1);

                        // Update block assignment
                        const bx = Math.floor((p.position.x + halfSize) / GRID.cellSize);
                        const bz = Math.floor((p.position.z + halfSize) / GRID.cellSize);
                        p.userData.currentBlock = {
                            x: Math.max(0, Math.min(GRID.gridCount - 1, bx)),
                            z: Math.max(0, Math.min(GRID.gridCount - 1, bz))
                        };

                        setNewPedTarget(p);
                    }
                    return;
                }

                const to = p.userData.target.clone().sub(p.position);
                to.y = 0;
                const d = to.length();

                if (d < 0.5) {
                    if (p.userData.state === 'toBuilding') {
                        // Arrived at building entrance - go inside
                        p.visible = false;
                        p.userData.state = 'insideBuilding';
                        p.userData.insideTime = 0;
                        return;
                    } else if (p.userData.state === 'towardsCrosswalk') {
                        const cw = p.userData.pendingCrosswalk;
                        if (isSafeToCross(cw)) {
                            p.userData.state = 'crossing';
                            if (cw.axis === 'z') {
                                const crossDir = p.userData.pendingBlock.z > p.userData.currentBlock.z ? 1 : -1;
                                p.userData.target = new THREE.Vector3(cw.x, 0.15, cw.z + crossDir * (GRID.roadWidth - 1));
                            } else {
                                const crossDir = p.userData.pendingBlock.x > p.userData.currentBlock.x ? 1 : -1;
                                p.userData.target = new THREE.Vector3(cw.x + crossDir * (GRID.roadWidth - 1), 0.15, cw.z);
                            }
                        } else {
                            // Not safe - wait briefly then give up if too long
                            p.userData.waitTime = (p.userData.waitTime || 0) + 0.016;
                            if (p.userData.waitTime > 3) {
                                // Give up waiting, go somewhere else
                                p.userData.waitTime = 0;
                                p.userData.state = 'walking';
                                p.userData.pendingCrosswalk = null;
                                p.userData.pendingBlock = null;
                                setNewPedTarget(p);
                            }
                        }
                        return;
                    } else if (p.userData.state === 'crossing') {
                        p.userData.currentBlock = p.userData.pendingBlock;
                        p.userData.state = 'walking';
                        p.userData.pendingCrosswalk = null;
                        p.userData.pendingBlock = null;
                        setNewPedTarget(p);
                    } else {
                        setNewPedTarget(p);
                    }
                } else {
                    // Movement speed - faster when crossing. Floor it so slow walkers
                    // (elders at 0.55x) still clear the roadway briskly instead of
                    // creeping mid-traffic. Applies to anyone actually standing on
                    // asphalt — avoidance pushes can strand a 'walking' ped mid-road
                    let moveSpeed = p.userData.spd;
                    const distToRoad = v => { const m = ((v + halfSize) % GRID.cellSize + GRID.cellSize) % GRID.cellSize; return Math.min(m, GRID.cellSize - m); };
                    const onRoad = distToRoad(p.position.x) < GRID.roadWidth / 2 || distToRoad(p.position.z) < GRID.roadWidth / 2;
                    if (p.userData.state === 'crossing' || onRoad) {
                        moveSpeed = Math.max(p.userData.spd * 2, 0.035);
                    }
                    
                    // Check for other pedestrians - avoid walking through each other
                    let blocked = false;
                    const targetDir = to.clone().normalize();

                    for (const other of peds) {
                        if (other === p || !other.visible) continue;

                        const dx = other.position.x - p.position.x;
                        const dz = other.position.z - p.position.z;
                        const dist = Math.sqrt(dx * dx + dz * dz);

                        // Personal space bubble - push away from nearby pedestrians
                        if (dist < 1.0 && dist > 0.01) {
                            // Normalize direction to other ped
                            const toOtherX = dx / dist;
                            const toOtherZ = dz / dist;

                            // Slow down significantly when close
                            if (dist < 0.6) {
                                blocked = true;
                            } else {
                                moveSpeed *= 0.3;
                            }

                            // Push away from other pedestrian (sideways avoidance)
                            const pushStrength = (1.0 - dist) * 0.015;
                            p.position.x -= toOtherX * pushStrength;
                            p.position.z -= toOtherZ * pushStrength;
                        }
                    }

                    // Also avoid cars even when not crossing (e.g., near curbs)
                    for (const car of cars) {
                        const cdx = car.position.x - p.position.x;
                        const cdz = car.position.z - p.position.z;
                        const cdist = Math.sqrt(cdx * cdx + cdz * cdz);

                        if (cdist < 2.8 && cdist > 0.01) {
                            // Push away — harder the closer the car
                            const push = cdist < 1.8 ? 0.09 : 0.03;
                            p.position.x -= cdx / cdist * push;
                            p.position.z -= cdz / cdist * push;
                            // Hard floor: never inside the vehicle footprint.
                            // 1.1 from the CENTER was inside long vehicles (buses
                            // are ~4.5 long) — they visibly rolled over pedestrians
                            if (cdist < 1.6) {
                                const need = 1.6 - cdist;
                                p.position.x -= cdx / cdist * need;
                                p.position.z -= cdz / cdist * need;
                            }
                            // Never keep walking INTO a close car
                            if (cdist < 1.6 && (cdx * targetDir.x + cdz * targetDir.z) > 0) {
                                blocked = true;
                            }
                        }
                    }
                    
                    // Check for vehicles when crossing the road — only MOVING cars block;
                    // a car stopped for you is your cue to keep walking (was a mutual standoff)
                    if (p.userData.state === 'crossing' && !blocked) {
                        // Check cars approaching
                        for (const car of cars) {
                            if (!car.userData.moving) continue;
                            const dx = car.position.x - p.position.x;
                            const dz = car.position.z - p.position.z;
                            const dist = Math.sqrt(dx * dx + dz * dz);
                            
                            // Only block if car is close AND moving toward pedestrian
                            if (dist < 4) {
                                // Check if car is heading toward ped
                                let approaching = false;
                                if (car.userData.axis === 'x') {
                                    approaching = (dx * car.userData.dir < 0) && Math.abs(dz) < 2;
                                } else {
                                    approaching = (dz * car.userData.dir < 0) && Math.abs(dx) < 2;
                                }
                                if (approaching) {
                                    blocked = true;
                                    break;
                                }
                            }
                        }
                    }
                    
                    if (!blocked) {
                        const dir = to.normalize();
                        
                        // Use moveSpeed (faster when crossing)
                        p.position.x += dir.x * moveSpeed;
                        p.position.z += dir.z * moveSpeed;
                        p.rotation.y = Math.atan2(dir.x, dir.z);
                        
                        // Faster leg animation when crossing
                        const walkRate = p.userData.state === 'crossing' ? 0.25 : 0.15;
                        p.userData.walk += walkRate;
                        const sw = Math.sin(p.userData.walk) * 0.3;
                        if (p.userData.ll) p.userData.ll.rotation.x = sw;
                        if (p.userData.rl) p.userData.rl.rotation.x = -sw;
                        
                        p.userData.stuckTime = 0;
                    } else {
                        // Track stuck time
                        p.userData.stuckTime = (p.userData.stuckTime || 0) + 0.016;
                        
                        // If stuck for more than 3 seconds, get a new target
                        if (p.userData.stuckTime > 3) {
                            p.userData.stuckTime = 0;
                            if (p.userData.state === 'crossing' && p.userData.pendingCrosswalk) {
                                // Abort: retreat to the curb we came from (never linger mid-road)
                                const cw = p.userData.pendingCrosswalk;
                                const curb = GRID.roadWidth / 2 + 0.7;
                                if (cw.axis === 'z') {
                                    const cd = p.userData.pendingBlock.z > p.userData.currentBlock.z ? 1 : -1;
                                    p.userData.target = new THREE.Vector3(cw.x, 0.15, cw.z - cd * curb);
                                } else {
                                    const cd = p.userData.pendingBlock.x > p.userData.currentBlock.x ? 1 : -1;
                                    p.userData.target = new THREE.Vector3(cw.x - cd * curb, 0.15, cw.z);
                                }
                                p.userData.pendingBlock = p.userData.currentBlock; // arrival keeps our block
                            } else {
                                setNewPedTarget(p);
                            }
                        }
                    }
                }
            });
        }

        function isSafeToCross(cw) {
            const t = clock.getElapsedTime();

            // First check traffic signal - pedestrians must obey walk signals
            for (const tl of tlights) {
                const tdx = Math.abs(cw.x - tl.userData.intersection.x);
                const tdz = Math.abs(cw.z - tl.userData.intersection.z);
                // If crosswalk is near this traffic light
                if (tdx < 15 && tdz < 15) {
                    const phase = (t + tl.userData.phase) % 10;
                    // Pedestrians can cross when perpendicular traffic has green
                    if (cw.axis === 'z') {
                        // Crossing a Z-axis road - wait for X-axis traffic to have green
                        const xGreen = phase < 4.5;
                        if (!xGreen) return false; // Don't cross, X-traffic has red
                    } else {
                        // Crossing an X-axis road - wait for Z-axis traffic to have green
                        const zGreen = phase >= 5 && phase < 9.5;
                        if (!zGreen) return false; // Don't cross, Z-traffic has red
                    }
                }
            }

            // Also check for approaching cars — stopped cars don't count (a car
            // waiting at the crosswalk is exactly the one you cross in front of)
            for (const car of cars) {
                if (!car.userData.moving) continue;
                const dx = cw.x - car.position.x;
                const dz = cw.z - car.position.z;

                if (cw.axis === 'z' && car.userData.axis === 'x') {
                    if (Math.abs(car.position.z - cw.z) < 5) {
                        const dist = Math.abs(dx);
                        if (dist < 15) return false;
                    }
                } else if (cw.axis === 'x' && car.userData.axis === 'z') {
                    if (Math.abs(car.position.x - cw.x) < 5) {
                        const dist = Math.abs(dz);
                        if (dist < 15) return false;
                    }
                }
            }
            return true;
        }

        function updTL(t) { 
            tlights.forEach(tl => { 
                const ph = (t + tl.userData.phase) % 10;
                // X-axis roads: green from 0-5, red from 5-10
                // Z-axis roads: red from 0-5, green from 5-10
                const xGreen = ph < 4.5;
                const xYellow = ph >= 4.5 && ph < 5;
                const zGreen = ph >= 5 && ph < 9.5;
                const zYellow = ph >= 9.5;
                
                tl.userData.lts.forEach(l => { 
                    const isXAxis = l.userData.axis === 'x';
                    const idx = l.userData.lightIndex; // 0=red, 1=yellow, 2=green
                    
                    let on = false;
                    if (isXAxis) {
                        // Lights for X-axis traffic
                        if (idx === 2) on = xGreen;           // Green
                        else if (idx === 1) on = xYellow;     // Yellow
                        else if (idx === 0) on = !xGreen && !xYellow; // Red
                    } else {
                        // Lights for Z-axis traffic
                        if (idx === 2) on = zGreen;           // Green
                        else if (idx === 1) on = zYellow;     // Yellow  
                        else if (idx === 0) on = !zGreen && !zYellow; // Red
                    }
                    
                    l.material.color.setHex(on ? l.userData.activeCol : 0x222222); 
                }); 
            }); 
        }

        function updBillboards(t) {
            billboards.forEach(bb => {
                bb.traverse(child => {
                    if (child.userData.isBillboardLight) {
                        const idx = child.userData.lightIndex;
                        const wave = Math.sin(t * 3 + idx * 0.5) > 0.3;
                        child.material.opacity = wave ? 1 : 0.2;
                    }
                    if (child.userData.isGlow) {
                        child.material.opacity = 0.3 + Math.sin(t * 2) * 0.2;
                    }
                    // Flash PAY TAXES sign
                    if (child.userData.isTaxSign) {
                        child.visible = Math.sin(t * 4) > 0;
                    }
                    if (child.userData.isTaxSignOff) {
                        child.visible = Math.sin(t * 4) <= 0;
                    }
                    // Marlboro Country chasing lights
                    if (child.userData.isMarlboroLight) {
                        const idx = child.userData.lightIndex;
                        // Chase pattern - lights turn on/off in sequence
                        const phase = (t * 5 + idx * 0.3) % (Math.PI * 2);
                        const brightness = Math.sin(phase) > 0.2 ? 1 : 0.15;
                        child.material.color.setRGB(
                            brightness * 1.0,
                            brightness * 0.85,
                            brightness * 0.3
                        );
                    }
                    // Aircraft warning lights - cascade from top to bottom
                    if (child.userData.isWarningLight) {
                        const idx = child.userData.lightIndex;
                        const total = child.userData.totalLights;
                        // Cascade effect: lights flash in sequence from top (idx 0) to bottom
                        const phase = (t * 2 - idx * 0.4) % (Math.PI * 2);
                        const isOn = Math.sin(phase) > 0.5;
                        child.material.color.setRGB(isOn ? 1 : 0.2, 0, 0);
                        child.scale.setScalar(isOn ? 1.2 : 0.8);
                    }
                });
            });
        }

        function updWindowLights(t) {
            if (t >= lastWindowToggle) {
                if (allWindows.length > 0) {
                    // Rework ~1% of all windows per tick so lights visibly flick on/off
                    // and the whole city converges to the hour's lit fraction
                    const numToToggle = Math.round(allWindows.length * 0.01) + Math.floor(Math.random() * 10);

                    for (let i = 0; i < numToToggle; i++) {
                        const win = allWindows[Math.floor(Math.random() * allWindows.length)];
                        if (win.userData.hasFigure) continue; // silhouette windows stay backlit

                        // Probability of being lit depends on time of day
                        const shouldBeLit = Math.random() < WIN_LIT_P();
                        if (shouldBeLit !== win.userData.isLit) setWindowLit(win, shouldBeLit);
                    }
                }
                lastWindowToggle = t + 0.3 + Math.random() * 0.5;
            }
        }

        function updSecrets(t) {
            secrets.forEach(s => {
                if (s.userData.type === 'ufo') { 
                    s.position.x = 30 + Math.sin(t * 0.15) * 25; 
                    s.position.z = 30 + Math.cos(t * 0.2) * 25; 
                    s.position.y = 65 + Math.sin(t * 0.3) * 8;
                    s.rotation.y += 0.01; 
                    s.traverse(c => { if (c.userData.ufoL) c.material.color.setHex(Math.sin(t * 5 + c.userData.ph) > 0 ? 0x00ff00 : 0x004400); }); 
                }
                if (s.userData.type === 'balloon') { 
                    s.position.y = 50 + Math.sin(t * 0.2) * 6; 
                    s.position.x = 5 + Math.sin(t * 0.1) * 10; 
                    s.rotation.y += 0.003; 
                }
                if (s.userData.type === 'heli') { 
                    if (s.userData.mainRotor) s.userData.mainRotor.rotation.y += 0.3;
                }
            });
        }

        function chkDiscoveries() { 
            secrets.forEach(s => { 
                if (cam.position.distanceTo(s.position) < 25 && !discoveries.has(s.userData.secret)) { 
                    discoveries.add(s.userData.secret); 
                    notify(`🎉 DISCOVERED!<br>${s.userData.secret}<br>(${discoveries.size}/3 secrets)`, 4000); 
                } 
            }); 
        }

        init();
    </script>
</body>
