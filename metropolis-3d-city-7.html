<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metropolis - 3D City Explorer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #87CEEB; font-family: system-ui, sans-serif; }
        #c { width: 100vw; height: 100vh; display: block; }
        
        #hud {
            position: fixed; top: 20px; left: 20px;
            color: #000; font-size: 14px; z-index: 100;
            background: rgba(255,255,255,0.8); padding: 10px 15px; border-radius: 8px;
            pointer-events: none;
        }
        #hud div { margin-bottom: 4px; }
        #hud .label { color: #666; font-size: 10px; }
        
        #weather { position: fixed; top: 20px; right: 20px; color: #333; font-size: 14px; z-index: 100; 
            background: rgba(255,255,255,0.8); padding: 8px 12px; border-radius: 8px; }
        
        #controls {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: #333; font-size: 12px; text-align: center; z-index: 100;
            background: rgba(255,255,255,0.9); padding: 10px 20px; border-radius: 8px;
        }
        
        #minimap {
            position: fixed; bottom: 70px; right: 20px;
            width: 130px; height: 130px; border-radius: 50%;
            border: 3px solid rgba(0,100,200,0.6);
            background: rgba(200,230,255,0.9); z-index: 100; overflow: hidden;
        }
        #minimap canvas { width: 100%; height: 100%; }
        
        #loading {
            position: fixed; inset: 0; background: linear-gradient(135deg, #87CEEB, #4a90c2);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; transition: opacity 0.8s;
        }
        #loading.done { opacity: 0; pointer-events: none; }
        #loading h1 { color: #fff; font-size: 42px; letter-spacing: 8px; margin-bottom: 25px; text-shadow: 2px 2px 10px rgba(0,0,0,0.3); }
        #bar { width: 280px; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; overflow: hidden; }
        #prog { width: 0%; height: 100%; background: #fff; transition: width 0.2s; }
        #ltxt { margin-top: 12px; color: #fff; font-size: 11px; letter-spacing: 2px; }
        
        #tooltip {
            position: fixed; transform: translate(-50%, -115%);
            background: rgba(18,20,28,0.92); color: #fff; padding: 8px 13px;
            border-radius: 8px; border: 1px solid rgba(255,255,255,0.25);
            font-size: 13px; max-width: 280px; z-index: 150;
            pointer-events: none; opacity: 0; transition: opacity 0.15s;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }
        #tooltip.show { opacity: 1; }
        #tooltip b { font-size: 14px; }
        #tooltip .tipsub { color: #cfd6e4; font-style: italic; margin-top: 3px; line-height: 1.35; }

        #xhair {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.8); font-size: 18px; z-index: 140;
            pointer-events: none; display: none; text-shadow: 0 0 3px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div id="loading">
        <h1>METROPOLIS</h1>
        <div id="bar"><div id="prog"></div></div>
        <div id="ltxt">INITIALIZING...</div>
    </div>
    
    <canvas id="c"></canvas>
    
    <div id="hud">
        <div><span class="label">ALT</span> <span id="alt">0</span>m</div>
        <div><span class="label">SPD</span> <span id="spd">0</span>km/h</div>
        <div><span class="label">POS</span> <span id="pos">0,0</span></div>
    </div>
    
    <div id="weather">☀️ Sunny 24°C</div>
    <div id="minimap"><canvas id="mm"></canvas></div>
    <div id="controls">WASD: Move • Q/E: Up/Down • Mouse: Look • Aim at shops for info • Scroll: Zoom • R: Rain • T: Cycle time • Space: Boost • Click to start</div>
    <div id="tooltip"></div>
    <div id="xhair">+</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        
        const $ = id => document.getElementById(id);
        
        const GRID = {
            cellSize: 24,
            roadWidth: 8,
            sidewalkWidth: 2,
            gridCount: 4
        };
        
        const CFG = { cars: 10, emergencyVehicles: 2, peds: 40, bikes: 3, flocks: 4 };

        // Zenith/horizon pairs — sky is rendered as a gradient dome, not a flat color
        const SKY_COLORS = {
            midnight: { zenith: 0x04040f, horizon: 0x0d0d24 },
            dawn:     { zenith: 0x4a5a8a, horizon: 0xffb377 },
            day:      { zenith: 0x3d72c0, horizon: 0xc4dcef },
            dusk:     { zenith: 0x35407a, horizon: 0xff7a4a },
            night:    { zenith: 0x060614, horizon: 0x12122c }
        };

        // Overcast palettes (scaled by daylight so weather skies darken at night)
        const WEATHER_SKY = {
            cloudy: { zenith: 0x73838f, horizon: 0xaab6c0 },
            rain:   { zenith: 0x5a6878, horizon: 0x8593a1 },
            storm:  { zenith: 0x353f4b, horizon: 0x515c6a }
        };

        let lightningFlash = 0; // 0-1, decays each frame; whitens sky + boosts light

        const BIRD_CFG = {
            flockSizes: [3, 5, 6, 8],     // Possible flock sizes for variety
            speed: 0.15,                   // Base bird speed
            turnSpeed: 0.03,               // How fast birds can turn
            separationDist: 2,             // Minimum distance between birds
            cohesionDist: 15,              // Max distance for cohesion
            alignmentDist: 10,             // Max distance for alignment
            separationWeight: 1.5,         // Weight of separation force
            cohesionWeight: 0.8,           // Weight of cohesion force
            alignmentWeight: 1.0,          // Weight of alignment force
            wanderWeight: 0.3,             // Weight of random wandering
            minHeight: 15,                 // Minimum flying height
            maxHeight: 60,                 // Maximum flying height
            boundaryMargin: 50,            // How far outside city birds can go
            landingChance: 0.002,          // Per-frame chance a flying bird decides to land
            minLandTime: 5,                // Minimum seconds to stay landed
            maxLandTime: 15,               // Maximum seconds to stay landed
            scatterDistance: 3,            // Distance at which pedestrians scare birds
            landingSpeed: 0.08,            // Speed when descending to land
            takeoffSpeed: 0.12             // Speed when taking off
        };

        const PERFORMER_CFG = {
            maxPerformers: 3,           // Maximum simultaneous performers
            spawnInterval: 45,          // Seconds between spawn checks
            spawnChance: 0.5,           // Chance to spawn when checked
            performDuration: [60, 120], // Min/max seconds a performer stays
            attractRadius: 12,          // Distance at which pedestrians notice
            crowdRadius: 3,             // Distance crowd stands from performer
            maxCrowd: 8                 // Maximum pedestrians watching one performer
        };

        const SUBWAY_CFG = {
            trackHeight: 6,           // Height of elevated track above ground
            trainSpeed: 0.12,         // Train movement speed
            stopDuration: 5,          // Seconds train waits at station
            stationSpacing: 40        // Approximate distance between stations
        };

        const ROOFTOP_CFG = {
            partySpawnInterval: 60,    // Seconds between party spawn checks
            partySpawnChance: 0.4,     // Chance to spawn party when checked
            partyDuration: [90, 180],  // Min/max seconds a party lasts
            maxParties: 2,             // Maximum simultaneous parties
            figuresPerGarden: [1, 3],  // Min/max figures on gardens
            figuresPerPool: [1, 2],    // Min/max figures near pools
            figuresPerParty: [4, 8]    // Min/max figures at parties
        };

        let scene, cam, renderer, clock;
        let composer, bloomPass, skyDome;
        let envMats = [], envMatsTimer = 0;
        let sunLight = null;      // Directional light reference
        let ambientLight = null;  // Ambient light reference
        let hemiLight = null;     // Hemisphere light reference
        let buildings = [], cars = [], emergencyVehicles = [], peds = [], tlights = [];
        let bicycles = [];
        let buildingEntrances = [];
        let allWindows = [];
        let billboards = [];
        let streetlights = [];
        let activeRooftops = [];  // Buildings with rooftop features (gardens/pools) for figure placement
        let vel = null, baseSpd = 0.5, boost = false;
        let raining = false, rain = null;
        
        // Weather system
        let weatherState = 'sunny'; // 'sunny', 'cloudy', 'rain', 'storm'
        let weatherTimer = 0;
        let nextWeatherChange = 30 + Math.random() * 60; // First change in 30-90 seconds
        let stormDebris = [];
        let lightning = null;
        let lastLightning = 0;
        let windDirection = { x: 0, z: 0 };
        let windStrength = 0;

        // Day/night cycle system
        let timeOfDay = 0.25; // 0-1 where 0=midnight, 0.25=dawn, 0.5=noon, 0.75=dusk
        let dayNightSpeed = 0.005; // How fast time passes (full cycle in ~200 seconds at 60fps)
        let isNight = false; // Computed from timeOfDay for quick checks
        let prevIsNight; // Track previous night state for transition detection
        let sunMesh = null;   // Visual sun sphere
        let moonMesh = null;  // Visual moon sphere

        let yaw = 0, pitch = -0.3, keys = {}, discoveries = new Set();
        let secrets = [], mmCtx;

        // Bird flock system
        let flocks = [];  // Array of flock groups, each containing birds[]

        // Street performer system
        let performers = [];

        // Subway system
        let subwayTrain = null;
        let subwayStations = [];
        let subwayTrack = null;
        let subwayPassengers = [];      // Pedestrians currently riding subway
        const SUBWAY_MAX_PASSENGERS = 12;

        // Rooftop party system
        let rooftopParties = [];      // Active rooftop party events
        let rooftopFigures = [];      // All rooftop figures (static + party)
        let lastPartySpawn = 0;       // Timer for party spawning

        let lastWindowToggle = 0;
        let lastBikeSpawn = 0;
        let policeChaseTarget = null;
        
        // Gridlock detection system
        let lastGridlockCheck = 0;
        let trafficCop = null;
        let trafficCopTarget = null;
        
        // Special events system
        let specialEvent = null;
        let eventEntities = [];
        let lastEventCheck = 0;
        let eventCooldown = 0;
        let lastPerformerCheck = 0;
        
        // Garbage truck system
        let garbageTruck = null;
        let lastGarbageTruck = 0;
        let garbageTruckActive = false;
        let suctionActive = false;
        
        // Falling person system
        let fallingPerson = null;
        let fallenBody = null;
        let lastFallEvent = 0;
        let fallState = 'none'; // 'none', 'inWindow', 'falling', 'onGround', 'ambulancecoming', 'pickedup'
        let fallEventTimer = 0;
        let ambulanceForFallen = null;
        let flashingWindow = null;
        let flashCount = 0;
        
        let crosswalks = [];
        let signalizedIntersections = []; // Intersections with crosswalks and signals

        const totalSize = GRID.cellSize * GRID.gridCount;
        const halfSize = totalSize / 2;

        function prog(p, t) {
            $('prog').style.width = p + '%';
            $('ltxt').textContent = t.toUpperCase();
        }

        async function init() {
            prog(5, 'Creating universe...');

            vel = new THREE.Vector3();
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 55, 330); // closer near plane = more aerial depth
            
            cam = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.35, 500);
            cam.position.set(0, 40, 0);
            
            renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true });
            renderer.setSize(innerWidth, innerHeight);
            renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.05; // 1.3 washed out the midtones

            composer = new EffectComposer(renderer);
            composer.addPass(new RenderPass(scene, cam));
            bloomPass = new UnrealBloomPass(
                new THREE.Vector2(innerWidth, innerHeight),
                0.0,   // strength — driven per-frame by time of day
                0.45,  // radius
                0.72   // threshold — only bright emissives bloom
            );
            composer.addPass(bloomPass);
            composer.addPass(new OutputPass());

            // Environment map: without one, metallic PBR materials render black
            const pmrem = new THREE.PMREMGenerator(renderer);
            scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
            pmrem.dispose();
            
            clock = new THREE.Clock();
            
            prog(10, 'Lighting...');
            mkLighting();
            mkSkyDome();
            mkCelestialBodies();
            mkStars();

            prog(20, 'City layout...');
            initTextures();
            mkCityLayout();

            prog(50, 'Buildings...');
            mkBuildings();
            mkAirport();
            
            prog(60, 'Billboards...');
            mkBillboards();
            mkWallAds();
            
            prog(70, 'Traffic system...');
            mkTrafficLights();
            mkStreetlights();
            mkCars();
            mkEmergencyVehicles();
            mkBuses();
            
            mkParkedCars();

            prog(80, 'Population...');
            mkPeds();
            mkBicycles();
            mkStreetLife();
            
            prog(90, 'Secrets...');
            mkSecrets();
            mkFlocks();

            // Spawn initial performer
            spawnPerformer();

            prog(98, 'Systems...');
            setupMM();
            setupInput();
            
            prog(100, 'Welcome');
            setTimeout(() => {
                $('loading').classList.add('done');
                notify('🌆 Welcome to Metropolis<br>Click to look around!', 3500);
            }, 400);
            
            animate();
        }

        function mkLighting() {
            // Low ambient + strong directional sun: shadows need contrast to read as real
            ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);

            sunLight = new THREE.DirectionalLight(0xfffacd, 2.2);
            sunLight.position.set(80, 120, 60);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 4096;
            sunLight.shadow.mapSize.height = 4096;
            sunLight.shadow.camera.near = 10;
            sunLight.shadow.camera.far = 400;
            sunLight.shadow.camera.left = -120;
            sunLight.shadow.camera.right = 120;
            sunLight.shadow.camera.top = 120;
            sunLight.shadow.camera.bottom = -120;
            sunLight.shadow.bias = -0.0004;
            sunLight.shadow.normalBias = 0.03;
            scene.add(sunLight);
            scene.add(sunLight.target);

            // Ground bounce is city asphalt, not lawn — a green ground colour tinted
            // every north-facing facade olive
            hemiLight = new THREE.HemisphereLight(0x9fc4e8, 0x584f46, 0.55);
            scene.add(hemiLight);
        }

        // ---- Sky extras: drifting cloud sheet + night starfield ----
        let starField = null;

        // Wrapping puffs. Every blob is stamped 9x so the texture tiles seamlessly,
        // which means it is easy to end up with total coverage — keep the count low
        // and the falloff sharp or the sky turns into a solid lid.
        function mkCloudTexture() {
            const tex = _mkTex(512, (ctx, s) => {
                ctx.clearRect(0, 0, s, s);
                for (let i = 0; i < 14; i++) {
                    const cx = Math.random() * s, cy = Math.random() * s;
                    const r = 22 + Math.random() * 46;
                    const puffs = 3 + Math.floor(Math.random() * 4);
                    for (let p = 0; p < puffs; p++) {
                        const px = cx + (Math.random() - 0.5) * r * 2.0;
                        const py = cy + (Math.random() - 0.5) * r * 0.8;
                        const pr = r * (0.3 + Math.random() * 0.45);
                        for (const [ox, oy] of [[0, 0], [s, 0], [-s, 0], [0, s], [0, -s], [s, s], [-s, -s], [s, -s], [-s, s]]) {
                            if (Math.abs(px + ox - s / 2) > s * 0.62 || Math.abs(py + oy - s / 2) > s * 0.62) continue;
                            const g = ctx.createRadialGradient(px + ox, py + oy, 0, px + ox, py + oy, pr);
                            g.addColorStop(0, 'rgba(255,255,255,0.72)');
                            g.addColorStop(0.4, 'rgba(255,255,255,0.28)');
                            g.addColorStop(1, 'rgba(255,255,255,0)');
                            ctx.fillStyle = g;
                            ctx.beginPath(); ctx.arc(px + ox, py + oy, pr, 0, Math.PI * 2); ctx.fill();
                        }
                    }
                }
            });
            tex.repeat.set(1, 1);
            return tex;
        }

        function mkStars() {
            const N = 900, pos = new Float32Array(N * 3), sz = new Float32Array(N);
            for (let i = 0; i < N; i++) {
                const th = Math.random() * Math.PI * 2, ph = Math.acos(Math.random() * 0.98 + 0.02);
                const r = 415;
                pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
                pos[i * 3 + 1] = r * Math.cos(ph);
                pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
                sz[i] = 1 + Math.random() * 2.2;
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('size', new THREE.BufferAttribute(sz, 1));
            starField = new THREE.Points(geo, new THREE.PointsMaterial({
                color: 0xfdfdff, size: 2.2, sizeAttenuation: false,
                transparent: true, opacity: 0, depthWrite: false, fog: false
            }));
            starField.renderOrder = -1;
            scene.add(starField);
        }

        function mkSkyDome() {
            const geo = new THREE.SphereGeometry(440, 48, 24);
            const mat = new THREE.ShaderMaterial({
                side: THREE.BackSide,
                depthWrite: false,
                fog: false,
                uniforms: {
                    zenithColor: { value: new THREE.Color(SKY_COLORS.dawn.zenith) },
                    horizonColor: { value: new THREE.Color(SKY_COLORS.dawn.horizon) },
                    cloudMap: { value: mkCloudTexture() },
                    cloudTint: { value: new THREE.Color(0xffffff) },
                    cloudAmt: { value: 0.45 },
                    cloudOff: { value: new THREE.Vector2(0, 0) }
                },
                vertexShader: `
                    varying vec3 vDir;
                    void main() {
                        vDir = position;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }`,
                fragmentShader: `
                    uniform vec3 zenithColor;
                    uniform vec3 horizonColor;
                    uniform sampler2D cloudMap;
                    uniform vec3 cloudTint;
                    uniform float cloudAmt;
                    uniform vec2 cloudOff;
                    varying vec3 vDir;
                    void main() {
                        vec3 dir = normalize(vDir);
                        float h = dir.y;
                        // slow falloff near horizon gives the hazy band real skies have
                        float f = pow(max(h, 0.0), 0.55);
                        vec3 sky = mix(horizonColor, zenithColor, f);

                        // Clouds are part of the sky, not a separate dome hung inside it.
                        // As geometry they showed their own rim as a black silhouette and
                        // fought the star layer for depth; here they simply cannot.
                        float lat = acos(clamp(h, -1.0, 1.0)) / 3.14159265;
                        float lon = atan(dir.z, dir.x) / 6.2831853 + 0.5;
                        vec2 uv = vec2(lon * 3.0 + cloudOff.x, lat * 2.6 + cloudOff.y);
                        float c = texture2D(cloudMap, uv).a;
                        // fade out toward the horizon so there is never a hard edge
                        c *= smoothstep(0.02, 0.30, h) * cloudAmt;
                        gl_FragColor = vec4(mix(sky, cloudTint, clamp(c, 0.0, 1.0)), 1.0);
                    }`
            });
            skyDome = new THREE.Mesh(geo, mat);
            skyDome.renderOrder = -1;
            scene.add(skyDome);
            scene.background = null; // dome replaces the flat background color
        }

        // Single entry point for sky color: drives dome gradient + fog tint.
        // dim scales the palette (night-time overcast), lightningFlash whitens it.
        const _skyZen = new THREE.Color(), _skyHor = new THREE.Color(), _skyWhite = new THREE.Color(0xffffff);
        function setSky(zenithHex, horizonHex, dim = 1) {
            _skyZen.set(zenithHex).multiplyScalar(dim);
            _skyHor.set(horizonHex).multiplyScalar(dim);
            if (lightningFlash > 0.01) {
                _skyZen.lerp(_skyWhite, lightningFlash * 0.8);
                _skyHor.lerp(_skyWhite, lightningFlash * 0.8);
            }
            if (skyDome) {
                skyDome.material.uniforms.zenithColor.value.copy(_skyZen);
                skyDome.material.uniforms.horizonColor.value.copy(_skyHor);
            }
            if (scene.fog) scene.fog.color.copy(_skyHor);
        }

        function mkCelestialBodies() {
            // Sun - bright yellow sphere with glow effect
            const sunGeo = new THREE.SphereGeometry(8, 32, 32);
            const sunMat = new THREE.MeshBasicMaterial({
                color: 0xffdd44,
                transparent: true,
                opacity: 1.0
            });
            sunMesh = new THREE.Mesh(sunGeo, sunMat);
            sunMesh.position.set(0, 100, 0); // Will be updated by updDayNight
            scene.add(sunMesh);

            // Sun glow halo
            const glowGeo = new THREE.SphereGeometry(12, 32, 32);
            const glowMat = new THREE.MeshBasicMaterial({
                color: 0xffff88,
                transparent: true,
                opacity: 0.3,
                side: THREE.BackSide
            });
            const sunGlow = new THREE.Mesh(glowGeo, glowMat);
            sunMesh.add(sunGlow); // Attach glow to sun

            // Moon - pale white/gray sphere
            const moonGeo = new THREE.SphereGeometry(5, 32, 32);
            const moonMat = new THREE.MeshBasicMaterial({
                color: 0xeeeecc,
                transparent: true,
                opacity: 1.0
            });
            moonMesh = new THREE.Mesh(moonGeo, moonMat);
            moonMesh.position.set(0, -100, 0); // Start below horizon
            scene.add(moonMesh);

            // Moon crater details (simple dark spots)
            const craterMat = new THREE.MeshBasicMaterial({ color: 0xccccaa });
            const craterPositions = [
                { x: 1, y: 0.5, z: 4, size: 0.8 },
                { x: -1.5, y: -0.8, z: 3.5, size: 1.0 },
                { x: 0.5, y: 1.2, z: 3.8, size: 0.6 }
            ];
            craterPositions.forEach(cp => {
                const crater = new THREE.Mesh(
                    new THREE.CircleGeometry(cp.size, 12),
                    craterMat
                );
                crater.position.set(cp.x, cp.y, cp.z);
                crater.lookAt(0, 0, 0); // Face outward from center
                moonMesh.add(crater);
            });
        }

        // ---- Procedural surface textures (canvas-generated, shared) ----
        function _mkTex(size, painter) {
            const c = document.createElement('canvas');
            c.width = c.height = size;
            painter(c.getContext('2d'), size);
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.anisotropy = 8;
            return tex;
        }

        function _fillNoise(ctx, size, r, g, b, vary) {
            const img = ctx.createImageData(size, size);
            const d = img.data;
            for (let i = 0; i < d.length; i += 4) {
                const v = (Math.random() - 0.5) * vary;
                d[i] = r + v; d[i + 1] = g + v; d[i + 2] = b + v; d[i + 3] = 255;
            }
            ctx.putImageData(img, 0, 0);
        }

        const TEX = {};
        function initTextures() {
            // Asphalt: dark grain + light aggregate speckle + tire-worn dark patches
            const asphalt = _mkTex(256, (ctx, s) => {
                _fillNoise(ctx, s, 74, 74, 78, 24);
                for (let i = 0; i < 900; i++) {
                    const a = 0.25 + Math.random() * 0.3;
                    ctx.fillStyle = Math.random() < 0.6 ? `rgba(130,130,135,${a})` : `rgba(25,25,28,${a})`;
                    ctx.fillRect(Math.random() * s, Math.random() * s, 1.5, 1.5);
                }
                for (let i = 0; i < 6; i++) {
                    ctx.fillStyle = 'rgba(20,20,22,0.12)';
                    ctx.beginPath();
                    ctx.ellipse(Math.random() * s, Math.random() * s, 30 + Math.random() * 50, 15 + Math.random() * 30, Math.random() * Math.PI, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            TEX.asphaltH = asphalt;            TEX.asphaltH.repeat.set(52, 1);
            TEX.asphaltV = asphalt.clone();    TEX.asphaltV.repeat.set(1, 52);

            // Concrete: light grain + expansion joints + stains
            const concrete = _mkTex(256, (ctx, s) => {
                _fillNoise(ctx, s, 152, 151, 146, 18);
                ctx.strokeStyle = 'rgba(90,90,88,0.5)';
                ctx.lineWidth = 2;
                for (let p = 0; p <= s; p += 64) {
                    ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, s); ctx.stroke();
                }
                for (let i = 0; i < 10; i++) {
                    ctx.fillStyle = `rgba(100,98,92,${0.06 + Math.random() * 0.08})`;
                    ctx.beginPath();
                    ctx.ellipse(Math.random() * s, Math.random() * s, 15 + Math.random() * 35, 10 + Math.random() * 25, Math.random() * Math.PI, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            TEX.concreteH = concrete;          TEX.concreteH.repeat.set(7, 1);
            TEX.concreteV = concrete.clone();  TEX.concreteV.repeat.set(1, 5);

            // Grass: green noise + mottled patches (worn dirt + lush spots)
            TEX.grass = _mkTex(256, (ctx, s) => {
                _fillNoise(ctx, s, 86, 104, 74, 30);
                for (let i = 0; i < 14; i++) {
                    const lush = Math.random() < 0.5;
                    ctx.fillStyle = lush ? 'rgba(60,105,55,0.18)' : 'rgba(125,115,75,0.14)';
                    ctx.beginPath();
                    ctx.ellipse(Math.random() * s, Math.random() * s, 20 + Math.random() * 45, 15 + Math.random() * 35, Math.random() * Math.PI, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            TEX.grass.repeat.set(14, 14);

            // Facade: near-white grain with floor bands + grime streaks (tinted per building)
            TEX.facade = _mkTex(256, (ctx, s) => {
                _fillNoise(ctx, s, 224, 224, 224, 12);
                ctx.fillStyle = 'rgba(120,120,125,0.25)';
                for (let y = 0; y < s; y += 32) ctx.fillRect(0, y, s, 2);
                for (let i = 0; i < 18; i++) {
                    const x = Math.random() * s;
                    ctx.fillStyle = `rgba(95,95,100,${0.04 + Math.random() * 0.07})`;
                    ctx.fillRect(x, 0, 3 + Math.random() * 8, s);
                }
            });

            // Brick: running bond with per-brick shade variation over mortar
            TEX.facadeBrick = _mkTex(256, (ctx, s) => {
                ctx.fillStyle = 'rgb(176,166,156)'; ctx.fillRect(0, 0, s, s);
                const bh = 10, bw = 26;
                for (let y = 0; y < s; y += bh) {
                    const off = (y / bh) % 2 ? bw / 2 : 0;
                    for (let x = -bw; x < s; x += bw) {
                        const v = (Math.random() - 0.5) * 30;
                        ctx.fillStyle = `rgb(${146 + v | 0},${76 + v * 0.6 | 0},${60 + v * 0.5 | 0})`;
                        ctx.fillRect(x + off + 1, y + 1, bw - 2, bh - 2);
                    }
                }
            });

            // Marble: pale stone with meandering veins
            TEX.facadeMarble = _mkTex(256, (ctx, s) => {
                _fillNoise(ctx, s, 228, 226, 220, 10);
                for (let i = 0; i < 9; i++) {
                    ctx.strokeStyle = `rgba(120,118,125,${0.15 + Math.random() * 0.2})`;
                    ctx.lineWidth = 1 + Math.random() * 1.5;
                    ctx.beginPath();
                    let x = Math.random() * s, y = 0;
                    ctx.moveTo(x, y);
                    while (y < s) { y += 10 + Math.random() * 20; x += (Math.random() - 0.5) * 30; ctx.lineTo(x, y); }
                    ctx.stroke();
                }
                ctx.fillStyle = 'rgba(140,140,145,0.3)';
                for (let y = 0; y < s; y += 42) ctx.fillRect(0, y, s, 2); // block courses
            });

            // Steel: panel grid, darker random panels, rivet dots
            TEX.facadeSteel = _mkTex(256, (ctx, s) => {
                _fillNoise(ctx, s, 138, 143, 150, 14);
                const p = 42;
                for (let y = 0; y < s; y += p) for (let x = 0; x < s; x += p) {
                    if (Math.random() < 0.3) { ctx.fillStyle = 'rgba(60,66,75,0.25)'; ctx.fillRect(x, y, p, p); }
                }
                ctx.strokeStyle = 'rgba(50,55,62,0.7)'; ctx.lineWidth = 2;
                for (let v = 0; v <= s; v += p) {
                    ctx.beginPath(); ctx.moveTo(v, 0); ctx.lineTo(v, s); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(0, v); ctx.lineTo(s, v); ctx.stroke();
                }
                ctx.fillStyle = 'rgba(210,215,222,0.6)';
                for (let y = 6; y < s; y += p) for (let x = 6; x < s; x += p / 2) ctx.fillRect(x, y, 2, 2);
            });

            // Cement: raw board-formed concrete with tie holes
            TEX.facadeCement = _mkTex(256, (ctx, s) => {
                _fillNoise(ctx, s, 158, 156, 150, 22);
                ctx.strokeStyle = 'rgba(105,103,98,0.5)'; ctx.lineWidth = 1.5;
                for (let y = 0; y < s; y += 20) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(s, y); ctx.stroke(); }
                ctx.fillStyle = 'rgba(70,68,64,0.55)';
                for (let y = 30; y < s; y += 60) for (let x = 30; x < s; x += 60) {
                    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
                }
                for (let i = 0; i < 8; i++) {
                    ctx.fillStyle = `rgba(95,93,88,${0.05 + Math.random() * 0.08})`;
                    ctx.fillRect(Math.random() * s, 0, 4 + Math.random() * 10, s);
                }
            });

            // Glass curtain wall: blue-grey panes with diagonal sky reflections
            TEX.facadeGlass = _mkTex(256, (ctx, s) => {
                _fillNoise(ctx, s, 105, 130, 158, 16);
                ctx.save();
                ctx.rotate(-0.5);
                ctx.fillStyle = 'rgba(230,240,250,0.14)';
                for (let i = -2; i < 6; i++) ctx.fillRect(i * 90, -s, 24 + Math.random() * 30, s * 3);
                ctx.restore();
                ctx.strokeStyle = 'rgba(30,38,48,0.8)'; ctx.lineWidth = 2;
                for (let v = 0; v <= s; v += 32) {
                    ctx.beginPath(); ctx.moveTo(v, 0); ctx.lineTo(v, s); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(0, v); ctx.lineTo(s, v); ctx.stroke();
                }
            });

            // Weighted facade palette: {tex, rough, metal, tinted} — tinted means the
            // building's type color multiplies in; strongly-colored textures stay near-white.
            // Tar-and-gravel roof deck: seams, gravel speckle, ponding stains
            TEX.roof = _mkTex(256, (ctx, s) => {
                _fillNoise(ctx, s, 60, 60, 63, 22);
                for (let i = 0; i < 1600; i++) {
                    const g = 110 + Math.random() * 70 | 0;
                    ctx.fillStyle = `rgba(${g},${g - 4},${g - 12},${0.12 + Math.random() * 0.3})`;
                    ctx.fillRect(Math.random() * s, Math.random() * s, 2, 2);
                }
                ctx.strokeStyle = 'rgba(32,32,36,0.65)'; ctx.lineWidth = 3;
                for (let p = 0; p <= s; p += 52) { ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(s, p); ctx.stroke(); }
                for (let i = 0; i < 6; i++) {
                    ctx.fillStyle = `rgba(28,30,34,${0.1 + Math.random() * 0.16})`;
                    ctx.beginPath();
                    ctx.ellipse(Math.random() * s, Math.random() * s, 18 + Math.random() * 44, 12 + Math.random() * 30, Math.random() * Math.PI, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Block-interior paving: big slabs, joints, oil stains, hairline cracks
            TEX.paving = _mkTex(256, (ctx, s) => {
                _fillNoise(ctx, s, 118, 116, 112, 20);
                ctx.strokeStyle = 'rgba(72,70,68,0.55)'; ctx.lineWidth = 2.5;
                for (let p = 0; p <= s; p += 64) {
                    ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, s); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(s, p); ctx.stroke();
                }
                for (let i = 0; i < 12; i++) {
                    ctx.fillStyle = `rgba(60,56,52,${0.05 + Math.random() * 0.11})`;
                    ctx.beginPath();
                    ctx.ellipse(Math.random() * s, Math.random() * s, 10 + Math.random() * 30, 8 + Math.random() * 22, Math.random() * Math.PI, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.strokeStyle = 'rgba(70,66,62,0.35)'; ctx.lineWidth = 1;
                for (let i = 0; i < 7; i++) {
                    let x = Math.random() * s, y = Math.random() * s;
                    ctx.beginPath(); ctx.moveTo(x, y);
                    for (let k = 0; k < 5; k++) { x += (Math.random() - 0.5) * 40; y += (Math.random() - 0.5) * 40; ctx.lineTo(x, y); }
                    ctx.stroke();
                }
            });
            TEX.paving.repeat.set(3, 3);

            const plaster = { tex: TEX.facade, rough: 0.7, metal: 0.05, tinted: true };
            const brick   = { tex: TEX.facadeBrick, rough: 0.85, metal: 0.0, tinted: false };
            const marble  = { tex: TEX.facadeMarble, rough: 0.35, metal: 0.05, tinted: false };
            const steel   = { tex: TEX.facadeSteel, rough: 0.4, metal: 0.55, tinted: false };
            const cement  = { tex: TEX.facadeCement, rough: 0.92, metal: 0.0, tinted: true };
            const glass   = { tex: TEX.facadeGlass, rough: 0.22, metal: 0.6, tinted: false };
            TEX.facades = [plaster, plaster, plaster, brick, brick, marble, steel, cement, cement, glass];

            initWindowTextures();
            initFigureTextures();
        }

        // ---- Window textures: frame + mullions + glass, lit/dark variants ----
        // Glass painted near-white so MeshBasic color tints it (warm lit / cool dark).
        function _winCanvasTex(W, H, draw) {
            const c = document.createElement('canvas');
            c.width = W; c.height = H;
            draw(c.getContext('2d'), W, H);
            const tex = new THREE.CanvasTexture(c);
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.anisotropy = 4;
            return tex;
        }

        function _drawWindow(ctx, W, H, { lit, mullV = 0, mullH = 0, open = false, door = false }) {
            // The plane is flush with the wall, so depth has to be painted: a lintel
            // shadow along the top, a bright sill along the bottom, and a darker reveal
            // down the left edge sell a recessed opening at zero geometry cost.
            const lintel = door ? 0 : Math.round(H * 0.075);
            const sill = door ? 0 : Math.round(H * 0.10);
            const reveal = door ? 0 : 3;

            ctx.fillStyle = 'rgb(56,54,52)';   // frame / jamb
            ctx.fillRect(0, 0, W, H);

            if (lintel) { // recess shadow the wall above throws into the opening
                const lg = ctx.createLinearGradient(0, 0, 0, lintel);
                lg.addColorStop(0, 'rgb(24,23,24)');
                lg.addColorStop(1, 'rgb(58,56,54)');
                ctx.fillStyle = lg;
                ctx.fillRect(0, 0, W, lintel);
            }

            const inset = door ? 5 : 5;
            const gx = inset + reveal, gy = lintel + inset;
            const gw = W - gx - inset, gh = H - sill - inset - gy;

            const paintGlass = (x, y, w, h) => {
                const grad = ctx.createLinearGradient(0, y, 0, y + h);
                if (lit) { grad.addColorStop(0, 'rgb(255,250,238)'); grad.addColorStop(1, 'rgb(255,233,185)'); }
                else {
                    // Unlit glass is a mirror: bright sky up top falling to a dark
                    // reflection of the street. Flat blue read as a painted-on sticker.
                    grad.addColorStop(0, 'rgb(206,222,238)');
                    grad.addColorStop(0.5, 'rgb(140,161,184)');
                    grad.addColorStop(1, 'rgb(84,98,118)');
                }
                ctx.fillStyle = grad;
                ctx.fillRect(x, y, w, h);
                if (lit) { // hint of interior: darker sill band
                    ctx.fillStyle = 'rgba(120,90,60,0.22)';
                    ctx.fillRect(x, y + h * 0.78, w, h * 0.22);
                } else { // diagonal sky glint across the pane
                    ctx.save();
                    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
                    ctx.fillStyle = 'rgba(255,255,255,0.16)';
                    ctx.beginPath();
                    ctx.moveTo(x - w * 0.2, y + h); ctx.lineTo(x + w * 0.45, y);
                    ctx.lineTo(x + w * 0.75, y); ctx.lineTo(x + w * 0.1, y + h);
                    ctx.fill();
                    ctx.restore();
                }
                // ambient occlusion inside the reveal
                const ao = ctx.createLinearGradient(0, y, 0, y + h * 0.3);
                ao.addColorStop(0, 'rgba(0,0,0,0.35)');
                ao.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = ao; ctx.fillRect(x, y, w, h * 0.3);
            };

            if (open) {
                // sash window pushed up: glass on top, dark open gap below
                paintGlass(gx, gy, gw, gh * 0.42);
                ctx.fillStyle = lit ? 'rgb(60,42,26)' : 'rgb(10,12,16)';
                ctx.fillRect(gx, gy + gh * 0.42, gw, gh * 0.58);
                ctx.fillStyle = 'rgb(40,43,48)'; // raised sash bar
                ctx.fillRect(gx - 2, gy + gh * 0.38, gw + 4, 5);
            } else {
                paintGlass(gx, gy, gw, gh);
                ctx.fillStyle = 'rgb(56,54,52)';
                for (let i = 1; i <= mullV; i++) ctx.fillRect(gx + (gw * i) / (mullV + 1) - 1.5, gy, 3, gh);
                for (let i = 1; i <= mullH; i++) ctx.fillRect(gx, gy + (gh * i) / (mullH + 1) - 1.5, gw, 3);
            }

            if (sill) {
                // Projecting stone sill: sunlit top face, hard shadow line beneath
                const sy = H - sill;
                const sg = ctx.createLinearGradient(0, sy, 0, sy + sill * 0.55);
                sg.addColorStop(0, 'rgb(228,224,214)');
                sg.addColorStop(1, 'rgb(178,173,163)');
                ctx.fillStyle = sg;
                ctx.fillRect(0, sy, W, sill * 0.62);
                ctx.fillStyle = 'rgb(120,116,110)';   // sill edge
                ctx.fillRect(0, sy + sill * 0.62, W, Math.max(1, sill * 0.14));
                ctx.fillStyle = 'rgba(0,0,0,0.42)';   // drop shadow onto the wall
                ctx.fillRect(0, sy + sill * 0.76, W, sill * 0.24);
            }

            if (door) {
                // sliding door: center divider, handle, bottom rail
                ctx.fillStyle = 'rgb(40,43,48)';
                ctx.fillRect(W / 2 - 2, gy, 4, gh);
                ctx.fillRect(gx, H - inset - 5, gw, 5);
                ctx.fillStyle = 'rgb(200,205,210)';
                ctx.fillRect(W / 2 - 6, H * 0.5 - 8, 3, 16); // handle
            }
        }

        function initWindowTextures() {
            const styles = {
                plain: { mullV: 0, mullH: 0 },
                cross: { mullV: 1, mullH: 1 },
                grid6: { mullV: 1, mullH: 2 },
                open:  { open: true },
            };
            TEX.win = {};
            for (const [name, opts] of Object.entries(styles)) {
                TEX.win[name] = {
                    lit:  _winCanvasTex(64, 112, (c, W, H) => _drawWindow(c, W, H, { ...opts, lit: true })),
                    dark: _winCanvasTex(64, 112, (c, W, H) => _drawWindow(c, W, H, { ...opts, lit: false }))
                };
            }
            TEX.win.door = {
                lit:  _winCanvasTex(64, 128, (c, W, H) => _drawWindow(c, W, H, { door: true, lit: true })),
                dark: _winCanvasTex(64, 128, (c, W, H) => _drawWindow(c, W, H, { door: true, lit: false }))
            };
        }

        // ---- Backlit human-silhouette textures for windows ----
        function _figTex(draw) {
            return _winCanvasTex(48, 72, (ctx) => {
                ctx.fillStyle = 'rgba(16,19,26,0.88)';
                ctx.strokeStyle = 'rgba(16,19,26,0.88)';
                draw(ctx);
            });
        }
        const _figHead = (ctx, x, y, r = 6) => { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); };
        const _figBody = (ctx, x, y, w, h) => { ctx.beginPath(); ctx.moveTo(x - w / 2, y + h); ctx.lineTo(x - w / 3, y); ctx.lineTo(x + w / 3, y); ctx.lineTo(x + w / 2, y + h); ctx.closePath(); ctx.fill(); };

        function initFigureTextures() {
            TEX.figures = [
                { type: 'pace', tex: _figTex(ctx => { _figHead(ctx, 24, 14); _figBody(ctx, 24, 22, 18, 44); }) },
                { type: 'sip', tex: _figTex(ctx => {
                    _figHead(ctx, 24, 14); _figBody(ctx, 24, 22, 18, 44);
                    ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(31, 30); ctx.lineTo(40, 20); ctx.stroke();
                    ctx.fillRect(37, 12, 8, 8); // the cup
                }) },
                { type: 'dance', frames: [
                    _figTex(ctx => { _figHead(ctx, 24, 16); _figBody(ctx, 24, 24, 16, 36);
                        ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(18, 28); ctx.lineTo(8, 12); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(30, 28); ctx.lineTo(40, 12); ctx.stroke(); }),
                    _figTex(ctx => { _figHead(ctx, 24, 16); _figBody(ctx, 24, 24, 16, 36);
                        ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(18, 30); ctx.lineTo(4, 32); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(30, 30); ctx.lineTo(44, 32); ctx.stroke(); })
                ] },
                { type: 'lift', frames: [
                    _figTex(ctx => { _figHead(ctx, 24, 18); _figBody(ctx, 24, 26, 18, 34);
                        ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(6, 30); ctx.lineTo(42, 30); ctx.stroke();
                        ctx.fillRect(2, 25, 6, 10); ctx.fillRect(40, 25, 6, 10); }),
                    _figTex(ctx => { _figHead(ctx, 24, 22); _figBody(ctx, 24, 30, 18, 30);
                        ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(6, 8); ctx.lineTo(42, 8); ctx.stroke();
                        ctx.fillRect(2, 3, 6, 10); ctx.fillRect(40, 3, 6, 10); })
                ] },
                { type: 'cat', tex: _figTex(ctx => {
                    ctx.beginPath(); ctx.ellipse(24, 54, 13, 9, 0, 0, Math.PI * 2); ctx.fill(); // body
                    _figHead(ctx, 32, 42, 7);
                    ctx.beginPath(); ctx.moveTo(27, 38); ctx.lineTo(29, 30); ctx.lineTo(32, 37); ctx.fill(); // ears
                    ctx.beginPath(); ctx.moveTo(33, 37); ctx.lineTo(36, 30); ctx.lineTo(38, 38); ctx.fill();
                    ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(12, 56); ctx.quadraticCurveTo(2, 50, 6, 38); ctx.stroke(); // tail
                }) },
                // couch potatoes: two heads over a sofa, TV panel on the wall — the
                // window itself strobes blue like a screen (see updWindowFigures)
                { type: 'tv', tex: _figTex(ctx => {
                    ctx.fillRect(12, 6, 24, 15);                       // wall-mounted TV
                    ctx.fillRect(21, 21, 6, 2);                        // mount
                    _figHead(ctx, 17, 42, 5); _figHead(ctx, 30, 43, 5); // viewers
                    ctx.fillRect(6, 47, 36, 7);                        // couch back
                    ctx.fillRect(4, 53, 40, 13);                       // couch body
                }) },
                { type: 'tv', tex: _figTex(ctx => {
                    ctx.fillRect(10, 8, 28, 17);                       // bigger TV
                    ctx.fillRect(22, 25, 4, 2);
                    _figHead(ctx, 24, 44, 5);                          // lone viewer
                    ctx.fillRect(8, 49, 32, 6);
                    ctx.fillRect(6, 54, 36, 12);
                }) }
            ];
        }

        function mkCityLayout() {
            // Runs well past the fog so the world has no visible edge
            const groundTex = TEX.grass.clone();
            groundTex.repeat.set(90, 90);
            groundTex.needsUpdate = true;
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(900, 900),
                new THREE.MeshStandardMaterial({ color: 0x7f8568, roughness: 0.97, map: groundTex })
            );
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.1;
            ground.receiveShadow = true;
            scene.add(ground);
            
            const roadMatH = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95, map: TEX.asphaltH });
            const roadMatV = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95, map: TEX.asphaltV });
            const sidewalkMatH = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9, map: TEX.concreteH });
            const sidewalkMatV = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9, map: TEX.concreteV });
            // Lit (not Basic) so markings darken at night instead of glowing; worn paint tones
            const lineMat = new THREE.MeshStandardMaterial({ color: 0xc8b13a, roughness: 0.7 });
            const whiteMat = new THREE.MeshStandardMaterial({ color: 0xc9c9c4, roughness: 0.7 });
            // decal(): lift a flat overlay onto its own depth layer. Sharing a y with
            // the layer underneath is what made the ground shimmer while moving.
            const decal = (m, layer) => {
                m.polygonOffset = true;
                m.polygonOffsetFactor = -layer;
                m.polygonOffsetUnits = -layer * 2;
                return m;
            };
            decal(lineMat, 3); decal(whiteMat, 3);
            const padMat = new THREE.MeshStandardMaterial({ color: 0xb9b4ab, roughness: 0.95, map: TEX.paving });
            const parkMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95, map: TEX.grass });
            const kerbMat = new THREE.MeshStandardMaterial({ color: 0xa9a49b, roughness: 0.85 });
            
            for (let i = 0; i <= GRID.gridCount; i++) {
                const pos = -halfSize + i * GRID.cellSize;
                
                const hRoad = new THREE.Mesh(new THREE.PlaneGeometry(420, GRID.roadWidth), roadMatH);
                hRoad.rotation.x = -Math.PI / 2;
                hRoad.position.set(0, 0.01, pos);
                hRoad.receiveShadow = true;
                scene.add(hRoad);

                const vRoad = new THREE.Mesh(new THREE.PlaneGeometry(GRID.roadWidth, 420), roadMatV);
                vRoad.rotation.x = -Math.PI / 2;
                vRoad.position.set(pos, 0.01, 0);
                vRoad.receiveShadow = true;
                scene.add(vRoad);
                
                for (let j = 0; j < GRID.gridCount; j++) {
                    const segStart = -halfSize + j * GRID.cellSize + GRID.roadWidth / 2 + 2;
                    const segEnd = -halfSize + (j + 1) * GRID.cellSize - GRID.roadWidth / 2 - 2;
                    
                    for (let k = segStart; k < segEnd; k += 5) {
                        const hLine = new THREE.Mesh(new THREE.PlaneGeometry(3, 0.2), lineMat);
                        hLine.rotation.x = -Math.PI / 2;
                        hLine.position.set(k + 1.5, 0.035, pos);
                        scene.add(hLine);
                        
                        const vLine = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 3), lineMat);
                        vLine.rotation.x = -Math.PI / 2;
                        vLine.position.set(pos, 0.035, k + 1.5);
                        scene.add(vLine);
                    }
                }
            }
            
            for (let bx = 0; bx < GRID.gridCount; bx++) {
                for (let bz = 0; bz < GRID.gridCount; bz++) {
                    const blockCenterX = -halfSize + bx * GRID.cellSize + GRID.cellSize / 2;
                    const blockCenterZ = -halfSize + bz * GRID.cellSize + GRID.cellSize / 2;
                    const innerSize = GRID.cellSize - GRID.roadWidth;
                    const swDepth = GRID.sidewalkWidth;
                    
                    const nSw = new THREE.Mesh(new THREE.BoxGeometry(innerSize, 0.15, swDepth), sidewalkMatH);
                    nSw.position.set(blockCenterX, 0.075, blockCenterZ - innerSize/2 + swDepth/2);
                    nSw.receiveShadow = true;
                    scene.add(nSw);

                    const sSw = new THREE.Mesh(new THREE.BoxGeometry(innerSize, 0.15, swDepth), sidewalkMatH);
                    sSw.position.set(blockCenterX, 0.075, blockCenterZ + innerSize/2 - swDepth/2);
                    sSw.receiveShadow = true;
                    scene.add(sSw);

                    const wSw = new THREE.Mesh(new THREE.BoxGeometry(swDepth, 0.15, innerSize - swDepth * 2), sidewalkMatV);
                    wSw.position.set(blockCenterX - innerSize/2 + swDepth/2, 0.075, blockCenterZ);
                    wSw.receiveShadow = true;
                    scene.add(wSw);

                    const eSw = new THREE.Mesh(new THREE.BoxGeometry(swDepth, 0.15, innerSize - swDepth * 2), sidewalkMatV);
                    eSw.position.set(blockCenterX + innerSize/2 - swDepth/2, 0.075, blockCenterZ);
                    eSw.receiveShadow = true;
                    scene.add(eSw);

                    // Block interior. Bare lawn between downtown towers was the single
                    // biggest tell that this was a toy — city blocks are paved.
                    const isPark = Math.random() < 0.18;
                    const pad = new THREE.Mesh(
                        new THREE.PlaneGeometry(innerSize, innerSize),
                        isPark ? parkMat : padMat
                    );
                    pad.rotation.x = -Math.PI / 2;
                    pad.position.set(blockCenterX, 0.006, blockCenterZ);
                    pad.receiveShadow = true;
                    scene.add(pad);
                    if (isPark) parkBlocks.push({ x: blockCenterX, z: blockCenterZ, size: innerSize });

                    // Granite kerb along each street edge, sitting proud of the paving
                    const kerbOff = innerSize / 2 - 0.14;
                    [[innerSize, 0.28, 0, -kerbOff], [innerSize, 0.28, 0, kerbOff]].forEach(([kw, kd, ox, oz]) => {
                        const k = new THREE.Mesh(new THREE.BoxGeometry(kw, 0.19, kd), kerbMat);
                        k.position.set(blockCenterX + ox, 0.095, blockCenterZ + oz);
                        k.receiveShadow = true; k.castShadow = true;
                        scene.add(k);
                    });
                    [[0.28, innerSize, -kerbOff], [0.28, innerSize, kerbOff]].forEach(([kw, kd, ox]) => {
                        const k = new THREE.Mesh(new THREE.BoxGeometry(kw, 0.19, kd), kerbMat);
                        k.position.set(blockCenterX + ox, 0.095, blockCenterZ);
                        k.receiveShadow = true; k.castShadow = true;
                        scene.add(k);
                    });
                }
            }

            
            // Randomly select which interior intersections get crosswalks and signals
            // Interior intersections are at i,j from 1 to GRID.gridCount-1
            for (let i = 1; i < GRID.gridCount; i++) {
                for (let j = 1; j < GRID.gridCount; j++) {
                    // ~60% chance of having crosswalks at this intersection
                    if (Math.random() < 0.6) {
                        const ix = -halfSize + i * GRID.cellSize;
                        const iz = -halfSize + j * GRID.cellSize;
                        signalizedIntersections.push({ x: ix, z: iz });

                        // Create all 4 crosswalks around this intersection
                        const hw = GRID.roadWidth / 2;

                        // North crosswalk (crossing Z-axis road, north of intersection)
                        for (let s = 0; s < 6; s++) {
                            const stripe = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 3), whiteMat);
                            stripe.rotation.x = -Math.PI / 2;
                            stripe.position.set(ix - hw + 1.5 + s * 1, 0.035, iz - hw - 3);
                            scene.add(stripe);
                        }
                        crosswalks.push({ x: ix, z: iz - hw - 3, axis: 'x', width: GRID.roadWidth });

                        // South crosswalk (crossing Z-axis road, south of intersection)
                        for (let s = 0; s < 6; s++) {
                            const stripe = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 3), whiteMat);
                            stripe.rotation.x = -Math.PI / 2;
                            stripe.position.set(ix - hw + 1.5 + s * 1, 0.035, iz + hw + 3);
                            scene.add(stripe);
                        }
                        crosswalks.push({ x: ix, z: iz + hw + 3, axis: 'x', width: GRID.roadWidth });

                        // West crosswalk (crossing X-axis road, west of intersection)
                        for (let s = 0; s < 6; s++) {
                            const stripe = new THREE.Mesh(new THREE.PlaneGeometry(3, 0.5), whiteMat);
                            stripe.rotation.x = -Math.PI / 2;
                            stripe.position.set(ix - hw - 3, 0.035, iz - hw + 1.5 + s * 1);
                            scene.add(stripe);
                        }
                        crosswalks.push({ x: ix - hw - 3, z: iz, axis: 'z', width: GRID.roadWidth });

                        // East crosswalk (crossing X-axis road, east of intersection)
                        for (let s = 0; s < 6; s++) {
                            const stripe = new THREE.Mesh(new THREE.PlaneGeometry(3, 0.5), whiteMat);
                            stripe.rotation.x = -Math.PI / 2;
                            stripe.position.set(ix + hw + 3, 0.035, iz - hw + 1.5 + s * 1);
                            scene.add(stripe);
                        }
                        crosswalks.push({ x: ix + hw + 3, z: iz, axis: 'z', width: GRID.roadWidth });
                    }
                }
            }

            mkRoadDetail(); // needs signalizedIntersections, so it runs last
            mkOutskirts();
        }

        let parkBlocks = [];

        // ---- Static obstacle field ----
        // Anything standing on the pavement registers a circle here. Walkers resolve
        // out of overlaps every frame, which is why they stop clipping through trees,
        // benches, hot dog carts and parked cars. Bucketed so the test stays O(1).
        const OBST_CELL = 8;
        const obstacleGrid = new Map();
        const _obstScratch = [];
        function addObstacle(x, z, r) {
            const k = `${Math.floor(x / OBST_CELL)},${Math.floor(z / OBST_CELL)}`;
            let a = obstacleGrid.get(k);
            if (!a) { a = []; obstacleGrid.set(k, a); }
            a.push({ x, z, r });
        }
        function nearObstacles(x, z) {
            _obstScratch.length = 0;
            const cx = Math.floor(x / OBST_CELL), cz = Math.floor(z / OBST_CELL);
            for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
                const a = obstacleGrid.get(`${cx + i},${cz + j}`);
                if (a) for (const o of a) _obstScratch.push(o);
            }
            return _obstScratch;
        }
        // Push a body out of whatever it has stepped into. Cheaper and steadier than
        // path planning, and it can never end a frame standing inside a bench.
        function resolveObstacles(obj, radius) {
            const list = nearObstacles(obj.position.x, obj.position.z);
            for (let i = 0; i < list.length; i++) {
                const o = list[i];
                const dx = obj.position.x - o.x, dz = obj.position.z - o.z;
                const min = o.r + radius;
                const d2 = dx * dx + dz * dz;
                if (d2 >= min * min) continue;
                const d = Math.sqrt(d2);
                if (d > 1e-4) {
                    obj.position.x = o.x + (dx / d) * min;
                    obj.position.z = o.z + (dz / d) * min;
                } else {
                    obj.position.x = o.x + min;
                }
            }
        }


        // Beyond the last block the city used to simply stop on a lawn. A ring of
        // low-rise sprawl gives downtown a horizon to sit against. These are cheap:
        // the window grid is painted into the facade texture, not built from meshes.
        function mkOutskirts() {
            const winFacade = _mkTex(256, (ctx, s) => {
                _fillNoise(ctx, s, 176, 172, 164, 16);
                ctx.fillStyle = 'rgba(110,108,104,0.35)';
                for (let y = 0; y < s; y += 64) ctx.fillRect(0, y, s, 3);
                for (let y = 14; y < s; y += 64) {
                    for (let x = 12; x < s - 20; x += 44) {
                        ctx.fillStyle = 'rgb(48,54,64)';
                        ctx.fillRect(x, y, 30, 38);
                        const g2 = ctx.createLinearGradient(0, y + 3, 0, y + 35);
                        g2.addColorStop(0, Math.random() < 0.18 ? 'rgb(255,238,190)' : 'rgb(178,196,214)');
                        g2.addColorStop(1, Math.random() < 0.18 ? 'rgb(240,205,150)' : 'rgb(96,112,132)');
                        ctx.fillStyle = g2;
                        ctx.fillRect(x + 3, y + 3, 24, 32);
                        ctx.fillStyle = 'rgba(232,228,216,0.9)';
                        ctx.fillRect(x - 1, y + 38, 32, 4);
                    }
                }
            });
            const roofTint = new THREE.MeshStandardMaterial({ color: 0x585c58, roughness: 0.96 });
            const lotMat = new THREE.MeshStandardMaterial({ color: 0x6e6a63, roughness: 0.98, map: TEX.paving });
            const tones = [0x9c9486, 0x8b8072, 0x7f858c, 0x99806c, 0x77808a, 0xa8a08e,
                           0x6f6a60, 0x8f6f5c, 0xa39a86, 0x6b7480];

            const step = 20, edge = halfSize + 14, reach = halfSize + 118;
            for (let x = -reach; x <= reach; x += step) {
                for (let z = -reach; z <= reach; z += step) {
                    if (Math.abs(x) < edge && Math.abs(z) < edge) continue;   // downtown
                    if (x > 56 && z > -104 && z < 74) continue;                // airport site
                    // keep the through-roads clear
                    if (Math.abs(((x + halfSize) % GRID.cellSize + GRID.cellSize) % GRID.cellSize) < GRID.roadWidth) continue;
                    if (Math.abs(((z + halfSize) % GRID.cellSize + GRID.cellSize) % GRID.cellSize) < GRID.roadWidth) continue;
                    if (Math.random() < 0.32) continue;
                    const dist = Math.max(Math.abs(x), Math.abs(z));
                    const far = (dist - edge) / (reach - edge);           // taper away from downtown
                    const h = (4 + Math.random() * 16) * (1 - far * 0.55);
                    const bw = 7 + Math.random() * 9, bd = 7 + Math.random() * 9;
                    const tint = new THREE.Color(tones[Math.floor(Math.random() * tones.length)]);
                    const wall = len => new THREE.MeshStandardMaterial({
                        color: tint, roughness: 0.85,
                        map: tiledTex(winFacade, len / 7, h / 7)
                    });
                    const m = new THREE.Mesh(new THREE.BoxGeometry(bw, h, bd),
                        [wall(bd), wall(bd), roofTint, roofTint, wall(bw), wall(bw)]);
                    const px = x + (Math.random() - 0.5) * 9, pz = z + (Math.random() - 0.5) * 9;
                    m.position.set(px, h / 2, pz);
                    m.castShadow = dist < edge + 40;
                    m.receiveShadow = true;
                    scene.add(m);
                    // parapet cap so the roofline isn't a bare cut
                    const cap = new THREE.Mesh(new THREE.BoxGeometry(bw + 0.4, 0.4, bd + 0.4), roofTint);
                    cap.position.set(px, h + 0.1, pz);
                    scene.add(cap);
                    // yard / car lot, so the sprawl isn't standing in a meadow
                    const lot = new THREE.Mesh(new THREE.PlaneGeometry(bw + 7, bd + 7), lotMat);
                    lot.rotation.x = -Math.PI / 2;
                    lot.position.set(px, 0.001 + Math.random() * 0.005, pz);   // under the road layer
                    lot.receiveShadow = true;
                    scene.add(lot);
                }
            }
        }


        // Manholes, utility-cut patches, drains, stop bars. Fresh unbroken asphalt
        // is the other tell — real roads are a patchwork of repairs.
        function mkRoadDetail() {
            const layer = (m, l) => { m.polygonOffset = true; m.polygonOffsetFactor = -l; m.polygonOffsetUnits = -l * 2; return m; };
            const manholeMat = layer(new THREE.MeshStandardMaterial({ color: 0x3a3a3e, roughness: 0.65, metalness: 0.5 }), 2);
            const patchMat = layer(new THREE.MeshStandardMaterial({ color: 0x2f3033, roughness: 0.98 }), 1);
            const sealMat = layer(new THREE.MeshStandardMaterial({ color: 0x232427, roughness: 0.9 }), 2);
            const barMat = layer(new THREE.MeshStandardMaterial({ color: 0xc9c9c4, roughness: 0.7 }), 3);
            let nudge = 0;
            const roadLines = Array.from({ length: GRID.gridCount + 1 }, (_, j) => -halfSize + j * GRID.cellSize);
            const nearCross = v => roadLines.some(p => Math.abs(v - p) < GRID.roadWidth + 2);
            // stagger the height too: two repairs on the same square metre would
            // otherwise be exactly coplanar
            const flat = m => { m.rotation.x = -Math.PI / 2; m.position.y = 0.016 + (nudge = (nudge + 1) % 7) * 0.0012; scene.add(m); };

            for (const roadPos of roadLines) {
                for (let v = -halfSize + 3; v < halfSize - 3; v += 6) {
                    if (nearCross(v)) continue;
                    const lat = () => (Math.random() - 0.5) * (GRID.roadWidth - 1.6);
                    if (Math.random() < 0.3) {   // manhole
                        const a = new THREE.Mesh(new THREE.CircleGeometry(0.42, 14), manholeMat);
                        const b = new THREE.Mesh(new THREE.CircleGeometry(0.42, 14), manholeMat);
                        a.position.set(v, 0, roadPos + lat());
                        b.position.set(roadPos + lat(), 0, v);
                        flat(a); flat(b);
                    }
                    if (Math.random() < 0.28) {  // asphalt repair patch
                        const pw = 1.4 + Math.random() * 2.6, pd = 1 + Math.random() * 1.8;
                        const a = new THREE.Mesh(new THREE.PlaneGeometry(pw, pd), patchMat);
                        a.position.set(v + (Math.random() - 0.5) * 2, 0, roadPos + lat());
                        flat(a);
                        const b = new THREE.Mesh(new THREE.PlaneGeometry(pd, pw), patchMat);
                        b.position.set(roadPos + lat(), 0, v + (Math.random() - 0.5) * 2);
                        flat(b);
                    }
                    if (Math.random() < 0.22) {  // crack-seal squiggle
                        const a = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 2 + Math.random() * 4), sealMat);
                        a.position.set(v, 0, roadPos + lat());
                        a.rotation.z = (Math.random() - 0.5) * 0.6;
                        flat(a);
                    }
                    if (Math.random() < 0.25) {  // kerbside storm drain
                        const side = Math.random() < 0.5 ? 1 : -1;
                        const g1 = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.35), manholeMat);
                        g1.position.set(v, 0, roadPos + side * (GRID.roadWidth / 2 - 0.25));
                        flat(g1);
                        const g2 = new THREE.Mesh(new THREE.PlaneGeometry(0.35, 0.9), manholeMat);
                        g2.position.set(roadPos + side * (GRID.roadWidth / 2 - 0.25), 0, v);
                        flat(g2);
                    }
                }
            }

            // Stop bars on the approach to every signalised intersection
            const hw = GRID.roadWidth / 2;
            for (const it of signalizedIntersections) {
                for (const s of [-1, 1]) {
                    const bx = new THREE.Mesh(new THREE.PlaneGeometry(hw - 0.4, 0.45), barMat);
                    bx.position.set(it.x + s * (hw / 2 + 0.2), 0, it.z + s * (hw + 5));
                    flat(bx);
                    const bz = new THREE.Mesh(new THREE.PlaneGeometry(0.45, hw - 0.4), barMat);
                    bz.position.set(it.x + s * (hw + 5), 0, it.z - s * (hw / 2 + 0.2));
                    flat(bz);
                }
            }
        }

        // Trees, bushes, hydrants, and benches along the sidewalks.
        // Spots sit at ±4/±12 mod 16 along each road — streetlights live at ±8,
        // so furniture never lands on a pole.
        function mkStreetFurniture() {
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4a2b, roughness: 0.9 });
            const leafMats = [0x2d6a2d, 0x3a7d3a, 0x4f8a3a, 0x5a9e4b].map(c =>
                new THREE.MeshStandardMaterial({ color: c, roughness: 0.9 }));
            const hydrantMat = new THREE.MeshStandardMaterial({ color: 0xcc2222, roughness: 0.5, metalness: 0.3 });
            const woodMat = new THREE.MeshStandardMaterial({ color: 0x7a5230, roughness: 0.8 });
            const ironMat = new THREE.MeshStandardMaterial({ color: 0x2a3a2a, roughness: 0.6, metalness: 0.5 });

            // A single sphere on a stick reads as a lollipop. Overlapping lobes at
            // different heights and tints give the canopy a silhouette.
            function mkTree(scale = 1) {
                const g = new THREE.Group();
                const th = (1.7 + Math.random() * 1.1) * scale;
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.09 * scale, 0.19 * scale, th, 7), trunkMat);
                trunk.position.y = th / 2;
                trunk.castShadow = true;
                g.add(trunk);

                // two angled branch stubs so the canopy has something to sit on
                for (const s of [-1, 1]) {
                    if (Math.random() < 0.45) continue;
                    const br = new THREE.Mesh(new THREE.CylinderGeometry(0.035 * scale, 0.06 * scale, 0.6 * scale, 5), trunkMat);
                    br.position.set(s * 0.16 * scale, th * 0.82, 0);
                    br.rotation.z = s * -0.7;
                    g.add(br);
                }

                const leafMat = leafMats[Math.floor(Math.random() * leafMats.length)];
                const alt = leafMats[Math.floor(Math.random() * leafMats.length)];
                const r = (0.85 + Math.random() * 0.55) * scale;
                const lobes = [[0, th + r * 0.55, 0, 1, leafMat],
                               [(Math.random() - 0.5) * r * 1.1, th + r * 0.95, (Math.random() - 0.5) * r * 1.1, 0.62, alt],
                               [(Math.random() - 0.5) * r * 1.3, th + r * 0.35, (Math.random() - 0.5) * r * 1.3, 0.7, leafMat]];
                if (Math.random() < 0.6) lobes.push([(Math.random() - 0.5) * r, th + r * 1.2, (Math.random() - 0.5) * r, 0.5, alt]);
                lobes.forEach(([lx, ly, lz, ls, lm]) => {
                    const c = new THREE.Mesh(new THREE.SphereGeometry(r * ls, 7, 6), lm);
                    c.position.set(lx, ly, lz);
                    c.scale.y = 0.8 + Math.random() * 0.2;
                    c.rotation.y = Math.random() * Math.PI;
                    c.castShadow = true;
                    g.add(c);
                });
                return g;
            }

            function mkBush() {
                const g = new THREE.Group();
                const leafMat = leafMats[Math.floor(Math.random() * leafMats.length)];
                const n = 1 + Math.floor(Math.random() * 2);
                for (let i = 0; i < n; i++) {
                    const r = 0.3 + Math.random() * 0.25;
                    const b = new THREE.Mesh(new THREE.SphereGeometry(r, 7, 5), leafMat);
                    b.position.set(i * 0.4, r * 0.7, (Math.random() - 0.5) * 0.3);
                    b.scale.y = 0.75;
                    g.add(b);
                }
                return g;
            }

            function mkHydrant() {
                const g = new THREE.Group();
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.17, 0.5, 8), hydrantMat);
                body.position.y = 0.25;
                g.add(body);
                const dome = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 6), hydrantMat);
                dome.position.y = 0.5;
                g.add(dome);
                const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.42, 6), hydrantMat);
                cap.rotation.z = Math.PI / 2;
                cap.position.y = 0.32;
                g.add(cap);
                return g;
            }

            function mkParkBench() {
                const g = new THREE.Group();
                const seat = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.08, 0.45), woodMat);
                seat.position.y = 0.45;
                seat.castShadow = true;
                g.add(seat);
                const back = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.45, 0.07), woodMat);
                back.position.set(0, 0.75, -0.2);
                back.rotation.x = -0.15;
                g.add(back);
                [-0.6, 0.6].forEach(x => {
                    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.45, 0.4), ironMat);
                    leg.position.set(x, 0.22, 0);
                    g.add(leg);
                });
                return g;
            }

            function place(x, z, rotation) {
                const roll = Math.random();
                if (roll < 0.35) return; // occasional, not wall-to-wall
                const item = roll < 0.65 ? mkTree() : roll < 0.82 ? mkBush() :
                             roll < 0.9 ? mkHydrant() : mkParkBench();
                item.position.set(x, 0, z);
                item.rotation.y = rotation; // benches/hydrants face the road
                scene.add(item);
                addObstacle(x, z, roll < 0.65 ? 0.5 : roll < 0.82 ? 0.4 : roll < 0.9 ? 0.28 : 0.8);
            }

            const roadLines = Array.from({ length: GRID.gridCount + 1 }, (_, j) => -halfSize + j * GRID.cellSize);
            const busCurbs = omnibusStops.map(s => ({ x: s.curbX, z: s.curbZ }));
            for (const roadPos of roadLines) {
                for (let v = -halfSize + 4; v < halfSize - 2; v += 8) {
                    const nearIntersection = roadLines.some(iPos => Math.abs(v - iPos) < GRID.roadWidth + 1);
                    if (nearIntersection) continue;
                    const off = GRID.roadWidth / 2 + 1.2 + Math.random() * 0.6;
                    const jit = (Math.random() - 0.5) * 3;
                    // One spot on each side of the horizontal and vertical road at this
                    // grid line; rotation turns the item's front (+z) toward the road
                    for (const [x, z, rot] of [
                        [v + jit, roadPos - off, 0],
                        [v + jit, roadPos + off, Math.PI],
                        [roadPos - off, v + jit, Math.PI / 2],
                        [roadPos + off, v + jit, -Math.PI / 2]
                    ]) {
                        if (busCurbs.some(c => Math.abs(x - c.x) < 3 && Math.abs(z - c.z) < 3)) continue;
                        place(x, z, rot);
                    }
                }
            }

            // Green blocks get planted properly — mature trees, hedges, a bench or two.
            // Keeps the few remaining lawns reading as parks rather than leftover ground.
            for (const pb of parkBlocks) {
                const half = pb.size / 2 - 2.5;
                for (let i = 0; i < 7; i++) {
                    const x = pb.x + (Math.random() - 0.5) * half * 2;
                    const z = pb.z + (Math.random() - 0.5) * half * 2;
                    if (buildings.some(b => Math.abs(b.position.x - x) < b.userData.width / 2 + 1.2 &&
                                            Math.abs(b.position.z - z) < b.userData.depth / 2 + 1.2)) continue;
                    const roll = Math.random();
                    const item = roll < 0.62 ? mkTree(1.25) : roll < 0.85 ? mkBush() : mkParkBench();
                    item.position.set(x, 0.03, z);
                    item.rotation.y = Math.random() * Math.PI * 2;
                    scene.add(item);
                    addObstacle(x, z, roll < 0.62 ? 0.7 : roll < 0.85 ? 0.4 : 0.8);
                }
            }
        }

        function mkStreetlights() {
            const poleHeight = 6;
            const armLength = 2;
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x6f7378, metalness: 0.55, roughness: 0.45 });
            const bulbMat = new THREE.MeshBasicMaterial({ color: 0x222211 }); // Off by default

            // Place streetlights along all roads
            for (let i = 0; i <= GRID.gridCount; i++) {
                const roadPos = -halfSize + i * GRID.cellSize;

                // Horizontal roads (along X axis)
                for (let x = -halfSize + 8; x < halfSize - 4; x += 16) {
                    // Skip intersection areas
                    const nearIntersection = Array.from({length: GRID.gridCount + 1}, (_, j) =>
                        -halfSize + j * GRID.cellSize
                    ).some(iPos => Math.abs(x - iPos) < GRID.roadWidth);

                    if (!nearIntersection) {
                        // North side of road
                        mkStreetlight(x, roadPos - GRID.roadWidth/2 - 1, 0);
                        // South side of road
                        mkStreetlight(x, roadPos + GRID.roadWidth/2 + 1, Math.PI);
                    }
                }

                // Vertical roads (along Z axis)
                for (let z = -halfSize + 8; z < halfSize - 4; z += 16) {
                    const nearIntersection = Array.from({length: GRID.gridCount + 1}, (_, j) =>
                        -halfSize + j * GRID.cellSize
                    ).some(iPos => Math.abs(z - iPos) < GRID.roadWidth);

                    if (!nearIntersection) {
                        // East side of road
                        mkStreetlight(roadPos + GRID.roadWidth/2 + 1, z, -Math.PI/2);
                        // West side of road
                        mkStreetlight(roadPos - GRID.roadWidth/2 - 1, z, Math.PI/2);
                    }
                }
            }

            function mkStreetlight(x, z, rotation) {
                const g = new THREE.Group();

                // Pole
                const pole = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.12, 0.15, poleHeight, 8),
                    poleMat
                );
                pole.position.y = poleHeight / 2;
                g.add(pole);

                // Curved arm
                const arm = new THREE.Mesh(
                    new THREE.BoxGeometry(armLength, 0.1, 0.1),
                    poleMat
                );
                arm.position.set(armLength/2, poleHeight - 0.1, 0);
                g.add(arm);

                // Light housing
                const housing = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.3, 0.4, 0.3, 8),
                    poleMat
                );
                housing.position.set(armLength, poleHeight - 0.3, 0);
                g.add(housing);

                // Bulb (visual) - use emissive material instead of PointLight for performance
                const bulbMaterial = new THREE.MeshBasicMaterial({ color: 0x222211 });
                const bulb = new THREE.Mesh(
                    new THREE.SphereGeometry(0.25, 8, 8),
                    bulbMaterial
                );
                bulb.position.set(armLength, poleHeight - 0.5, 0);
                g.add(bulb);
